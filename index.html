<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sujo Rajan - Spiritual Video Library &amp; സത്യപ്രകാശം</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {box-sizing: border-box;}
html, body {
    width: 100%;
    margin: 0;
    padding: 0;
    background: #080d19;
    color: #fff;
    font-family: 'Noto Sans Malayalam', sans-serif;
    overflow-x: hidden;
}
body {
    padding: 12px;
    background: radial-gradient(ellipse at 50% 0%, rgba(28,67,119,.35), transparent 55%), radial-gradient(ellipse at 100% 60%, rgba(145,104,35,.09), transparent 45%), #080d19;
}

/* Fixed Header + Mode Tabs + Search + Quick Tags Shell */
.header-fixed-shell {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 8px 12px 10px;
    background: linear-gradient(to bottom, #080d19 calc(100% - 10px), rgba(8, 13, 25, 0.95) 100%);
    pointer-events: none;
}

/* Smooth Morphing Top Banner */
.channel-header {
    pointer-events: auto;
    position: relative;
    width: 100%;
    max-width: 1000px;
    height: 230px;
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid rgba(218,177,91,.45);
    border-radius: 16px;
    background: linear-gradient(120deg,rgba(5,13,31,.99),rgba(15,39,72,.98),rgba(5,13,31,1));
    box-shadow: 0 10px 28px rgba(0,0,0,.85),inset 0 0 40px rgba(46,105,170,.12);
    will-change: height, border-radius;
}
.channel-header::before{content:"";position:absolute;width:280px;height:280px;top:-170px;left:50%;transform:translateX(-50%);border-radius:50%;background:rgba(61,135,218,.24);filter:blur(50px)}
.channel-header::after{content:"";position:absolute;inset:10px;border:1px solid rgba(222,185,104,.15);border-radius:11px;pointer-events:none;transition: inset 0.15s ease;}

/* Smoothly Positioned Logo & Text via JS Interpolation */
.channel-logo {
    position: absolute;
    width: 92px;
    height: 92px;
    object-fit: cover;
    display: block;
    border-radius: 50%;
    border: 2px solid #d9b66b;
    padding: 3px;
    background: #091629;
    box-shadow: 0 0 12px rgba(54,139,255,.85),0 0 28px rgba(54,139,255,.65),0 0 45px rgba(54,139,255,.35),0 0 12px rgba(218,177,91,.3);
    will-change: left, top, width, height;
    z-index: 2;
}
.header-text {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    will-change: left, top;
    z-index: 2;
    max-width: calc(100% - 24px);
}
.channel-title {
    margin: 0;
    color: #f2d28d;
    font-family: Georgia, 'Noto Sans Malayalam', serif;
    font-size: 29px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 15px rgba(230,185,91,.25);
    line-height: 1.25;
    will-change: font-size;
}
.channel-subtitle {
    margin: 8px 0 0;
    color: #d6dfed;
    font-size: 13.5px;
    letter-spacing: 0.5px;
    line-height: 1.3;
    will-change: font-size, margin-top;
}
.header-line {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg,transparent,#d9b66b,transparent);
    will-change: opacity;
}

/* Mode Switcher Tabs (Videos vs ചർച്ച സംഗ്രഹം) */
.mode-tabs-bar {
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    max-width: 650px;
    margin: 9px auto 0;
}
.mode-tab {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(15, 28, 48, 0.94);
    border: 1px solid rgba(119, 157, 202, 0.35);
    color: #cfe0f5;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
}
.mode-tab:hover {
    border-color: #e4c27d;
    color: #fff;
}
.mode-tab.active {
    background: linear-gradient(135deg, #f0d18c, #c5953e);
    border-color: #f7dfa6;
    color: #0b1424;
    font-weight: 700;
    box-shadow: 0 3px 12px rgba(240, 209, 140, 0.35);
}

/* Sticky Search Bar & Quick Topic Tags inside Fixed Header Shell */
.search-bar-dock {
    pointer-events: auto;
    width: 100%;
    max-width: 1000px;
    margin: 8px auto 0;
}
.search-container {
    position: relative;
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
}
.search-input {
    width: 100%;
    padding: 10px 42px 10px 38px;
    background: rgba(13, 24, 42, 0.96);
    border: 1px solid rgba(218, 177, 91, 0.5);
    border-radius: 10px;
    color: #fff;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 14px;
    outline: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.search-input::placeholder {
    color: #899bb3;
}
.search-input:focus {
    border-color: #f0d18c;
    box-shadow: 0 0 16px rgba(218, 177, 91, 0.28);
}
.search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #d9b66b;
    font-size: 14px;
    pointer-events: none;
}
.search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(218, 177, 91, 0.22);
    border: none;
    color: #f0d18c;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
}
.search-clear.visible {
    display: flex;
}

/* Quick Topic Tags + Saved Filter Chip */
.quick-tags-bar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    max-width: 650px;
    margin: 8px auto 0;
    overflow-x: auto;
    padding-bottom: 3px;
    scrollbar-width: none;
}
.quick-tags-bar::-webkit-scrollbar {
    display: none;
}
@media (min-width: 620px) {
    .quick-tags-bar {
        justify-content: center;
    }
}
.topic-chip {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 50px;
    background: rgba(18, 33, 56, 0.92);
    border: 1px solid rgba(119, 157, 202, 0.35);
    color: #cfe0f5;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
}
.topic-chip:hover {
    border-color: #e4c27d;
    color: #fff;
}
.topic-chip.active {
    background: linear-gradient(135deg, #f0d18c, #c5953e);
    border-color: #f7dfa6;
    color: #0b1424;
    font-weight: 700;
    box-shadow: 0 2px 10px rgba(240, 209, 140, 0.35);
}
.topic-chip.fav-chip {
    border-color: rgba(240, 209, 140, 0.55);
    color: #f2d28d;
}
.topic-chip.fav-chip.active {
    color: #0b1424;
}

/* Main Content Wrapper */
.content-wrapper {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding-top: 386px;
    position: relative;
}
.content-wrapper.discussions-mode {
    padding-top: 300px;
}

.library{width:100%;margin:auto}
.library-heading{margin:0 auto 17px;text-align:center}
.library-heading h2{margin:0;color:#f0d18c;font-size:21px;font-weight:700}
.library-heading p{margin:7px 0 0;color:#9eacc1;font-size:13px}

.search-status {
    text-align: center;
    color: #f0d18c;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
}

/* Playlist & Discussion Accordion Card Styles (+ and - Button) */
.playlist{position:relative;margin-bottom:13px;background:linear-gradient(110deg,#14233a,#101c30);border:1px solid rgba(119,157,202,.25);border-radius:10px;overflow:hidden;box-shadow:0 5px 16px rgba(0,0,0,.25);transition:border-color .25s ease,box-shadow .25s ease}
.playlist:hover{border-color:rgba(221,183,104,.65);box-shadow:0 7px 22px rgba(0,0,0,.35)}
.playlist summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:61px;padding:14px 17px;font-size:16px;font-weight:600;color:#f4e8cd}
.playlist summary::-webkit-details-marker{display:none}
.playlist-name{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;line-height:1.5}
.playlist-right{display:flex;align-items:center;justify-content:center;gap:11px;flex-shrink:0}
.video-count{font-family:Arial, 'Noto Sans Malayalam', sans-serif;font-size:12px;font-weight:600;color:#aebdd1;white-space:nowrap}
.playlist-toggle{width:29px;height:29px;min-width:29px;padding:0;margin:0;display:grid;place-items:center;border-radius:50%;border:1px solid #e4c27d;background:linear-gradient(145deg,#f0d18c,#b58a3c);color:#101a2a;flex-shrink:0;font-family:Arial,sans-serif;font-size:21px;font-weight:500;line-height:1;box-shadow:0 0 12px rgba(218,177,91,.2)}
.playlist-toggle::before{content:"+";display:block;line-height:1;transform:translateY(-1px)}
.playlist[open] .playlist-toggle::before{content:"−";transform:translateY(-1px)}
.playlist[open]{border-color:rgba(224,185,103,.65)}
.video-list{padding:5px 16px 13px;border-top:1px solid rgba(143,168,201,.19);background:rgba(5,12,24,.38)}
.video-item{border-bottom:1px solid rgba(143,168,201,.14)}
.video-item:last-child{border-bottom:none}

/* Discussion Details Inside Expanded Accordion */
.discussion-body {
    padding: 16px 18px 18px;
    border-top: 1px solid rgba(143,168,201,.19);
    background: rgba(5,12,24,.45);
}
.disc-date-day {
    display: inline-block;
    padding: 4px 11px;
    margin-bottom: 14px;
    border-radius: 6px;
    background: rgba(218, 177, 91, 0.14);
    border: 1px solid rgba(218, 177, 91, 0.4);
    color: #f2d28d;
    font-size: 12px;
    font-weight: 600;
}
.disc-summary-box {
    background: rgba(14, 27, 48, 0.85);
    border: 1px solid rgba(119, 157, 202, 0.25);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
}
.disc-section-heading {
    margin: 0 0 10px;
    color: #8fb4e0;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
}
.disc-main-points {
    margin: 0;
    padding-left: 20px;
    color: #e2eaf5;
    font-size: 14px;
    line-height: 1.85;
}
.disc-main-points li {
    margin-bottom: 6px;
}
.disc-conclusion-box {
    background: linear-gradient(135deg, rgba(218, 177, 91, 0.14), rgba(20, 42, 74, 0.7));
    border-left: 4px solid #f0d18c;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 18px;
}
.disc-conclusion-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #f2d28d;
    margin-bottom: 6px;
}
.disc-conclusion-text {
    margin: 0;
    color: #fff6e0;
    font-size: 14.2px;
    line-height: 1.8;
    font-weight: 500;
}

/* Exact Full PDF Content Box */
.full-pdf-box {
    background: rgba(8, 16, 30, 0.92);
    border: 1px solid rgba(218, 177, 91, 0.3);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 15px;
}
.full-pdf-header {
    font-size: 14px;
    font-weight: 700;
    color: #f2d28d;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(218, 177, 91, 0.25);
    display: flex;
    align-items: center;
    gap: 6px;
}
.full-pdf-text {
    color: #dce6f4;
    font-size: 14px;
    line-height: 1.85;
    word-wrap: break-word;
}
.full-pdf-text h4 {
    color: #f0d18c;
    font-size: 15px;
    margin: 14px 0 6px;
    border-bottom: 1px dashed rgba(240, 209, 140, 0.25);
    padding-bottom: 3px;
}
.full-pdf-text h4:first-child {
    margin-top: 2px;
}
.full-pdf-text p {
    margin: 0 0 8px;
}
.full-pdf-text p:last-child {
    margin-bottom: 0;
}

.copy-summary-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 50px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(218, 177, 91, 0.4);
    color: #f2d28d;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}
.copy-summary-btn:hover {
    background: rgba(218, 177, 91, 0.22);
    color: #fff;
}

/* Video Row with Bookmark Star */
.video-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
}
.video-title{display:flex;align-items:flex-start;gap:11px;flex:1;min-width:0;padding:13px 5px;border:none;background:transparent;color:#dce6f4;font-family:'Noto Sans Malayalam',sans-serif;font-size:14px;line-height:1.7;text-align:left;cursor:pointer;transition:color .2s ease;overflow-wrap:anywhere;word-break:break-word}
.video-title:hover{color:#f2d28d}
.play{display:inline-block;flex-shrink:0;margin-top:3px;color:#e4bd70;font-family:Arial,sans-serif;font-size:15px;transition:transform .2s ease}
.video-title.active{color:#f3d28d}
.video-title.active .play{transform:rotate(90deg)}

/* Favorite Bookmark Star Button */
.fav-btn {
    flex-shrink: 0;
    margin-top: 9px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    color: #6f84a3;
    font-size: 18px;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
}
.fav-btn:hover {
    color: #f2d28d;
    background: rgba(242, 210, 141, 0.1);
}
.fav-btn.saved {
    color: #ffd54f;
    text-shadow: 0 0 10px rgba(255, 213, 79, 0.65);
}

.video-player{display:none;width:100%;padding:0 0 15px 27px}
.video-player.show{display:block}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid rgba(218,177,91,.35);border-radius:8px}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Advanced Glass Action Bar */
.player-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 8px 12px;
    background: linear-gradient(135deg, rgba(16, 30, 54, 0.85), rgba(10, 19, 36, 0.92));
    border: 1px solid rgba(218, 177, 91, 0.25);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

/* Advanced Glowing WhatsApp Share Pill */
.whatsapp-share-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 15px;
    border-radius: 50px;
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    border: 1px solid rgba(185, 255, 210, 0.5);
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
}

.whatsapp-share-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    transform: skewX(-20deg);
    animation: waShimmer 3.5s infinite;
}

@keyframes waShimmer {
    0% { left: -120%; }
    35%, 100% { left: 160%; }
}

.whatsapp-share-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
    color: #fff;
}

/* Sleek YouTube Button */
.youtube-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 50px;
    background: rgba(255, 0, 0, 0.14);
    border: 1px solid rgba(255, 68, 68, 0.4);
    color: #ff9494;
    font-family: Arial, sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-decoration: none;
    white-space: nowrap;
    transition: all 0.25s ease;
}
.youtube-link:hover {
    background: rgba(255, 0, 0, 0.26);
    border-color: #ff5252;
    color: #fff;
    transform: translateY(-1px);
}

.whatsapp-share-btn svg, .youtube-link svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
    flex-shrink: 0;
}

/* Variety Back to Top Button */
.back-to-top {
    position: fixed;
    bottom: calc(55px + env(safe-area-inset-bottom));
    right: 20px;
    width: 50px;
    height: 50px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #1d3557, #0a1426);
    color: #ffd54f;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255, 215, 0, 0.65), 0 0 34px rgba(255, 193, 7, 0.35), 0 6px 18px rgba(0, 0, 0, 0.8);
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transform: translateY(16px) scale(0.9);
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease, box-shadow 0.25s ease;
}
.back-to-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}
.back-to-top:hover {
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 0 24px rgba(255, 224, 51, 0.9), 0 0 44px rgba(255, 193, 7, 0.55), 0 8px 22px rgba(0, 0, 0, 0.85);
}
.back-to-top svg.progress-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}
.back-to-top .ring-bg {
    fill: none;
    stroke: rgba(255, 215, 0, 0.25);
    stroke-width: 3;
}
.back-to-top .ring-fill {
    fill: none;
    stroke: #ffd54f;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 138.23;
    stroke-dashoffset: 138.23;
    transition: stroke-dashoffset 0.1s linear;
}
.back-to-top .top-arrow-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
}
.back-to-top .arrow-icon {
    font-size: 16px;
    font-weight: 700;
    color: #ffd54f;
    animation: floatUp 1.8s ease-in-out infinite;
}
.back-to-top .top-label {
    font-family: Arial, sans-serif;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: #fff;
    margin-top: 2px;
}
@keyframes floatUp {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2.5px); }
}

.library-footer{max-width:1000px;margin:25px auto 5px;padding:17px 10px;text-align:center;border-top:1px solid rgba(218,177,91,.25);color:#899bb3;font-size:12px}
.library-footer span{color:#d8b66f;font-family:Georgia,serif;letter-spacing:1px}
@media(max-width:600px){
body{padding:7px}
.header-fixed-shell{padding:7px 7px 8px;}
.mode-tabs-bar{margin-top: 7px; gap: 6px;}
.mode-tab{padding: 7px 8px; font-size: 12px;}
.search-bar-dock{margin-top: 7px;}
.search-input{padding: 9px 36px 9px 34px; font-size: 13px;}
.search-icon{left: 11px; font-size: 13px;}
.quick-tags-bar{margin-top: 7px; gap: 6px;}
.topic-chip{padding: 4px 10px; font-size: 11px;}
.content-wrapper {padding-top: 334px;}
.content-wrapper.discussions-mode {padding-top: 262px;}
.library-heading h2{font-size:18px}
.playlist{margin-bottom:10px;border-radius:8px}
.playlist summary{padding:12px 10px;min-height:54px;font-size:14px;gap:6px}
.playlist-right{gap:7px}
.video-count{font-size:11px}
.playlist-toggle{width:26px;height:26px;min-width:26px}
.video-list{padding:3px 9px 10px}
.discussion-body{padding: 13px 12px 15px;}
.disc-summary-box, .full-pdf-box{padding: 12px 13px;}
.disc-main-points, .disc-conclusion-text, .full-pdf-text{font-size: 13.5px;}

        fullContentHtml: `<p><br><strong>പഠന സംഗ്രഹം</strong><br>2026 നവംബർ 10, ചൊവ്വാഴ്ച<br><strong>വിഷയം:</strong> ദൈവം തരുന്ന ഭൗതികവും സന്തോഷവും എന്താണ്?</p>

            <h4>ആത്മാവിൻ്റെ നിയോഗം</h4>
            <p>നമ്മൾ ഈ ഭൂമിയിലോട്ട് വരുമ്പോൾ തന്നെ നമ്മൾ ചില അത്യാവശ്യ ജോലികളോടു കൂടി തന്നെയാണ് വരുന്നത്. ഇപ്പോൾ ഒരു കുടുംബിനിയായ, അമ്മയായ ആൾക്ക് ഭർത്താവിനെയും മക്കളെയും തന്നിട്ടുണ്ട്. ദൈവീകമായിട്ടുള്ള ഒരുപാട് കാര്യങ്ങൾ അവർക്ക് അറിഞ്ഞുകൂടല്ലോ. അറിഞ്ഞുകൂടാ എങ്കിൽ, അവർക്ക് പറഞ്ഞു കൊടുക്കുക. ദൈവത്തിൻ്റെ നിയമങ്ങൾ അനുസരിച്ച് ജീവിക്കാൻ മക്കൾക്ക് പറഞ്ഞു കൊടുക്കുക. നിങ്ങൾ മാതൃക കാണിച്ചു കൊടുക്കുക. ഇത് കൃത്യമായിട്ടും നന്നായിട്ടും തന്നെ ചെയ്തു കഴിയുമ്പോൾ, ദൈവം അത് കാണും. ഈ ഒരു ചെറിയ ജോലി നിങ്ങൾ ഭംഗിയായിട്ട് ചെയ്യുമ്പോൾ, അടുത്ത ജോലി നിങ്ങൾ പ്രാർത്ഥിക്കുമ്പോൾ ദൈവം പെട്ടെന്ന് തന്നെ കാണിച്ചുതരും. ഇപ്പോൾ നമ്മൾ ചെയ്യേണ്ട കാര്യം ചെയ്യാതെ, "ഈ ഭൂമിയിൽ ഞാൻ വന്നിരിക്കുന്നത് എന്തിനു വേണ്ടിയിട്ടായിരിക്കും? ദൈവം ആ ജോലി എനിക്ക് കാണിച്ചു തരണം! എന്നാലേ എനിക്ക് മോക്ഷത്തിൽ സകലമാന കർമ്മവും തീർത്ത് വരാൻ പറ്റുകയുള്ളൂ." എന്ന് ചോദിക്കുമ്പോൾ; ഈ ചെയ്യേണ്ട കാര്യം ചെയ്യാതെ അത് ചോദിച്ചാൽ കിട്ടുമെന്ന് തോന്നുന്നില്ല. കിട്ടുമായിരിക്കും. പല രീതികളിലും അഥവാ കിട്ടിപ്പോയാലും, അടിസ്ഥാനമായിട്ടുള്ളത് അത് പോയി വീണ്ടും ചെയ്യേണ്ടിവരും. അതുകൊണ്ട് നമുക്ക് തന്നിരിക്കുന്ന ആ ചെറിയ ജോലി നല്ല രീതിയിൽ ചെയ്ത്, ദൈവത്തിന്റെ മുൻപിൽ കാണിച്ചു കൊടുക്കുക. അങ്ങനെ വരുമ്പോൾ, ദൈവം അടുത്തതു തരും. അങ്ങനെ തന്ന് തന്ന് വലിയ വലിയ ജോലികൾ വരെ നമ്മളെ ഏൽപ്പിച്ചെന്ന് വരും.</p>
            <p>ഈ കാലഘട്ടത്തിൽ, ഓരോരുത്തരും ഓരോ വിളി അനുസരിച്ച് ഭൂമിയിൽ വന്നിട്ടുണ്ട്. പക്ഷേ ആ വിളി അനുസരിച്ചോ, ആ നിയോഗം അനുസരിച്ചോ അല്ല കാര്യങ്ങൾ പൊയ്ക്കൊണ്ടിരിക്കുന്നത്. ദൈവത്തിൻ്റെ ശരിക്കുള്ള നിയോഗത്തിലോട്ട് എത്താതിരിക്കാൻ വേണ്ടിയിട്ട് ഈ പൈശാചിക ശക്തികൾ എന്താണ് ചെയ്യുക? അവർ, ഒരുപാട് ഉയർച്ചയും വളർച്ചയും ഭൗതിക സുഖവും നേട്ടവും കൊടുക്കും. ഈ വ്യക്തികൾ, ഇതെല്ലാം ദൈവം തന്നതാണെന്ന് വിചാരിച്ച് ഇതെല്ലാം അനുഭവിച്ചങ്ങ് പോകും. അങ്ങനെ പൊയിക്കൊണ്ടിരിക്കുന്ന പലരുമാണ് ഇപ്പോൾ ഇങ്ങനെ ഈ കാലഘട്ടത്തിൽ ഉള്ളത്. ഇതിങ്ങനെ പൊയിക്കൊണ്ടിരുന്നു കഴിഞ്ഞാൽ ഒരിക്കലും ആരും യഥാർത്ഥ ദൈവത്തിലോട്ട് എത്തില്ല. അവരുടെ ആത്മാവിന്റെ നിയോഗത്തിലോട്ടും വരുന്നില്ല. അതുകൊണ്ടാണ് ഇപ്പോൾ ദൈവം കർശ്ശനമാക്കി പിടിച്ചിരിക്കുന്നു എന്ന് പറയുന്നത്. അങ്ങനെ വരുമ്പോഴേക്കും പലരുടെയും വ്യാപാരങ്ങൾ തടസ്സമാകും. ചിലർക്ക് പല പല തടസങ്ങളും പ്രശ്നങ്ങളും അവരുടെ ജീവിതത്തിലൊക്കെ വരും. ഇതെല്ലാം വരുന്നതിന്റെ കാരണം ദൈവം കർശ്ശനമായിട്ട് പിടിക്കുന്നത് കൊണ്ടാണ്.</p>
            <p>ഒരുവന്റെ ആത്മനിയോഗം ഒരു അധ്യാപകൻ ആകാനാണ്, ഒരു ഗുരുവാകാനാണെങ്കിൽ അവൻ ഒരു ഡോക്ടറായി നിന്നുകൊണ്ട് പണം സമ്പാദിച്ച് പോയിക്കൊണ്ടിരിക്കുമ്പോൾ ശരിക്കും അവിടെ തെറ്റ് ചെയ്യുന്നു. പക്ഷെ അവൻ ആ ഡോക്ടർ ജോലിയിൽ നീതിയും ന്യായവുമൊക്കെ ചെയ്തുകൊണ്ടിരിക്കും. ആ ജന്മം അവൻ ഒരു ഗുരു ആവാൻ വേണ്ടിയിട്ടായിരുന്നു ഭൂമിയിൽ വന്നത്. അപ്പോൾ, ഇതെല്ലാം തെറ്റിപ്പോവുകയാണ്. നീതിയും ന്യായവും എന്ന് അവൻ വിചാരിച്ച് ചെയ്യുന്നതെല്ലാം തെറ്റായിട്ടുള്ള രീതിയിലായിരുന്നു. അവൻ അതിനു വേണ്ടിയിട്ടായിരുന്നു നീതിന്യായം അത്രയും കാണിച്ചുകൊണ്ടിരുന്നത്. ഇതാണ് പലർക്കും തെറ്റിക്കൊണ്ടിരിക്കുന്ന പല സംഗതികൾ. ഇതുകൊണ്ടാണ്, പല ജന്മങ്ങളും നമുക്ക് വേണ്ടിവരുന്നത്. ഓരോ ജന്മത്തിലും അവനവന്റെ ആത്മാവിനെ തിരിച്ചറിഞ്ഞ് അതനുസരിച്ച് മുന്നോട്ടു പോയി വളർന്നു വന്നാൽ, അവൻ്റെ ആ ജന്മം വിജയിച്ചു. ഗുരുവാകേണ്ട വ്യക്തി ഡോക്ടറായി വന്നന്നുകൊണ്ട് സമ്പാദിച്ച് സമ്പാദിച്ചു കൂട്ടുമ്പോൾ അവിടെ അവൻ നീതിയായാലും എന്ത് ചെയ്താലും, പ്രകൃതിയുടെ കണ്ണിൽ അത് തെറ്റാണ്. ശരിക്കും അവൻ തെറ്റിപ്പോയി. പക്ഷേ അത് ഒരു ശിക്ഷ എന്ന രീതിയിൽ വരില്ല. കാരണം അറിവില്ലല്ലോ!</p>
            <p>ആത്മനിയോഗം എന്ന സാധനത്തെകുറിച്ച് ചിലപ്പോൾ അറിയാതെ, നിരീശ്വരവാദി പോലും ആയിരിക്കും. ദൈവം ഇല്ല എന്നുള്ള ചിന്താഗതി വരെ ആക്കി വച്ചിട്ടായിരിക്കും അവൻ മുന്നോട്ട് പോയിക്കൊണ്ടിരിക്കുന്നത്. അപ്പോ ഇത് പ്രകൃതിയുടെ കണ്ണിൽ തെറ്റാണ്. ഇതാണ് ഈ പ്രശ്നം. ഇങ്ങനെ പൊയിക്കൊണ്ടിരുന്നു കഴിഞ്ഞാൽ, ജന്മങ്ങൾ കൊടുത്ത് പഠിപ്പിക്കാൻ ഇനി സമയമില്ലല്ലോ! അതുകൊണ്ടാണ് പ്രകൃതി ഇപ്പോൾ കർശ്ശനമാണെന്ന് പറയുന്നത്. ഇനി അങ്ങോട്ടുള്ള കാര്യത്തിൽ അവനവന്റെ ആത്മാവിന്റെ നിയോഗം കണ്ടെത്തി, മനസ്സിലാക്കി ചെയ്തില്ലെങ്കിൽ, തടസ്സം വരും. കാരണം ഈ തടസ്സം വന്നില്ല എന്നുണ്ടെങ്കിൽ, അവന്റെ ആത്മാവ് നിയോഗത്തിലോട്ട് എത്തില്ല. ഇപ്പോൾ, നമ്മുടെ ഈ ഗ്രൂപ്പിലുള്ള പലർക്കും വ്യാപാരത്തിലും സാമ്പത്തികത്തിലും ഒക്കെ പല വിധത്തിൽ തടസ്സമായി കിടക്കുകയാണ്.</p>
            <p>സ്രഷ്ടാവായ ദൈവത്തിലോട്ട് എത്തി, പറ്റാവുന്ന നിയമങ്ങളൊക്കെ പാലിച്ചു. എന്നിട്ടും ഈ തടസ്സങ്ങൾ മാറുന്നില്ല. അതിന്റെ കാരണം, അവർക്ക് വെച്ചിട്ടുള്ള രീതിയല്ല അവർ ചെയ്യുന്നത്. അവർക്ക് വെച്ചിരിക്കുന്നത് വേറെ എന്തോ ആയിരിക്കാം. ചിലപ്പോൾ, സ്വന്തമായിട്ട് വ്യാപാരം ചെയ്യാൻ ആയിരിക്കും, ദൈവം പദ്ധതി വച്ചിരിക്കുന്നത്, അല്ലെങ്കിൽ ഭൂമിയിൽ വിട്ടിരിക്കുന്നത്. ഇപ്പോൾ നിൽക്കുന്നത് ഏതെങ്കിലും ഒരു തല തിരിഞ്ഞ മുതലാളിയുടെ കീഴിൽ ജീവനക്കാരൻ ആയിട്ടായിരിക്കും. ചിലർക്ക് ഇന്ന വ്യാപാരം ചെയ്യാൻ അല്ലെങ്കിൽ ഇന്ന രീതിയിലുള്ള വ്യാപാരം ആയിരിക്കും പറഞ്ഞിരിക്കുന്നത്. പക്ഷെ തെറ്റായി വേറെ ചെയ്തുകൊണ്ടിരിക്കുകയായിരിക്കും. അതെല്ലാം ശരിക്കും പ്രകൃതി തടസ്സമാക്കി വക്കുന്നതാണ്. ദൈവത്തിന്റെ ആ ശരിയായ വഴിയിലേക്ക് തിരിച്ച്, തിരിച്ചറിഞ്ഞു വരികയും. ദർശ്ശനത്തിലൂടെയും വെളിപാടിലൂടെയും ഒക്കെ അവരവരുടെ സത്യം തിരിച്ചറിഞ്ഞ്, അത് അതേപോലെ അനുസരിച്ച് മുന്നോട്ടു പോയാൽ, അവർക്ക് ഉയർച്ചയും സാമ്പത്തിക നേട്ടവും ഒക്കെ ഉണ്ടായിരിക്കും. അവിടെ തെറ്റില്ലല്ലോ. ദൈവത്തിന്റെ മാർഗ്ഗത്തിൽ നിന്നും കൊണ്ട്, ദൈവത്തിന്റെ നിയമങ്ങൾ പാലിച്ച്, അവനവന്റെ ആത്മനിയോഗം മനസ്സിലാക്കിയിട്ട് വരുന്ന ഉയർച്ചയാണ് ശരിക്കുള്ള ഉയർച്ച. അതാണ് ഭൂമിയിൽ ഇനി ദൈവം അങ്ങോട്ട് തരുന്ന ഉയർച്ചയും സമാധാനവും സന്തോഷവും എല്ലാം.</p>
            <h4>സുഖം, സമ്പത്ത് തരുന്നത്?</h4>
            <p>ഈ 2012 ന് മുമ്പൊക്കെ വഴിതെറ്റി പോയാൽ പോലും, പൈശാചികശക്തികളാണ് കൊടുക്കുന്നത് എന്ന് അറിഞ്ഞാൽ പോലും, ദൈവം കൃപയാൽ സൗജന്യമായിട്ട് അത് അനുവദിച്ചു വിടുന്ന ഒരു കാലഘട്ടമായിരുന്നു. "പോട്ടെ, സമയം ആകുമ്പോൾ പിടിക്കാം" എന്ന രീതിയിൽ വിട്ടിരിക്കുന്ന ഒരു സമയമായിരുന്നു. പക്ഷേ, ഇപ്പോൾ അങ്ങനെയല്ല. ആ കാലഘട്ടം മാറ്റി ദൈവം കർശ്ശനമാക്കി പിടിച്ചിരിക്കുകയാണ്. നിങ്ങൾ ദൈവത്തിലേക്ക് എത്തിയെങ്കിൽ പോലും, നിങ്ങൾക്ക് ഒരു ഉയർച്ച വരുന്നില്ലെങ്കിൽ നിങ്ങൾ വരേണ്ട രീതിയിൽ വരാത്തതുകൊണ്ടാണെന്ന് മനസ്സിലാക്കുക. ഇത്രയും നാളും നമ്മൾ തെറ്റായ രീതിയിൽ വേറെ ഏതോ ശക്തികളുടെ പുറകെ പോയിരുന്നതുകൊണ്ട് അവിടുന്നാണ് ഇതെല്ലാം കിട്ടിക്കൊണ്ടിരുന്നത്. സൃഷ്ടാവാം ദൈവത്തിന്റെ കയ്യിൽ നിന്നല്ല. അത് നേരായ മാർഗ്ഗത്തിൽ അല്ല കിട്ടിക്കൊണ്ടിരുന്നത് എന്നുള്ള സത്യം തിരിച്ചറിയണം. ആരാണോ ആ വിളിക്കനുസരിച്ച് ശരിയായ വഴിയിൽ വരുന്നത്, അതനുസരിച്ച് അവർക്ക് ഇനി എല്ലാം തുറന്ന് കൊടുക്കും എന്നാണ് ദൈവം പറയുന്നത്. അപ്പോഴേ അവരവർക്ക് മനസ്സിലാവുള്ളൂ അവരുടെ വിളി എന്തായിരുന്നു എന്നുള്ളത്. അത് നേരിട്ട് അവർക്ക് തന്നെ ബോധ്യം വരും.</p>
            <p>ശരിക്കും പറഞ്ഞാൽ ദൈവത്തിൻ്റെ നിയമങ്ങൾ പാലിക്കുകയും, ദൈവത്തോട് നല്ല ഒരു ബന്ധം ഉണ്ടാവുകയും, ദൈവം മതി എന്നും പറഞ്ഞു നിൽക്കുന്ന ഒരു ആത്മാവാണെങ്കിൽ, ആ ആത്മാവിന് ആവശ്യമുള്ളത് ദൈവം തരും. ആ ആത്മാവിന് ഇത്ര മതി എന്ന് ഇത്ര കൂടി പോകരുത് എന്ന് ദൈവത്തിന് അറിയാം. ആത്മാവിന് അതിൻ്റെ ആവശ്യമുണ്ടോ എന്നുംകൂടി ദൈവം നോക്കും. ദൈവം കൊടുക്കും, പക്ഷേ അത് അവൻ എങ്ങനെ ഉപയോഗിക്കുന്നു? അതിന്റെ ആവശ്യമുണ്ടോ? ഇപ്പോൾ അതിന്റെ ആവശ്യമുണ്ടോ? എന്നൊക്കെ നോക്കിയിട്ടല്ലേ കൊടുക്കാൻ പറ്റുയുള്ളൂ. ഉദാഹരണത്തിന് യേശു ഒരു ഉപമ പറയുന്നുണ്ടല്ലോ താലന്തിന്റെ ഉപമ. അതിൽ അവസാനം ഇങ്ങനെയാണ്: ഉള്ളവന് വീണ്ടും വീണ്ടും കൊടുക്കപ്പെടും. ഇല്ലാത്തവന് ഉള്ളതും കൂടി എടുക്കപ്പെടും; എന്ന്. ഇത് കേൾക്കുമ്പോൾ, ഇത്രയും ക്രൂരനാണൊ ദൈവം എന്ന് നമുക്ക് ഒരു ചെറിയ ഒരു തോന്നൽ വരാം. ഇവിടെ ബുദ്ധിയും ബോധവും ഉള്ളവനേ കൊടുക്കാവൂ, കൊടുക്കാൻ പറ്റുകയുള്ളൂ. ഉദാഹരണത്തിൽ നല്ല ഒരു വീട് കൊടുത്തു കഴിഞ്ഞാൽ, അതിനെ എപ്പോഴും നല്ലപോലെ സൂക്ഷിക്കുകയും, അത് നല്ല വൃത്തിയായിട്ടും വെടിപ്പായിട്ടും വക്കുകയും, സദാ ആ വീട്ടിൽ നല്ല വെളിച്ചം പരത്തുകയും, അങ്ങനെ ഉള്ള എല്ലാം ചെയ്ത്, ദൈവത്തിന് ദിവസവും നന്ദി പറഞ്ഞ്, നല്ലപോലെ സൂക്ഷിച്ചിരിക്കുന്ന ഒരാളുടെ കയ്യിൽ ഇത്തിരിക്കൂടെ ഒരു വലിയ വീട് കൊടുത്താൽ അവൻ അതുപോലെ തന്നെ ചെയ്യും. ദൈവത്തിൽ നിന്ന് കിട്ടി എന്നും പറഞ്ഞുകൊണ്ട്, എന്തായാലും എന്റെ അധ്വാനത്തിന് ദൈവം തന്ന പ്രതിഫലമാണ് എന്ന് പറഞ്ഞുകൊണ്ട്, വാങ്ങിച്ചിട്ട് ആ വീട്ടിൽ മാറാമ്പലും പൊടിപിടിച്ചും ഒന്നും നോക്കാതെയും, ഒരു വൃത്തിയില്ല ഒന്നുമില്ല, അങ്ങനെയൊക്കെ ആയിട്ടിരുന്നാൽ പിന്നെ അവന് കൊടുത്തിട്ട് എന്ത് കാര്യം? നന്നായിട്ട് നോക്കുന്നവന്റെ കയ്യിലല്ലേ കൂടുതൽ കൂടുതൽ കൊടുക്കാൻ പറ്റുകയുള്ളൂ. കാരണം, അവൻ കേറിക്കേറി വരുന്നുണ്ട്. അതുകൊണ്ട് അവന് കൂടുതൽ കൊടുക്കാം. ഇവന് ഒന്നുമില്ല. ആ കൊടുത്തത് പോലും മര്യാദയക്ക് ചെയ്യുന്നില്ല, എന്ന് വരുമ്പോൾ ആ വ്യക്തിക്ക് അതെങ്ങനെ ദൈവം കൊടുക്കും? പക്ഷേ, അവൻ നിയമം പാലിച്ചാലും, ദൈവത്തോട് കൂടുതൽ മമത വെച്ചാൽ പോലും, അവന് ബുദ്ധിയില്ലല്ലോ അറിവില്ലല്ലോ അതും കൂടി നോക്കി; ഇവന് എത്ര കഴിവുണ്ട് എത്ര ചെയ്യാൻ പറ്റും, എന്നതും കൂടി ദൈവം നോക്കിയിട്ടേ സാമ്പത്തികമായാലും എന്തായാലും ദൈവം കൊടുക്കുന്നുള്ളൂ.</p>
            <h4>എങ്ങനെ രക്ഷപ്പെടാം?</h4>
            <p>ന്യായവിധി ശിക്ഷയുടെ കാലത്തെകുറിച്ചാണ് പറയുന്നത്. ഇപ്പോൾ ശരിക്കും പറഞ്ഞാൽ ദൈവം ശരിക്കുള്ള സമ്പത്തായിട്ട് നമുക്ക് തരുന്നത്; അറിവും തിരിച്ചറിവും ജ്ഞാനവുമാണ്. ഈ സമ്പത്ത് വച്ചിട്ട് ഒരുപാട് ഭൗതികമായാലും ആത്മീയമായാലും സമ്പത്തുകൾ ചെയ്തുകൂട്ടാനായിട്ട് നമുക്ക് പറ്റും. എന്ത് കാര്യത്തിന് വേണ്ടിയിട്ട് പ്രാർത്ഥിച്ചാലും, ദൈവം തരുന്ന മറുപടി: "അറിവുണ്ടല്ലോ! ജ്ഞാനം ഉണ്ടല്ലോ! ചിന്തിക്ക്! ഒരു ജോലി ആയാൽ പോലും അത് എങ്ങനെ ചെയ്യണം? എങ്ങനെ ചെയ്താൽ അത് വിജയകരമാകും? അറിവുണ്ടല്ലോ!"</p>
            <p>അല്ലാതെ ഒരു കാര്യം പോയി പ്രാർത്ഥിക്കുമ്പോൾ, അപ്പോൾ തന്നെ അത് സാധിച്ചു കൊടുക്കുന്നത് ഇനി ഇല്ല. "ഒരു കാർ വേണം, അല്ലെങ്കിൽ ഒരു വസ്തു വേണം, എന്നൊക്കെ പല കാര്യങ്ങളും ചോദിക്കുന്നുണ്ട്. ഇതിന്റെ ആവശ്യമുണ്ടോ? ആവശ്യമുണ്ടെങ്കിൽ അത് എപ്പോൾ എങ്ങനെ? അറിവ് ഉപയോഗിക്ക്. നിന്റെ ജ്ഞാനം ഉപയോഗിക്ക്." എന്നൊക്കെ പറഞ്ഞുകൊണ്ടാണ് ഇപ്പോൾ ദൈവം പറയുന്നത്. അപ്പോൾ നമുക്ക് തന്നിരിക്കുന്ന ഈ വലിയ സ്വത്തായ ആ അറിവും ജ്ഞാനവും ഉപയോഗിച്ച് നമുക്ക് കേറി കേറി വരാൻ പറ്റും. നമ്മൾക്ക് സമ്പന്നരാകാനും പറ്റും. നമ്മൾ അത് കളഞ്ഞിട്ട് താഴോട്ട് പോകാനും പറ്റും. ദൈവം തന്നിരിക്കുന്ന, നമുക്ക് വച്ചിരിക്കുന്ന, നമ്മളിൽ തന്നിരിക്കുന്ന, അല്ലെങ്കിൽ തന്നുകൊണ്ടിരിക്കുന്ന സമ്പത്ത്, ഈ അറിവാണ്. ഇത് വച്ചിട്ട് നമുക്ക് സമ്പന്നരാവാം.</p>
            <p>ദൈവത്തിൻ്റെ കൂടെ ഒരു ദൂതനുണ്ട്. ആ ദൂതന്റെ കയ്യിൽ ഒരു ത്രാസ് ഉണ്ട്. ആ ത്രാസ് വെച്ച് അളന്നു നോക്കിയിട്ടാണ് തരുന്നത്. നമ്മൾ എത്ര നിയമങ്ങൾ പാലിക്കുന്നു, അത്രയും സംരക്ഷണം. 100 ശതമാനം നിയമം പാലിക്കുന്നതിന് 100 ശതമാനം സംരക്ഷണം. അതാണ് പൗലോസ് പ്രത്യേകം പറഞ്ഞിക്കുന്നത്, പിശാചിന്റെ തന്ത്രങ്ങൾ നിങ്ങൾ തിരിച്ചറിയണമെന്ന്. അതാണ് അവന്റെ തന്ത്രം. നമ്മൾ നീതിമാനായിട്ടും സത്യസന്ധനായിട്ടും ഒക്കെ ജീവിച്ചാൽ മതി. നമ്മുടെ വിശ്വാസം അല്ലെങ്കിൽ നമ്മൾ ആരെയാണോ ആശ്രയിച്ചിരിക്കുന്നത്, അത് നോക്കിയിട്ടാണ് ഇവൻ ഈ കാര്യങ്ങൾ ചെയ്യുന്നത്. സ്രഷ്ടാവാം ദൈവത്തെ മുറുകെ പിടിച്ചുകൊണ്ട് വേറെ ഒന്നിലും ആശ്രയിക്കാതെ ആ നിയമങ്ങൾ പാലിച്ച ഒരു വ്യക്തിയെ മാത്രമേ പിശാചിന് തൊടാതിരിക്കാൻ പറ്റുകയുള്ളൂ. നിയമം തെറ്റിക്കിടന്നു കൊണ്ട് നമ്മൾ എന്തൊക്കെ നല്ല പ്രവർത്തി എവിടെയൊക്കെ ചെയ്താലും അവന് അധികാരമുണ്ട്. അത് എവിടെയെങ്കിലും ഏതെങ്കിലും ഒരു വശത്ത് അവൻ നിയമം തെറ്റിപ്പിച്ച് ഇട്ടയക്കും. എന്നിട്ട് അവൻ സ്വാധീനിച്ച് കൈവശപ്പെടുത്തി വച്ചേക്കുകയും ചെയ്യും.</p>
            <p>ഏറ്റവും പ്രധാനമാണ്, അവനവന്റെ ആത്മാവിന്റെ നിയോഗം കണ്ടെത്തി തിരിച്ചറിയുക. അറിവില്ലാത്ത കാലത്ത്, നമ്മുടെ അറിവ് വച്ചുകൊണ്ട് നമ്മുടെ മാതാപിതാക്കളിൽ നിന്നും; മറ്റു മതങ്ങളിൽ നിന്നുമൊക്കെ പഠിക്കുന്ന നീതിയും ന്യായവും ധർമ്മവും ഒക്കെയാണ് നമ്മൾ പാലിച്ചുകൊണ്ടിരിക്കുന്നത്. നമ്മുടെ വിചാരം ഇതെല്ലാം ശരി ആണെന്നാണ്. പക്ഷെ, പ്രകൃതിയുടെ വ്യവസ്ഥകൾ ശരിക്കും അതല്ല. അത് നമ്മൾ മതഗ്രന്ഥങ്ങളിലൂടെ ആഴത്തിൽ മനസ്സിലാക്കിയാലേ ഇവ കിട്ടുള്ളൂ. മിക്കവരെയും ഇവിടെയാണ് പൈശാചിക ശക്തികൾ തെറ്റിക്കുന്നത്. മനുഷ്യന് പലപല ജന്മങ്ങൾ ആവശ്യം വരുന്നത്, ഓരോ ജന്മത്തിലും ഈ പൈശാചിക ശക്തികൾ അവനെ ആത്മീയമായിട്ട് വളരാൻ സമ്മതിക്കാതെ ഭൗതിക സുഖങ്ങളും നേട്ടങ്ങളും കൊടുത്ത് മരണം വരെ കൊണ്ടുപോകും. മരണശേഷമാണ് ഈ ആത്മാവിന് മനസ്സിലാകുന്നത്, മുഴുവനും തെറ്റിപ്പോയെന്ന്. അതിനുശേഷം ആ ആത്മാവിനുള്ള ശിക്ഷയും കാര്യങ്ങളും എല്ലാം കഴിഞ്ഞ്, അടുത്ത പ്രായശ്ചിത്തമായിട്ട് പല ജന്മങ്ങളും കഴിഞ്ഞ് ,വീണ്ടും മനുഷ്യ ജന്മം തരും. വീണ്ടും പൈശാചിക ശക്തികൾ അവനെ പ്രലോഭിപ്പിച്ച് സുഖങ്ങളും കാര്യങ്ങളും എല്ലാം കൊടുത്തു കൊണ്ടുപോകും.</p>
            <p>ഒരു വ്യക്തി ഭൂമിയിൽ വെച്ച് ഇതെല്ലാം അല്ലല്ലോ ശരി, ഇതൊന്നും ധർമ്മം അല്ലല്ലോ, അല്ലെങ്കിൽ ദൈവത്തിന്റെ വഴിയിൽ അല്ലല്ലോ ഞാൻ പൊയ്ക്കൊണ്ടിരിക്കുന്നത്, ശരിക്കും ഞാൻ നീതി ന്യായവും എന്നൊക്കെ വിചാരിച്ച് ചെയ്തുകൊണ്ടിരുന്ന ഒന്നും ദൈവത്തിന്റെ കണ്ണിൽ - പ്രകൃതിയുടെ കണ്ണിൽ നീതിന്യായം അല്ല. ഇങ്ങനെയൊക്കെ ഉള്ള അറിവുകൾ കിട്ടി തുടങ്ങുമ്പോഴാണ് ഈ പൈശാചിക ശക്തികൾ ശരിക്കും അങ്ങോട്ട് തിരിയുകയും, അവനെ പിന്നെ ഭൂമിയിലിട്ട് പീഡിപ്പിക്കാനും തുടങ്ങുന്നത്. അപ്പോൾ, ഈ വ്യക്തി ശരിക്കും ദൈവത്തിലോട്ട് കൂടുതൽ അടുക്കും. ദൈവത്തിലോട്ട് എത്തും. പിന്നെ ദൈവത്തിൽ നിന്നുള്ള ഉയർച്ചകളും കാര്യങ്ങളും അവന് വന്നുകൊണ്ടിരിക്കും.</p>
            <h4>പരീക്ഷണവും പരിപാലനവും</h4>
            <p>"പൈശാചികങ്ങൾക്ക് എല്ലാം അറിയാം" ഇങ്ങനെ പറഞ്ഞ് തോറ്റു കൊടുക്കരുത്. ഒരു ശത്രുവിനെ പോയിട്ട് നമ്മളെക്കാളും അവർക്കെല്ലാം അറിയാം എന്ന് പറയുന്നത് ചെറിയ ഒരു തോൽവി തന്നെയാണ്. അവർക്ക് എന്ത് അറിഞ്ഞാലും അറിഞ്ഞില്ലേലും; എനിക്ക് ദൈവം തന്നിരിക്കുന്ന നിയമം, എനിക്ക് ദൈവം തന്നിരിക്കുന്ന വ്യവസ്ഥ, ഞാൻ ദൈവത്തോട് കാണിക്കുന്ന വിശ്വസ്തതയുള്ള വിശ്വാസം, സ്നേഹം, ഇതൊക്കെ വച്ചിട്ട് നമ്മൾ അവനോട്, അറിയാവുന്ന ആ പിശാചിനോട് യുദ്ധം ചെയ്ത് ജയിക്കണം. ഇതാണല്ലോ ഇപ്പോൾ ദൈവം നമ്മളോട് ആവശ്യപ്പെടുന്നത്. അറിയാത്ത ഒരാളുടെ അടുത്ത് നമുക്ക് ജയിക്കാൻ എളുപ്പമാണ്. എല്ലാം അറിഞ്ഞുകൊണ്ടുവരുന്ന ഒരാളോട് ജയിച്ചു കേറുമ്പോഴാണ് നമ്മൾ അത്രക്കും പ്രാപ്തരാവുന്നത്.</p>
            <p>പക്ഷേ ഇത്രയും അറിയാവുന്ന പിശാചിന് ദൈവം ഒരു പരിധി വച്ചിട്ടുണ്ട്. നമ്മൾ ശരി പറയാതെ, നമ്മൾ സമ്മതിക്കാതെ, അവന് നമ്മളിലോട്ട് കടന്നുവരാൻ പറ്റില്ല. നമ്മൾ എന്തെങ്കിലും ഒരു പാലം ഇട്ടു കൊടുക്കുമ്പോഴാണ് അതിലൂടെ നമ്മളിലോട്ട് കടന്നുവരുന്നത്. നിയമം തെറ്റിക്കുക, സ്വന്തം ഇഷ്ടത്തിന് ജീവിക്കുക, ദൈവത്തെ അനുസരിക്കാതെ പോവുക, പിന്നെ ചെയ്യാം നാളെ ചെയ്യാം എന്നിങ്ങനെ മടിപിടിച്ചിരിക്കുക, ഇതൊക്കെയാണ് ഈ പിശാചിൻറെ പാലം. അങ്ങനെ വച്ചു കൊടുക്കുമ്പോഴേക്കും അവൻ വലിഞ്ഞു കയറി വരാനുള്ള എല്ലാ സാധ്യതകളും ഉണ്ട്.</p>
            <p>ബൈബിളിലെ ഇയ്യോബ് എന്ന് പറയുന്ന ആളുണ്ട്. അയാൾ ആ സമയത്ത് ആ ദേശത്തെ വലിയൊരു ധനികനായിരുന്നു. അയാൾക്ക് കിട്ടിയ ധനവും സമ്പത്തും എല്ലാം ദൈവം തന്നതാണ് എന്ന് നന്ദിയും പറഞ്ഞ്, ദൈവത്തെ വാഴ്ത്തിയും സ്തുതിച്ചും ഒക്കെ ഇരിക്കുന്ന ഒരാളായിരുന്നു. വലിയ ധനികനാണ് അയാൾ. ബൈബിളിൽ പറഞ്ഞിക്കുന്നത് ഇതേപോലെ ഒരു നീതിമാൻ ഇല്ല എന്നാണ്. ഇയ്യോബിന് ദൈവമായിട്ട് നല്ല അടുപ്പവും അത്രയും ഉയർച്ചയും ഉണ്ടെന്നും. പരിജ്ഞാനവും ജ്ഞാനവും ഒക്കെ അത്ര നല്ല രീതിയിൽ ഉള്ളതുകൊണ്ടാണ് തനിക്ക് ഈ സമ്പത്തും നേട്ടവും എല്ലാം കിട്ടിക്കൊണ്ടിരിക്കുന്നത് എന്ന രീതിയിൽ ഒരു അഹങ്കാര സംസാരം ഇയോബിന് ഉണ്ടായിരുന്നു. ആ ഒരൊറ്റ കാരണം കൊണ്ടാണ് ഈ പരീക്ഷണം അനുഭവിക്കേണ്ടി വന്നത്. അങ്ങനെ വന്നപ്പോൾ, പിശാച് ദൈവത്തോട് ഒരു ചോദ്യം ചോദിച്ചു. ഇവൻ ഇതെല്ലാം ഉള്ളതുകൊണ്ടല്ലേ ദൈവത്തെ വാഴ്ത്തി ഇങ്ങനെ ശക്തമായി നിൽക്കുന്നത്. ഇതല്ലാം നഷ്ടപ്പെട്ടാൽ, ഇവൻ എന്താവും? അപ്പോൾ, ദൈവം അവനെ പരീക്ഷിക്കാൻ പറഞ്ഞു. നമ്മുടെ ജീവിതത്തിൽ ഇതേപോലെ പരീക്ഷണങ്ങൾ വരും. ഭഗവാൻ എല്ലാം തന്നു. ഭഗവാൻ തന്നെ എല്ലാം ഇല്ലാതാക്കിയാൽ, നമ്മൾ ഭഗവാനെ ഉപേക്ഷിക്കുമോ ഇല്ലയോ? എന്നുള്ള പരീക്ഷണങ്ങളും കൂടി നമ്മുടെ ജീവിതത്തിൽ ചിലപ്പോൾ തരണം ചെയ്യേണ്ടി വരും.</p>
            <p>സംഭവിക്കാൻ പോകുന്ന കാര്യം, ദൈവം ഭൂമിയിലുള്ള പല വ്യക്തികളിലൂടെയും അറിയിപ്പ് കൊടുത്തുകൊണ്ടേിരിപ്പുണ്ട്. അത് സമയത്ത് സംഭവിക്കും. ആ സംഭവിക്കുന്ന സമയത്ത്, തിരഞ്ഞെടുക്കപ്പെട്ട ആരെങ്കിലും ഉണ്ടെങ്കിൽ അവർ എങ്ങനെ പാകപ്പെടണം? അവർ എന്ത് ചെയ്യണം? അതെല്ലാം ഇവരിലൂടെ ഒന്നും കിട്ടില്ല. അവരെയൊക്കെ ദൈവം തന്നെ ഒരുക്കിയെടുക്കും എന്ന കാര്യം വെളിപാട് പുസ്തകത്തിൽ പ്രത്യേകം പറഞ്ഞിട്ടുണ്ട്. മണവാട്ടിയെ താൻ ഒരുക്കുന്നതു പോലെ ദൈവം അവരെ ഒരുക്കും. തന്നെത്താനെയാണ് ഒരുങ്ങുന്നത്. അപ്പോൾ, അത് ഒരുക്കി എടുത്തോളും. സുജോ സാറിന്റെ സന്ദേശം കേട്ട് നിങ്ങൾക്ക് പരമാവധി ആർക്കൊക്കെ വേണമെങ്കിലും ഒരുങ്ങാം. ഇനി ഒരുങ്ങാത്തവരെ ദൈവം തന്നെ സാഹചര്യത്തിലൂടെ ഒരുക്കി എടുത്തോളും. എളുപ്പം. പക്ഷെ, ഇങ്ങനെയുള്ള അറിയിപ്പും കാര്യങ്ങളും ഇഷ്ടം പോലെ ആൾക്കാർ പറയുന്നുണ്ട്. പക്ഷെ, ആര് അതിലോട്ട് എത്തും? ആര് ഒരുങ്ങുന്നു? അതാണ് വിഷയം.</p>
            <p>ഈ ഗ്രൂപ്പിലുള്ള ചിലരെ ദൈവം അതി സമ്പന്നതയിലേക്ക്, അല്ലെങ്കിൽ വളരെ ഉയരത്തിലേക്കുള്ള ഭൗതിക സാമ്പത്തിക ഉയർച്ചയിലേക്ക് കൊണ്ടുപോകും; എന്ന് പറഞ്ഞിട്ടുണ്ട്. ഈ അന്ത്യകാലത്ത് ഇതെല്ലാം നശിച്ചു പോകുന്ന ഒരു കാലഘട്ടത്ത് ഭാവിയിൽ 350 വർഷം ആകുമ്പോൾ മനുഷ്യന് കൃഷിയേ കാണുകയുള്ളൂ. ബാക്കിയുള്ളത് എല്ലാം നശിച്ചു പോകും എന്ന് പറയുന്നുണ്ട്. സമ്പത്തും ഭൗതിക ഉയർച്ചയും കാര്യങ്ങളൊക്കെ ദൈവം ഇപ്പോൾ കൊടുക്കുന്നു എന്ന് പറയുമ്പോൾ, അത് എങ്ങനെ ശരിയാകും? എന്ന് ചോദിച്ചപ്പോൾ സുജോ സാറിന് ദൈവം പറഞ്ഞു കൊടുത്തത്: ഇത്രയും നാളും ഈ ഭൂമിയിൽ ദൈവത്തിന് നല്ല രീതിയിൽ ദൈവത്തിന്റെ ഒരാളായിട്ട് ഉയർത്തി കാണിക്കത്തക്ക രീതിയിൽ ഒരാളും അത്ര പാകപ്പെട്ട് വന്നിട്ടില്ലായിരുന്നു. കൃപയുടെ കാലഘട്ടം ആയതുകൊണ്ട് അവന്റെ കയ്യിൽ നീതിയും ന്യായവും ഒന്നും ഇല്ലെങ്കിൽ പോലും, ഭക്തി കാരണവും, അല്ലെങ്കിൽ ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവ് ഒക്കെ ഉള്ള ഒരു കൃപ കാരണവും, കുറച്ച് ഉയർച്ചയും വളർച്ചയും ഒക്കെ കൊടുത്തിട്ടുണ്ടായിരുന്നു. പക്ഷേ, ആരും ഈ നീതിയോടുകൂടി, നിയമം പാലിച്ച് ആ ഒരു തലത്തിൽ ഉയർന്നു വന്നിട്ടില്ല. പലരും ഉയർന്നു വന്നിട്ടുണ്ടെങ്കിൽ പോലും മനസ്സിലാക്കണം, കൃപയാൽ ഒരു കഴിവുമില്ലാതെ, ദൈവം കൊടുത്ത ദാനം പോലെയാണ് വന്നിട്ടുള്ളത്.</p>
            <p>ഇനിയുള്ള കാലഘട്ടത്തിൽ പണ്ട് പഴയ നിയമത്തിലൊക്കെ ദൈവം പലരെയും ഉയർത്തിയതുപോലെ ദൈവത്തിന്റെ കൂടെ നിന്നുകൊണ്ട്  ദൈവം ഏൽപ്പിച്ച ആത്മനിയോഗം തിരിച്ചറിഞ്ഞ് ആ നിലയിൽ നിന്നുകൊണ്ട് ദൈവം പലരെയും വലിയ തലത്തിലേക്ക് ഉയർത്തും. പൈശാചിക ശക്തികളാണ് ഇപ്പോൾ ഒരുപാട് പേരെ ഉയർത്തി വച്ചുകൊണ്ടിരിക്കുന്നത്. അവരെയൊക്കെ തോൽപ്പിച്ച് താഴെ ഇറക്കിയിട്ട്, ദൈവം പദ്ധതിയിട്ട ചിലരെ വളരെ വലിയ നിലയിലേക്ക് ഉയർത്തി കാണിക്കും, എന്ന് ദൈവം പറയുന്നുണ്ട്. കാരണം, ദൈവം ആരാണെന്ന് അന്ത്യകാലത്ത് കാണിച്ചു കൊടുക്കും എന്ന് ദൈവം ഒരു വാക്ക് ബൈബിളിൽ തന്നെ പറയുന്നുണ്ട്. ദൈവത്തിന്റെ കൂടെ നിൽക്കുന്ന ദൈവജനം അത്ര ഉയരത്തിലേക്ക് പോകുന്നത് ദൈവം ചെയ്യുന്ന ഒരു സംഗതിയാണ്. പക്ഷേ, അതിനു യോഗ്യമായ മനസ്സുള്ളവരെ മാത്രമേ ദൈവം അങ്ങനെ ഉയർത്തുകയുള്ളൂ. ഒരിക്കലും എനിക്ക് ഉയരണം എന്ന് ചിന്തിക്കുന്ന ആരെയും ദൈവം അതിനുവേണ്ടി തിരഞ്ഞെടുക്കില്ല. ശലമോനെ ഒക്കെ പോലെ ഇതൊന്നും എനിക്ക് വേണ്ട എന്ന് ഹൃദയം കൊണ്ട് മനസ്സുകൊണ്ട് ആഗ്രഹിച്ചിരിക്കുന്ന ചിലരെ ദൈവം ആ തലത്തിലേക്ക് ഉയർത്തും.</p>`

            "ദൈവീക വിവാഹ സങ്കൽപ്പം: രണ്ട് മനസ്സുകൾ തമ്മിലുള്ള ഐക്യത്തെയാണ് ദൈവം വിവാഹമായി കരുതുന്നത്. ഒരാളുടെ ആത്മാവിന്റെ നിലവാരമനുസരിച്ചുള്ള വ്യക്തിയെയാണ് ജീവിതപങ്കാളിയായി ലഭിക്കുക; അതിനാൽ പങ്കാളിയെ പഴിചാരാതെ സ്വയം ആത്മീയമായി മുന്നേറുക.",
            "വിവാഹമോചനവും പുനർവിവാഹവും: സ്വന്തം താല്പര്യമില്ലായ്മ കാരണം പങ്കാളിയെ ഉപേക്ഷിച്ച് വീണ്ടും വിവാഹം കഴിക്കുന്നവർ ദൈവശിക്ഷ അനുഭവിക്കേണ്ടി വരും. എന്നാൽ പങ്കാളിയാൽ ഉപേക്ഷിക്കപ്പെട്ടവർക്കും, വ്യഭിചാരം നടത്തുന്ന പങ്കാളിയെ ഉപേക്ഷിക്കുന്നവർക്കും മറ്റൊരു വിവാഹം കഴിക്കുന്നതിൽ തെറ്റില്ല.",

            "വിശുദ്ധിയും സത്യയുഗ പ്രവേശനവും: ഏതൊരു വ്യക്തിയുമായും ശാരീരിക ബന്ധത്തിൽ ഏർപ്പെടുന്നത് ദൈവം വിവാഹമായി കണക്കാക്കുന്നു; വിവാഹേതര ബന്ധങ്ങളും സ്വവർഗ അനുരാഗവും ദൈവശിക്ഷയ്ക്ക് വിധേയമാണ്. ഭാര്യയും ഭർത്താവും ഒരേ ആത്മീയ നിലയിൽ ഉയർന്നുവന്നാൽ മാത്രമേ രണ്ടുപേർക്കും ഒരുമിച്ച് സത്യയുഗത്തിലേക്ക് പ്രവേശിക്കാൻ സാധിക്കൂ."

        conclusion: "ആത്മീയമായി വളരാൻ വിവാഹ ജീവിതത്തിൽ നിന്ന് ഒളിച്ചോടിയിട്ട് കാര്യമില്ല. ദൈവത്തിന്റെ നിയമപ്രകാരം വിവാഹജീവിതം നയിക്കുകയും, പ്രതിസന്ധികളിൽ ദൈവത്തോട് പ്രാർത്ഥിച്ച് സ്വയം ആത്മീയമായി ഉയരുകയും ചെയ്യുക.",
        fullContentHtml: `<p>🪔🪞<br><strong>പഠന സംഗ്രഹം</strong><br>2026 ഒക്ടോബർ 8, വ്യാഴാഴ്ച<br><strong>വിഷയം:</strong> വിവാഹമോചനം</p><p>വിവാഹജീവിതം ദൈവത്തിൻറെ നിയമപ്രകാരം നടത്തുക. </p><p>രണ്ട് മനസ്സുകൾ തമ്മിലുള്ള ഐക്യത്തെയാണ് ദൈവം വിവാഹമായി കരുതുന്നത്.</p><p>ഒരാളുടെ ആത്മാവിൻ്റെ നിലവാരം അനുസരിച്ചുള്ള വ്യക്തിയെയാണ് ജീവിതപങ്കാളിയായി ലഭിക്കുക. അതുകൊണ്ട് ജീവിതപങ്കാളിയെ പഴിചാരാതെ സ്വയം ആത്മീയമായി മുന്നേറുക. വഴികൾ ദൈവം തന്നെ തുറന്നു തരും.</p><p>സ്വന്തം താല്പര്യമില്ലായ്മ കാരണം ജീവിതപങ്കാളിയെ ഉപേക്ഷിച്ച് പിന്നീട് വിവാഹം കഴിക്കുന്നവർ ദൈവത്തിൻ്റെ ശിക്ഷ അനുഭവിക്കേണ്ടതായി വരും. ജീവിതപങ്കാളിയാൽ ഉപേക്ഷിക്കപ്പെട്ട ആൾക്ക് മറ്റൊരു വിവാഹം ചെയ്യുന്നതിൽ തെറ്റില്ല. വ്യഭിചാരം നടത്തുന്ന ജീവിതപങ്കാളിയെ ഒരാൾ ഉപേക്ഷിക്കുന്നതിൽ തെറ്റില്ല.</p><p>സ്വയം ജീവിതപങ്കാളിയെ ഉപേക്ഷിച്ചതിനു ശേഷം പിന്നീട് തിരിച്ചുവന്ന് സഹായിയ്ക്കണം എന്ന് പശ്ചാത്താപത്തോടെ അപേക്ഷിക്കുകയാണെങ്കിൽ അവർക്ക് വേണ്ട സഹായം ചെയ്തു കൊടുക്കേണ്ടതാണ്. ദൈവം നമ്മളുടെ തെറ്റുകൾ ക്ഷമിക്കുന്നത് പോലെ ദൈവത്തിൻ്റെ മക്കളായ നാം അവരുടെ തെറ്റുകൾ ക്ഷമിയ്ക്കേണ്ടതാണ്.</p><p>ഏതൊരു വ്യക്തിയുമായും ശാരീരിക ബന്ധത്തിൽ ഏർപ്പെട്ടാൽ അതെല്ലാം വിവാഹമായി ദൈവം കണക്കാക്കുന്നു. സ്വവർഗ അനുരാഗം, വിവാഹേതര ബന്ധങ്ങൾ ഇതെല്ലാം ദൈവ ശിക്ഷയ്ക്ക് വിധേയമാണ്.</p><p>ജീവിതപങ്കാളിയിൽ നിന്നുണ്ടാകുന്ന ഉപദ്രവങ്ങൾ ദ്രോഹങ്ങൾ എന്നിവയെ നേരിടാൻ ദൈവത്തോട് പ്രാർത്ഥിക്കുക. ദൈവം തന്നെ ആ സാഹചര്യത്തെയോ ആ വ്യക്തിയെയോ മാറ്റി തരുന്നതായിരിക്കും.</p><p>വിവാഹ ജീവിതത്തിൽ ദൈവത്തിൻ്റെ വ്യവസ്ഥകൾ തെറ്റി പോയിട്ടുണ്ടെങ്കിൽ അതെല്ലാം ഓരോന്നായി ഓർത്ത് ദൈവത്തോട് ക്ഷമ പറഞ്ഞു പശ്ചാത്തപിയ്ക്കുക. മേലിൽ തെറ്റുകൾ ആവർത്തിക്കില്ല എന്ന് നിശ്ചയത്തോടെ ഉടമ്പടി വെച്ച് പ്രാർത്ഥിക്കുക.</p><p>ആത്മീയമായി വളരാൻ വിവാഹ ജീവിതത്തിൽ നിന്ന് ഒളിച്ചോടിയിട്ട് കാര്യമില്ല. </p><p>ഭാര്യ ഭർത്താക്കന്മാർ ഒരേ ആത്മീയ നിലയിൽ ഉയർന്നുവരികയാണെങ്കിൽ മാത്രമേ രണ്ടുപേർക്കും സത്യയുഗത്തിലേക്ക് പ്രവേശിക്കാൻ സാധിക്കൂ. ഇല്ലെങ്കിൽ ഏതൊരു വ്യക്തിയാണോ ആത്മീയമായി ഉയർന്നുവരുന്നത് ആ വ്യക്തി മാത്രമായിരിക്കും സത്യയുഗം അനുഭവിക്കുക.</p>`

        ],
        conclusion: "അറിവ് നേടിയ ശേഷം ഏത് വഴി തിരഞ്ഞെടുക്കണമെന്നത് ഓരോരുത്തരുടെയും തീരുമാനമാണ്. ദൈവീക വ്യവസ്ഥകൾ പാലിച്ച് കുടുംബത്തെ നേർവഴിക്ക് നയിക്കുന്നവർ ഒന്നാം പുനരുദ്ധാനമായ സത്യയുഗത്തിന് യോഗ്യരാകും.",
        fullContentHtml: `<p><strong>പഠന സംഗ്രഹം</strong><br>2026 ഒക്ടോബർ 29, വ്യാഴാഴ്ച<br><strong>വിഷയം:</strong> ഇന്നുവരെ ചർച്ച ചെയ്ത ചർച്ചകളിലെ സംശയനിവാരണം.</p><h4>സ്ത്രീകളുടെ ധർമ്മം</h4><p><strong>ചോദ്യം:</strong> സുഭാഷിതങ്ങൾ 31: 10 - 28 പ്രകാരമുള്ള ഉത്തമയായ ഭാര്യയെ കണ്ടുപിടിയ്ക്കാൻ ആർക്ക് കഴിയും?</p><p><strong>ഉത്തരം:</strong> സുഭാഷിതങ്ങളിൽ ഈ പറയുന്ന കാര്യങ്ങൾ എല്ലാം ഒത്തിണങ്ങി വന്നാൽ സ്ത്രീ ശരിയാണ്. പക്ഷേ ഈ കാലഘട്ടത്തിൽ അങ്ങനെയല്ല. ഈ കാലഘട്ടത്തിൽ ഭർത്താക്കന്മാർക്ക് വീട്ടുജോലി, ഭാര്യമാർ കുടുംബനേതൃത്വം ഏറ്റെടുത്ത് കുടുംബത്തിന്റെ തല സ്ത്രീയായിട്ടിരിക്കുകയല്ലേ? അവൾ വാ തുറന്നാൽ ജ്ഞാനം വരുമോ? അനാവശ്യ വാക്കും വിരട്ടും ഭീഷണിയും തെറിവാക്കും ഒക്കെ അല്ലേ വായിൽ വരുന്നത്? നിങ്ങൾ ഈ പറയുന്ന എല്ലാം ഒത്തിണങ്ങി വന്ന സ്ത്രീ എന്ന് പറയുന്നത് ശരിയാണ്. അല്ലാതെ വരുമാനത്തിനു വേണ്ടി മാത്രം സ്ത്രീ പോവുകയും ഭർത്താവിനെയും, കുടുംബ കാര്യങ്ങളും നേരാംവണ്ണം നോക്കാതെ, രാവിലെ ജോലിക്ക് പോയിട്ട് രാത്രി കയറി വന്നിട്ട്, മക്കളെ അമ്മയുടെ കയ്യിൽ ഏൽപ്പിക്കുക, ജോലിക്കാരിയെ വച്ച് മക്കളെ നോക്കുക, എന്നിട്ട് ഭാര്യ പണത്തിനു വേണ്ടി മാത്രമുള്ള പോക്ക്, ആ കാശ് എന്തു ചെയ്യുന്നു എന്ന് ഭർത്താവിനും അറിഞ്ഞുകൂടാ. ഭാര്യ പോയാൽ തന്നെ എവിടേയ്ക്ക് പോകുന്നു എന്തൊക്കെ കാണിയ്ക്കുന്നു എന്ന് ഭർത്താവിന് യാതൊരു ബോധവുമില്ല. ഭർത്താവ് വേറൊരു രീതിയിൽ പോകുന്നു. അതാണ് പ്രശ്നം. ദൈവം ഒരുകാലത്ത് നല്ല കാര്യങ്ങൾ പറഞ്ഞതെല്ലാം. അതിന്റെ ചില കാര്യങ്ങൾ മാത്രം എടുത്തു വച്ചുകൊണ്ട്, ബാക്കി എല്ലാം തള്ളിക്കളഞ്ഞിട്ട് വഴി തെറ്റി പോകുന്നതു കൊണ്ടാണ്; പിന്നീട് ദൈവം ഇതെല്ലാം മാറ്റി മാറ്റി കർശ്ശനമാക്കി കൊണ്ടുവരുന്നത്. ഇപ്പോൾ ദൈവം കർശ്ശനമായി.</p><p><strong>ചോദ്യം:</strong> സ്ത്രീകൾക്ക് മാത്രം ചെയ്യാൻ പറ്റുന്ന എന്ത് ദൗത്യമാണ് ജീവിതത്തിൽ ഉള്ളത്?</p><p>സ്ത്രീയുടെ മുഖ്യ പങ്ക് എന്ന് പറയുന്നത് അടുത്ത തലമുറയെ തെറ്റ് കൂടാതെ വളർത്തിയെടുക്കുക. മറ്റുള്ളവർക്ക് അറിവ് - ജ്ഞാനം പകർന്നു കൊടുക്കുക. സ്ത്രീയ്ക്ക് എത്രത്തോളം വേണമെങ്കിലും അറിവ് സമ്പാദിക്കാം. ഭർത്താവിന് കീഴ്പ്പെട്ടു നിന്ന്, ഭർത്താവിന് എന്തൊക്കെ വേണമൊ സഹായങ്ങൾ ചെയ്യേണ്ടത് അതെല്ലാം ചെയ്ത് ഭർത്താവിനെ സഹായിയ്ക്കുക. മക്കളെ പ്രസവിയ്ക്കുക. അത് ഒരിക്കലും ഒരു ആണിന് പറ്റില്ലല്ലോ, ഇതാണ് പ്രധാനം.</p><p>നമ്മൾ, പറയുന്നത് കേട്ടിട്ടുണ്ടല്ലോ: സ്ത്രീയാണ് വീട്ടിലെ വിളക്ക്. ഒരു സ്ത്രീ വിചാരിച്ചാൽ കുടുംബം നന്നാകും. ഒരു സ്ത്രീ ആ കുടുംബത്തെ നശിപ്പിയ്ക്കുകയും ചെയ്യും എന്നൊക്കെ പറയാറുണ്ടല്ലോ. അതൊക്കെ ശരി തന്നെ. കാരണം, ഒരു വീട്ടിലെ മക്കളെ വളർത്താനും അവരെ നല്ല രീതിയിൽ എത്തിയ്ക്കാനും; ദൈവത്തോട് സദാ പ്രാർത്ഥിക്കേണ്ട ഒരു വലിയ ദൗത്യം സ്ത്രീകൾക്കാണ് ഉള്ളത്. എങ്ങനെയുള്ള ഭർത്താവായാലും ആ ഭർത്താവിനെ നന്നാക്കിത്തരാൻ ദൈവത്തോട് പ്രാർത്ഥിയ്ക്കുകയും. ഏത് തരം ഭർത്താവിനെയും സ്ത്രീയുടെ പെരുമാറ്റം കൊണ്ട്, നല്ല പ്രവർത്തികൾ കൊണ്ട്, നന്നാക്കി മാറ്റിയെടുക്കുന്നതിന്റെ ഉദാഹരണം കാണിച്ചു കൊടുക്കേണ്ടത് സ്ത്രീ തന്നെയാണ്. ഒരു കുടുംബത്തിൽ ഏറ്റവും പ്രധാനമായി കണക്കാക്കപ്പെടുന്നത് സ്ത്രീയാണ്.</p><p><strong>ചോദ്യം:</strong> സ്ത്രീ അബലയാണോ? സൃഷ്ടിയിൽ ഏറ്റവും അവസാനത്തേതും, ഏറ്റവും ശക്തവും ഏറ്റവും പ്രധാനപ്പെട്ട ഒരു സൃഷ്ടിയുമാണ് സ്ത്രീ. ഭൗതിക തലങ്ങളിൽ ബന്ധപ്പെട്ട് നിൽക്കുന്ന പുരുഷ വർഗ്ഗത്തിന് ഉന്നതമായ ആത്മീയതലത്തിലേക്ക് ബന്ധിപ്പിക്കുന്ന ദൈവത്തിന്റെ ഒരു പ്രത്യേക ഉപകരണം അല്ലേ സ്ത്രീ?</p><p><strong>ഉത്തരം:</strong> ദൈവം ആദ്യം ഒരാളെ സൃഷ്ടിച്ചു. ആ ആണിൽ നിന്നുമാണ് കുറച്ച് ശക്തിയെടുത്ത് സ്ത്രീയെ സൃഷ്ടിച്ചത്. ആ സ്ത്രീയെ സൃഷ്ടിച്ചത് തന്നെ അയാൾക്ക് കൂട്ടായിട്ടാണ്. ഇത് എന്തിനാണ് ചിന്തിച്ചാൽ ബാക്കി കാര്യങ്ങൾ നമുക്ക് കിട്ടും. സ്ത്രീ അബല എന്നല്ല. പുരുഷനെ സഹായിയ്ക്കാൻ പുരുഷന്റെ കീഴിൽ നിൽക്കുന്ന സ്ത്രീ, ആ സ്ത്രീയെ അബല എന്ന് എങ്ങനെ പറയാൻ പറ്റും? പുരുഷൻ അമേരിക്കൻ പ്രസിഡെന്റ് ആണെങ്കിൽ അയാളുടെ ഭാര്യയുടെ ശക്തിയും നിലയും നമ്മുടെ ഈ ഗ്രൂപ്പിലുള്ള സാധാരണ ഒരു സ്ത്രീയ്ക്ക് കിട്ടുമോ? ബാക്കിയുള്ള സ്ത്രീകളെ വച്ച് നോക്കുമ്പോൾ വലിയ നിലയിൽ ആയിരിയ്ക്കും ആ സ്ത്രീ. പല കാര്യത്തിലും അധികാരങ്ങളും കാണും, എന്തെല്ലാം കിട്ടും. ഭർത്താവ് ഒരു പടി മുകളിൽ നിൽക്കണം എന്നേയുള്ളൂ, വേറൊന്നുമല്ല. ഇപ്പോൾ മാതാ അമൃതാനന്ദമയി. എത്രയോ ആൾക്കാരെ നിയന്ത്രിച്ച് എത്രയോ വലിയ നിലയിൽ നിൽപ്പുണ്ട്. നന്മയോ തിന്മയോ എന്തോ ആയിക്കോട്ടെ, സ്ത്രീ നിൽക്കുന്നത് കണ്ടോ? സ്ത്രീയ്ക്ക് സ്ഥാനമില്ലെന്നൊ, അബല അല്ലെന്നുള്ളതോ അല്ല വിഷയം. വിവാഹം കഴിഞ്ഞ് ഒരു തലയായ പുരുഷന്റെ കീഴിൽ ഭാര്യയായി വന്നു കഴിഞ്ഞാൽ, ഒരു പടി താഴെ. എന്തൊക്കെയുണ്ടെങ്കിലും, എത്ര കഴിവുണ്ടെങ്കിലും ആ പുരുഷന്റെ ഒരു പടി താഴെ നിന്നേ കാര്യങ്ങൾ ചെയ്യാൻ പറ്റുകയുള്ളൂ. പുരുഷൻ ഒരുപടി മുകളിൽ നിന്ന് ഇതെല്ലാം ചെയ്യും, ഒരുപടി താഴെ നിന്നുകൊണ്ട് സ്ത്രീയും ചെയ്യും.</p><p><strong>ചോദ്യം:</strong> ശരിയല്ലാത്ത ഒരു കാര്യം പുരുഷൻ ചെയ്യുമ്പോൾ അത് തെറ്റാണെന്ന് ഭാര്യ പറയുന്നത് തെറ്റാണോ? അത് ദൈവനിന്ദ ആയിട്ട് വരുമോ?</p><p><strong>ഉത്തരം:</strong> ഭർത്താവിന്റെ അടുത്ത് നമ്മൾ തെറ്റ് ചൂണ്ടിക്കാണിയ്ക്കുന്നതും അന്യനായ ഒരാളുടെ അടുത്ത് തെറ്റ് ചൂണ്ടിക്കാണിയ്ക്കുന്നതും തമ്മിൽ വ്യത്യാസമുണ്ട്. ഭർത്താവിന്റെ അടുത്ത് തെറ്റ് ചൂണ്ടി കാണിയ്ക്കുമ്പോൾ നമ്മൾ ഭർത്താവിന്റെ കീഴിൽ നിൽക്കുന്നതു കൊണ്ട് അത് ചൂണ്ടിക്കാണിക്കുന്ന രീതിയിൽ വ്യത്യാസമുണ്ട്. അവിടെ കാര്യം പറഞ്ഞ് മനസ്സിലാക്കുന്നത് പോലെ; സ്നേഹത്തിലും, ആ നിലയിലും തെറ്റിനെ പറഞ്ഞു മനസ്സിലാക്കി കൊടുക്കണം. അല്ലാതെ ഭർത്താവിന്റെ അടുത്ത്, "പണ്ടേ നിങ്ങളുടെ സ്വഭാവം ഇങ്ങനെയായിരുന്നു, ഇത് നേരത്തെ എനിയ്ക്ക് മനസ്സിലായിരുന്നു, നിങ്ങൾ കാണിയ്ക്കുന്നത് അത്രയും മണ്ടത്തരം" എന്നൊക്കെയുള്ള അധികാര രീതിയിൽ സംസാരിയ്ക്കുമ്പോഴാണ് അവിടെ പ്രശ്നം വരുന്നത്. അപ്പോൾ സ്ത്രീ ഭർത്താവിന്റെ തൊട്ട് മുകളിലെ നിലയിൽ കയറി സംസാരിയ്ക്കുകയാണ്. അങ്ങനെ സംസാരിയ്ക്കുമ്പോൾ ദൈവീക കണ്ണിൽ അവിടെ പ്രശ്നം വരും. അപ്പോൾ, സ്ത്രീ താഴത്തെ തട്ടിൽ നിന്ന് എങ്ങനെയാണ് ഉപദേശിയ്ക്കേണ്ടത്, അങ്ങനെ ഉപദേശിക്കണം. ഭർത്താവിന്റെ ഭാഗത്തു നിന്ന് ഏതെങ്കിലും ഒരു തെറ്റ് നമ്മൾ കാണുന്നുണ്ട് എങ്കിൽ, തീർച്ചയായും അവരെ ഉപദേശിയ്ക്കണം. അവരുടെ കീഴിൽ തന്നെ നിന്നുകൊണ്ട് അവരെ പഠിപ്പിയ്ക്കുന്ന രീതിയിൽ ആവാതെ, എനിയ്ക്ക് ആത്മീയ കാര്യങ്ങൾ ഇത്തിരി അറിയാം എന്നുള്ള രീതിയിലും പറയാതെ, ഒരു ഭാര്യ എന്നുള്ള രീതിയിൽ നിന്നുകൊണ്ട് ഭർത്താവിനെ ഉപദേശിയ്ക്കുന്നതിൽ യാതൊരു തെറ്റുമില്ല. അങ്ങനെ തന്നെ ചെയ്യണം.</p><p><strong>ചോദ്യം:</strong> പ്രവാചക പദവിയിൽ സ്ത്രീകൾ വരുമോ? ബൈബിളിൽ പ്രവാചകരായ സ്ത്രീകളെക്കുറിച്ച് പറയുന്നുണ്ടല്ലൊ!</p><p><strong>ഉത്തരം:</strong> പുരുഷന്റെ മേൽ അധികാരം വഹിയ്ക്കാനുള്ള അനുവാദം സ്ത്രീയ്ക്ക് ദൈവം കൊടുത്തിട്ടില്ല. സ്ത്രീയ്ക്ക് എപ്പോഴും സ്ത്രീകളെ മാത്രമേ ഉപദേശിയ്ക്കാനും പഠിപ്പിയ്ക്കാനും നേർവഴിയ്ക്ക് നയിയ്ക്കാനും ദൈവം വച്ചിരിയ്ക്കുന്ന ഒരു വഴിയുള്ളൂ. പുരുഷനാണെങ്കിൽ അങ്ങനെയല്ല; പുരുഷന്മാരെയും സ്ത്രീകളെയും ഒരേപോലെ ആത്മീയ മേഖല പഠിപ്പിയ്ക്കാനും അവരുടെ മേൽ അധികാരമെടുക്കാനും ഒരു പുരുഷനും പറ്റും. സ്ത്രീകൾക്ക് ഒരു പുരുഷന്റെ മേൽ അധികാരം എടുക്കാൻ പറ്റാത്തതു കൊണ്ടാണ്, പ്രവാചകന്മാരായിട്ട് ദൈവം സ്ത്രീകളെ തിരഞ്ഞെടുക്കാത്തത്. പ്രവാചകൻ എന്ന് പറയുമ്പോൾ അത്രയും ഉയർന്ന നിലയിൽ ഉള്ളവരായിരിയ്ക്കണം. സ്ത്രീകൾക്ക് എങ്ങനെയായാലും അത് പറ്റില്ലല്ലോ. പുരുഷന്റെ മേൽ അധികാരമില്ലല്ലോ.</p><p>ബൈബിളിൽ പറയുന്നതും, ഇന്ന് ചുറ്റുപാടും മാധ്യമങ്ങളിലും കാണുന്നതും, സ്ത്രീകൾക്ക് പ്രവചന വരം ഉണ്ട് എന്നാണ്. ഇവരാരും പ്രവാചകർ അല്ലല്ലോ. വരം തൽക്കാലമായി കിട്ടുന്നതാണ്. ഈ അന്ത്യകാലത്ത് ദൈവം അതെല്ലാം പിൻവലിച്ചിരിപ്പുണ്ട്. അതെല്ലാം അവരിൽ നിന്നും നഷ്ടപ്പെട്ടു പോകും. കൃപാ കാലത്ത് അങ്ങനെയൊക്കെ ചില കാര്യങ്ങൾ കിട്ടിക്കൊണ്ടിരുന്നതാണ്. യഥാർത്ഥ പ്രവാചക എന്നൊന്നില്ല; പ്രവാചകൻ എന്നേയുള്ളൂ. പൈശാചിക ശക്തികളുടെ കൂടെ നിൽക്കുന്ന ചില പ്രവാചകിമാർ ഉണ്ട്. ദൈവത്തിന്റെ നന്മയിൽ അങ്ങനെ ഇല്ല.</p><p><strong>ചോദ്യം:</strong> എല്ലാ ഉത്തരവാദിത്വങ്ങളും സ്ത്രീകൾ ഒറ്റയ്ക്ക് ചെയ്യുന്നതിൽ തെറ്റുണ്ടോ?</p><p><strong>ഉത്തരം:</strong> ദൈവം കർമ്മങ്ങൾ രണ്ടായിട്ട് കൊടുത്തിട്ടുണ്ട്. ഒന്ന് സ്ത്രീകൾക്ക് ഒരു വിഭാഗം കൊടുത്തു; മറ്റൊന്ന് പുരുഷന്മാർക്ക് ഒരു വിഭാഗം കൊടുത്തു. സ്ത്രീയ്ക്ക് കൊടുത്തതു തന്നെ കൂടുതലാണ്. സ്ത്രീയ്ക്ക് കൊടുത്ത ജോലി ചെയ്യാൻ ബാധ്യസ്ഥയാണ്. വീടും പരിസരവും വൃത്തിയായി സൂക്ഷിയ്ക്കുക, ആഹാരം പാകം ചെയ്യുക, മക്കളെ വളർത്തുക, പ്രസവിയ്ക്കുക, ഭർത്താവ് ഉണ്ടെങ്കിൽ ഭർത്താവിന് ഭൗതികത്തിൽ എന്തെങ്കിലും സഹായം ചെയ്തു കൊടുക്കുക. വലിയ വലിയ ദൗത്യങ്ങൾ സ്ത്രീകൾക്ക് നേരത്തേ കൊടുത്തിട്ടുണ്ട്.</p><p>ഭർത്താവിന്റെ ജോലി എന്ന് പറഞ്ഞു കഴിഞ്ഞാൽ വീട്ടിലേയ്ക്ക് ഭാര്യയ്ക്ക് മക്കൾക്ക് എന്തൊക്കെ ആവശ്യങ്ങളുണ്ട് അതിനുള്ള പണം എത്ര കഷ്ടപ്പെട്ട് ആണെങ്കിലും വിയർത്ത് അധ്വാനിച്ച് സമ്പാദിച്ചു കൊടുക്കുക. എങ്ങനെ വലിയൊരു ജോലിയാണ് ഭർത്താവിന് കൊടുത്തേക്കുന്നത്. നമ്മുടെ അഭിപ്രായത്തിൽ, ഭർത്താവിന്റെ ജോലി സുഖമാണ്. കുറച്ചു ബുദ്ധിയും ആരോഗ്യവും ജോലി ചെയ്യാനുള്ള കഴിവും ഉണ്ടെന്നുണ്ടെങ്കിൽ ദൈവം ഏൽപ്പിച്ച ജോലി എളുപ്പത്തിൽ ചെയ്യാൻ പറ്റും. സ്ത്രീയ്ക്ക് ഇപ്പോൾ ഉള്ള ജോലി കുറച്ച് പാടാണ്. കാരണം, മക്കളെയൊക്കെ വളർത്തി നേർവഴിക്ക് എത്തിയ്ക്കുക എന്ന് പറയുന്നത് വിചാരിയ്ക്കുന്ന പോലെ എളുപ്പമല്ല; നല്ല പാടാണ്. കാരണം, പിള്ളേര് കാണിയ്ക്കുന്ന ഓരോ മണ്ടത്തരങ്ങളും; ക്ഷമയോടും സ്നേഹത്തിലും, അറിവ് നേടിയും, പഠിപ്പിച്ച് എടുക്കാൻ തന്നെ 'വട്ടാവും'. അത് അമ്മമാർക്ക് അറിയാം. ഇതോടൊപ്പം തന്നെ, വീട് വൃത്തിയാക്കുക തുണികൾ കഴുകിക്കൊടുക്കുക, കുട്ടികളുടെ കാര്യങ്ങൾ നോക്കുക; മൊത്തം അധികപ്പണിയാണ്. ഭർത്താക്കന്മാർക്ക് ഒന്നും അറിയേണ്ട; രാവിലെ വീട്ടിൽ നിന്ന് പോയി വൈകുന്നേരം കയറി വന്നാൽ മതി. ശരിയ്ക്കും മനസ്സിലാവാത്ത കാര്യം എന്താണെന്ന് വച്ചു കഴിഞ്ഞാൽ ഇത്രയും ജോലികൾ കിടക്കവേ, ഭർത്താക്കന്മാരുടെ ജോലിയും കൂടെ സ്ത്രീകൾക്ക് ചെയ്തേ പറ്റൂ: "വരുമാനം കൂടി എനിയ്ക്ക് കണ്ടെത്തണം' എന്ന് സ്ത്രീ ചിന്തിയ്ക്കുന്നത് ശരിക്കും മാനസികമായിട്ട് ഇത്തിരി പ്രശ്നമുണ്ടെന്ന് നമുക്ക് തോന്നുകയുള്ളൂ. ഇല്ലെന്നുണ്ടെങ്കിൽ, സ്ത്രീയ്ക്ക് ഏൽപ്പിച്ച ജോലി ഒന്നും ചെയ്യാതെ; ഈ ആണുങ്ങളുടെ ജോലി മാത്രം ചെയ്യാനായിരിയ്ക്കും സ്ത്രീയുടെ പദ്ധതി. അങ്ങനെ വരുമ്പോഴേക്കും പ്രകൃതിയുടെ വ്യവസ്ഥ തെറ്റി. സ്ത്രീയ്ക്ക് ദൈവം ഏൽപ്പിച്ച കടുത്ത ജോലി സ്വതവേ ഉണ്ട്. ഇതിനും പുറമേ, ഭർത്താവ് ഉഴപ്പുന്ന ഇടത്ത് സാമ്പത്തികം കൂടെ കണ്ടെത്തി ഉണ്ടാക്കി വരിക എന്ന് പറയുമ്പോൾ; സ്ത്രീ ഇരട്ടി പണി ചെയ്യുകയാണ്. അങ്ങനെ വരുമ്പോൾ ആ സ്ത്രീ ഭൂമിയിൽ നരകം അനുഭവിയ്ക്കുകയാണ്. അല്ലാതെ, ഇരട്ടിപ്പണിയും മൂന്നിരട്ടിപ്പണിയും ചെയ്യുക എന്ന് പറയുന്ന ഒരു സ്ത്രീക്ക് മാനസികമായ രോഗമാണെന്നേ നമുക്ക് പറയാൻ പറ്റുകയുള്ളൂ.</p><p><strong>ചോദ്യം:</strong> സത്യയുഗത്തിൽ എത്താൻ സ്ത്രീ പുരുഷന്മാർ കുടുംബ ജീവിതത്തിൽ പാലിക്കേണ്ട പ്രധാന നിയമം എന്താണ്?</p><p><strong>ഉത്തരം:</strong> ഈ വ്യവസ്ഥകളും കാര്യങ്ങളും ഒക്കെ കേട്ടാൽ ആത്മീയമായി വളർച്ച വരും. ആത്മീയ വളർച്ച വന്ന ഒരു ആത്മാവ് സ്ത്രീയാണെങ്കിൽ, ആ വ്യക്തിക്ക് ഭർത്താവ് ജോലി ചെയ്യുന്നതു പോലെ സമ്പാദിക്കണം എന്നുള്ള ആഗ്രഹവും ആ മനസ്സും പൂർണ്ണമായിട്ട് അങ്ങോട്ട് മാറിപ്പോകും. പകരം, മക്കളുടെ കാര്യങ്ങൾ നല്ലപോലെ നോക്കണം, വീടും പരിസരവും വൃത്തിയായി സൂക്ഷിയ്ക്കണം, ഇങ്ങനെയൊക്കെയുള്ള അതിലോട്ടേ ആത്മാവിന് താത്പര്യം വരികയുള്ളൂ. ആത്മീയ വളർച്ചയില്ലാത്ത സ്ത്രീകളാണ് ഭൗതിക കാര്യങ്ങൾക്ക് വേണ്ടി തെറ്റി, തെറ്റായിക്കൊണ്ട് ഓടിക്കൊണ്ടിരിക്കുന്നത്. പുരുഷന്മാരും അങ്ങനെ തന്നെയാണ്. ആത്മീയ വളർച്ച വന്ന ഒരു പുരുഷൻ, യഥാർത്ഥ ആത്മീയ വളർച്ച വന്നാൽ പിന്നെ സ്വന്തം ഭാര്യയെ ഇരട്ടപ്പണി കൊടുത്തു ദ്രോഹിയ്ക്കാൻ ശ്രമിയ്ക്കുകയില്ല. മാത്രവുമല്ല, ഭാര്യ ചെയ്യേണ്ട ജോലി ഭർത്താവിന് ചെയ്യാൻ തോന്നുകയുമില്ല. ആത്മീയ വളർച്ച വന്ന ആൾക്കാരുടെ കാര്യമാണ് ഈ പറയുന്നത്. ഇത് താനേ വരുന്ന ഒരു മാനസികാവസ്ഥയാണ്. ഇപ്പോൾ അങ്ങനെ ഒരു അവസ്ഥ വരുന്നില്ല എന്ന് വെച്ചാൽ, ആത്മീയ വളർച്ച വന്നിട്ടില്ല എന്നർത്ഥം. ആത്മാവായിട്ട് ആ ഒരു നിലയിൽ ഒന്നും ആകുന്നില്ല. ആവാത്ത കാലത്തോളം ഈ വ്യവസ്ഥ തെറ്റിയേ ജീവിയ്ക്കുകയുള്ളൂ.</p><p>ഒരു കുടുംബത്തിൽ ഇപ്പോൾ പുരുഷന് ആത്മീയ വളർച്ച വന്നു എന്ന് വച്ചോളൂ. ആ സ്ത്രീയ്ക്ക് ആത്മീയ വളർച്ച വന്നില്ല എന്നുണ്ടെങ്കിൽ അവർ തമ്മിൽ ഒന്നിച്ചു പോകുന്നത് വളരെ പാടായിരിയ്ക്കും. കാരണം അങ്ങോട്ട് പൊരുത്തപ്പെടുകയില്ല. രണ്ടുപേരും ഒരേപോലെ ആ വളർച്ച വന്നാലേ ഒരു കുടുംബത്തിൽ നല്ല കൃത്യമായിട്ട് സുഖമായിട്ട് പോകാൻ പറ്റുകയുള്ളൂ. ആത്മീയ വളർച്ച വരുന്ന ഒരു വ്യക്തിയ്ക്ക് ആത്മീയ വളർച്ച ഇല്ലാത്തവരുടെ കൂടെ ജീവിയ്ക്കുന്നത് നരകതുല്യമായിരിയ്ക്കും. ഒന്നുകിൽ രണ്ടുപേരും ആത്മീയ വളർച്ച ഇല്ലാത്ത ശിശുക്കളെപ്പോലെ എല്ലാവരും ചെയ്യുന്നത് പോലെ ഭൗതികത്തിൽ തോന്നുന്നത് പോലെ അങ്ങ് ജീവിച്ചു പോവുക. അതിന്റേതായ കഷ്ടങ്ങളും കാര്യങ്ങളും അങ്ങ് നേരിടുക. അങ്ങനെയുള്ള കുടുംബങ്ങളിൽ എപ്പോഴും പ്രശ്നങ്ങളും വിഷയങ്ങളും രോഗങ്ങളും അങ്ങനെയുള്ള കാര്യങ്ങൾ വന്നു കൊണ്ടേയിരിയ്ക്കും. അവർ പലരും നിയമം പാലിയ്ക്കാൻ സന്നദ്ധരല്ല. കാരണം, എത്ര നാൾ കാത്തിരുന്ന് പരീക്ഷ എഴുതിയ ജോലിയാണ് കിട്ടിയിട്ടുള്ളത്. അത് കളയാനുള്ള മനസ്സ് ഒന്നും വരില്ല. അവർ പറയുന്നത് ഇങ്ങനെ ആഗ്രഹിച്ചു കിട്ടിയ ജോലി ഒന്നും കളയാൻ പറ്റുകയില്ല, മരണം വരെ ഇങ്ങനെയുള്ള ദുരിതം അനുഭവിച്ചു കൊള്ളാം.</p><p>അമ്മ ശരി ഇല്ലാതെ വരുമ്പോഴേയ്ക്കും കുറച്ചു കഴിഞ്ഞു മക്കളിൽ പൈശാചികത കയറി വരും എന്നതിൽ മാറ്റം ഒന്നുമില്ല. കാരണം, ദൈവം - പ്രകൃതി പറയുന്നതാണ്. കുട്ടികൾ വഴി തെറ്റി പോകുന്നതിന്റെ മുഖ്യ കാരണം അമ്മമാരുടെ സ്വാധീനം കുടുംബത്തിൽ വരാത്തതുകൊണ്ടാണ്. അമ്മമാർ രാവിലെ ഇറങ്ങിപ്പോകുമ്പോൾ മക്കളെ നയിക്കേണ്ട അവിടെ തെറ്റിപ്പോവുകയാണ്. കാരണം, വീട്ടിൽ മറ്റുള്ളവർ നോക്കുന്നത് ഒന്നും അമ്മ നോക്കുന്നത് പോലെ വരില്ല. അമ്മയ്ക്ക് അറിവും വിവരവും ഒന്നും കാണില്ല. അമ്മ തോന്നിയത് പോലുള്ള ജീവിതം, ഭർത്താവ് നേരെ തല തിരിച്ചുള്ള വേറൊരു ജീവിതം. ഇത് കണ്ട് വളരുന്ന മക്കളും തല തിരിഞ്ഞു പോവില്ലേ? വേറെ ഒരു മാറ്റവും ഒന്നുമില്ല. ഇതൊക്കെ അനുഭവിക്കേണ്ടതായി വരും. കാരണം, എല്ലാവർക്കും ഈ നിയമം പാലിയ്ക്കാൻ പറ്റില്ല. അത് പറ്റണമെന്നുണ്ടെങ്കിൽ ദൈവത്തോട് അത്രയും തീക്ഷ്ണതയും ദൈവത്തോട് അത്രയും ആത്മാർത്ഥതയും ഉണ്ടാവണം. ഒരു ആത്മീയ വളർച്ച വ്യക്തിക്ക് വരുമ്പോഴേ ആ മനസ്സ് മാറി വരികയുള്ളൂ. പറഞ്ഞു മാറ്റിച്ച് പഠിപ്പിച്ചു മാറ്റിക്കാവുന്ന സാധനമല്ല. സത്യയുഗത്തിലേയ്ക്ക് ദൈവം പദ്ധതിയിട്ട് വച്ചിരിക്കുന്ന ചില ആത്മാക്കൾക്ക് ഇത് കേട്ട് കഴിയുമ്പോൾ അവരുടെ ഉള്ളിൽ തന്നെ ആ മാറ്റം വന്നിരിയ്ക്കും, എന്നാണ് ദൈവം പറയുന്നത്. മാറ്റം വന്നില്ല എന്നാൽ വിചാരിച്ചു കൊള്ളണം, സത്യയുഗത്തിലേയ്ക്ക് ആ കുടുംബത്തിന് സാധ്യതയില്ല.</p><p><strong>ചോദ്യം:</strong> സ്ത്രീകൾക്ക് ദൈവത്തിൽ നിന്ന് ആത്മീയ ദർശ്ശനങ്ങൾ ലഭിയ്ക്കുമോ?</p><p><strong>ഉത്തരം:</strong> സ്ത്രീകൾക്ക് ദൈവത്തിൽ നിന്ന് ദർശ്ശനങ്ങൾ കിട്ടില്ലെന്ന് ആരു പറഞ്ഞു? ഒരു പുരുഷനെ സ്ത്രീ ശബ്ദത്തിൽ വന്ന് പഠിപ്പിയ്ക്കുന്നു എന്ന് പറയുമ്പോൾ അവിടെ കുറച്ച് സംശയിയ്ക്കാൻ ഉണ്ട്. കാരണം, പുരുഷനു മേൽ സ്ത്രീയ്ക്ക് അധികാരമില്ലല്ലോ. പക്ഷേ ഒരു സ്ത്രീയ്ക്ക്, പുരുഷ ശബ്ദത്തിലോ സ്ത്രീ ശബ്ദത്തിലോ കിട്ടിക്കഴിഞ്ഞാൽ അവിടെ വിശ്വസിയ്ക്കാം. ദൈവം ആ നിയമത്തിലൂടെ പ്രവർത്തിയ്ക്കുകയുള്ളൂ. ദൈവം ഒരു നിയമം എഴുതി വച്ചിട്ട് ഒരു വ്യക്തിക്ക് മാത്രമാണ് നിയമം തെറ്റി കാര്യം നടക്കും എന്ന് പറയുമ്പോൾ, അവിടെ സംശയിക്കേണ്ടിയിരിയ്ക്കുന്നു. നിങ്ങൾക്ക് കിട്ടിയ കാര്യങ്ങൾ നിങ്ങൾ മനസ്സിൽ വച്ചേക്കുക, എന്നിട്ട് മുന്നോട്ടു പോവുക. ബാക്കി നിങ്ങളുടെ ജീവിതവും കാര്യങ്ങളും ദൈവത്തിന്റെ വ്യവസ്ഥയിൽ തന്നെയാണ് പോകുന്നത് എന്നുണ്ടെങ്കിൽ കുഴപ്പം ഒന്നുമില്ല. അതല്ല ദർശ്ശനങ്ങളും കാര്യങ്ങളൊക്കെ കിട്ടിയതിനു ശേഷം വ്യവസ്ഥകളിൽ ശരിയെന്ന് തോന്നുന്നതെല്ലാം തെറ്റിപ്പോകുന്നു, അല്ലെങ്കിൽ തെറ്റായിട്ടുള്ള ദർശ്ശനങ്ങൾ കിട്ടുന്നു. ഇപ്പോൾ ഈ ആത്മീയ ഗുരുക്കന്മാർക്ക് തെറ്റായ ദർശനം കിട്ടി ഒരുപാട് വഴിതെറ്റി പോവുകയല്ലേ? അപ്പോൾ, അതേ പോലെ, സ്വയം ദൈവമാകണം, ഞാൻ തന്നെയാണ് സൃഷ്ടാവായ ദൈവം, അങ്ങനെയൊക്കെ കയറിവരുന്നുണ്ടെങ്കിൽ ഒന്ന് സൂക്ഷിക്കേണ്ടിയിരിക്കുന്നു.</p><h4>വഴിതെറ്റിപ്പോകുന്ന ആത്മീയർ</h4><p>നമ്മുടെ ഈ കാലഘട്ടത്തിൽ ഒരുപാട് ആത്മീയ ആൾക്കാർ വഴി തെറ്റി പോകുന്നുണ്ട്. പക്ഷേ പുറമെ നമ്മൾക്ക് നോക്കുമ്പോൾ അറിയാം, അവർ കാണിക്കുന്നത് അത്രയും മണ്ടത്തരങ്ങളും തെറ്റുകളും ആണെന്ന്. വ്യക്തമായി ശബ്ദം കേട്ടും, വ്യക്തമായി ചില ദർശ്ശനം കണ്ടുമാണ്, അവരിതെല്ലാം ചെയ്തുകൊണ്ടിരിയ്ക്കുന്നത്. അവരെ നമ്മൾക്ക് പറഞ്ഞു മനസ്സിലാക്കിയ്ക്കുവാൻ പറ്റില്ല. പുറമേ നിന്ന് നമ്മൾ നോക്കുമ്പോൾ അറിയാം ഇവർ കാണിയ്ക്കുന്നതെല്ലാം വചനവിരുദ്ധമാണ്. പക്ഷേ, അവർക്ക് അത് അറിയാൻ പറ്റില്ല, കാരണം അവർ കാണുന്ന കാര്യം അവർ ചെയ്യുന്നു. അവർക്ക് കിട്ടുന്ന ദർശ്ശനം അനുസരിച്ച് അവർ മുന്നോട്ടു പോകുന്നു. ഇതെങ്ങനെ നമുക്ക് മാറ്റാൻ പറ്റും? നമുക്കൊന്നും ചെയ്യാൻ പറ്റില്ല. അവരെ അവരുടെ വഴിയ്ക്ക് വിടുക. ദൈവത്തിന് ആവശ്യമുണ്ടെങ്കിൽ അവരെയൊക്കെ നന്നാക്കിച്ച് എടുത്തുകൊള്ളും. ഇത്രയേ ഉള്ളൂ.</p><h4>യേശുവിന്റെ അമ്മ മറിയം</h4><p>യേശുവിന്റെ അമ്മയെ കുറിച്ച് ഒരുപാട് കാര്യങ്ങൾ പറയാൻ പറ്റും. ആദ്യമായിട്ട്, ഇവർ പിതാവായ ദൈവത്തെ പൂർണ്ണ ആത്മാവോടും, പൂർണ്ണ മനസ്സോടും, പൂർണ്ണ ശക്തിയോടും കൂടെ സ്നേഹിച്ചിരുന്ന ഒരു സ്ത്രീയായിരുന്നു. അവരുടെ ജീവിതത്തിൽ എന്ത് സംഭവിച്ചാലും ഇത് യാദൃശ്ചികമാണ് എന്ന് പറയില്ല. അവർ എപ്പോഴും ഇത് ദൈവം നിശ്ചയിച്ചു, ദൈവത്തിന്റെ ഇഷ്ടം നിറവേറട്ടെ; എന്ന് മാത്രമേ പറഞ്ഞിട്ടുള്ളൂ. അങ്ങനെ പറഞ്ഞ് ശീലിച്ചു ശീലിച്ചു വളർന്നതാണ്. ഇവർ ഇങ്ങനെ വളരണമെങ്കിൽ ഇവരുടെ അച്ഛനമ്മമാർ ഏറ്റവും കൂടുതൽ ദൈവത്തിന്റെ നിയമം അനുസരിച്ച് ജീവിച്ചിരുന്ന ഒരു മാതാപിതാക്കളായിരുന്നു.</p><p>മറിയം എല്ലാ കാര്യത്തിലും ദൈവത്തെ മാത്രമാണ് മനസ്സിൽ പ്രധാനമായി കൊണ്ട് നടന്നിട്ടുള്ളത്. മറ്റുള്ളവർ എന്ത് സഹായം ചോദിച്ചാലും അവർക്ക് വേണ്ടി പ്രാർത്ഥിയ്ക്കുകയും, അവരുടെ കാര്യങ്ങൾ സാധിച്ചു കൊടുക്കുകയും, അവരെ സ്നേഹിയ്ക്കുകയും, അവർക്ക് എന്തെങ്കിലും ഭൗതിക ആവശ്യങ്ങൾ ഉണ്ടെങ്കിൽ അത് അപ്പോൾ തന്നെ കൊണ്ട് കൊടുക്കുകയും; അങ്ങനെ ഒരുപാട് നല്ല ശീലങ്ങൾ മറ്റുള്ളവർക്ക് കാണിച്ചു കൊടുക്കുകയും; സ്വന്തം ജീവിതത്തിൽ പ്രവർത്തിയ്ക്കുകയും അവർ ചെയ്തിട്ടുണ്ട്.</p><p>അവർ യൗസേഫ് എന്ന അവരുടെ ഭർത്താവ് ഒഴികെ വേറെ ഏതൊരു പുരുഷനെയും മനസ്സുകൊണ്ട് പോലും ചിന്തിച്ചിട്ടില്ലാത്ത ഒരു വിശുദ്ധ സ്ത്രീയായിരുന്നു. ഒരു ഭർത്താവിന്റെ അടുത്ത് എങ്ങനെ ഇടപഴകണം, എന്തൊക്കെ ചെയ്യണം, എങ്ങനെയൊക്കെ ആയിരിയ്ക്കണം എന്നതിനെക്കുറിച്ച് ഇവർ നൂറു ശതമാനം കൃത്യമായിട്ട് ചെയ്തു. അതേപോലെ ഒരു കുട്ടിയെ എങ്ങനെ വളർത്തണം എന്നുള്ളത് കാണാം. യേശുവിനെ എടുത്താൽ, എല്ലാ നിയമങ്ങളും ഇവർക്ക് അറിയാം അറിയാവുന്നതെല്ലാം കുഞ്ഞിലേ ഇരുന്നപ്പോൾ യേശുവിന് പറഞ്ഞു കൊടുക്കുകയും, സകലമായ കാര്യങ്ങളിൽ ഒരമ്മ എങ്ങനെയായിരിയ്ക്കണം എന്ന് മറ്റുള്ളവരെക്കൊണ്ട് പറയിപ്പിയ്ക്കുകയും ഇവരത് മാതൃകയായി ചെയ്യുകയും ചെയ്തിട്ടുണ്ട്. വളർന്നു വരുമ്പോഴേയ്ക്കും യേശു തന്നെ അമ്മയെ കുറിച്ച് ഒരുപാട് നല്ല കാര്യങ്ങൾ പറഞ്ഞിട്ടുണ്ട്. എന്റെ അമ്മയാണ്, എന്റെ അമ്മയുടെ പ്രാർത്ഥനയാണ് ആത്മീയതയുടെ കാരണം. ഇതുമാത്രമല്ല, ഒരുപാട് ഒരുപാട് കാരണങ്ങളുണ്ട്. അതുകൊണ്ടാണ് സോഫി ടീച്ചറുടെ പ്രാർത്ഥനയിൽ ദൈവം, മറിയം ഒരു ഉദാഹരണമാണെന്ന് പറഞ്ഞിട്ടുള്ളത്.</p><p>മറിയം ഒരിക്കലും "എന്നോട് നിങ്ങൾ പ്രാർത്ഥിയ്ക്കുക" എന്നോ, "എന്റെ അടുത്ത് ഒരു ഉടമ്പടി വയ്ക്കണം" എന്നോ "എന്റെ വിഗ്രഹം ഉണ്ടാക്കി വച്ച് ഇങ്ങനെയൊക്കെ ചെയ്യണം" എന്നോ ഒരിയ്ക്കലും എവിടെയും പറഞ്ഞിട്ടില്ല. അഥവാ എവിടെയെങ്കിലും അങ്ങനെ പറഞ്ഞിട്ടുണ്ടെങ്കിൽ, അത് യേശുവിന്റെ അമ്മയാകാൻ സാധ്യതയില്ല. ഭൂമിയിൽ പലരോടും ഇവർ സംസാരിച്ചിട്ടുണ്ട്, പ്രത്യക്ഷപ്പെട്ടിട്ടുണ്ട്. ഇവർ പറയുന്ന കാര്യങ്ങൾ എന്താണെന്ന് വച്ചാൽ: "നിങ്ങൾ പിതാവായ ദൈവം വച്ച നിയമങ്ങൾ അനുസരിച്ച് നടക്കുക. ദൈവത്തിന്റെ ഇഷ്ടം അനുസരിച്ച് നടക്കൂ. നിങ്ങൾ പാപം ചെയ്യല്ലേ! യേശു പറഞ്ഞിരിയ്ക്കുന്ന കാര്യങ്ങൾ മനസ്സിലാക്കാൻ നിങ്ങൾ ബൈബിൾ വായിച്ചിരിയ്ക്കണം. നിങ്ങൾ സദാ പ്രാർത്ഥിയ്ക്കണം." എന്നുള്ള നല്ല കാര്യങ്ങളൊക്കെ പറഞ്ഞു തന്നിട്ടുണ്ട്. "ന്യായവിധി ശിക്ഷയുടെ കാലങ്ങൾ തുടങ്ങാൻ പോകുന്നു. അതിൽ നിന്ന് രക്ഷപ്പെടാൻ നിങ്ങൾ ഇങ്ങനെ ചെയ്യൂ. പിതാവായ ദൈവത്തോട് കൂടുതൽ അടുക്കൂ." എന്നുള്ള ഒരുപാട് കാര്യങ്ങൾ പറഞ്ഞു തന്നിട്ടുണ്ട്. ഇപ്പോൾ ഇതൊക്കെയാണ് ഇവർ നമ്മളോട് പറഞ്ഞു തരുന്നത്. നമ്മളെ ഒരുക്കുന്നു. എങ്ങനെ ഒരുക്കുന്നു? ദൈവത്തിന്റെ നിയമങ്ങൾ അനുസരിച്ച് ജീവിയ്ക്കാൻ വേണ്ടിയുള്ള ഒരു ഒരുക്കത്തിന് സഹായിയ്ക്കുന്ന ഒരാളായിട്ടേയുള്ളൂ. അല്ലാതെ വേറെ ഈ ലോകത്ത് പറഞ്ഞു നടക്കുന്ന കത്തോലിക്ക സഭയിൽ പോലും പറഞ്ഞു നടക്കുന്ന കാര്യങ്ങളൊന്നും ശരിയല്ല.</p><h4>ബൈബിളിൽ സസ്യാഹാരം</h4><p>ബൈബിളിൽ പറഞ്ഞിരിയ്ക്കുന്ന യഹൂദ മതമാണെങ്കിലും, യേശുവിന് ശേഷമുള്ളവരൊക്കെ; ഭൗതിക കുടുംബത്തിൽ കടമകൾ ശരിയായിട്ട് ചെയ്തു മുന്നോട്ടു പോകുന്നരീതിയിലുള്ള കാര്യങ്ങളാണ് പറയുന്നത്, പഠിപ്പിയ്ക്കുന്നത്. അല്ലാതെ വീടും നാടും മക്കളെയും കുടുംബവും ഒക്കെ ഉപേക്ഷിച്ചിട്ട് ഒറ്റയ്ക്ക് ദൈവത്തെ മാത്രം ധ്യാനിച്ച്, ദൈവത്തെ മാത്രം ആശ്രയിച്ച്, ദൈവത്തിലേയ്ക്ക് പോകുന്നവരുടെ ഏറ്റവും ഉയർന്ന തലമല്ല ബൈബിളിൽ പഠിപ്പിയ്ക്കുന്നത്. ഖുർആനും അങ്ങനെയല്ല. കാരണം, ഏറ്റവും ഉയർന്ന തലത്തിലേയ്ക്ക് പോകേണ്ട സമയമാകുമ്പോഴാണ് നമ്മൾ പൂർണ്ണമായും സസ്യാഹാരവും അല്ല - പഴവർഗ്ഗങ്ങളും, വെള്ളവും മാത്രം കുടിച്ച് കഴിയുന്ന അവസ്ഥയിലേയ്ക്ക് എത്തേണ്ടത്. അതിനു മുമ്പ് ചെയ്തു തീർക്കേണ്ട ഒരുപാട് കർമ്മങ്ങൾ പൂർത്തീകരിയ്ക്കാൻ ഉണ്ട്. അതിന്, ആത്മീയത്തിലുള്ള ശിശുക്കൾക്ക് വേണ്ടിയുള്ള പഠിപ്പുകളും പഠനങ്ങളും ഒക്കെയാണ് ബൈബിളിലും ഖുർആനിലും ഉള്ളത്. അതുകൊണ്ട്, അതിൽ സസ്യാഹാരത്തിനെ കുറിച്ച് പറയുന്നില്ല. പൗലോസ്, ബൈബിളിൽ പറയുന്നുണ്ട് സസ്യാഹാരമായാലും മാംസാഹാരമായാലും അവനവന്റെ ഇഷ്ടം പോലെ ചെയ്യാം.</p><h4>സ്വപ്നം - ദർശ്ശനങ്ങൾ</h4><p>സ്വപ്നം എന്ന് പറയുന്നത് നമ്മുടെ ആത്മാവ് നമ്മളോട് ആശയവിനിമയം നടത്തുന്നതാണ്. ആത്മാവിന് നമ്മളോട് പല കാര്യങ്ങളും പറഞ്ഞുതരാൻ ഉണ്ട്. ഭാവിയിൽ സംഭവിയ്ക്കാനുള്ളത് ഉണ്ട്, ഇപ്പോൾ പറ്റിക്കൊണ്ടിരിക്കുന്ന തെറ്റുകൾ പറഞ്ഞു തരാൻ ഉണ്ട്, ചിലപ്പോൾ മുജ്ജന്മത്തിൽ എന്തെങ്കിലും കാണിച്ചിട്ടുണ്ടെങ്കിൽ അത് കാണിച്ചു തരും, നമുക്ക് എന്തെങ്കിലും പൈശാചികങ്ങൾ ഇപ്പോൾ നിൽപ്പുണ്ടെങ്കിൽ അത് കാണിച്ചു തരും, നമ്മൾ എങ്ങനെ നന്നാകണം എന്ന് പറഞ്ഞു തരും. നമ്മളുടെ സുഹൃത്ത് എന്ന നിലയിൽ അല്ലെങ്കിൽ നമ്മൾ തന്നെയാണ് നമ്മളെ സഹായിയ്ക്കുന്നത് എന്ന രീതിയിൽ സകല കാര്യങ്ങളും ആശയവിനിമയം നടത്താനുള്ള ഒരു മാധ്യമമാണ് സ്വപ്നം എന്നു പറയുന്നത്. ആത്മാവിന് എവിടെ നിന്ന് ഈ വിവരങ്ങൾ കിട്ടുന്നു എന്ന് വെച്ചാൽ; മറ്റ് അദൃശ്യ ശക്തികൾക്ക് ആത്മാവുമായിട്ട് ബന്ധമുണ്ട്. നമുക്ക് നേരിട്ട് ബന്ധം ഒന്നുമില്ല. ദൈവത്തിൽ നിന്നും കിട്ടിയ വിവരങ്ങൾ, മറ്റ് ദൂതന്മാരിലൂടെ - ദേവന്മാരിലൂടെ നമ്മുടെ ആത്മാവിന് കിട്ടിയിട്ട്, ഈ ആത്മാവ് നമുക്ക് പറഞ്ഞു തരുന്നതാണ് സ്വപ്നങ്ങളെല്ലാം.</p><p>ഇനി ആത്മാവിന് തന്നെ നമ്മളെ വിട്ട് വേറെ ഏതെങ്കിലും മണ്ഡലങ്ങളിൽ സഞ്ചരിയ്ക്കണമെങ്കിൽ, ആത്മാവ് സഞ്ചരിയ്ക്കും. പക്ഷേ നമ്മൾ ഇത് തിരിച്ചറിയുന്നതോ; - നമുക്ക് ഒരു സ്വപ്നം പോലെ തോന്നുകയുള്ളൂ. സ്വപ്നവും, നമ്മുടെ ആത്മാവ് നമ്മളിൽ നിന്നും ഒരു മേഖലയിലേയ്ക്ക് സഞ്ചരിയ്ക്കുന്നതും; അത് കണ്ടുകൊണ്ടിരിയ്ക്കുന്നവർക്കേ അത് തിരിച്ചറിയാൻ സാധിയ്ക്കൂ. അപ്പോൾ നമ്മൾ കാണുന്നതെല്ലാം എന്താണ് ഏതാണെന്ന് വ്യാഖ്യാനിച്ചു മനസ്സിലാക്കി എടുത്താൽ കാര്യങ്ങൾ ശരിയാകും. പക്ഷേ, ഇത് വ്യാഖ്യാനിച്ചു മനസ്സിലാക്കി എടുക്കാൻ പാടാണ്. ഒരാളുടെ സ്വപ്നം പല രീതിയിൽ വരും. അയാൾ കണ്ട കാര്യം വച്ചും, അനുഭവിച്ച കാര്യം വച്ചും, അയാൾ ചോദിച്ച ചോദ്യം വച്ചും, അയാളുടെ കൂടെയുള്ളവരെ വെച്ചും ഒക്കെയാണിത് കാണിച്ചു തരുന്നത്. ഒരാളുടെ സ്വപ്നം വ്യാഖ്യാനിയ്ക്കുക എന്ന് പറയുന്നത് തന്നെ വളരെ പാടാണ്. അയാളുടെ അടുത്ത് സകല വിധ വിശദാംശങ്ങളും ചോദിയ്ക്കണം - കണ്ട കാര്യങ്ങൾ ആദ്യം മുതൽ അവസാനം വരെ, അപ്പോൾ എന്തൊക്കെ തോന്നി, സ്വപ്നത്തിൽ കണ്ട ആളുടെ വസ്ത്രം, ഇതുപോലെ സ്വപ്നത്തിൽ കാണുന്ന സൂക്ഷ്മം ആയിട്ടുള്ള സകല കാര്യങ്ങളും ഓർത്തെടുത്ത് ഗ്രഹിച്ചെടുത്താൽ മാത്രമേ കൃത്യമായ ഉത്തരം കിട്ടുകയുള്ളൂ. സത്യം പറഞ്ഞാൽ അത് ഇത്തിരി പാടാണ്. പക്ഷേ നമ്മൾ അതിനു വേണ്ടി ശ്രമിച്ച് കണ്ട സ്വപ്നത്തെ അങ്ങനെ ആദ്യാവസാനം ആലോചിച്ച്, ഉണർന്ന ഉടൻ തന്നെ ഒരു പത്ത് പതിഞ്ച് മിനിറ്റ് കട്ടിലിൽ കിടന്നു കൊണ്ട് തന്നെ, അത് മുഴുവനും ഗ്രഹിച്ച് എടുത്തു വെച്ചാൽ നമുക്ക് ചിലപ്പോൾ അതിൽ നിന്ന് വ്യാഖ്യാനിച്ചു കിട്ടും. പക്ഷേ കുറേ കഴിഞ്ഞ ശേഷം ഒന്നുകൂടെ ആലോചിച്ചു കഴിഞ്ഞാൽ ഇതിന്റെ സൂക്ഷ്മമായ മർമ്മങ്ങൾ എല്ലാം മറന്നു പോകും. ഇതിന്റെ അകത്തു നിന്ന് മർമ്മ ഭാഗങ്ങളെല്ലാം ഓർത്തെടുത്ത് വെച്ചാലേ, അതിൽ നിന്ന് നമുക്ക് ഉത്തരമെടുത്ത് മുന്നോട്ട് പോകാൻ പറ്റുകയുള്ളൂ. പക്ഷേ പറ്റും എന്നുള്ളത് ഉറപ്പാണ്. ഇപ്പോൾ പിശാച് കാണിച്ചു തന്നാലും ശരി, ദൈവത്തിൽ നിന്ന് കാണിച്ചു തന്നാലും ശരി, നമ്മളിനി ഭാവനാ മണ്ഡലത്തിൽ പോയി എന്ത് കണ്ടാലും ശരി, സകല സ്വപ്നത്തിന്റെയും എല്ലാം പിന്നിൽ കാര്യങ്ങൾ ഉണ്ട്; അല്ലാതെ വെറുതെ കാണില്ല. എന്തു കണ്ടാലും അതിന്റെ പിന്നിൽ സംഗതികൾ ഉണ്ടെന്ന് മനസ്സിലാക്കണം.</p><p>വെളിപാട് കാണുക, അല്ലെങ്കിൽ സ്വപ്നം കാണുക എന്നതു കൊണ്ട്, നമ്മുടെ ഈ മൂന്നാം കണ്ണ് കൊണ്ട് ഒരു മണ്ഡലത്തിൽ നിന്നു കൊണ്ട് ചില കാര്യങ്ങൾ കാണുന്നതാണ്. ഇപ്പോൾ ഒരു ടീവി നമ്മൾ വാങ്ങിച്ചു. ആ ടീവി ഓൺ ചെയ്താൽ, റിമോട്ട് വച്ച് ചാനൽ മാറ്റിയാൽ പലതും കാണാമല്ലോ. അതേപോലെ, നമ്മുടെ ഈ സ്വപ്നദർശനം കാണുന്ന മേഖല ഭൗതിക മനസ്സുകൊണ്ട് ഒരാൾക്ക് തുറന്നു കിട്ടിക്കഴിഞ്ഞാൽ, ആ മേഖലയിൽ നടക്കുന്ന എന്തും കാണാം. ആ മേഖല ഒരു ടീവി പോലെയാണ്. ആ മേഖലയിൽ ആത്മാവ് വേണ്ടതെല്ലാം ആ ടീവിയിലൂടെ നമുക്ക് കാണിച്ചു തന്നുകൊണ്ടേയിരിയ്ക്കും. നമ്മുടെ ആത്മാവിന് അത്രയും ബലം ഇല്ലെങ്കിൽ അതിന്റെ ഇടയിൽ കൂടെ നമ്മുടെ ഉള്ളിലുള്ള പൈശാചിക ശക്തികളും, റിമോട്ട് വെച്ച് ചാനല് മാറ്റി വേറെ കാണിച്ച് തരുന്നതു പോലെ ആ ടീവിയിലൂടെ സ്വാധീനിച്ച് അതിലൂടെ കാണിച്ചു തന്നുകൊണ്ടിരിയ്ക്കും. ഇത് ആത്മാവിന് അറിയാം, പക്ഷേ ആത്മാവിന് ഒന്നും ചെയ്യാൻ പറ്റില്ല. അതിനെ മറികടന്നും കൊണ്ട് നമുക്ക് വിവരം തരാനുള്ള അത്രയും ശക്തി ആത്മാവിന് കാണില്ല. ബോധ മനസ്സുകൊണ്ട് നമ്മുടെ വിവരങ്ങളും കാര്യങ്ങളും തിരിച്ചറിഞ്ഞിട്ട് വേണം നമ്മൾ അത് കണ്ടുപിടിച്ച് നിയന്ത്രിയ്ക്കാൻ.</p><p>ഇതേപോലെ നന്മയുടെ ശക്തികൾ തരുന്ന ചില വിവരങ്ങൾ ആത്മാവിലൂടെ അല്ലാതെ തന്നെ ചിലപ്പോൾ ചില സംഗതികൾ സ്വപ്നത്തിലൂടെ കണ്ടെന്നിരിയ്ക്കും. കാര്യം, അത് അവിടെ തുറന്നു കിടക്കുമ്പോൾ, നമ്മുടെ ആത്മാവ് പോയി എന്തും കാണുന്നതാണ്. ചിലപ്പോൾ മറ്റു മണ്ഡലങ്ങളിൽ പോയി അത് കാണും. ഇത് ഒരു മേഖല തുറന്നു കിട്ടുന്നതാണ്. അതാണ് മൂന്നാം കണ്ണ് തുറക്കുന്നത് എന്ന് പറയുന്നത്. മറ്റു മണ്ഡലങ്ങളിൽ ഉള്ളതെല്ലാം ഒരു ടീവി കാണുന്നതു പോലെ നമ്മൾ കാണുകയാണ്. എന്തൊക്കെ ആ മേഖലയിൽ ഉണ്ടോ അതൊക്കെ നമുക്ക് കാണാൻ പറ്റും. ആ മേഖലയിലൂടെയാണ് നമ്മളുടെ ആത്മാവ് നമുക്ക് കാര്യങ്ങളൊക്കെ ഇങ്ങനെ പറഞ്ഞു തന്നുകൊണ്ടിരിയ്ക്കുന്നത്. നമുക്ക് സ്വപ്നം പോലെ അത് തോന്നുമെങ്കിലും, പൈശാചികവും ഉണ്ട്. ഇതൊന്നും നമ്മുടെ ആത്മാവ് കാണിച്ചുതരുന്നതല്ല, ആ തുറന്നു കിടക്കുന്നതിലൂടെ നമ്മുടെ ആത്മാവ് അത് കാണുന്നതാണ്. സ്ഥിരം കാണുന്നവർക്ക് അറിയാം ഇത് സ്വപ്നമാണോ അല്ലാതെ കാണുന്നതാണോ എന്ന്. സ്ഥിരമായിട്ട് ഇങ്ങനെ പല പല ദർശ്ശനങ്ങൾ കാണുന്നവർക്ക് അതിന്റെ വ്യത്യാസം അനുഭവിയ്ക്കാൻ പറ്റും.</p><h4>രണ്ടാം പുനരുദ്ധാനം</h4><p>സുജോ സാർ പറയുന്നത് സത്യയുഗത്തിലേയ്ക്കുള്ള കാര്യങ്ങളാണ്. സത്യയുഗം എന്നുള്ള ആ കാലഘട്ടം അല്ലെങ്കിൽ പുതിയ ആകാശം പുതിയ ഭൂമി എന്ന് പറയുന്ന ആ ഒരു അനുഭവം. അതിലേയ്ക്ക് പ്രവേശിയ്ക്കുന്നവർക്ക് വേണ്ടിയുള്ള നിയമങ്ങൾ വ്യവസ്ഥകൾ ദൈവം സുജോ സാറിന് പറഞ്ഞു തരുന്നത്, നമുക്ക് പറഞ്ഞു തരുന്നതാണ്. ആരെങ്കിലും ആ വ്യവസ്ഥയിൽ ശരിയായി വന്നിട്ടുണ്ടെങ്കിൽ അത് നിങ്ങളുടെ ഭാഗ്യം. നിങ്ങൾ അതിന് യോഗ്യനായി.</p><p>രണ്ടാം പുനരുദ്ധാനം അങ്ങനെയല്ല. ഭൂമിയുടെ അന്ത്യത്തോളം കർമ്മം തെറ്റി കിടക്കുന്നതിന്റെ ഫലമെല്ലാം അനുഭവിച്ചുകൊണ്ടിരിയ്ക്കണം. എന്നിട്ട് അവർക്ക് സ്വർഗ്ഗത്തിൽ തന്നെ പോകാൻ പറ്റും. പക്ഷേ ഭൂമിയിലുള്ള സത്യയുഗം എന്ന ഈ കാലഘട്ടത്തിലേയ്ക്ക് അവരുടെ തലമുറയോ അവരോ പ്രവേശിയ്ക്കില്ല. ആർക്കു വേണം എങ്ങനെ വേണം അത് അവരവരുടെ തിരഞ്ഞെടുപ്പാണ്. അല്ലാതെ ഇതെല്ലാം പറഞ്ഞു തരുമ്പോഴേക്കും, ഈ വ്യവസ്ഥ തെറ്റിക്കിടക്കുന്നവർ കിടന്ന് പിറുപിറുത്തിട്ടോ, ദൈവത്തോട് മറുത്തടിച്ചിട്ടോ, കാര്യമൊന്നുമില്ല. തെറ്റിക്കിടക്കുന്ന കർമ്മത്തിന്റെ ഫലം അവരവർ അനുഭവിച്ചു തീർക്കണം. അതെന്തായാലും അനുഭവിച്ചിരിയ്ക്കും. അവരുടെ മക്കളിലൂടെയോ എങ്ങനെയെങ്കിലും അത് അനുഭവിച്ചു തീരും. എന്നിട്ട് ആ ആത്മാക്കളെ ദൈവം സ്വർഗ്ഗത്തിലോട്ട് കൊണ്ടുപോകും. ഭൂമിയിൽ മൊത്തം കഷ്ടമായിരിയ്ക്കും. അവരുടെ കണ്ണുനീർ സ്വർഗ്ഗത്തിൽ ചെല്ലുമ്പോൾ ദൈവം തുടച്ചു മാറ്റും എന്ന് പറഞ്ഞാൽ, അങ്ങ് കയറുന്നത് വരെയും കരച്ചിൽ ആയിരിയ്ക്കും. ഒരു വിഭാഗം ജനങ്ങൾ അങ്ങനെയേ പോവുകയുള്ളൂ. നമുക്ക് ഇപ്പോൾ അവരെ ഉപദേശിച്ചു നന്നാക്കാൻ ഒന്നും പറ്റില്ല.</p><p>അറിവ് എടുക്കുക, ആ അറിവെടുത്തതിനു ശേഷം എന്ത് വേണമെന്ന് അവരവർ തീരുമാനിയ്ക്കുക. പറ്റാത്തവർ, ദൈവത്തോട് പ്രാർത്ഥിയ്ക്കുക. സാഹചര്യം മാറ്റിത്തന്ന് എനിക്ക് സത്യയുഗം ആസ്വദിയ്ക്കണം അല്ലെങ്കിൽ ഭൂമിയിലെ സുഖം എനിക്ക് വരണം; എനിക്ക് ഒന്നാം പുനരുദ്ധാനത്തിൽ പങ്കു വരണമെന്ന് അവനവൻ ആഗ്രഹിച്ചാൽ, സാഹചര്യത്തിലൂടെ അത് ചെയ്യും. അല്ലാതെ എന്റെ കുടുംബം പ്രശ്നങ്ങളൊന്നുമില്ലാതെ ഇങ്ങനെ പോയാൽ മതി എന്ന് ചിന്തിയ്ക്കുന്നവർക്ക് നാളെ ഇതിന്റെയൊക്കെ ഫലം നിയമത്തിൽ അനുഭവിച്ചറിയേണ്ടതായി വരും.<br>സത്യപ്രകാശം</p>`

        mainPoints: [
            "കൃപയുടെ കാലഘട്ടം (2012-ന് മുമ്പ്): യോഗ്യതയോ അർഹതയോ ഇല്ലെങ്കിൽ പോലും ദൈവം കരുണയാൽ കാര്യങ്ങൾ സാധിച്ചു കൊടുത്തിരുന്ന കാലമായിരുന്നു ഇത്. അന്ന് സാധാരണക്കാർക്ക് മതഗ്രന്ഥങ്ങളിലെ അറിവുകൾ ലഭ്യമല്ലാതിരുന്നതിനാൽ തെറ്റുകൾ ആവർത്തിക്കുമ്പോഴും ദൈവം സംരക്ഷിച്ചിരുന്നു.",
            "ന്യായവിധിയുടെ കാലഘട്ടം (2012 മുതൽ): സാങ്കേതികവിദ്യയിലൂടെയും മാധ്യമങ്ങളിലൂടെയും ഇന്ന് സകലർക്കും അറിവ് ലഭ്യമാണ്. അതിനാൽ ദൈവം സൗജന്യ സംരക്ഷണം പിൻവലിക്കുകയും ന്യായവിധിയുടെ കാലഘട്ടം ആരംഭിക്കുകയും ചെയ്തു. ഇനി യോഗ്യതയുണ്ടെങ്കിലേ കാര്യങ്ങൾ നടക്കുകയുള്ളൂ; ചെറിയ തെറ്റുകൾക്ക് പോലും ഉടനടി ശിക്ഷയും ഫലവും അനുഭവിക്കേണ്ടി വരും.",
            "സ്വയം തൊഴിലും പശ്ചാത്താപവും: മറ്റൊരാളുടെ കീഴിൽ ജോലി ചെയ്യുമ്പോൾ ഉടമയിലെ പൈശാചിക ശക്തികളുടെ സ്വാധീനം വരാൻ സാധ്യതയുള്ളതിനാൽ സ്വയം തൊഴിൽ കണ്ടെത്തുക. പൊങ്ങച്ചവും ശാപവാക്കുകളും ഉപേക്ഷിച്ച്, കഴിഞ്ഞ തെറ്റുകൾക്ക് മനസ്സുരുകി ദൈവത്തോട് മാപ്പ് പറഞ്ഞു പശ്ചാത്തപിക്കുക.",
            "പരിശുദ്ധാത്മാവും കൽക്കിയുടെ വരവും: ദൈവത്തോട് അടുക്കാൻ ശ്രമിക്കുന്നവരിലെല്ലാം ന്യായവിധിയുടെ ആത്മാവ് പ്രവേശിച്ചിട്ടുണ്ട്. യേശു കൃപയുടെ ദൗത്യമായിരുന്നു നിർവ്വഹിച്ചതെങ്കിൽ, വരാനിരിക്കുന്ന കൽക്കിയിൽ (പുതിയ മനുഷ്യനിൽ) അതേ ദൈവാത്മാവ് പ്രവേശിച്ച് ന്യായവിധി നടപ്പിലാക്കും. 300 വർഷങ്ങൾക്ക് ശേഷം ന്യായവിധിയും ശിക്ഷയും ഇല്ലാത്ത പൂർണ്ണ സത്യയുഗം വരും."
        ],
        conclusion: "കൃപയുടെ കാലം അവസാനിച്ചു; ഇനി ന്യായവിധിയുടെ കാലമാണ്. സൗജന്യ സംരക്ഷണം പിൻവലിക്കപ്പെട്ട ഈ കാലഘട്ടത്തിൽ, പ്രകൃതിയുടെ വ്യവസ്ഥകൾ പാലിച്ചും പശ്ചാത്തപിച്ചും യോഗ്യരായി ജീവിക്കുന്നവർക്ക് മാത്രമേ രക്ഷപ്പെടാൻ സാധിക്കൂ.",
        fullContentHtml: `<p><strong>സത്യപ്രകാശം</strong><br><strong>പഠന സംഗ്രഹം</strong><br>2026 ഒക്ടോബർ 25, ചൊവ്വാഴ്ച<br><strong>വിഷയം:</strong> കൃപയുടെ കാലഘട്ടവും ന്യായവിധിയുടെ കാലഘട്ടവും തമ്മിൽ വ്യത്യാസമെന്ത്?</p><p>2012 നു മുമ്പ് ന്യായമായിട്ടല്ല വിധി പോയിക്കൊണ്ടിരുന്നത്, അന്യായമായിട്ടാണ് പോയിക്കൊണ്ടിരുന്നത്. അതിനെയാണ് കൃപ എന്ന് പറയുന്നത്. അതായത്, ഒരുത്തന് അർഹത ഇല്ലെങ്കിൽ പോലും, അവനത് കിട്ടാനുള്ള ന്യായം ഇല്ലെങ്കിൽ പോലും, അവൻ അത് ദൈവം കൊടുക്കുന്ന ഒരു കാലഘട്ടമായിരുന്നു. 2012 മുതൽ ഇനി ന്യായവിധിയുടെ കാലഘട്ടമാണ്. അതായത് ന്യായമായേ ഇനി എല്ലാവർക്കും കാര്യങ്ങൾ നടക്കുകയുള്ളൂ. അന്യായമായി നടക്കില്ല. വെറുതെ പ്രാർത്ഥിച്ചത് കൊണ്ട് കാര്യങ്ങൾ നടക്കില്ല. അവന് അതിന് യോഗ്യതയുണ്ടോ എന്ന് നോക്കിയിട്ടേ ദൈവത്തിൽ നിന്ന് കാര്യങ്ങൾ നടന്ന് കിട്ടുകയുള്ളൂ. 300 വർഷം കഴിയുമ്പോൾ പൂർണ്ണ സത്യയുഗമാണ്. അവിടെ ന്യായവിധിയോ ശിക്ഷയോ ഒന്നുമില്ല. അതിനുമുമ്പ് അതൊക്കെ ചെയ്തു കഴിഞ്ഞിരിയ്ക്കും.</p><p>കൃപയുടെ കാലഘട്ടത്തിൽ ആര് എത്ര തെറ്റ് ചെയ്താലും അവരുടെ പ്രാർത്ഥനയ്ക്ക് ഫലം വരുമായിരുന്നു. നാളെ ഒരു സമയത്ത് അവൻ നന്നാവുമല്ലോ എന്ന് വിചാരിച്ച് പ്രാർത്ഥിയ്ക്കുന്ന ആർക്കും, അല്ലെങ്കിൽ പ്രാർത്ഥന ഇല്ലാത്തവർക്ക് പോലും; അവന്റെ വിഷമം മനസ്സിലാക്കി കാര്യങ്ങൾ ശരിയാക്കി കൊടുക്കുമായിരുന്നു.</p><p>കൃപയുടെ കാലഘട്ടത്തിൽ സകലർക്കും അറിവുകൾ ഇല്ല. ഒരു മതഗ്രന്ഥങ്ങളിലെ കാര്യങ്ങൾ പോലും ആർക്കും അറിഞ്ഞുകൂടാ. ചില അപൂർവ്വ ഗുരുക്കന്മാർക്ക് മാത്രമേ ഇത് അറിയാവൂ. അവരിത് നേരാംവണ്ണം സാധുജനങ്ങൾക്ക് പഠിപ്പിയ്ക്കാറുമില്ല. അതുകൊണ്ടാണ് കൃപയുടെ കാലഘട്ടത്തിൽ, മനുഷ്യൻ തെറ്റിന് പുറമേ തെറ്റ് ആവർത്തിച്ച് പൊയ്ക്കൊണ്ടിരിയ്ക്കുമ്പോൾ, അതിലൂടെ വരുന്ന പൈശാചിക ശക്തികളുടെ ശല്യം അല്ലെങ്കിൽ ആ കർമ്മത്തിന്റെ ഫലം അനുഭവിക്കാതെ ദൈവം അവരെ കാത്തുകൊണ്ടിരുന്നത്. ദൈവം തീരെ നിവൃത്തിയില്ലാത്തവർക്ക് മാത്രമേ കുറച്ചു കുറച്ചായിട്ട് അതിന്റെ ഫലം കൊടുത്തു കൊണ്ടിരുന്നുള്ളൂ. തീരെ രക്ഷയില്ലെന്ന് കാണുന്നവരെ നശിപ്പിച്ച്, അടുത്ത ജന്മം കൊടുത്തു കൊണ്ടു വരും. കാരണം അറിവ് കിട്ടുന്നില്ലല്ലോ!</p><p>ഒരു സ്ഥാപനത്തിന്റെ ഉടമയുടെ കീഴിൽ ജോലി ചെയ്യുന്നവരിലേക്ക് അയാളുടെ പൈശാചിക ശക്തികളുടെ സ്വാധീനം വരും. മക്കളുടെ കഴിവിനെക്കുറിച്ച് പൊങ്ങച്ചം പറയുന്നവരിലേയ്ക്കും, മാതാപിതാക്കളുടെ ശാപവാക്കുകളിലൂടെ മക്കളിലേയ്ക്കും പൈശാചിക ശക്തികളുടെ സ്വാധീനം വരും. കൃപയുടെ കാലഘട്ടം കഴിഞ്ഞതുകൊണ്ട് ഇനി: സ്വയം തൊഴിൽ കണ്ടെത്തുക, പൊങ്ങച്ചം പറയാതിരിയ്ക്കുക, ശാപവാക്കുകൾ പറയാതിരിയ്ക്കുക. ചെയ്തു പോയ തെറ്റുകൾക്ക് മനസ്സുരുകി ദൈവത്തോട് മാപ്പ് പറഞ്ഞു പശ്ചാത്തപിയ്ക്കുക.</p><p>ന്യായവിധി എന്നാൽ ശിക്ഷ മാത്രമല്ല. നന്മയാണെങ്കിലും ന്യായമായ ഒരു വിധിയെ ഇനി നടക്കുകയുള്ളൂ. ഒരുത്തന് ഇനി ഉയർച്ച വരണമെങ്കിൽ ന്യായമായ രീതിയിലേ ഉയർച്ച വരികയുള്ളൂ.</p><p>ഈ ന്യായവിധിയുടെ കാലഘട്ടത്തിൽ ഭൂമിയിൽ വച്ച് തന്നെ ഓരോരുത്തർക്കും അവരുടെ ന്യായമായി വിധിനടപ്പിലാക്കി അവരെ നന്നാക്കിയെടുക്കുകയും. നന്നാകാത്തവർക്ക് മരണശേഷം മറ്റ് മണ്ഡലങ്ങളിൽ കൊണ്ടുപോയിട്ട് വേറെ ഒരു ന്യായവിധിയും ഉണ്ട്. മരിയ്ക്കുന്നതു വരെ ഭൂമിയിൽ തോന്നിയപോലെ ജീവിച്ചിട്ട്, "മരണശേഷം ന്യായവിധി, അത് അപ്പോൾ കണ്ടോളാം" എന്ന് മനുഷ്യൻ ഇങ്ങനെ കുഴിഞ്ഞു ചിന്തിയ്ക്കുമെന്ന് ദൈവത്തിന് നേരത്തേ അറിയാം. അതുകൊണ്ട് ഭൂമിയിൽ വെച്ചു തന്നെ ശരിയ്ക്കുള്ള ന്യായമായ ശിക്ഷയും വിധിയും തുടങ്ങിയിട്ട്, മരണശേഷവും ഇതിന്റെ ബാക്കി തുടരും.</p><p>സൗജന്യ സംരക്ഷണം ദൈവം പിൻവലിയ്ക്കുമ്പോൾ ആൾക്കാർക്ക് എന്ത് കാരണം കൊണ്ടാണ് നമ്മൾക്ക് ഇത്രയും പ്രശ്നങ്ങളും വിഷയങ്ങളും എന്ന് തിരിച്ചറിയാൻ പറ്റുകയില്ല. പക്ഷേ സുജോ സാറിന്റെ മെസ്സേജ് കേൾക്കുന്ന ഒരു വ്യക്തിക്ക് എവിടെയാണ് നമ്മൾ ശരിയാകേണ്ടത് എന്നുള്ള തിരിച്ചറിവ് കിട്ടും. അപ്പോൾ അങ്ങനെ വരുന്നവർ അത് പാലിച്ചു പെട്ടെന്ന് രക്ഷപ്പെടും. ഇത്രയേ ഉള്ളൂ ഗുണം.</p><p>ഇത്രയും നാളും പലർക്കും ഒരു യോഗ്യതയും ഇല്ലാതെ പ്രാർത്ഥനയിലൂടെ കാര്യങ്ങൾ സാധിച്ചു കൊണ്ടിരുന്നത്, ഇനി അങ്ങനെ സാധിയ്ക്കില്ല. ഇനി അങ്ങനെ സാധിയ്ക്കണമെങ്കിൽ അവൻ അത്രയും ആത്മീയമായി ത്യാഗം സഹിയ്ക്കണം. ഒന്നുകിൽ ധനം നഷ്ടപ്പെടുത്തേണ്ടി വരും, ഇല്ലെങ്കിൽ ശാരീരിക പീഡനം, ഇല്ലെങ്കിൽ മാനസിക ക്ലേശം; ഇതിലൂടെ അവൻ അവനെത്തന്നെ വില കൊടുത്താൽ മാത്രമേ ഇനി കാര്യങ്ങളെല്ലാം ശരിയായി വരികയുള്ളൂ. സുജോ സാറിന്റെ മെസ്സേജുകൾ കേട്ട് കാര്യങ്ങൾ ക്രമപ്പെടുത്തി പ്രകൃതിയുടെ വ്യവസ്ഥകൾ അനുസരിച്ച് പോകുന്നവർക്ക് അങ്ങനെ വില കൊടുക്കേണ്ടി വരില്ല. എന്തെങ്കിലും വിഷമങ്ങളൊ പ്രശ്നങ്ങളൊ വരുമ്പോൾ, സുജോ സാറിന്റെ മെസ്സേജിലൂടെ മനസ്സിലാക്കിയ കാര്യങ്ങൾ പാലിച്ച്, അതിനെ അതിജീവിച്ച് മുന്നോട്ടു പോകാൻ പറ്റും.</p><p>ദൈവം ഈ കാലഘട്ടത്തിൽ സാങ്കേതികത വികസിപ്പിച്ചിട്ട് മാധ്യമങ്ങളിലൂടെ സകലർക്കും ഈ അറിവുകൾ കൊടുക്കാൻ തുടങ്ങി. കൊച്ചു കുട്ടികൾക്ക് വരെ മൊബൈലിലൂടെയും ഈ സകല അറിവും കിട്ടാൻ തുടങ്ങി. അറിവ് ഇത്രയും കിട്ടിയ സ്ഥിതിക്ക്, ധൈര്യമായിട്ട് ഇനി കൃപയുടെ കാലഘട്ടം നിർത്തുകയും ന്യായമായി വിധി ചെയ്യുകയും ചെയ്യും. കാരണം, എല്ലാവർക്കും അറിവ് കിട്ടിക്കൊണ്ടിരിയ്ക്കുകയാണ്. ഇപ്പോഴും അറിവ് കിട്ടിക്കൊണ്ടിരിപ്പുണ്ട്. ഇനി ആർക്കും ജന്മങ്ങൾ ഇല്ല.</p><p>സത്യയുഗത്തിലേയ്ക്ക് പ്രവേശിയ്ക്കുന്നവർ ദൈവത്തിന്റെ ഹിതം അനുസരിച്ച് ജീവിയ്ക്കുന്നവർ ആയിരിയ്ക്കും. അവരൊന്നിലും തെറ്റില്ല. ദൈവത്തിന്റെ നിയമം എന്താണൊ അതായിരിയ്ക്കും അവരുടെ ഇഷ്ടങ്ങളും, അതിൽ ആയിരിയ്ക്കും അവരുടെ സന്തോഷവും. അത് ചെയ്തായിരിയ്ക്കും അവർ ജീവിയ്ക്കുക. അപ്പോൾ, അവർക്ക് എവിടെയാണ് ശിക്ഷ വരുന്നത്? അവിടെ ശിക്ഷയുടെ ആവശ്യമില്ലല്ലോ!</p><p>സത്യയുഗത്തിലും മനുഷ്യന്റെ സ്വതന്ത്ര ചിന്തയിൽ ചില തെറ്റുകൾ പറ്റാം, പറ്റില്ലെന്നല്ല. നമ്മുടെ ഉള്ളിൽ തന്നെ രക്ഷയുടെ ശക്തികളും ശിക്ഷയുടെ ശക്തികളും സ്വതവേ ഉണ്ട്. നമ്മെ വഴിതെറ്റിച്ച് തെറ്റായ രീതിയിൽ കൊണ്ടുപോകുവാൻ പൈശാചിക ശക്തികൾ ഇല്ലെന്നേ ഉള്ളൂ. എവിടെയെങ്കിലും ചില തെറ്റുകൾ ചെറുതായി പറ്റുമ്പോൾ തന്നെ നമ്മുടെ ഉള്ളിൽ ശിക്ഷയുടെ ശക്തികൾ അല്പം ശിക്ഷ തരും. നമുക്ക് ബോധം വന്ന് പെട്ടെന്ന് തന്നെ നമ്മൾ ശരിയായിക്കൊള്ളും. നമ്മൾ വഴി തെറ്റി പോകില്ല. നമ്മൾ ഇന്ന് കാണുന്നതു പോലെയുള്ള ആശുപത്രി - നരകം പോലുള്ള കൊള്ള സംഘങ്ങൾ സത്യയുഗത്തിൽ ഇല്ല.</p><p>ദൈവത്തിന്റെ ആത്മാവ് പരിശുദ്ധാത്മാവ് എന്ന രീതിയിൽ ദൈവത്തോട് അടുക്കാൻ ശ്രമിയ്ക്കുന്ന സകലരിലും പ്രവേശിച്ചിട്ടുണ്ട്. അപ്പോൾ, ന്യായവിധിയുടെ ആത്മാവ് സകലരിലും ഉണ്ട്. ഈ കാലഘട്ടം മാറി ന്യായവിധിയുടെ കാലഘട്ടം ആകുമ്പോഴേയ്ക്കും, സകലരിലും ഉള്ള ആത്മാവ് എന്ന ദൈവത്തിന്റെ ചൈതന്യം തന്നെ അവരെ ന്യായം വിധിയ്ക്കും. ന്യായമായ വിധി എല്ലാവർക്കും വരും. അത് പുറമേ കാണാൻ പറ്റില്ല. അകമേ അനുഭവത്തിലൂടെയാണ് അത് തിരിച്ചറിയുന്നത്. ന്യായമായത് ചെയ്യാതെ അവർക്ക് ഒരു രക്ഷയും വരില്ല. ചെറിയ തെറ്റിനു വരെ അപ്പപ്പോൾ ശിക്ഷ കിട്ടും. അപ്പോൾ അവർക്ക് മനസ്സിലാകും, ന്യായമായത് അവർക്ക് സംഭവിച്ചുകൊണ്ടിരിപ്പുണ്ട്.</p><p>ഏതൊരു മനുഷ്യനിൽ ആണോ ദൈവത്തിന്റെ ആത്മാവ് പ്രവേശിച്ച് പ്രവർത്തിയ്ക്കുന്നത് ആ മനുഷ്യനെ ക്രിസ്തു എന്നു പറയും. ക്രിസ്തു എന്ന വാക്കിന്റെ അർത്ഥം അഭിഷിക്തൻ: ദൈവത്തിന്റെ ആത്മാവിനെ അഭിഷേകം പ്രാപിച്ചവൻ. യേശുവും ഒരു ക്രിസ്തു ആയിരുന്നു. യേശുവിന് ന്യായവിധി ശിക്ഷ നടത്താൻ പറ്റില്ല. യേശുവിന് കൃപയാണ്. യേശുവിന് കൊടുത്തിരിക്കുന്നത് ആ കുരുതിയാണ്. ആ കുരുതിയിൽ വിശ്വസിക്കുന്നവർക്ക് സൗജന്യമായിട്ട് കർമ്മങ്ങൾ ഇളവ് ചെയ്യുകയും, അങ്ങനെയൊരു ജോലിയാണ് യേശു ചെയ്യുന്നത്. യേശു അന്നും ഇന്നും ഭൂമിയിലുണ്ട്. ഈ കാലഘട്ടം അവസാനിയ്ക്കുന്നത് വരെ, അതായത് പൂർണ്ണ സത്യയുഗം ആകുന്നതുവരെ യേശു ശരീരം ആയിട്ടും അല്ലാതെയും ഭൂമിയിൽ തന്നെ കാണും.</p><p>ന്യായവിധി നടത്താൻ വരുന്ന ആ കൽക്കിയുടെ ആത്മാവും ഒരു മനുഷ്യനായിട്ടു വരുമ്പോൾ ദൈവത്തിന്റെ ആത്മാവ് പ്രവേശിയ്ക്കുന്നത് കൊണ്ട്, നമുക്ക് ആ വ്യക്തിയെയും ക്രിസ്തു എന്ന് വിളിയ്ക്കാം. പുതിയൊരു മനുഷ്യൻ പുതിയൊരു സ്ത്രീയിലൂടെ ജനിച്ച ഇത് ചെയ്യും. ആ വ്യക്തിയിലും യേശുവിൽ മുപ്പതാമത്തെ വയസ്സിൽ പ്രവേശിച്ച ദൈവത്തിന്റെ അതേ ആത്മാവ് തന്നെയായിരിയ്ക്കും ഈ ന്യായവിധി നടത്താൻ വരുന്ന ആ വ്യക്തിയിൽ പ്രവേശിച്ചിട്ട് ന്യായവിധി ശിക്ഷ നടത്തുന്നത്.</p><p>ഇപ്പോൾ കാര്യം മനസ്സിലായല്ലൊ. നിങ്ങളുടെ കുടുംബത്തിലും നിങ്ങളുടെ ദേശത്തിലും തെറ്റിദ്ധാരണകൾ പഠിച്ചു വച്ചിരിക്കുന്നവർക്ക് ശരിയായിട്ടുള്ള കാര്യങ്ങൾ പറഞ്ഞു കൊടുക്കുക. കാരണം, പറഞ്ഞു കൊടുത്താലും ഇല്ലെങ്കിലും അവർക്ക് ഇഷ്ടംപോലെ പ്രശ്നങ്ങളും വിഷയങ്ങളും കഷ്ടങ്ങളും പെരുകിപ്പെരുകി വരുമ്പോൾ താനെ അവർക്ക് മനസ്സിലായിക്കൊള്ളും. അപ്പോൾ, നിങ്ങൾ പറഞ്ഞു കൊടുത്തില്ലെങ്കിലും ദൈവം ആരെയെങ്കിലും വെച്ച് അന്ന് അവർക്ക് ഇത് അറിയിച്ചു കൊടുക്കും.<br>സത്യപ്രകാശം</p>`

/* =====================================================================
   3. TAB SWITCHING & HEADER TITLE/SUBTITLE UPDATE LOGIC
   ===================================================================== */
let currentMode = "videos"; // 'videos' or 'discussions'

const tabVideosBtn = document.getElementById("tabVideosBtn");
const tabDiscussionsBtn = document.getElementById("tabDiscussionsBtn");
const videosSection = document.getElementById("videosSection");
const discussionsSection = document.getElementById("discussionsSection");
const searchBarDock = document.getElementById("searchBarDock");
const contentWrapper = document.getElementById("contentWrapper");
const titleEl = document.getElementById("channelTitle");
const subEl = document.getElementById("channelSubtitle");
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");

function switchMode(mode) {
    currentMode = mode;
    searchInput.value = "";
    searchClear.classList.remove("visible");

    if (mode === "videos") {
        tabVideosBtn.classList.add("active");
        tabDiscussionsBtn.classList.remove("active");
        videosSection.style.display = "block";
        discussionsSection.style.display = "none";
        searchBarDock.style.display = "block";
        contentWrapper.classList.remove("discussions-mode");

        // Update Top Banner Text for Videos
        titleEl.textContent = "Spritual Destiny";
        subEl.textContent = "SPIRITUAL KNOWLEDGE & EXPLORATION";
        filterVideos();
    } else {
        tabDiscussionsBtn.classList.add("active");
        tabVideosBtn.classList.remove("active");
        videosSection.style.display = "none";
        discussionsSection.style.display = "block";
        searchBarDock.style.display = "none"; // Hide search bar & tags on 2nd page
        contentWrapper.classList.add("discussions-mode");
        stopVideosIn(document);

        // Update Top Banner Text for സത്യപ്രകാശം (Discussion Summary)
        titleEl.textContent = "സത്യപ്രകാശം";
        subEl.textContent = "വാട്സ്ആപ്പ് ഗ്രൂപ്പിൽ നടക്കുന്ന ആത്മീയ ചർച്ചകളുടെ സംഗ്രഹം";
        renderDiscussionsList();
    }

    updateMorph(); // Re-center header text immediately
    window.scrollTo({ top: 0, behavior: "smooth" });
}

tabVideosBtn.addEventListener("click", () => switchMode("videos"));
tabDiscussionsBtn.addEventListener("click", () => switchMode("discussions"));

/* =====================================================================
   4. DAILY DISCUSSIONS ACCORDION LIST (MAIN POINTS + CONCLUSION + FULL PDF)
   ===================================================================== */
const discussionsList = document.getElementById("discussionsList");

function renderDiscussionsList() {
    discussionsList.innerHTML = "";

    dailyDiscussions.forEach((item) => {
        const details = document.createElement("details");
        details.className = "playlist";

        // Close other opened discussions when one is opened
        details.addEventListener("toggle", () => {
            if (details.open) {
                discussionsList.querySelectorAll(".playlist").forEach((other) => {
                    if (other !== details) other.removeAttribute("open");
                });
            }
        });

        const summary = document.createElement("summary");

        const topicSpan = document.createElement("span");
        topicSpan.className = "playlist-name";
        topicSpan.textContent = item.topic;

        const rightSpan = document.createElement("span");
        rightSpan.className = "playlist-right";

        const dateSpan = document.createElement("span");
        dateSpan.className = "video-count";
        dateSpan.textContent = "📅 " + item.date;

        const plusMinusToggle = document.createElement("span");
        plusMinusToggle.className = "playlist-toggle";

        rightSpan.appendChild(dateSpan);
        rightSpan.appendChild(plusMinusToggle);

        summary.appendChild(topicSpan);
        summary.appendChild(rightSpan);
        details.appendChild(summary);

        // Expanded Body: Main Points -> Conclusion -> Full Unchanged PDF Content
        const bodyDiv = document.createElement("div");
        bodyDiv.className = "discussion-body";

        const pointsHtml = item.mainPoints.map(pt => `<li>${pt}</li>`).join("");
        const shareText = `✨ *സത്യപ്രകാശം - പഠന സംഗ്രഹം* ✨\n📅 *തീയതി:* ${item.fullDate}\n\n📌 *വിഷയം: ${item.topic}*\n\n📝 *ചർച്ചയുടെ പ്രധാന ആശയങ്ങൾ:*\n${item.mainPoints.map(p => "• " + p).join("\n")}\n\n💡 *ചർച്ചയുടെ നിഗമനം (Conclusion):*\n_${item.conclusion}_`;
        const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);

        bodyDiv.innerHTML = `
            <span class="disc-date-day">📅 ${item.fullDate}</span>

            <div class="disc-summary-box">
                <h3 class="disc-section-heading">📝 ചർച്ചയുടെ പ്രധാന ആശയങ്ങൾ</h3>
                <ul class="disc-main-points">${pointsHtml}</ul>
            </div>

            <div class="disc-conclusion-box">
                <div class="disc-conclusion-title">💡 ചർച്ചയുടെ നിഗമനം (Conclusion)</div>
                <p class="disc-conclusion-text">${item.conclusion}</p>
            </div>

            <div class="full-pdf-box">
                <div class="full-pdf-header">📄 പൂർണ്ണ പഠന വിവരങ്ങൾ</div>
                <div class="full-pdf-text">${item.fullContentHtml}</div>
            </div>

            <div class="player-actions" style="margin-top: 0;">
                <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="whatsapp-share-btn">

try {

} catch (e) {}

let showOnlyFavorites = false;

    try {
        localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify([...savedVideoIds]));

}

    });
