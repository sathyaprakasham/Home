<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sujo Rajan - Spiritual Video Library</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {box-sizing: border-box;}
html, body {
    width: 100%;
    margin: 0;
    padding: 0;
    background: #080d19;
    color: #fff;
    font-family: 'Noto Sans Malayalam', sans-serif;
    overflow-x: hidden;
}
body {
    padding: 12px;
    background: radial-gradient(ellipse at 50% 0%, rgba(28,67,119,.35), transparent 55%), radial-gradient(ellipse at 100% 60%, rgba(145,104,35,.09), transparent 45%), #080d19;
}

/* Fixed Header + Search Shell */
.header-fixed-shell {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 8px 12px 10px;
    background: linear-gradient(to bottom, #080d19 calc(100% - 10px), rgba(8, 13, 25, 0.94) 100%);
    pointer-events: none;
}

/* Smooth Morphing Top Banner */
.channel-header {
    pointer-events: auto;
    position: relative;
    width: 100%;
    max-width: 1000px;
    height: 230px;
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid rgba(218,177,91,.45);
    border-radius: 16px;
    background: linear-gradient(120deg,rgba(5,13,31,.99),rgba(15,39,72,.98),rgba(5,13,31,1));
    box-shadow: 0 10px 28px rgba(0,0,0,.85),inset 0 0 40px rgba(46,105,170,.12);
    will-change: height, border-radius;
}
.channel-header::before{content:"";position:absolute;width:280px;height:280px;top:-170px;left:50%;transform:translateX(-50%);border-radius:50%;background:rgba(61,135,218,.24);filter:blur(50px)}
.channel-header::after{content:"";position:absolute;inset:10px;border:1px solid rgba(222,185,104,.15);border-radius:11px;pointer-events:none;transition: inset 0.15s ease;}

/* Smoothly Positioned Logo & Text via JS Interpolation */
.channel-logo {
    position: absolute;
    width: 92px;
    height: 92px;
    object-fit: cover;
    display: block;
    border-radius: 50%;
    border: 2px solid #d9b66b;
    padding: 3px;
    background: #091629;
    box-shadow: 0 0 12px rgba(54,139,255,.85),0 0 28px rgba(54,139,255,.65),0 0 45px rgba(54,139,255,.35),0 0 12px rgba(218,177,91,.3);
    will-change: left, top, width, height;
    z-index: 2;
}
.header-text {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    will-change: left, top;
    z-index: 2;
    white-space: nowrap;
}
.channel-title {
    margin: 0;
    color: #f2d28d;
    font-family: Georgia,serif;
    font-size: 29px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 2px 15px rgba(230,185,91,.25);
    line-height: 1.2;
    will-change: font-size;
}
.channel-subtitle {
    margin: 10px 0 0;
    color: #d6dfed;
    font-size: 14px;
    letter-spacing: 1px;
    line-height: 1.2;
    will-change: font-size, margin-top;
}
.header-line {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg,transparent,#d9b66b,transparent);
    will-change: opacity;
}

/* Sticky Search Bar inside Fixed Header Shell */
.search-bar-dock {
    pointer-events: auto;
    width: 100%;
    max-width: 1000px;
    margin: 10px auto 0;
}
.search-container {
    position: relative;
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
}
.search-input {
    width: 100%;
    padding: 11px 42px 11px 38px;
    background: rgba(13, 24, 42, 0.96);
    border: 1px solid rgba(218, 177, 91, 0.5);
    border-radius: 10px;
    color: #fff;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 14px;
    outline: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.search-input::placeholder {
    color: #899bb3;
}
.search-input:focus {
    border-color: #f0d18c;
    box-shadow: 0 0 16px rgba(218, 177, 91, 0.28);
}
.search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #d9b66b;
    font-size: 14px;
    pointer-events: none;
}
.search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(218, 177, 91, 0.22);
    border: none;
    color: #f0d18c;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
}
.search-clear.visible {
    display: flex;
}

/* Main Content Wrapper */
.content-wrapper {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding-top: 308px;
    position: relative;
}

.library{width:100%;margin:auto}
.library-heading{margin:0 auto 17px;text-align:center}
.library-heading h2{margin:0;color:#f0d18c;font-size:21px;font-weight:700}
.library-heading p{margin:7px 0 0;color:#9eacc1;font-size:13px}

.search-status {
    text-align: center;
    color: #f0d18c;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
}

.playlist{position:relative;margin-bottom:13px;background:linear-gradient(110deg,#14233a,#101c30);border:1px solid rgba(119,157,202,.25);border-radius:10px;overflow:hidden;box-shadow:0 5px 16px rgba(0,0,0,.25);transition:border-color .25s ease,box-shadow .25s ease}
.playlist:hover{border-color:rgba(221,183,104,.65);box-shadow:0 7px 22px rgba(0,0,0,.35)}
.playlist summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:61px;padding:14px 17px;font-size:16px;font-weight:600;color:#f4e8cd}
.playlist summary::-webkit-details-marker{display:none}
.playlist-name{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.playlist-right{display:flex;align-items:center;justify-content:center;gap:11px;flex-shrink:0}
.video-count{font-family:Arial,sans-serif;font-size:12px;font-weight:600;color:#aebdd1;white-space:nowrap}
.playlist-toggle{width:29px;height:29px;min-width:29px;padding:0;margin:0;display:grid;place-items:center;border-radius:50%;border:1px solid #e4c27d;background:linear-gradient(145deg,#f0d18c,#b58a3c);color:#101a2a;flex-shrink:0;font-family:Arial,sans-serif;font-size:21px;font-weight:500;line-height:1;box-shadow:0 0 12px rgba(218,177,91,.2)}
.playlist-toggle::before{content:"+";display:block;line-height:1;transform:translateY(-1px)}
.playlist[open] .playlist-toggle::before{content:"−";transform:translateY(-1px)}
.playlist[open]{border-color:rgba(224,185,103,.65)}
.video-list{padding:5px 16px 13px;border-top:1px solid rgba(143,168,201,.19);background:rgba(5,12,24,.38)}
.video-item{border-bottom:1px solid rgba(143,168,201,.14)}
.video-item:last-child{border-bottom:none}
.video-title{display:flex;align-items:flex-start;gap:11px;width:100%;padding:13px 5px;border:none;background:transparent;color:#dce6f4;font-family:'Noto Sans Malayalam',sans-serif;font-size:14px;line-height:1.7;text-align:left;cursor:pointer;transition:color .2s ease;overflow-wrap:anywhere;word-break:break-word}
.video-title:hover{color:#f2d28d}
.play{display:inline-block;flex-shrink:0;margin-top:3px;color:#e4bd70;font-family:Arial,sans-serif;font-size:15px;transition:transform .2s ease}
.video-title.active{color:#f3d28d}
.video-title.active .play{transform:rotate(90deg)}
.video-player{display:none;width:100%;padding:0 0 15px 27px}
.video-player.show{display:block}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid rgba(218,177,91,.35);border-radius:8px}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Action Links Bar (YouTube + WhatsApp Share) */
.player-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
}
.youtube-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #e9c77e;
    font-size: 13px;
    text-decoration: none;
}
.youtube-link:hover {
    color: #fff;
    text-decoration: underline;
}
.whatsapp-share-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    background: rgba(37, 211, 102, 0.14);
    border: 1px solid rgba(37, 211, 102, 0.45);
    color: #5ee68d;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
}
.whatsapp-share-btn:hover {
    background: rgba(37, 211, 102, 0.28);
    color: #fff;
}

/* Variety Back to Top Button (Golden Scroll-Progress Ring + Glowing Pill) */
.back-to-top {
    position: fixed;
    bottom: 22px;
    right: 20px;
    width: 50px;
    height: 50px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #1d3557, #0a1426);
    color: #f2d28d;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75), 0 0 16px rgba(218, 177, 91, 0.4);
    z-index: 990;
    opacity: 0;
    visibility: hidden;
    transform: translateY(16px) scale(0.9);
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease, box-shadow 0.25s ease;
}
.back-to-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}
.back-to-top:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85), 0 0 24px rgba(242, 210, 141, 0.75);
}
.back-to-top svg.progress-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}
.back-to-top .ring-bg {
    fill: none;
    stroke: rgba(218, 177, 91, 0.22);
    stroke-width: 3;
}
.back-to-top .ring-fill {
    fill: none;
    stroke: #f2d28d;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 138.23;
    stroke-dashoffset: 138.23;
    transition: stroke-dashoffset 0.1s linear;
}
.back-to-top .top-arrow-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
}
.back-to-top .arrow-icon {
    font-size: 16px;
    font-weight: 700;
    color: #f2d28d;
    animation: floatUp 1.8s ease-in-out infinite;
}
.back-to-top .top-label {
    font-family: Arial, sans-serif;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: #fff;
    margin-top: 2px;
}
@keyframes floatUp {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2.5px); }
}

.library-footer{max-width:1000px;margin:25px auto 5px;padding:17px 10px;text-align:center;border-top:1px solid rgba(218,177,91,.25);color:#899bb3;font-size:12px}
.library-footer span{color:#d8b66f;font-family:Georgia,serif;letter-spacing:1px}
@media(max-width:600px){
body{padding:7px}
.header-fixed-shell{padding:7px 7px 8px;}
.search-bar-dock{margin-top: 8px;}
.search-input{padding: 9px 36px 9px 34px; font-size: 13px;}
.search-icon{left: 11px; font-size: 13px;}
.content-wrapper {padding-top: 262px;}
.library-heading h2{font-size:18px}
.playlist{margin-bottom:10px;border-radius:8px}
.playlist summary{padding:12px 10px;min-height:54px;font-size:14px;gap:6px}
.playlist-right{gap:7px}
.video-count{font-size:11px}
.playlist-toggle{width:26px;height:26px;min-width:26px}
.video-list{padding:3px 9px 10px}
.video-title{font-size:13px;gap:8px;padding:11px 2px}
.video-player{padding-left:20px}
.back-to-top{bottom: 18px; right: 15px; width: 46px; height: 46px;}
}
</style>
</head>

/* Helper to stop & close any playing video inside a specific container */
function stopVideosIn(container) {
    container.querySelectorAll(".video-player.show").forEach(p => {
        p.classList.remove("show");
        p.innerHTML = "";
    });
    container.querySelectorAll(".video-title.active").forEach(b => {
        b.classList.remove("active");
    });
}

/* Playlist display */

const library = document.getElementById("library");

playlists.forEach((playlist) => {

    const details = document.createElement("details");
    details.className = "playlist";

    details.addEventListener("toggle", () => {
        const isSearching = document.getElementById("searchInput").value.trim().length > 0;
        if (details.open) {
            if (!isSearching) {
                document.querySelectorAll(".playlist").forEach((otherDetails) => {
                    if (otherDetails !== details) {
                        otherDetails.removeAttribute("open");
                        stopVideosIn(otherDetails);
                    }
                });
            }
        } else {
            stopVideosIn(details);
        }
    });

    const summary = document.createElement("summary");

    const name = document.createElement("span");
    name.className = "playlist-name";
    name.textContent = playlist.name;

    const right = document.createElement("span");
    right.className = "playlist-right";

    const count = document.createElement("span");
    count.className = "video-count";
    count.dataset.total = playlist.videos.length;
    count.textContent = playlist.videos.length + " Videos";

    const toggle = document.createElement("span");
    toggle.className = "playlist-toggle";

    right.appendChild(count);
    right.appendChild(toggle);

    summary.appendChild(name);
    summary.appendChild(right);

    details.appendChild(summary);

    const videoList = document.createElement("div");
    videoList.className = "video-list";

    playlist.videos.forEach((video) => {

        const item = document.createElement("div");
        item.className = "video-item";

        const button = document.createElement("button");
        button.className = "video-title";
        button.type = "button";

        const play = document.createElement("span");
        play.className = "play";
        play.textContent = "▶";

        const title = document.createElement("span");
        title.textContent = video[0];

        button.appendChild(play);
        button.appendChild(title);

        const player = document.createElement("div");
        player.className = "video-player";

        button.addEventListener("click", () => {

            const isAlreadyOpen = player.classList.contains("show");

            stopVideosIn(document);

            if (!isAlreadyOpen) {

                button.classList.add("active");
                player.classList.add("show");

                const videoId = video[1];
                const videoTitle = video[0];
                const youtubeUrl = "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);

                const frame = document.createElement("div");
                frame.className = "video-frame";

                const iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(videoId);
                iframe.title = videoTitle;
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;

                frame.appendChild(iframe);

                // Action Links Bar (YouTube + WhatsApp Share)
                const actions = document.createElement("div");
                actions.className = "player-actions";

                const link = document.createElement("a");
                link.className = "youtube-link";
                link.href = youtubeUrl;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "YouTube-ൽ തുറക്കുക";

                const waShare = document.createElement("a");
                waShare.className = "whatsapp-share-btn";
                const shareMessage = `${videoTitle}\n${youtubeUrl}`;
                waShare.href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareMessage);
                waShare.target = "_blank";
                waShare.rel = "noopener noreferrer";
                waShare.textContent = "WhatsApp-ൽ ഷെയർ ചെയ്യുക";

                actions.appendChild(link);
                actions.appendChild(waShare);

                player.appendChild(frame);
                player.appendChild(actions);
            }
        });

        item.appendChild(button);
        item.appendChild(player);

        videoList.appendChild(item);
    });

    details.appendChild(videoList);
    library.appendChild(details);
});

/* Instant Search Logic */
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");
const searchStatus = document.getElementById("searchStatus");

function filterVideos() {
    const query = searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle("visible", query.length > 0);

    const allPlaylists = document.querySelectorAll(".playlist");
    let totalMatchedVideos = 0;

    if (!query) {
        searchStatus.style.display = "none";
        allPlaylists.forEach((pl) => {
            pl.style.display = "";
            pl.removeAttribute("open");
            stopVideosIn(pl);
            const countEl = pl.querySelector(".video-count");
            countEl.textContent = countEl.dataset.total + " Videos";
            pl.querySelectorAll(".video-item").forEach((item) => {
                item.style.display = "";
            });
        });
        return;
    }

    allPlaylists.forEach((pl) => {
        const playlistName = pl.querySelector(".playlist-name").textContent.toLowerCase();
        const isPlaylistNameMatch = playlistName.includes(query);
        const items = pl.querySelectorAll(".video-item");
        let matchedInPlaylist = 0;

        items.forEach((item) => {
            const titleText = item.querySelector(".video-title span:last-child").textContent.toLowerCase();
            if (isPlaylistNameMatch || titleText.includes(query)) {
                item.style.display = "";
                matchedInPlaylist++;
                totalMatchedVideos++;
            } else {
                item.style.display = "none";
                stopVideosIn(item);
            }
        });

        const countEl = pl.querySelector(".video-count");
        if (matchedInPlaylist > 0) {
            pl.style.display = "";
            pl.setAttribute("open", "");
            countEl.textContent = matchedInPlaylist + " / " + countEl.dataset.total + " Videos";
        } else {
            pl.style.display = "none";
            pl.removeAttribute("open");
            stopVideosIn(pl);
        }
    });

    searchStatus.style.display = "block";
    if (totalMatchedVideos > 0) {
        searchStatus.textContent = `${totalMatchedVideos} വീഡിയോകൾ കണ്ടെത്തി`;
    } else {
        searchStatus.textContent = "തിരയുന്ന വിഷയത്തിൽ വീഡിയോകൾ ഒന്നും കണ്ടെത്തിയില്ല.";
    }
}

searchInput.addEventListener("input", filterVideos);
searchClear.addEventListener("click", () => {
    searchInput.value = "";
    filterVideos();
    searchInput.focus();
});

/* Back to Top Button with Live Scroll Progress */
const backToTopBtn = document.getElementById("backToTop");
const progressRingFill = document.getElementById("progressRingFill");
const ringCircumference = 2 * Math.PI * 22; // r = 22 -> ~138.23

backToTopBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
});

/* Continuous 60fps Smooth Header Morphing */
const header = document.getElementById("channelHeader");
const logo = document.getElementById("channelLogo");
const textBox = document.getElementById("headerText");
const titleEl = document.getElementById("channelTitle");
const subEl = document.getElementById("channelSubtitle");
const lineEl = document.getElementById("headerLine");

function lerp(start, end, t) {
    return start + (end - start) * t;
}

function updateMorph() {
    const isMobile = window.innerWidth <= 600;
    const scrollRange = isMobile ? 130 : 160;
    const scrollY = window.scrollY;
    const progress = Math.min(Math.max(scrollY / scrollRange, 0), 1);

    // Toggle Back to Top visibility & update scroll progress ring
    if (scrollY > 220) {
        backToTopBtn.classList.add("show");
    } else {
        backToTopBtn.classList.remove("show");
    }

    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const scrollPercent = docHeight > 0 ? Math.min(Math.max(scrollY / docHeight, 0), 1) : 0;
    progressRingFill.style.strokeDashoffset = ringCircumference * (1 - scrollPercent);

    // Smooth easing curve
    const ease = progress * (2 - progress);

    const headerW = header.clientWidth;

    // 1. Header Height & Border Radius
    const startH = isMobile ? 195 : 230;
    const endH = isMobile ? 58 : 68;
    const currentH = lerp(startH, endH, ease);
    header.style.height = currentH + "px";
    header.style.borderRadius = lerp(isMobile ? 12 : 16, 12, ease) + "px";

    // 2. Logo Size & Position (Smoothly moves from top-center to left)
    const startLogo = isMobile ? 75 : 92;
    const endLogo = isMobile ? 40 : 46;
    const curLogo = lerp(startLogo, endLogo, ease);

    const startLogoX = (headerW - startLogo) / 2;
    const endLogoX = isMobile ? 12 : 18;
    const curLogoX = lerp(startLogoX, endLogoX, ease);

    const startLogoY = isMobile ? 22 : 28;
    const endLogoY = (endH - endLogo) / 2;
    const curLogoY = lerp(startLogoY, endLogoY, ease);

    logo.style.width = curLogo + "px";
    logo.style.height = curLogo + "px";
    logo.style.left = curLogoX + "px";
    logo.style.top = curLogoY + "px";

    // 3. Text Font Sizes
    const startTitleSize = isMobile ? 23 : 29;
    const endTitleSize = isMobile ? 16 : 19;
    titleEl.style.fontSize = lerp(startTitleSize, endTitleSize, ease) + "px";

    const startSubSize = isMobile ? 11 : 14;
    const endSubSize = isMobile ? 10 : 11;
    subEl.style.fontSize = lerp(startSubSize, endSubSize, ease) + "px";
    subEl.style.marginTop = lerp(isMobile ? 6 : 10, 2, ease) + "px";

    // 4. Text Alignment & Position (Center aligned at top -> Left aligned beside logo when scrolled)
    if (ease > 0.5) {
        textBox.style.alignItems = "flex-start";
        textBox.style.textAlign = "left";
    } else {
        textBox.style.alignItems = "center";
        textBox.style.textAlign = "center";
    }

    const textW = textBox.offsetWidth;
    const textH = textBox.offsetHeight;

    const startTextX = (headerW - textW) / 2;
    const endTextX = endLogoX + endLogo + (isMobile ? 10 : 14);
    const curTextX = lerp(startTextX, endTextX, ease);

    const startTextY = startLogoY + startLogo + (isMobile ? 11 : 14);
    const endTextY = (endH - textH) / 2;
    const curTextY = lerp(startTextY, endTextY, ease);

    textBox.style.left = curTextX + "px";
    textBox.style.top = curTextY + "px";

    // 5. Divider Line Fade Out
    lineEl.style.opacity = Math.max(0, 1 - ease * 2.5);
}

let isTicking = false;
function onScrollOrResize() {
    if (!isTicking) {
        window.requestAnimationFrame(() => {
            updateMorph();
            isTicking = false;
        });
        isTicking = true;
    }
}

window.addEventListener("scroll", onScrollOrResize, { passive: true });
window.addEventListener("resize", onScrollOrResize, { passive: true });

// Initial positioning
updateMorph();
</script>
