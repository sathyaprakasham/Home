/* Instant Search + Quick Topic Tags + Favorites Filter Logic */
const searchStatus = document.getElementById("searchStatus");
const favFilterBtn = document.getElementById("favFilterBtn");
const topicChips = document.querySelectorAll("#quickTagsBar .topic-chip[data-tag]");

function syncChipStates() {
    const currentQuery = searchInput.value.trim();
    topicChips.forEach(chip => {
        chip.classList.toggle("active", !showOnlyFavorites && currentQuery === chip.dataset.tag);
    });
    favFilterBtn.classList.toggle("active", showOnlyFavorites);
}

function filterVideos() {
    const query = searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle("visible", query.length > 0 || showOnlyFavorites);
    syncChipStates();

    const allPlaylists = library.querySelectorAll(".playlist");
    let totalMatchedVideos = 0;

    if (!query && !showOnlyFavorites) {
        searchStatus.style.display = "none";
        allPlaylists.forEach((pl) => {
            pl.style.display = "";
            pl.removeAttribute("open");
            stopVideosIn(pl);
            const countEl = pl.querySelector(".video-count");
            countEl.textContent = countEl.dataset.total + " Videos";
            pl.querySelectorAll(".video-item").forEach((item) => {
                item.style.display = "";
            });
        });
        return;
    }

    allPlaylists.forEach((pl) => {
        const playlistName = pl.querySelector(".playlist-name").textContent.toLowerCase();
        const isPlaylistNameMatch = query.length > 0 && playlistName.includes(query);
        const items = pl.querySelectorAll(".video-item");
        let matchedInPlaylist = 0;

        items.forEach((item) => {
            const titleText = item.querySelector(".video-title span:last-child").textContent.toLowerCase();
            const vidId = item.dataset.videoId;
            const matchesText = !query || isPlaylistNameMatch || titleText.includes(query);
            const matchesFav = !showOnlyFavorites || savedVideoIds.has(vidId);

            if (matchesText && matchesFav) {
                item.style.display = "";
                matchedInPlaylist++;
                totalMatchedVideos++;
            } else {
                item.style.display = "none";
                stopVideosIn(item);
            }
        });

        const countEl = pl.querySelector(".video-count");
        if (matchedInPlaylist > 0) {
            pl.style.display = "";
            pl.setAttribute("open", "");
            countEl.textContent = matchedInPlaylist + " / " + countEl.dataset.total + " Videos";
        } else {
            pl.style.display = "none";
            pl.removeAttribute("open");
            stopVideosIn(pl);
        }
    });

    searchStatus.style.display = "block";
    if (showOnlyFavorites && totalMatchedVideos === 0) {
        searchStatus.textContent = "സേവ് ചെയ്ത വീഡിയോകൾ ഒന്നും ഇല്ല. വീഡിയോയുടെ വലതുവശത്തുള്ള ☆ ബട്ടൺ അമർത്തി സേവ് ചെയ്യാം.";
    } else if (totalMatchedVideos > 0) {
        searchStatus.textContent = showOnlyFavorites
            ? `സേവ് ചെയ്ത ${totalMatchedVideos} വീഡിയോകൾ`
            : `${totalMatchedVideos} വീഡിയോകൾ കണ്ടെത്തി`;
    } else {
        searchStatus.textContent = "തിരയുന്ന വിഷയത്തിൽ വീഡിയോകൾ ഒന്നും കണ്ടെത്തിയില്ല.";
    }
}

searchInput.addEventListener("input", filterVideos);

searchClear.addEventListener("click", () => {
    searchInput.value = "";
    showOnlyFavorites = false;
    filterVideos();
    searchInput.focus();
});

// Quick Topic Chips Click
topicChips.forEach(chip => {
    chip.addEventListener("click", () => {
        showOnlyFavorites = false;
        const tag = chip.dataset.tag;
        if (searchInput.value.trim() === tag) {
            searchInput.value = "";
        } else {
            searchInput.value = tag;
        }
        filterVideos();
    });
});

// Saved Favorites Chip Click
favFilterBtn.addEventListener("click", () => {
    showOnlyFavorites = !showOnlyFavorites;
    if (showOnlyFavorites) {
        searchInput.value = "";
    }
    filterVideos();
});

/* Back to Top Button with Live Scroll Progress */
const backToTopBtn = document.getElementById("backToTop");
const progressRingFill = document.getElementById("progressRingFill");
const ringCircumference = 2 * Math.PI * 22;

backToTopBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
});

/* Continuous 60fps Smooth Header Morphing */
const header = document.getElementById("channelHeader");
const logo = document.getElementById("channelLogo");
const textBox = document.getElementById("headerText");
const lineEl = document.getElementById("headerLine");

function lerp(start, end, t) {
    return start + (end - start) * t;
}

function updateMorph() {
    const isMobile = window.innerWidth <= 600;
    const scrollRange = isMobile ? 130 : 160;
    const scrollY = window.scrollY;
    const progress = Math.min(Math.max(scrollY / scrollRange, 0), 1);

    if (scrollY > 220) {
        backToTopBtn.classList.add("show");
    } else {
        backToTopBtn.classList.remove("show");
    }

    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const scrollPercent = docHeight > 0 ? Math.min(Math.max(scrollY / docHeight, 0), 1) : 0;
    progressRingFill.style.strokeDashoffset = ringCircumference * (1 - scrollPercent);

    const ease = progress * (2 - progress);
    const headerW = header.clientWidth;

    // 1. Header Height & Border Radius
    const startH = isMobile ? 205 : 235;
    const endH = isMobile ? 62 : 70;
    const currentH = lerp(startH, endH, ease);
    header.style.height = currentH + "px";
    header.style.borderRadius = lerp(isMobile ? 12 : 16, 12, ease) + "px";

    // 2. Logo Size & Position
    const startLogo = isMobile ? 75 : 92;
    const endLogo = isMobile ? 40 : 46;
    const curLogo = lerp(startLogo, endLogo, ease);

    const startLogoX = (headerW - startLogo) / 2;
    const endLogoX = isMobile ? 12 : 18;
    const curLogoX = lerp(startLogoX, endLogoX, ease);

    const startLogoY = isMobile ? 18 : 24;
    const endLogoY = (endH - endLogo) / 2;
    const curLogoY = lerp(startLogoY, endLogoY, ease);

    logo.style.width = curLogo + "px";
    logo.style.height = curLogo + "px";
    logo.style.left = curLogoX + "px";
    logo.style.top = curLogoY + "px";

    // 3. Text Font Sizes
    const isDiscussion = currentMode === "discussions";
    const startTitleSize = isMobile ? (isDiscussion ? 22 : 23) : (isDiscussion ? 28 : 29);
    const endTitleSize = isMobile ? 15 : 18;
    titleEl.style.fontSize = lerp(startTitleSize, endTitleSize, ease) + "px";

    const startSubSize = isMobile ? (isDiscussion ? 11.5 : 11) : (isDiscussion ? 13.5 : 14);
    const endSubSize = isMobile ? 9.5 : 11;
    subEl.style.fontSize = lerp(startSubSize, endSubSize, ease) + "px";
    subEl.style.marginTop = lerp(isMobile ? 5 : 8, 2, ease) + "px";

    // 4. Text Alignment & Position
    if (ease > 0.5) {
        textBox.style.alignItems = "flex-start";
        textBox.style.textAlign = "left";
        textBox.style.whiteSpace = "nowrap";
    } else {
        textBox.style.alignItems = "center";
        textBox.style.textAlign = "center";
        textBox.style.whiteSpace = isMobile && isDiscussion ? "normal" : "nowrap";
    }

    const textW = textBox.offsetWidth;
    const textH = textBox.offsetHeight;

    const startTextX = (headerW - textW) / 2;
    const endTextX = endLogoX + endLogo + (isMobile ? 10 : 14);
    const curTextX = lerp(startTextX, endTextX, ease);

    const startTextY = startLogoY + startLogo + (isMobile ? 10 : 12);
    const endTextY = (endH - textH) / 2;
    const curTextY = lerp(startTextY, endTextY, ease);

    textBox.style.left = curTextX + "px";
    textBox.style.top = curTextY + "px";

    // 5. Divider Line Fade Out
    lineEl.style.opacity = Math.max(0, 1 - ease * 2.5);
}

let isTicking = false;
function onScrollOrResize() {
    if (!isTicking) {
        window.requestAnimationFrame(() => {
            updateMorph();
            isTicking = false;
        });
        isTicking = true;
    }
}

window.addEventListener("scroll", onScrollOrResize, { passive: true });
window.addEventListener("resize", onScrollOrResize, { passive: true });

updateMorph();
</script>
