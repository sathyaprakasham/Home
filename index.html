<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sujo Rajan - Spiritual Video Library &amp; സത്യപ്രകാശം</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {box-sizing: border-box;}
html, body {
    width: 100%;
    margin: 0;
    padding: 0;
    background: #080d19;
    color: #fff;
    font-family: 'Noto Sans Malayalam', sans-serif;
    overflow-x: hidden;
}
body {
    padding: 12px;
    background: radial-gradient(ellipse at 50% 0%, rgba(28,67,119,.35), transparent 55%), radial-gradient(ellipse at 100% 60%, rgba(145,104,35,.09), transparent 45%), #080d19;
}

/* Fixed Header + Mode Tabs + Search + Quick Tags Shell */
.header-fixed-shell {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 8px 12px 10px;
    background: linear-gradient(to bottom, #080d19 calc(100% - 10px), rgba(8, 13, 25, 0.95) 100%);
    pointer-events: none;
}

/* Smooth Morphing Top Banner */
.channel-header {
    pointer-events: auto;
    position: relative;
    width: 100%;
    max-width: 1000px;
    height: 230px;
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid rgba(218,177,91,.45);
    border-radius: 16px;
    background: linear-gradient(120deg,rgba(5,13,31,.99),rgba(15,39,72,.98),rgba(5,13,31,1));
    box-shadow: 0 10px 28px rgba(0,0,0,.85),inset 0 0 40px rgba(46,105,170,.12);
    will-change: height, border-radius;
}
.channel-header::before{content:"";position:absolute;width:280px;height:280px;top:-170px;left:50%;transform:translateX(-50%);border-radius:50%;background:rgba(61,135,218,.24);filter:blur(50px)}
.channel-header::after{content:"";position:absolute;inset:10px;border:1px solid rgba(222,185,104,.15);border-radius:11px;pointer-events:none;transition: inset 0.15s ease;}

/* Smoothly Positioned Logo & Text via JS Interpolation */
.channel-logo {
    position: absolute;
    width: 92px;
    height: 92px;
    object-fit: cover;
    display: block;
    border-radius: 50%;
    border: 2px solid #d9b66b;
    padding: 3px;
    background: #091629;
    box-shadow: 0 0 12px rgba(54,139,255,.85),0 0 28px rgba(54,139,255,.65),0 0 45px rgba(54,139,255,.35),0 0 12px rgba(218,177,91,.3);
    will-change: left, top, width, height;
    z-index: 2;
}
.header-text {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    will-change: left, top;
    z-index: 2;
    max-width: calc(100% - 24px);
}
.channel-title {
    margin: 0;
    color: #f2d28d;
    font-family: Georgia, 'Noto Sans Malayalam', serif;
    font-size: 29px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 15px rgba(230,185,91,.25);
    line-height: 1.25;
    will-change: font-size;
}
.channel-subtitle {
    margin: 8px 0 0;
    color: #d6dfed;
    font-size: 13.5px;
    letter-spacing: 0.5px;
    line-height: 1.3;
    will-change: font-size, margin-top;
}
.header-line {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg,transparent,#d9b66b,transparent);
    will-change: opacity;
}

/* Mode Switcher Tabs (Videos vs ചർച്ച സംഗ്രഹം) */
.mode-tabs-bar {
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    max-width: 650px;
    margin: 9px auto 0;
}
.mode-tab {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(15, 28, 48, 0.94);
    border: 1px solid rgba(119, 157, 202, 0.35);
    color: #cfe0f5;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
}
.mode-tab:hover {
    border-color: #e4c27d;
    color: #fff;
}
.mode-tab.active {
    background: linear-gradient(135deg, #f0d18c, #c5953e);
    border-color: #f7dfa6;
    color: #0b1424;
    font-weight: 700;
    box-shadow: 0 3px 12px rgba(240, 209, 140, 0.35);
}

/* Sticky Search Bar & Quick Topic Tags inside Fixed Header Shell */
.search-bar-dock {
    pointer-events: auto;
    width: 100%;
    max-width: 1000px;
    margin: 8px auto 0;
}
.search-container {
    position: relative;
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
}
.search-input {
    width: 100%;
    padding: 10px 42px 10px 38px;
    background: rgba(13, 24, 42, 0.96);
    border: 1px solid rgba(218, 177, 91, 0.5);
    border-radius: 10px;
    color: #fff;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 14px;
    outline: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.search-input::placeholder {
    color: #899bb3;
}
.search-input:focus {
    border-color: #f0d18c;
    box-shadow: 0 0 16px rgba(218, 177, 91, 0.28);
}
.search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #d9b66b;
    font-size: 14px;
    pointer-events: none;
}
.search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(218, 177, 91, 0.22);
    border: none;
    color: #f0d18c;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
}
.search-clear.visible {
    display: flex;
}

/* Quick Topic Tags + Saved Filter Chip */
.quick-tags-bar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    max-width: 650px;
    margin: 8px auto 0;
    overflow-x: auto;
    padding-bottom: 3px;
    scrollbar-width: none;
}
.quick-tags-bar::-webkit-scrollbar {
    display: none;
}
@media (min-width: 620px) {
    .quick-tags-bar {
        justify-content: center;
    }
}
.topic-chip {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 50px;
    background: rgba(18, 33, 56, 0.92);
    border: 1px solid rgba(119, 157, 202, 0.35);
    color: #cfe0f5;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
}
.topic-chip:hover {
    border-color: #e4c27d;
    color: #fff;
}
.topic-chip.active {
    background: linear-gradient(135deg, #f0d18c, #c5953e);
    border-color: #f7dfa6;
    color: #0b1424;
    font-weight: 700;
    box-shadow: 0 2px 10px rgba(240, 209, 140, 0.35);
}
.topic-chip.fav-chip {
    border-color: rgba(240, 209, 140, 0.55);
    color: #f2d28d;
}
.topic-chip.fav-chip.active {
    color: #0b1424;
}

/* Main Content Wrapper */
.content-wrapper {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding-top: 386px;
    position: relative;
}
.content-wrapper.discussions-mode {
    padding-top: 300px;
}

.library{width:100%;margin:auto}
.library-heading{margin:0 auto 17px;text-align:center}
.library-heading h2{margin:0;color:#f0d18c;font-size:21px;font-weight:700}
.library-heading p{margin:7px 0 0;color:#9eacc1;font-size:13px}

.search-status {
    text-align: center;
    color: #f0d18c;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
}

/* Playlist & Discussion Accordion Card Styles (+ and - Button) */
.playlist{position:relative;margin-bottom:13px;background:linear-gradient(110deg,#14233a,#101c30);border:1px solid rgba(119,157,202,.25);border-radius:10px;overflow:hidden;box-shadow:0 5px 16px rgba(0,0,0,.25);transition:border-color .25s ease,box-shadow .25s ease}
.playlist:hover{border-color:rgba(221,183,104,.65);box-shadow:0 7px 22px rgba(0,0,0,.35)}
.playlist summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:61px;padding:14px 17px;font-size:16px;font-weight:600;color:#f4e8cd}
.playlist summary::-webkit-details-marker{display:none}
.playlist-name{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;line-height:1.5}
.playlist-right{display:flex;align-items:center;justify-content:center;gap:11px;flex-shrink:0}
.video-count{font-family:Arial, 'Noto Sans Malayalam', sans-serif;font-size:12px;font-weight:600;color:#aebdd1;white-space:nowrap}
.playlist-toggle{width:29px;height:29px;min-width:29px;padding:0;margin:0;display:grid;place-items:center;border-radius:50%;border:1px solid #e4c27d;background:linear-gradient(145deg,#f0d18c,#b58a3c);color:#101a2a;flex-shrink:0;font-family:Arial,sans-serif;font-size:21px;font-weight:500;line-height:1;box-shadow:0 0 12px rgba(218,177,91,.2)}
.playlist-toggle::before{content:"+";display:block;line-height:1;transform:translateY(-1px)}
.playlist[open] .playlist-toggle::before{content:"−";transform:translateY(-1px)}
.playlist[open]{border-color:rgba(224,185,103,.65)}
.video-list{padding:5px 16px 13px;border-top:1px solid rgba(143,168,201,.19);background:rgba(5,12,24,.38)}
.video-item{border-bottom:1px solid rgba(143,168,201,.14)}
.video-item:last-child{border-bottom:none}

/* Discussion Details Inside Expanded Accordion */
.discussion-body {
    padding: 16px 18px 18px;
    border-top: 1px solid rgba(143,168,201,.19);
    background: rgba(5,12,24,.45);
}
.disc-date-day {
    display: inline-block;
    padding: 4px 11px;
    margin-bottom: 14px;
    border-radius: 6px;
    background: rgba(218, 177, 91, 0.14);
    border: 1px solid rgba(218, 177, 91, 0.4);
    color: #f2d28d;
    font-size: 12px;
    font-weight: 600;
}
.disc-summary-box {
    background: rgba(14, 27, 48, 0.85);
    border: 1px solid rgba(119, 157, 202, 0.25);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
}
.disc-section-heading {
    margin: 0 0 10px;
    color: #8fb4e0;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
}
.disc-main-points {
    margin: 0;
    padding-left: 20px;
    color: #e2eaf5;
    font-size: 14px;
    line-height: 1.85;
}
.disc-main-points li {
    margin-bottom: 6px;
}
.disc-conclusion-box {
    background: linear-gradient(135deg, rgba(218, 177, 91, 0.14), rgba(20, 42, 74, 0.7));
    border-left: 4px solid #f0d18c;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 18px;
}
.disc-conclusion-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #f2d28d;
    margin-bottom: 6px;
}
.disc-conclusion-text {
    margin: 0;
    color: #fff6e0;
    font-size: 14.2px;
    line-height: 1.8;
    font-weight: 500;
}

/* Exact Full PDF Content Box (Proper Clean Paragraph Spacing) */
.full-pdf-box {
    background: rgba(8, 16, 30, 0.92);
    border: 1px solid rgba(218, 177, 91, 0.3);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 15px;
}
.full-pdf-header {
    font-size: 14px;
    font-weight: 700;
    color: #f2d28d;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(218, 177, 91, 0.25);
    display: flex;
    align-items: center;
    gap: 6px;
}
.full-pdf-text {
    color: #dce6f4;
    font-size: 14px;
    line-height: 1.85;
    word-wrap: break-word;
}
.full-pdf-text h4 {
    color: #f0d18c;
    font-size: 15px;
    margin: 14px 0 6px;
    border-bottom: 1px dashed rgba(240, 209, 140, 0.25);
    padding-bottom: 3px;
}
.full-pdf-text h4:first-child {
    margin-top: 2px;
}
.full-pdf-text p {
    margin: 0 0 8px;
}
.full-pdf-text p:last-child {
    margin-bottom: 0;
}

.copy-summary-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 50px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(218, 177, 91, 0.4);
    color: #f2d28d;
    font-family: 'Noto Sans Malayalam', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}
.copy-summary-btn:hover {
    background: rgba(218, 177, 91, 0.22);
    color: #fff;
}

/* Video Row with Bookmark Star */
.video-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
}
.video-title{display:flex;align-items:flex-start;gap:11px;flex:1;min-width:0;padding:13px 5px;border:none;background:transparent;color:#dce6f4;font-family:'Noto Sans Malayalam',sans-serif;font-size:14px;line-height:1.7;text-align:left;cursor:pointer;transition:color .2s ease;overflow-wrap:anywhere;word-break:break-word}
.video-title:hover{color:#f2d28d}
.play{display:inline-block;flex-shrink:0;margin-top:3px;color:#e4bd70;font-family:Arial,sans-serif;font-size:15px;transition:transform .2s ease}
.video-title.active{color:#f3d28d}
.video-title.active .play{transform:rotate(90deg)}

/* Favorite Bookmark Star Button */
.fav-btn {
    flex-shrink: 0;
    margin-top: 9px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    color: #6f84a3;
    font-size: 18px;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
}
.fav-btn:hover {
    color: #f2d28d;
    background: rgba(242, 210, 141, 0.1);
}
.fav-btn.saved {
    color: #ffd54f;
    text-shadow: 0 0 10px rgba(255, 213, 79, 0.65);
}

.video-player{display:none;width:100%;padding:0 0 15px 27px}
.video-player.show{display:block}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid rgba(218,177,91,.35);border-radius:8px}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Advanced Glass Action Bar */
.player-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 8px 12px;
    background: linear-gradient(135deg, rgba(16, 30, 54, 0.85), rgba(10, 19, 36, 0.92));
    border: 1px solid rgba(218, 177, 91, 0.25);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

/* Advanced Glowing WhatsApp Share Pill */
.whatsapp-share-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 15px;
    border-radius: 50px;
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    border: 1px solid rgba(185, 255, 210, 0.5);
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
}

.whatsapp-share-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    transform: skewX(-20deg);
    animation: waShimmer 3.5s infinite;
}

@keyframes waShimmer {
    0% { left: -120%; }
    35%, 100% { left: 160%; }
}

.whatsapp-share-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
    color: #fff;
}

/* Sleek YouTube Button */
.youtube-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 50px;
    background: rgba(255, 0, 0, 0.14);
    border: 1px solid rgba(255, 68, 68, 0.4);
    color: #ff9494;
    font-family: Arial, sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-decoration: none;
    white-space: nowrap;
    transition: all 0.25s ease;
}
.youtube-link:hover {
    background: rgba(255, 0, 0, 0.26);
    border-color: #ff5252;
    color: #fff;
    transform: translateY(-1px);
}

.whatsapp-share-btn svg, .youtube-link svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
    flex-shrink: 0;
}

/* Variety Back to Top Button */
.back-to-top {
    position: fixed;
    bottom: calc(55px + env(safe-area-inset-bottom));
    right: 20px;
    width: 50px;
    height: 50px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #1d3557, #0a1426);
    color: #ffd54f;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255, 215, 0, 0.65), 0 0 34px rgba(255, 193, 7, 0.35), 0 6px 18px rgba(0, 0, 0, 0.8);
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transform: translateY(16px) scale(0.9);
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease, box-shadow 0.25s ease;
}
.back-to-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}
.back-to-top:hover {
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 0 24px rgba(255, 224, 51, 0.9), 0 0 44px rgba(255, 193, 7, 0.55), 0 8px 22px rgba(0, 0, 0, 0.85);
}
.back-to-top svg.progress-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}
.back-to-top .ring-bg {
    fill: none;
    stroke: rgba(255, 215, 0, 0.25);
    stroke-width: 3;
}
.back-to-top .ring-fill {
    fill: none;
    stroke: #ffd54f;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 138.23;
    stroke-dashoffset: 138.23;
    transition: stroke-dashoffset 0.1s linear;
}
.back-to-top .top-arrow-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
}
.back-to-top .arrow-icon {
    font-size: 16px;
    font-weight: 700;
    color: #ffd54f;
    animation: floatUp 1.8s ease-in-out infinite;
}
.back-to-top .top-label {
    font-family: Arial, sans-serif;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: #fff;
    margin-top: 2px;
}
@keyframes floatUp {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2.5px); }
}

.library-footer{max-width:1000px;margin:25px auto 5px;padding:17px 10px;text-align:center;border-top:1px solid rgba(218,177,91,.25);color:#899bb3;font-size:12px}
.library-footer span{color:#d8b66f;font-family:Georgia,serif;letter-spacing:1px}
@media(max-width:600px){
body{padding:7px}
.header-fixed-shell{padding:7px 7px 8px;}
.mode-tabs-bar{margin-top: 7px; gap: 6px;}
.mode-tab{padding: 7px 8px; font-size: 12px;}
.search-bar-dock{margin-top: 7px;}
.search-input{padding: 9px 36px 9px 34px; font-size: 13px;}
.search-icon{left: 11px; font-size: 13px;}
.quick-tags-bar{margin-top: 7px; gap: 6px;}
.topic-chip{padding: 4px 10px; font-size: 11px;}
.content-wrapper {padding-top: 334px;}
.content-wrapper.discussions-mode {padding-top: 262px;}
.library-heading h2{font-size:18px}
.playlist{margin-bottom:10px;border-radius:8px}
.playlist summary{padding:12px 10px;min-height:54px;font-size:14px;gap:6px}
.playlist-right{gap:7px}
.video-count{font-size:11px}
.playlist-toggle{width:26px;height:26px;min-width:26px}
.video-list{padding:3px 9px 10px}
.discussion-body{padding: 13px 12px 15px;}
.disc-summary-box, .full-pdf-box{padding: 12px 13px;}
.disc-main-points, .disc-conclusion-text, .full-pdf-text{font-size: 13.5px;}

            <h4>ആഘോഷങ്ങൾ വേണോ ?</h4>
            <p>ആത്മീയ വളർച്ചയോ, ആത്മാവിനെ കുറിച്ചോ, ദൈവത്തെയോ ഒന്നും അറിഞ്ഞുകൂടാത്ത കുട്ടികൾക്ക് നമ്മൾ എന്ത് പറഞ്ഞു കൊടുക്കും? എന്നുള്ളതാണ് വിഷയം. കാര്യം ഇപ്പോൾ പറഞ്ഞു കൊടുത്തും, മനസ്സിലാക്കിച്ചും, അവരെ ആ നിലയിൽ പരിശീലിപ്പിച്ചാൽ; അവർ നേരത്തെ ആ ദൈവമായിട്ട് സമ്പർക്കം കിട്ടി നല്ല പിള്ളേരായിട്ട് മുന്നോട്ട് പോകും. ഇല്ലെങ്കിൽ, നമ്മളെയൊക്കെ പോലെ വയസാൻകാലത്തൊക്കെ ആയിരിയ്ക്കും കാര്യങ്ങളൊക്കെ പിടികിട്ടി വരുന്നത്.</p>
            <p>ദീപാവലി - ആഘോഷങ്ങൾ, ഇത്രയും വിശദമായിട്ടൊന്നും പിള്ളേർക്കൊന്നും പറഞ്ഞു കൊടുക്കേണ്ട ആവശ്യം വരുന്നില്ല. ഇതൊക്കെ വെറുതെ മനുഷ്യർ, പൊങ്ങച്ചം കാണിച്ചും, സന്തോഷിയ്ക്കാൻ വേണ്ടി കാണിയ്ക്കുന്ന ഓരോ ആഘോഷങ്ങളാണ്. എന്തുമാത്രം ആൾക്കാർ ഇവിടെയെല്ലാം പട്ടണിയും കാര്യങ്ങളായിട്ട് എത്രയോ പിള്ളേരും ദാരിദ്ര്യത്തിൽ കിടക്കുമ്പോൾ, നമ്മൾ ഈ കഷ്ടപ്പെട്ട് ഉണ്ടാക്കിയ കാശു കൊണ്ടുവന്ന് വെറുതെ തീ കത്തിച്ച് കളയണോ? ശരിക്കും പറഞ്ഞാൽ ഇതൊക്കെ ദൈവത്തിന് ഇഷ്ടമില്ലാത്ത കാര്യങ്ങളാണ്. നമുക്ക് അതിന്റെ ആവശ്യമില്ല. പിന്നെ, മക്കൾക്ക് അത്ര ആഗ്രഹമാണെങ്കിൽ എന്തെങ്കിലും അച്ഛൻ വാങ്ങിച്ചു തരാം. എന്ന് പറഞ്ഞുകൊണ്ട് കാര്യം ചെയ്തു കൊടുക്കണം. പിന്നെയും ഈ കാര്യങ്ങൾ പറയണം. ഇത് വെറും പാഴാണെന്നും, ഇത് അനാവശ്യ പരിപാടിയാണെന്നും, മനുഷ്യരായിട്ട് ഉപദ്രവം ചെയുന്നതാണെന്നും; ഇങ്ങനെയൊക്കെ പറഞ്ഞിട്ട് ചെയ്യണം. അങ്ങനെ പിള്ളേരുടെ മനസ്സ് സ്വാഭാവികമായിട്ട് തന്നെ, ഇത് വേണ്ട എന്നുള്ളത് വരും. അവർ തന്നെ പറയും, വെറുതെ ആവശ്യമില്ല. ഞാൻ അപ്പുറത്ത് പടക്കം പോയി നോക്കിക്കോളാം, അല്ലെങ്കിൽ കണ്ടോളാം. എന്നൊക്കെ പറഞ്ഞിട്ട് പതുക്കെ നമ്മളെത്തന്നെ അവർ അനുകൂലിച്ചു തരും. അങ്ങനെ കൊണ്ടുവരണം. ഒരുപാട് ആത്മീയമായിട്ടൊന്നും പറയേണ്ട ആവശ്യമൊന്നുമില്ല. ആത്മീയ സംശയങ്ങളും ആത്മീയ ചോദ്യങ്ങളും ഒക്കെ ചോദിയ്ക്കുന്ന അങ്ങനെയൊക്കെ ഉള്ള പിള്ളേർക്ക് ആത്മീയമായിട്ടുള്ള ഉത്തരം കൊടുത്താൽ മതി.</p>
            <p>സുജോ സാർ ഈ പറയുന്ന കാര്യങ്ങളൊന്നും ഒരു മതത്തിലും പെട്ടിട്ടുള്ളതല്ല. ഇപ്പോൾ, ഒരു ഒരു മുസ്ലിം ആയിട്ടുള്ള ഒരു കുട്ടി ജനിച്ചു. ആ മുസ്ലിം സ്ത്രീ ഭർത്താവുമായിട്ട് നമ്മുടെ മാർഗ്ഗത്തിൽ ആണെങ്കിൽ, അവർക്ക് - ആ കുട്ടിയ്ക്ക് വേണമെങ്കിൽ ക്രിസ്മസ് ആഘോഷിയ്ക്കാം, ദീപാവലി ആഘോഷിയ്ക്കാം, ഓണമാഘോഷിയ്ക്കാം. എന്തും ആ കുട്ടിക്ക് അനുവദനീയമാണ്. കാരണം, ഒരിയ്ക്കലും കൊച്ചുകുട്ടികളിൽ തിന്മ എന്ന് പറയുന്ന സാധനം താനേ വലിഞ്ഞു കയറുകയില്ല. മാതാപിതാക്കളിലൂടെ വരുന്ന തിന്മയേ കുട്ടികൾക്കുള്ളൂ. കുട്ടികൾ സ്വതന്ത്ര മനസ്സും സ്വതന്ത്ര ബുദ്ധിയുമായിട്ട്, സ്വന്തം കാലിൽ നിൽക്കുന്ന നിലയിലായാൽ മാത്രമേ അവർക്ക് സ്വതന്ത്രമായിട്ടുള്ള പൈശാചികത വരുകയുള്ളൂ. പ്രായപൂർത്തിയൊക്കായി, കോളേജിലും ഒക്കെ പഠിയ്ക്കുന്ന സമയത്ത് മാതാപിതാക്കൾ ഇല്ലാതെ സ്വന്തം ബുദ്ധിയിൽ കള്ളത്തരങ്ങളും കാര്യങ്ങളും ഒക്കെ ചെയ്തു തുടങ്ങുമ്പോഴാണ് കുട്ടികളിൽ തിന്മയാകുന്നത്. അല്ലാതെയുള്ള കൊച്ചു കുട്ടികൾ, അച്ഛനെയും അമ്മയെയും ആശ്രയിച്ച്, അവർ കൊടുക്കുന്ന ആഹാരം കഴിച്ച്, കരഞ്ഞും, നമ്മൾ വിരട്ടുമ്പോൾ കരഞ്ഞും ഇരിയ്ക്കുന്ന കൊച്ചുകുട്ടികൾക്കൊന്നും തിന്മ ഒന്നുമില്ല.  മാതാപിതാക്കളുടെ മനസ്സ് നോക്കിയിട്ടാണ് കുട്ടികളിൽ പൈശാചികത വരണോ കയറണോ എന്നൊക്കെ പദ്ധതിയിടുന്നത്.</p>
            <p>അപ്പോൾ, ഒരു കൊച്ചുകുട്ടിയെ അവിടെ നമ്മൾ തുടക്കത്തിൽ തന്നെ ജാതിയോ മതമോ ഒന്നുമില്ലാതെ മനുഷ്യനായിട്ട് വളർത്താൻ പഠിയ്ക്കണം. സമൂഹത്തിൽ മുസ്ലിം അപ്പുറത്തുണ്ടെങ്കിൽ, അവനും അവനാഘോഷിയ്ക്കും പോലെ ആഘോഷിയ്ക്കണം. ഇപ്പുറത്ത് ക്രിസ്ത്യാനി ഉണ്ടെങ്കിൽ, അതും ആഘോഷിപ്പിയ്ക്കണം. ആ കുട്ടിയുടെ മനസ്സനുസരിച്ച് അവനെ എല്ലാത്തിനും ഉൾക്കൊള്ളിപ്പിച്ച്, ഒരു മനുഷ്യനായിട്ട് വേണം, നമ്മൾ കൊച്ചുകുട്ടിയെ വളർത്തിക്കൊണ്ടുവരാൻ. ഇപ്പോൾ, ഈ പറഞ്ഞ പലരും, മതം ആയിട്ടാണ് കൊണ്ടുപോകുന്നത്. ഞാൻ ക്രിസ്ത്യാനി ആയതുകൊണ്ട് എന്റെ കുട്ടിയെ ഞാൻ ദീപാവലി ആഘോഷിയ്ക്കാൻ സമ്മതിയ്ക്കില്ല. മുസ്ലിം ആയതുകൊണ്ട് വിടില്ല. അപ്പോൾ, അവിടെ ആ കൊച്ചുകുട്ടിയിൽ വീണ്ടും മതമാണ് നമ്മൾ കുത്തിവെയ്ക്കുന്നത്. അത് തെറ്റ്!</p>
            <p>പിറന്നാൾ ചെറിയ രീതിയിൽ ആഘോഷിയ്ക്കണം. ഇപ്പോഴത്തെ ആഘോഷം മുഴവൻ ആൾക്കാരെ വിളിച്ച് പൊങ്ങച്ചം കാണിയ്ക്കലല്ലേ? അങ്ങനെ വരുമ്പോഴേയ്ക്കും, നമുക്ക് ഗുണത്തിന് പകരം ഒരുപാട് ദോഷമാകും. ആ കുട്ടിയുടെ സന്തോഷത്തിനു വേണ്ടിയിട്ട് വളരെ വേണ്ടപ്പെട്ടവർ, അതായത് നമ്മളായിട്ട് സ്ഥിരം ഇടപെടുന്ന ആൾക്കാരുണ്ടല്ലോ, കുടുംബത്തിലൊക്കെ കൂടിപ്പോയാൽ ഒരു അഞ്ചു പേർ അല്ലെങ്കിൽ പത്തു പേർ ഒക്കെ കാണും, അവരുമായിട്ട് വെറുതെ ഒരു ചെറിയ സന്തോഷം. അതിനൊന്നും ഒരു കുഴപ്പമില്ല, കുട്ടിയ്ക്ക് സന്തോഷമുള്ള കാര്യമല്ലെ? പക്ഷേ, ഇപ്പോഴത്തെ ബർത്ത്ഡേ ഒന്നും അങ്ങനെയൊന്നും അല്ലല്ലോ. മുഴുവനും ആടംബരവും, പൊങ്ങച്ചവും, അതിനു വേണ്ടിയിട്ട് ഒരു ബ്യൂട്ടി പാർലർ പോക്കും. സുജോ സാറിന്റെ വീടിന്റെ അടുത്ത് തന്നെ ഒരു വയസ്സുള്ള കൊച്ചിന്റെ ഒരു ബർത്ത്ഡേ ഉണ്ടായിരുന്നു. ബർത്ത്ഡേയ്ക്ക് വിളിച്ചു, വെറുതെ പോയി. പോയപ്പോഴത്തേയ്ക്കും, കൊച്ചിന്റെ അമ്മ വേറെ ഏതോ ഒരു സ്ത്രീ! അപ്പോൾ, സാർ അന്തം വിട്ട് നോക്കി; കുട്ടിയുടെ അമ്മ മുഖത്ത് പെയിന്റടിച്ച് - മേക്കപ്പിൽ മുങ്ങിയപ്പോൾ ആളു തന്നെ വെറെയായി. ഇങ്ങനെ ഒന്നും ആയി പോകരുത്. അത്രയേ ഉള്ളൂ.</p>
            <h4>വിദ്യാഭ്യാസം എന്തിന്?</h4>
            <p>ശരിയ്ക്കും പറഞ്ഞാൽ ഏ.ഐ. സർജറി നടത്തും എന്നല്ല, നടത്തുന്നുണ്ട്, നടന്നു എന്നൊക്കെയാണ് കേട്ടേക്കുന്നത്. യൂറോപ്യൻ രാജ്യങ്ങളിലൊക്കെ ഇങ്ങനെയൊക്കെ ഉള്ള കാലഘട്ടത്തിൽ ഇങ്ങനെയൊക്കെ വരുന്ന ആ ഒരു സാഹചര്യത്തിൽ നമ്മൾ എന്ത് ചെയ്യണം? നമ്മുടെ മക്കൾക്ക് എന്ത് ചെയ്യണം? എന്ന് വെച്ചാൽ "അയ്യോ! ജോലി പോയേ" എന്നല്ല ചിന്തിയ്ക്കേണ്ടത്. ഇനി കുട്ടി പഠിച്ചിട്ട് എന്ത്? ചെയ്യാൻ ജോലി കിട്ടില്ല! ശരിയ്ക്കും പറഞ്ഞാൽ ഈ പഠിയ്ക്കാൻ പോകുന്നത് ജോലിയ്ക്ക് വേണ്ടിയിട്ടാണോ, അല്ലെങ്കിൽ അറിവ് സമ്പാദിക്കാൻ വേണ്ടിയിട്ടാണോ? നമ്മൾ ചിന്തിയ്ക്കേണ്ടതുണ്ട്. പിന്നെ ദൈവം ഇതെല്ലാം പുറകോട്ട് ആക്കികൊണ്ടു വരികയാണ്. കഷ്ടപ്പെട്ട് പഠിച്ച്, ഒരു ജോലി കണ്ടെത്തി, ആ ജോലി ചെയ്യുക. ഇതാണ് ലക്ഷ്യമായിട്ട് എല്ലാവരും കൊണ്ടുനടക്കുന്നത്. ഇതാണോ ശരിയ്ക്കും ഒരു ആത്മീയർക്കുള്ളത്? കഷ്ടപ്പെട്ട് പഠിച്ച്, മാർക്ക് വേടിച്ച്, പിന്നെ ഒരു ജോലിയിലായി. ഇത്രയൊക്കെ ഉള്ളോ, ഒരു ഒരു മനുഷ്യന്റെ ജീവിതം? അല്ലല്ലോ. അപ്പോൾ, നമ്മളുടെ കുട്ടിക്കാലത്തെല്ലാം പഠിച്ചു. പിന്നെ എങ്ങനെയെങ്കിലും എത്തിപ്പിടിച്ച് ആ ജോലി കിട്ടി. എന്നാൽ പിന്നെ ജീവിയ്ക്കാം. വീട്ടിൽ പിന്നെ കല്യാണമായി സുഖമായി ഇങ്ങനെ. ശരിയ്ക്കും പറഞ്ഞാൽ നമ്മുടെ ലക്ഷ്യം എന്താണ്? നമ്മുടെ ലക്ഷ്യം എങ്ങനെയെങ്കിലും പഠിച്ച് ഒരു ജോലി കിട്ടി സന്തോഷമായിട്ട് ജീവിക്കുക: ഇത് മാത്രമാണോ? ഇതാണോ ദൈവം! ഇതിനു വേണ്ടിയിട്ടാണോ ദൈവം ഉദ്ദേശിച്ച് നമ്മളെ ഈ ഭൂമിയിലോട്ട് വിട്ടത്? അങ്ങനെയല്ലല്ലോ! എ.ഐ. വന്നു എന്ന് പറഞ്ഞാൽ അത് ഇങ്ങനെയൊക്കെ വന്ന്, നമ്മുടെയൊക്കെ ജോലി പോയി. ഇങ്ങനെയൊക്കെ ഉള്ളത് ശരിയ്ക്കും പറഞ്ഞാൽ ഇതിന്റെ പിന്നിൽ ദൈവത്തിന്റെ ഒരു കളി ഉണ്ടെന്നാണ് തോന്നുന്നത്.</p>
            <p>സ്കൂളിൽ പോകാൻ മടി കാണിയ്ക്കുന്ന പിള്ളേർ ശരിയ്ക്കും പഠിക്കാൻ ഇഷ്ടമില്ല, എന്നൊക്കെ പറഞ്ഞ് ഇങ്ങനെ ബഹളം കാണിക്കുന്നു. ആ പിള്ളർക്ക് ശരിയ്ക്കും ഉള്ള പ്രോത്സാഹനം കിട്ടാത്തത് ഒരു കാര്യം. പല കാരണങ്ങൾ ഉണ്ടാകാം. ഒരു പ്രോത്സാഹനം, അതായത് നീ മിടുക്കനാണ്, നീ ഇത്രയും പഠിച്ചില്ലേ, നിനക്ക് ഇതൊക്കെ അറിയാം, നീ പഠിച്ചു, അങ്ങനെയൊക്കെ ആകും. എന്ന് പറഞ്ഞ് ആ കുട്ടിക്ക് ഒന്നും അറിയില്ലെങ്കിലും പോലും, അവൻ പഠിയ്ക്കാനായിട്ട് വളരെ താഴെയായാൽ പോലും ആ കുട്ടിയെ പ്രോത്സാഹിപ്പിയ്ക്കണം. മാതാപിതാക്കൾ ആയാലും ശരി, പ്രത്യേകിച്ച് സ്കൂളിൽ ആ കുട്ടിയെ പ്രോത്സാഹിപ്പിയ്ക്കണം. ഇപ്പോൾ, അവൻ രണ്ടു മൂന്നു വിഷയത്തിൽ തോറ്റു പോയി എന്ന് വച്ചോളൂ. ഏതെങ്കിലും ഒരു വിഷയത്തിൽ ജയിച്ചാൽ പോലും, കണ്ടോ ആ വിഷയത്തിൽ നീ ജയിച്ചില്ലേ, എന്തുകൊണ്ട് തോറ്റു പോയി - നീ ശ്രദ്ധിയ്ക്കാത്തത് കൊണ്ടാണ്. എന്നൊക്കെ പറഞ്ഞ് കുട്ടിയെ പ്രോത്സാഹിപ്പിച്ചുകൊണ്ടിരിയ്ക്കണം. ഒരു കുട്ടിയ്ക്ക് ഇത്തിരി കഴിവ് കുറവാണെന്ന് പറയുമ്പോൾ തന്നെ: ഓ നീ ഇങ്ങനെയൊക്കെ തന്നെ, നീ ഗുണം പിടിക്കൂല്ല. എന്ന് പറഞ്ഞ് കുട്ടിയെ നമ്മൾ ഒരുമാതിരി കീഴ്പ്പോട്ടാക്കി കളയരുത്. നിനക്ക് നല്ല കഴിവുണ്ട്. പക്ഷേ നീ ഉഴപ്പുകയാണ്, നീ പഠിച്ചാൽ നീ ഇങ്ങനെയാവും, എന്നൊക്കെ പറഞ്ഞ് ആ കുട്ടിയെ നമ്മൾ പ്രോത്സാഹിപ്പിച്ചുകൊണ്ടിരിയ്ക്കണം. ഇത് പ്രത്യേകിച്ച് നമ്മൾ മാതാപിതാക്കൾ ചിന്തിയ്ക്കേണ്ടതാണ്.</p>
            <p>ശരിയ്ക്കും പറഞ്ഞാൽ നമ്മുടെ ഉദ്ദേശ്യം: ജോലി, പൈസ ഇതായിരിയ്ക്കരുത്. ഇപ്പോൾ ലോകം മുന്നോട്ട് പോയിക്കൊണ്ടിരിയ്ക്കുന്നത് അങ്ങനെയാണ്. ദൈവീക മാർഗ്ഗത്തിൽ നിൽക്കുന്നവർക്ക് ഇത് ശരിയായ ഒരു കാഴ്ചപ്പാടല്ല. അപ്പോൾ, പിള്ളേരെ പഠിപ്പിയ്ക്കേണ്ടത്; അവരുടെ അറിവ് തന്നെ പറഞ്ഞു കൊടുക്കുക. നമ്മൾ പഠിച്ചില്ലെങ്കിൽ നമുക്ക് അറിവുണ്ടാവില്ല. പല കാര്യത്തിലും നമ്മൾ മണ്ടരായി പോകും. പലരും നമ്മുടെ അടുത്ത് എന്തെങ്കിലും ചോദിയ്ക്കുമ്പോഴേയ്ക്കും, അയ്യോ എനിയ്ക്ക് അറിഞ്ഞു കൂടാ എന്നൊക്കെ പറയുമ്പോൾ അതൊരു നാണക്കേടല്ലേ? പിന്നെ എന്തെങ്കിലും ഒരു കണക്കോ എന്തെങ്കിലും ഒന്ന് പറയണം - മനസ്സുകൊണ്ട് പെട്ടെന്ന് കൂട്ടാനും കുറയക്കാനും. ഇങ്ങനെയൊക്കെ ആകുമ്പോൾ, മറ്റുള്ള ആൾക്കാരെയൊക്കെ മിടുക്കൻ എന്ന് പറയും, പക്ഷേ നമ്മൾ മാത്രം ഇങ്ങനെ ഇരിക്കും. ഇങ്ങനെയൊക്കെ പറഞ്ഞ് കൊടുക്കണം. നമ്മുടെ അറിവ് വർദ്ധിപ്പിയ്ക്കാനും; ഈ ലോകത്തിൽ എന്തെല്ലാം നടക്കുന്നു, എന്താണ് സംഭവിക്കുന്നത്, എന്നുള്ളതിനെ അറിയാനും; കൂടുതൽ കാര്യങ്ങൾ മറ്റുള്ള കൂട്ടുകാർ വഴിയായിട്ട് അറിയാനും; ഈ ലോകം എന്താണെന്നുള്ള ഒരുപാട് കാര്യങ്ങൾ നമുക്ക് അറിയാൻ വേണ്ടിയിട്ടാണ്; നമ്മൾ അറിവ് സമ്പാദിയ്ക്കാൻ വേണ്ടിയിട്ടാണ്; പഠിയ്ക്കുന്നത്. എന്നൊക്കെ പറഞ്ഞ്, മക്കളെ അവരെന്താ പറഞ്ഞത്, ഇതിലോട്ട് പ്രോത്സാഹിപ്പിയ്ക്കണം. നീ പഠിച്ച് എന്തെങ്കിലും ഒരു ജോലി - എന്തെങ്കിലും പൈസ വേണ്ടേ, നാലുപേരുടെ മുമ്പിൽ പോയി കൈനീട്ടേണ്ടെ, എന്നൊക്കെ പറയുമ്പോൾ, കുട്ടിയ്ക്ക് മറുപടി ഉണ്ട്. ഞാൻ ഇങ്ങനെ ചെയ്യും, ഞാൻ ഈ ജോലി കണ്ടെത്തി, ഞാൻ ഇങ്ങനെ പൈസ ഉണ്ടാക്കും. എന്ന് പറഞ്ഞ്, അവന്റെ ഉള്ളിന്റെ ഉള്ളിൽ ഒരു മറുപടി കാണും. അത് പറയാത്തതാണ്. പഠിച്ചു തന്നെ ജോലി കിട്ടണം എന്നുണ്ടോ? എത്രയോ പേര് പഠിക്കാതെ ഈ ജോലിയൊക്കെ ചെയ്യുന്നുണ്ടല്ലോ, അപ്പോൾ ഞാൻ അതുപോലെ ചെയ്യും എന്നു പറഞ്ഞു വരും. കാരണം എന്താണ്? പൈസയാണ് നിങ്ങൾ പ്രധാനമായിട്ടും ഇവിടെ പറഞ്ഞിരിയ്ക്കുന്നത്.  പിന്നെ ജോലിയും. എത്രയോ പേർ ഓട്ടോ ഓട്ടിയ്ക്കുന്നുണ്ടല്ലോ? അവരൊക്കെ എന്ത് പഠിച്ചേക്കുകയാണ്? എന്നൊക്കെ പിള്ളേർ ചോദിച്ചാൽ എന്ത് പറയും? അതുകൊണ്ട് പ്രധാനമായിട്ടും, പിള്ളേരുടെ അറിവും കഴിവും; ഇതിനെക്കുറിച്ച് പറയണം. നമ്മൾക്ക് നമ്മുടെ അനുഭവത്തിൽ നിന്നും നമ്മൾ മറ്റുള്ളവരെ കണ്ടുള്ള അനുഭവത്തിൽ നിന്നും നമുക്ക് കിട്ടിയ അറിവുണ്ടല്ലോ. വലിയ വലിയ മഹാന്മാരുടെ, വലിയ ആൾക്കാരുടെ ജീവിതമൊക്കെ ഉദാഹരണങ്ങൾ ഒക്കെ പറയണം. വലിയ ആൾക്കാർ എങ്ങനെയാണ് അവർ കഷ്ടപ്പെട്ട് പഠിച്ച് ഈ നിലയിൽ എത്തിയത് എന്നുള്ള ആ ചെറിയ കഥകളൊക്കെ പിള്ളർക്ക് പറഞ്ഞു കൊടുക്കണം. ജോലി, പൈസ ഇത് പ്രധാനമായിട്ടും പറഞ്ഞാൽ, പിള്ളർ തെറ്റും. പൈസ്ക്ക് വേണ്ടിയിട്ട് അവര് എന്തും ചെയ്യാനായിട്ടുള്ള ആ ഒരു രീതി വരും. കാരണം അമ്മയുടെ ആ ഒരു താത്പര്യം, അമ്മയുടെ ആ ഒരു ഒരു ഉദ്ദേശം പൈസയാണ് എന്നുള്ളത് പിള്ളേരുടെ മനസ്സിൽ ഉറച്ചതായി പോകുമല്ലോ! അങ്ങനെ ആയി പോകാൻ പാടില്ല.</p>
            <h4>എങ്ങനെ പെരുമാറണം?</h4>
            <p>കുട്ടികളോട് എപ്പോഴും മയത്തിൽ വേണം പെരുമാറാനായിട്ട്. മയത്തിലേ പറഞ്ഞു കൊടുക്കാവൂ; അതാണ് ഈ പിള്ളേരോട് സംസാരിയ്ക്കുന്ന രീതി. പിന്നെ, അവർ എന്ത് ചെയ്താലും നമ്മൾ ശ്രദ്ധിയ്ക്കണം. നമ്മൾ ശ്രദ്ധിയ്ക്കുന്നത് ആ കുട്ടിയ്ക്ക് പേടി തോന്നരുത് തന്നെ. എന്ത് ചെയ്താലും എന്റെ പിറകെ അമ്മ എന്നെ നിരീക്ഷിച്ചുകൊണ്ടിരിയ്ക്കുന്നുണ്ട്; ഇപ്പോൾ എനിയ്ക്ക് കിട്ടും; എന്ന ഒരു രീതിയിൽ പിള്ളേർ ചിന്തിയ്ക്കാൻ പാടില്ല. നമ്മൾ ശ്രദ്ധിയ്ക്കുന്ന മാതിരി ചെയ്യണം. പക്ഷേ ശ്രദ്ധിയ്ക്കുന്നില്ല എന്ന് ആയിരിയ്ക്കണം. ആ പിള്ളേർക്ക് മനസ്സിലാവേണ്ടത്, നമ്മൾ എല്ലാ കാര്യങ്ങളും ശ്രദ്ധിയ്ക്കുന്നുണ്ട്. പക്ഷെ, പിള്ളേർക്ക് അത് പിടി കിട്ടുന്നില്ല. ആ രീതിയിൽ ആയിരിയ്ക്കണം.</p>
            <p>ഒരു കുട്ടി എന്തെങ്കിലും ഒരു തെറ്റ് ചെയ്യുന്നു എന്ന് നിങ്ങൾ കണ്ടാൽ, അതിന എങ്ങനെ പറഞ്ഞു മനസ്സിലാക്കി കൊടുക്കണം? "നീ ചെയ്യരുത്" എന്നും പറഞ്ഞുകൊണ്ട് പേടിപ്പിച്ചാൽ, ആ കുട്ടി പേടിച്ചു പോകില്ലേ? അല്ലെങ്കിൽ, നിങ്ങൾ ഏതെങ്കിലും ഒരു പിരിമുദക്കത്തിൽ ആയിരിയ്ക്കും, അപ്പോഴായിരിയ്ക്കും കൊച്ചു വെറുതെ വന്ന് എന്തെങ്കിലും ചോദിച്ചുകൊണ്ടിരിക്കുന്നത്. "മിണ്ടാതിരിയ്ക്ക്" എന്ന് പറഞ്ഞാൽ അതിനെ നമ്മൾ ഇങ്ങനെ വിരട്ടിയാൽ പിന്നെ ആ കുട്ടി ഒരു സംശയവും ചോദിയ്ക്കാൻ വരില്ല. അമ്മയ്ക്ക് ദേഷ്യം വരും, എന്ന് പറഞ്ഞ് പേടിച്ചിരിയ്ക്കും. നമ്മുടെ ബന്ധം നമ്മുടെ രീതി അനുസരിച്ചാണ് ആ പിള്ളേര് പേടിയ്ക്കണോ, അല്ലെങ്കിൽ മനസ്സിലാക്കി പോണോ എന്നുള്ളത് അടങ്ങിയിരിയ്ക്കുന്നത്. എന്തെങ്കിലും ഒരു അബദ്ധം കാണിച്ചുപോയി. എന്തെങ്കിലും ഒരു തെറ്റ് പറ്റിപ്പോയി. വലിയ ഒരു തെറ്റാണ് എന്ന് പറയുമ്പോഴേയ്ക്കും ഒച്ചയിട്ട് "ആരടി നിന്നോട് ഇങ്ങനെ ചെയ്യാൻ പറഞ്ഞതെന്ന്  " പറഞ്ഞു ഒച്ചയിടുമ്പോഴേക്കും, കുട്ടി അങ്ങനെ ഞെട്ടിപ്പോകും. അതേസമയത്ത്, അതിന്റെ നന്മയുടെ വശം തിന്മയുടെ വശം പറഞ്ഞ്; നീ ഇങ്ങനെ ചെയ്യരുത് മോളെ, ചെയ്താൽ ഇത് ഇങ്ങനെ ആയി പോകും. അമ്മ എത്ര പ്രാവശ്യം പറയണം? എന്നൊക്കെ പറഞ്ഞ് ഇത്ര സ്നേഹത്തിലൊക്കെ പറയുമ്പോഴേയ്ക്കും, ചിലപ്പോൾ ആ കുട്ടി അത് കേൾക്കും.</p>
            <p>അലറേണ്ട ആവശ്യമൊന്നുമില്ല. അതായത്, പറഞ്ഞിട്ട് കേൾക്കുന്നില്ല. പലതവണ പറഞ്ഞിട്ട് കേൾക്കുന്നില്ലെങ്കിൽ നിങ്ങൾ എന്തെടുക്കണം എന്ന് വച്ചാൽ ; ഒരു ചെറിയ ഒരു ശിക്ഷ പോലെ കൊടുക്കണം. അവർക്ക് ഏറ്റവും ഇഷ്ടമുള്ള ഒരു കാര്യമായിരിയ്ക്കും. ആ കാര്യത്തിൽ നിങ്ങൾ കർശ്ശനമായിട്ട് പിടിയ്ക്കണം. ഞാൻ എത്ര തവണ പറഞ്ഞത് നീ കേട്ടില്ലല്ലോ, അതുകൊണ്ട് ഇന്ന് ഇത് വേണ്ട. കളിയോ, ടിവിയോ, മൊബൈലോ, എന്തെങ്കിലും ആയിരിയ്ക്കാം. ഇന്ന് ഇതില്ല കാരണം, അമ്മ പല തവണ പറഞ്ഞിട്ടും നീ ശ്രദ്ധിച്ചില്ല. അതുകൊണ്ട് ഇത് ഞാൻ അനുവദിയ്ക്കുന്നില്ല. അപ്പോൾ അവർ ഇങ്ങോട്ട് പറയും: "ഇല്ല അമ്മ! ഞാൻ ഇനി അനുസരിച്ചോളാം. ഞാൻ ചെയ്തോളാം." എന്ന് പറഞ്ഞാൽ, "ഞാൻ ഒരു പ്രാവശ്യം വിളിച്ചാൽ നീ വിളി കേൾക്കണം, ഞാൻ പറഞ്ഞാൽ നീ അനുസരിയ്ക്കണം. അങ്ങനെ ചെയ്തില്ല എങ്കിൽ ഇത് ഞാൻ നിനക്ക് അനുവാദം തരില്ല", എന്ന് പറഞ്ഞ് കർശ്ശനമായിട്ട് നിങ്ങൾ പോകണം. കാരണം നിങ്ങൾ ഈ അലറി സംസാരിക്കുന്നതുണ്ടല്ലോ; ചിലപ്പോൾ അമ്മ കിടന്ന് ഇങ്ങനെ ഒച്ച എടുക്കുന്നു എന്ന് പറഞ്ഞ്, പിള്ളേർ അത് നിർബന്ധമായിട്ട് അനുസരിയ്ക്കും. ഇത് ശരിയ്ക്കും പറഞ്ഞാൽ ഒരു ദൈവീക രീതിയല്ല. എന്തിനാണ് നമ്മൾ നമ്മുടെ ശക്തി അത്രയ്ക്കും നാശമാകുന്നത്? വേറെ വഴികളൊക്കെ ഉണ്ടല്ലോ. ചെറുതായിട്ട്, "ഇന്ന് നിന്നെ അവിടെ പോകാൻ ഞാൻ അനുവാദം തരില്ല, നീ അങ്ങോട്ട് പോകണ്ട", എന്ന് പറയണം. പക്ഷേ, അവന് ഇഷ്ടമുള്ള സ്ഥലമായിരിയ്ക്കും, കളിയായിയ്രിക്കും, മാച്ച് ആയിരിയ്ക്കും. പോകണ്ട, കാരണം നീ അനുസരിച്ചില്ല, എന്ന് പറഞ്ഞ് ഇത് തന്നെ ഒരു മൃദുവായ രീതിയിൽ ചെയ്താൽ അതല്ലേ നല്ലത്?</p>
            <h4>മനസ്സിനെ മനസ്സിലാകണം</h4>
            <p>ഭയം നമുക്ക് വരുന്നത് രണ്ടു രീതിയിലാണ്. ചെറുപ്പത്തിലേ കുഞ്ഞുങ്ങൾ ആയിരിയ്ക്കുമ്പോൾ വീട്ടിലെ അച്ഛനമ്മയുടെ കർക്കശം. അമ്മയായിരിയ്ക്കാം അച്ഛനായിരിയ്ക്കാം എന്തെങ്കിലും ഒരു കാര്യത്തിൽ തെറ്റിയാൽ പിന്നെ ഭയങ്കര കർശ്ശനമാണ്. അങ്ങനെ വരുമ്പോഴേയ്ക്കും ഒരു പേടി. അതുമല്ലാതെ അച്ഛൻ അമ്മ ഇവർ രണ്ടുപേരും തമ്മിൽ അടികൂടുന്നത്. അച്ഛന്റെയോ അമ്മയുടെയോ ശബ്ദം ഭയങ്കര ഉച്ചത്തിലായിട്ട് സംസാരിച്ച്. അങ്ങനെ ചിലപ്പോൾ അടിച്ചെന്ന് വരും. ഒക്കെ കാണുമ്പോഴേയ്ക്കും ആ സമയത്ത് വരുന്ന ഒരു പേടി. ഓരോ തരത്തിലുള്ള പേടിയ്ക്കും ഓരോ പരിഹാരമാണ്. ഇനി വേറെ ഒരു രീതിയിലുണ്ട് ഇത് പൈശാചികമായിട്ട് വരുന്ന പേടി. ഏതോ ഒരു സ്ഥലത്ത് ഒരു നിഴൽ കണ്ടു, അല്ലെങ്കിൽ എന്തോ എന്നെ പിടിയ്ക്കുന്ന മാതിരി വന്നു, രാത്രിയിൽ എന്റെ കഴുത്തിൽ പിടിയ്ക്കുന്ന മാതിരി വന്നു എന്നുള്ള പേടി. ഇത് പൈശാചികമായിട്ട് വരുന്ന പേടിയാണ് ഇതിന് വേറൊരു പരിഹാരം ഉണ്ട്. </p>
            <p>ആദ്യത്തേതിൽ ശരിയ്ക്കും പറഞ്ഞാൽ ഒരു മനഃശാസ്ത്രവിദഗ്ധന്റെ ആവശ്യം ഉണ്ട്. പക്ഷേ, ശരിയ്ക്കും പറഞ്ഞാൽ, ഇപ്പോൾ നമുക്ക് അതിന്റെ ആവശ്യം വരുന്നില്ല. കാരണം, നമ്മൾ തന്നെ അത് കണ്ടുപിടിച്ച് അതിനെ അതിജീവിയ്ക്കാവുന്നതേയുള്ളൂ. അതായത് അതിലോട്ടുള്ള ആ ഒരു ചികിത്സ ഇങ്ങനെയാണ് കാണിയ്ക്കുന്നത്. എവിടെ വച്ച് കുട്ടി പേടിച്ചു, അവരുടെ ആ രീതിയാണ്. കുട്ടിയെ ശരിയ്ക്ക് ബാധിച്ചത് അമ്മയാണോ അച്ഛനാണോ? എന്തിനാണ് പേടിച്ചത്? ഇങ്ങനെയുള്ള ആ ഒരു ചികിത്സ പോകും. അവർ അങ്ങനെയാണ് ചോദിയ്ക്കുന്നത്. ഓരോന്നും ചോദിച്ച് ഇത്ര വയസ്സായിരുന്നപ്പോൾ എന്തെങ്കിലും നിനക്ക് അനുഭവം ഉണ്ടോ എന്നിങ്ങനെ ചോദിച്ച്, കുട്ടി എവിടെ വെച്ച് പേടിച്ചോ ആ ഒരു സംഭവം ഉണ്ടല്ലോ, ആ ഒരു സാഹചര്യത്തിൽ പോയിട്ട് അതിനെ മനസ്സിലാക്കി കൊടുക്കണം. അതായത് ആ ഒരു സന്ദർഭം, അച്ഛൻ അമ്മയെ ദേഷ്യത്തിൽ അടിച്ചു. അത് കണ്ടിട്ടായിരിയ്ക്കും കുട്ടി പേടിയ്ക്കുന്നത്. ആ ഒരു സംഭവം ഉണ്ടല്ലോ കുട്ടിയുടെ  അബോധമനസ്സിൽ ഇങ്ങനെ കിടക്കും. അതിനെ പുറത്തു കൊണ്ടുവരണം. കൊണ്ടുവന്ന് ആ ഒരു സാഹചര്യത്തിൽ പോയിട്ട് ആ കുട്ടിയോട് പറയണം, ഇന്ന കാരണം കൊണ്ടാണ് അച്ഛൻ അങ്ങനെ ദേഷ്യപ്പെട്ടത്. ആ സമയത്ത് അതിന്റെ ആവശ്യം ഉണ്ടായിരുന്നു. അത് കഴിഞ്ഞിട്ട് അച്ഛൻ നല്ല അച്ഛനണ്, അച്ഛൻ എപ്പോഴും ആ ദേഷ്യക്കാരൻ അല്ല. അത് കഴിഞ്ഞുപോയി, അത് കടന്നുപോയി, ഇനി അത് ചിന്തിയ്ക്കരുത്. എന്ന് പറഞ്ഞ്, ആ കുട്ടിയെ പറഞ്ഞു മനസ്സിലാക്കി കൊടുത്ത്, അതിൽ പല ചികിത്സകൾ ഒക്കെ അവർ കൊടുക്കും. അതനുസരിച്ച് നമ്മൾ പോയി കഴിഞ്ഞാൽ, പിന്നെ ഓ അത് ഇങ്ങനെയായിരുന്നു അല്ലേ എന്ന് മനസ്സിലാക്കുന്നത് വരെ; അതിലോട്ട് അവർ പറയുന്നതുപോലെ ചെയ്തു പോകേണ്ടി വരും. ഇത് നമുക്ക് തന്നെ ചെയ്യാം എന്നുള്ളതേ ഉള്ളൂ. പക്ഷേ, ഏത് സമയത്ത് എങ്ങനെ എപ്പോൾ എന്നുള്ളത് നമുക്ക് അറിഞ്ഞുകൂടാ. അവര് ചോദ്യങ്ങൾ ചോദിയ്ക്കും, ചികിത്സയായി വരയ്ക്കാൻ തരും. അങ്ങനെയൊക്കെ ചെയ്തത് വഴിയായിട്ട് നമുക്ക് കണ്ടുപിടിയ്ക്കാൻ പറ്റും. ഇത് വഴിയായിട്ട് നമുക്ക് രോഗമോചനം ആകാനായിട്ട് പറ്റും. നേരായ രീതിയിൽ അവരോട് സഹകരിച്ചു പോയാൽ പറ്റും.</p>
            <p>മറ്റേ രീതിയിൽ, ഈ പിശാചിനെ പുറത്താക്കാനുള്ളത് ആത്മീയമായിട്ടുള്ള അച്ഛനമ്മയാണെങ്കിൽ പ്രാർത്ഥിച്ചാൽ മതി. പക്ഷേ, ഇന്ന് നമ്മൾ ന്യായവിധി ശിക്ഷയുടെ കാലത്ത് മിക്കതും വരുന്നത് ഈ തിന്മയുടെ ശക്തിയാണ്. തിന്മയാണ് നമ്മളെ ഇങ്ങനെയൊക്കെ പേടിപ്പിച്ചു നിർത്തുന്നത്. ഇപ്പോൾ തന്നെ അച്ഛൻ ദേഷ്യപ്പെട്ട് ഇങ്ങനെ ചെയ്തു എന്നൊക്കെ പറയുമ്പോൾ, അച്ഛനിൽ ഇരിയ്ക്കുന്നത് നന്മയുടെ ശക്തിയല്ലല്ലോ? അങ്ങനെ ചെയ്യുന്നതും ഒരു തിന്മയല്ലേ. ശരിക്കും പറഞ്ഞാൽ, മുഴുവനും ഈ പൈശാചികം വഴിയായിട്ട് വരുന്നതാണ്. നമ്മൾ ഇപ്പോൾ ചിന്തിയ്ക്കേണ്ടത്, അങ്ങനെയൊക്കെ വരുമ്പോൾ നമ്മുടെ ദൈവീകമായിട്ടുള്ള കാര്യങ്ങളൊക്കെ ചെയ്തു പോകുമ്പോൾ, ദൈവത്തിന്റെ ആ നിയമം പാലിച്ചും, വ്യവസ്ഥകളൊക്കെ പാലിച്ചും, അങ്ങനെയൊക്കെ അനുസരിച്ചു പോകുമ്പോൾ ആ പിശാചിന് അവിടെ നിലനിൽക്കാൻ പറ്റില്ല. അത് പതുക്കെ നമ്മളെ വിട്ട് പോയിക്കോളും. അതാണ് ഇപ്പോൾ നമ്മൾ ചെയ്യേണ്ടത്. പക്ഷേ ശരിയ്ക്കും സാധാരണക്കാർ ചെയ്യുന്നത്, നേരത്തെ പറഞ്ഞതുപോലെ അവർക്ക് ഒരു ചികിത്സ ആവശ്യമുണ്ട്. അതുവഴിയായിട്ട് പോയ അവർ അത് മനസ്സിലാക്കി, അതിൽ നിന്ന് വിട്ട് സാധാരണയായിട്ട് വരാനുള്ള ഒരു സഹായം ചെയ്യുന്നുണ്ട്. ഇപ്പോഴും അതൊക്കെ ഉണ്ട്; അതും ഒരു സഹായം തന്നെ. പക്ഷേ ഇപ്പോൾ നമുക്ക് ആവശ്യം, ആ തിന്മയുടെ ശക്തിയെ എങ്ങനെ പുറത്താക്കാം എന്നതാണ്. എന്നാലേ നമ്മൾ പൂർണ്ണ സ്വതന്ത്രർ ആവുകയുള്ളൂ. അതിന് ദൈവത്തിന്റെ വ്യവസ്ഥകൾ പാലിയ്ക്കണം പ്രത്യേകിച്ച് അച്ഛനമ്മ പാലിയ്ക്കണം.</p>`

            "ധ്യാന മാർഗ്ഗവും മതഗ്രന്ഥങ്ങളുടെ പ്രസക്തിയും: കുടുംബ ഉത്തരവാദിത്വങ്ങൾ ഉപേക്ഷിച്ച് മണിക്കൂറുകളോളം വെറുതെ ഇരിക്കുന്ന കപട ധ്യാനങ്ങളിൽ കുടുങ്ങരുത്. സ്രഷ്ടാവായ ദൈവവുമായി ആത്മാവ് ബന്ധപ്പെടുകയാണ് പ്രധാനം. ഭഗവദ്ഗീത, ബൈബിൾ, ഖുർആൻ എന്നിവ വായിച്ച് മനസ്സിലാക്കിയാലേ സ്രഷ്ടാവായ ദൈവത്തിന്റെ സ്വഭാവം വ്യക്തമാകൂ."

        conclusion: "എത്ര ജന്മം എടുത്താലും ദൈവം ആത്മാവിനെ സ്നേഹിക്കുന്നതിനാൽ ഭൂമിയിലിട്ട് പഠിപ്പിച്ച് നന്നാക്കിയെടുക്കും. നമുക്ക് ലഭിച്ച ശ്വാസത്തിനും ശരീരത്തിനും സകല അനുഗ്രഹങ്ങൾക്കും സ്രഷ്ടാവായ ദൈവത്തോട് നന്ദിയും പൂർണ്ണ സ്നേഹവും ഉള്ളവരായി പ്രകൃതിയുടെ വ്യവസ്ഥകൾ പാലിച്ച് മുന്നോട്ടു പോവുക.",
        fullContentHtml: `<p><strong>പഠന സംഗ്രഹം</strong><br>2026 നവംബർ 3, ചൊവ്വാഴ്ച<br><strong>വിഷയം:</strong> പ്രകൃതിയുടെ വ്യവസ്ഥകളെല്ലാം തിരിച്ചറിഞ്ഞു...ഇനി എങ്ങനെ പ്രാവർത്തികമാക്കാം..?</p><p>എത്ര ജന്മം എടുത്താലും ആത്മാവിനെ ദൈവം സ്നേഹിയ്ക്കുന്നതിനാൽ, ദൈവം ഭൂമിയിലിട്ട് പഠിപ്പിച്ചു പഠിപ്പിച്ച് നന്നാക്കി കൊണ്ടുപോയിരിയ്ക്കും. ഇനി പറയൂ, ദൈവത്തിന് ആത്മാവിനോട് സ്നേഹമില്ലേ?</p><h4>ദിനചര്യ</h4><p>സൂര്യൻ ഉദിയ്ക്കുമ്പോൾ നമ്മൾ നമ്മുടെ ജോലികൾ തുടങ്ങണം, സൂര്യൻ അസ്തമിയ്ക്കുമ്പോൾ അതെല്ലാം അവസാനിപ്പിയ്ക്കുകയും ചെയ്യണം. ഇപ്പോൾ നമ്മൾ ഏഴു മണിയ്ക്കല്ലേ ഇത് (പഠനം) വെച്ചേക്കുന്നത്? അപ്പോൾ നമ്മൾ ബാക്കിയുള്ള ജോലിയും കാര്യങ്ങളും ഒക്കെ ഒതുക്കി വച്ചിട്ട്, വൈന്നേരം സമയത്ത് ദൈവീക ചിന്തകളും ദൈവീക കാര്യങ്ങളിലൊ ഇടപെടണം. പ്രാർത്ഥിയ്ക്കാൻ സമയം കണ്ടെത്തണം. രാത്രി സമയങ്ങളൊക്കെ അതിനുവേണ്ടി ഉപയോഗിയ്ക്കണം.</p><h4>ഉറക്കം</h4><p>ഒരു ആത്മീയന് ശരിയ്ക്കും രാത്രി ഇത്ര മണി വരെ ഉറങ്ങണമെന്ന് നിർബന്ധമൊന്നുമില്ല എന്ന് മനസ്സിലാക്കണം. ആത്മീയൻ എന്ന് ഞാൻ ഉദ്ദേശിയ്ക്കുന്നത്, ആത്മാവ് നയിച്ചുകൊണ്ട് പോകുന്ന ഒരു വ്യക്തിയുടെ കാര്യം. ആ വ്യക്തിയുടെ പൂർണ്ണ മനസ്സും ബോധവും എല്ലാം ആത്മാവിന്റെ നിയന്ത്രണത്തിൽ ആയിരിയ്ക്കും. ആത്മാവിൽ നിന്നുള്ള ദർശ്ശനവും കാര്യങ്ങളും സദാ എപ്പോഴും പ്രാർത്ഥനയിലൂടെ കണ്ടു മനസ്സിലാക്കാം, ഉള്ളിലൂടെ ശബ്ദരൂപേണെ കാര്യങ്ങൾ കേട്ട് മനസ്സിലാക്കാം. അങ്ങനെയുള്ള ഒരു വ്യക്തിയ്ക്ക് ഈ ഉറക്കം എന്നുള്ള സാധനം നിർബന്ധമുള്ള കാര്യമല്ല.</p><p>ശരിയ്ക്കും ദൈവം പ്രകൃതിയിൽ ഉറക്കം വെച്ചിരിയ്ക്കുന്നത്, ആത്മാവിന് നമ്മളോട് - നമ്മുടെ ബോധ മനസ്സിലേയ്ക്ക് - നമ്മളുടെ തലച്ചോറിലോട്ടൊക്കെ ആശയവിനിമയം ചെയ്ത് പല കാര്യങ്ങളും സൂക്ഷിച്ച് വെയ്ക്കാനാണ്. അപ്പോൾ, ആ സമയത്ത് നമ്മൾ ബോധം വിട്ടു പോയിട്ട് ഉറങ്ങി കൊടുത്താലേ, ആത്മാവിൽ നിന്നുള്ള നിർദ്ദേശങ്ങൾ നമ്മുടെ തലച്ചോറിലോട്ട് നിറഞ്ഞു വരികയുള്ളൂ. അതുകൊണ്ടാണ് ഈ ഉറക്കം നിർബന്ധം എന്ന് പറയുന്നത്. നമുക്ക് ഉറങ്ങാൻ പറ്റുന്നില്ല എങ്കിൽ, അതിനർത്ഥം, തിന്മയുടെ ശക്തികൾ നമ്മുടെ ആത്മാവിൽ നിന്നുള്ള ആശയവിനിമയം കിട്ടാത്ത തലത്തിൽ നമ്മളെ തടസ്സപ്പെടുത്തുന്നു. അങ്ങനെ ഒരു വ്യക്തിയ്ക്ക് മാനസികമായ പ്രശ്നങ്ങളും പല കാര്യങ്ങളും വരും, നിലവിട്ടു പോകും. ആത്മാവിൽ നിന്നുള്ള നിർദ്ദേശങ്ങൾ കിട്ടാതെ ആ വ്യക്തിയ്ക്ക് മുന്നോട്ട് പോകാൻ പറ്റില്ല. അപ്പോൾ, നിർബന്ധമായിട്ട് രാത്രി ഉറങ്ങിയിരിയ്ക്കണം. ഇല്ലെങ്കിൽ അത് പ്രശ്നമാണ്. അല്ലെങ്കിൽ ആദ്യം പറഞ്ഞതുപോലെ സദാസമയം ധ്യാനത്തിലൂടെ എപ്പോഴും വേണമോ ആത്മാവുമായിട്ട് സംഭാഷണം ചെയ്യുന്ന ഒരു വളർച്ച വന്ന ഒരാളായിരിയ്ക്കണം. എങ്കിൽ കുഴപ്പമില്ല.</p><p>പകൽ ഉറങ്ങുന്നത് കുറച്ച് പൈശാചികത നമ്മളിലേയ്ക്ക് കൂട്ടും, അത്രയേ ഉള്ളൂ. എത്രത്തോളം പകൽ ഉറങ്ങുന്നു അത്രത്തോളം നമ്മൾ പൈശാചികം ആയികൊണ്ടിരിയ്ക്കും. അതിന്റേതായിട്ടുള്ള ഫലങ്ങൾ ചിലപ്പോൾ അന്നോ പിറ്റേന്നോ അതിന്റെ വ്യത്യാസം അനുഭവിയ്ക്കേണ്ടി വരും. കുഴപ്പം ഉണ്ടോ എന്ന് ചോദിച്ചു കഴിഞ്ഞാൽ, അത് കുഴപ്പമാണ്. പക്ഷേ സുജോ സാർ പോലും മിക്ക ദിവസങ്ങളിലും അങ്ങനെ കിടന്നു പോകാറുണ്ട്. കാര്യം, നല്ല ക്ഷീണവും ആഹാരം കഴിച്ചു കഴിയുമ്പോഴത്തേയ്ക്കും ഒരു മയകം പോലെയൊക്കെ വരും. വരുമ്പോൾ, കിടക്കുമ്പോൾ വെറുതെ ഒന്ന് മയങ്ങാറുണ്ട്. പക്ഷേ ദൈവം പറയുന്നു, അങ്ങനെ ചെയ്യരുത്. അങ്ങനെ, അതിന്റെ ആവശ്യമില്ല. ആ സമയത്ത് നമ്മൾ കുറച്ച് പൈശാചികം ആയിപ്പോകും.</p><p>ഈ പറഞ്ഞതുപോലെ, പകലുറക്കം ശരിയ്ക്കും പൈശാചിക ശക്തികൾ കൈകാര്യം ചെയ്യുന്ന ഒരു പരിപാടിയാണ്. അത് പ്രകൃതിയുടെ വ്യവസ്ഥയ്ക്ക് എതിരാണ്. പകൽ സൂര്യൻ ഉണർവായിരിയ്ക്കുന്ന സമയത്ത് നമ്മൾ ഉറങ്ങുക എന്നുള്ളത് ശരിയല്ല. ആ സമയത്ത് നമ്മളുടെ ആത്മാവ് കുറച്ച് ബലപ്പെട്ട ആത്മാവാണെങ്കിൽ, നമുക്ക് ചെറിയ ശിക്ഷ ആ സമയത്ത് കിട്ടും. ഇപ്പോൾ സുജോ സാറിന് ഉള്ളതുപോലെ തന്നെയാണ് ഗ്രൂപ്പിൽ ഒന്ന് രണ്ടുപേരും പറഞ്ഞത്. സുജോ സാർ പകൽ ആഹാരം കഴിച്ചിട്ട് വെറുതെ ഒന്ന് വിശ്രമിച്ചാൽ കുഴപ്പമില്ല. പക്ഷെ ഒന്ന് ഉറങ്ങിപ്പോയാൽ പിന്നെ അന്ന് രാത്രി വരെ നല്ല തലവേദന ആയിരിയ്ക്കും. ഈ പകൽ ഉറങ്ങിയതിന്റെ ആ ഒരു കർമ്മം തെറ്റിയതിന്റെ ഫലം വേദനയിലൂടെ അനുഭവിച്ചു തീരേണ്ടി വരും.</p><h4>സ്ത്രീകളിലൂടെ വരുമാനം</h4><p>ഈ പറയുന്ന വ്യവസ്ഥകൾ കൃത്യമായി പാലിച്ചിട്ട് സ്ത്രീകൾക്ക് വേറെ വരുമാന മാർഗ്ഗത്തിന് പോകാം, കുഴപ്പമൊന്നുമില്ല. ഒന്ന് രാവിലെ ഉറക്കൊമൊഴിക്കുക. രാവിലത്തെ ആഹാരം രാവിലെ ഉണ്ടാക്കുക. അതിനുശേഷം പ്രാർത്ഥനയും അങ്ങനെയുള്ള കാര്യങ്ങളൊക്കെ ചെയ്യുക. വീണ്ടും ഉച്ചയ്ക്കുള്ള ആഹാരം അടുത്ത പാചകം ചെയ്യുക. ഉച്ചയ്ക്കുള്ള ആഹാരം പാചകം ചെയ്യുമ്പോഴും രാവിലത്തെ ആഹാരം പാചകം ചെയ്യുമ്പോഴും അതിന്റെ ബാക്കി എന്തായാലും കാണുമായിരിക്കുമല്ലോ; അത് രാത്രിയിലേയ്ക്ക് ക്രമീകരിയ്ക്കാം. വീട് രാവിലെ എവിടെയെങ്കിലും അഴുക്കോ ചവറോ ഒക്കെ ഉണ്ടെങ്കിൽ, എല്ലാം തൂത്ത് വൃത്തിയാക്കി എടുക്കുക. അന്നന്നുള്ള മുഷിഞ്ഞ തുണികൾ അന്നന്ന് കഴുകണം. ജോലിയ്ക്ക് പോകുന്ന ഭർത്താവാണെങ്കിൽ ഭർത്താവിന്റെ തുണികളും, മക്കളുടെ തുണികളും, സ്വന്തം തുണികളും അന്നന്നുള്ളത് കഴുകണം.</p><p>സന്ധ്യയ്ക്ക് മുമ്പ് തന്നെ ആഹാരം കഴിച്ച പാത്രങ്ങൾ, രാവിലത്തെ ആഹാരം കഴിച്ച പാത്രങ്ങൾ ഉച്ചക്ക് മുമ്പും, ഉച്ചക്ക് ആഹാരം കഴിച്ച പാത്രങ്ങൾ വൈകുന്നേരത്തിനു മുമ്പും, കഴുകി വൃത്തിയാക്കി വയ്ക്കുക. രാത്രിയലുള്ള ആഹാരത്തിന്റെ കാര്യങ്ങളെല്ലാം നേരത്തെ ആസൂത്രണം ചെയ്തു വെച്ചതുകൊണ്ട്, സന്ധ്യനേരത്ത് കുറച്ചു നേരം പ്രാർത്ഥനയും പിന്നെ ഇങ്ങനെയുള്ള ആത്മീയ കാര്യങ്ങളും ഗ്രഹിയ്ക്കലും ഒക്കെ ആയിട്ട് കുറച്ചുനേരം മുന്നോട്ടു പോവുക. ഭർത്താവ് വരുമ്പോൾ ഭർത്താവുമായിട്ട് കാര്യങ്ങൾ പങ്കുവയ്ക്കുക. മക്കൾ ഉണ്ടെങ്കിൽ മക്കളെ രാത്രി ഇരുന്ന് ശക്തമായിട്ട് അവരെ പഠിക്കാൻ സഹായിയ്ക്കുക. രാത്രി ആഹാരം നേരത്തെ ഉണ്ടാക്കി വച്ചിരുന്നതുകൊണ്ട് അത് രാത്രി കഴിയ്ക്കാൻ ക്രമീകരിയ്ക്കാം. ഉറങ്ങുന്നതിനു മുമ്പ് തന്നെ അടുക്കളയും പാത്രങ്ങളും മുതലായ സാധനങ്ങളും എല്ലാം ക്ലീൻ ആയിരിയ്ക്കണം. ഇത് മുടങ്ങുകയും ചെയ്യരുത്. ഭർത്താവ് നിർബന്ധിച്ച് വിടുന്നുണ്ടെങ്കിൽ മാത്രം, ഒരു സ്ത്രീ ഇത്രയും കാര്യങ്ങൾ ചെയ്തതിനു ശേഷം വേറെ വരുമാനത്തിന് വേണമെങ്കിൽ ജോലിയ്ക്ക് പോവുകയും ചെയ്യാം. കാരണം, ഭർത്താവിന് അത്രയും സാമ്പത്തികം ഉണ്ടാക്കാൻ കഴിവില്ലാത്ത ഒരാളാണെങ്കിൽ, ഭർത്താവ് ഭാര്യയുടെ അടുത്ത് ജോലി ചെയ്ത് കാശുണ്ടായി കൊണ്ടുവരാൻ പറയും. എങ്കിൽ ഭർത്താവിന്റെ കഴിവുകേട് കാരണം ഞാൻ പോകുന്നു എന്ന് ദൈവത്തോട് പ്രാർത്ഥിച്ചിട്ട് വേണം ജോലിയ്ക്ക് പോകാൻ. "എന്റെ ഭർത്താവ് ഒരു കഴിവില്ലാത്തവനാണ്. ഇത്രയേ പറ്റുന്നുള്ളൂ. അതുകൊണ്ട് ഞാനും കൂടെ വരുമാനം ഉണ്ടാക്കുന്നു.' കിട്ടുന്ന വരുമാനം കൊണ്ട് ഭർത്താവിന്റെ കയ്യിൽ ഏൽപ്പിയ്ക്കണം. ഇങ്ങനെ ചെയ്യാമെങ്കിൽ ഭാര്യയ്ക്ക് ജോലിക്ക് പോകാൻ ഒരു കുഴപ്പവുമില്ല.</p><p>ഭർത്താവ് വിരമിച്ച് വീട്ടിൽ ഇരിയ്ക്കുകയാണെങ്കിൽ, വേറെ വരുമാനം ഒന്നും ഇല്ലെങ്കിൽ, സ്ത്രീകൾ ജോലി ചെയ്യേണ്ടി വരും, കുഴപ്പമൊന്നുമില്ല. പക്ഷേ സ്ത്രീയുടെ കുറെ ജോലി ഭർത്താവിന് കൊടുക്കണം. വിരമിച്ച ഭർത്താവിന്റെ അവസ്ഥ വെച്ച് നോക്കുമ്പോൾ വേറെ ജോലിയൊന്നും ചെയ്യാൻ നിവൃത്തിയില്ല. അതിനുള്ള ആരോഗ്യം ഇല്ലെങ്കിൽ നമുക്ക് ഒന്നും ചെയ്യാൻ നിവൃത്തിയില്ല. അങ്ങനെയുള്ള ഭർത്താക്കന്മാരെ നമ്മൾ സഹായിയ്ക്കണം. എന്നാൽ അല്ല, ആരോഗ്യമൊക്കെ ഉണ്ട് വെറുതെ വീട്ടിൽ സുഖിയ്ക്കുകയാണെന്നുണ്ടെങ്കിൽ സ്ത്രീകളുടെ ജോലി കുറെ ഏൽപ്പിയ്ക്കുക. തുണി കഴുകിയ്ക്കുകയും, പാത്രം കഴുകിയ്ക്കുകയും, വീട് വൃത്തിയാക്കലും കൂടെ ഒക്കെ ഭർത്താവിനെ കൊണ്ട് ചെയ്യാൻ പറയണം. എന്നിട്ട് ഭാര്യ പോയി ജോലി ചെയ്ത് വരുമാനം കണ്ടെത്തണം.</p><h4>ധ്യാന മാർഗ്ഗം</h4><p>നമ്മുടെ കർമ്മത്തെ യഥാവിധം ചെയ്യാൻ സമ്മതിക്കാതെ ജന്മത്തെ വെറുതെ പാഴാക്കിക്കളയുന്ന ഒരു പൈശാചികശക്തി ഈ അന്ത്യകാലത്ത് ശക്തമായിട്ടുണ്ട്. ആ പൈശാചികശക്തിയുടെ പ്രത്യേകത എന്താന്ന് വെച്ചാൽ ഈ ധ്യാനം മെഡിറ്റേഷൻ എന്നൊക്കെ പറഞ്ഞ് ഓരോ വ്യക്തികളെ മണിക്കൂറോളം ഇരുത്തി, ആ ദിവസം പാഴാക്കിയും, ആ കുടുംബത്തിന്റെ കർമ്മങ്ങളെല്ലാം തെറ്റിയ്ക്കും. ഈ ജന്മം തന്നെ വെറുതെ പാഴാക്കി ആ ആത്മാവിനെ അടുത്തൊരു ജന്മം കൊടുക്കുന്ന മോക്ഷം കൊടുക്കാത്ത തലത്തിലേയ്ക്ക് വെറുതെ പാഴാക്കി കൊണ്ടുപോകുന്ന ചില ശക്തമായ പൈശാചികശക്തികൾ ഈ അന്ത്യകാലത്ത് ഈ കലിയുഗത്തിന്റെ അവസാനം ശക്തമായിട്ട് വന്നിട്ടുണ്ട്. അതുകൊണ്ട്, നമുക്ക് ധ്യാനം - ഇത് ശരി ഇത് കപടം എന്ന് കണ്ടുപിടിയ്ക്കാൻ പാടാണ്. കുടുംബത്തിന്റെ വ്യവസ്ഥകളെല്ലാം കൃത്യമായി പോകുന്നുണ്ട്, ആത്മീയ കാര്യങ്ങളെല്ലാം മനസ്സിലാകുന്നുണ്ട്, നമുക്ക് അത് സ്വന്തം അനുഭവത്തിലൂടെ അറിയാൻ പറ്റുള്ളൂ.</p><p>വീട്ടിൽ വിഷയങ്ങളില്ല. പ്രശ്നങ്ങളില്ല. ഭർത്താവും ഭാര്യയും എല്ലാവരും ഒരേപോലെ ഒരേ മനപ്പെട്ട് ഒരേ രീതിയിൽ വഴക്കും പ്രശ്നങ്ങളും ഒന്നുമില്ല. അതായത് മുഴുവൻ കുടുംബം നന്മ ആയിരിയ്ക്കണം. അങ്ങനത്തെ ഒരു കുടുംബത്തിലെ ഒരു വ്യക്തി ചിലപ്പോൾ ഒന്നോ രണ്ടോ മൂന്നോ മണിക്കൂറോ ഒക്കെ ധ്യാനിച്ച് ആ ഒരു അനുഭവത്തിലേയ്ക്ക് ഇരിയ്ക്കുന്നു എന്നുണ്ടെങ്കിൽ, അത് അതെ ശരിയാണ്. ഞാൻ കേട്ടിട്ടുള്ള പലയിടത്തും കുടുംബ വ്യവസ്ഥയേ മുഴുവനും തെറ്റാണ്. ഭാര്യ ഒരു വഴിയ്ക്കായിരിയ്ക്കും ചിന്താഗതി, ഭർത്താവ് വേറെ വഴിയ്ക്കായിരിയ്ക്കും. മക്കളുടെ രീതി വേറെ. തമ്മിൽ വിഷയങ്ങൾ, പ്രശ്നങ്ങൾ വഴക്ക്. ഇതിന് ഇടയിൽ കൂടെ നാലഞ്ചു മണിക്കൂർ ധ്യാനം. അതും മെഡിറ്റേഷൻ വെറുതെ ഇരിപ്പ്. ഒരാൾ സസ്യാഹാരി വേറൊരാൾ മാംസാഹാരി. ഇത് മൊത്തം തലതിരിഞ്ഞ വിഷയമാണ്. അപ്പോൾ, അതുകൊണ്ടാണ് ഈ അന്ത്യകാലത്ത് ദൈവം സുജോ സാറിലൂടെ അടിസ്ഥാനപരമായിട്ടുള്ള ഈ കാര്യങ്ങളൊക്കെ പറഞ്ഞു മനസ്സിലാക്കി കൊടുക്കുന്നത്. ഇത് മനസ്സിലാക്കുന്നവർ ഈ ധ്യാനത്തിലൂടെ ആളെ വിഡ്ഢിയാക്കുന്ന പൈശാചികശക്തികളെ ജയിച്ചു രക്ഷപ്പെട്ടുവരും.</p><p>സ്രഷ്ടാവായ ദൈവത്തെ തിരിച്ചറിഞ്ഞു കഴിഞ്ഞ പിന്നെ, നമ്മളുടെ പ്രാർത്ഥനാ രീതി നമ്മളുടെ ധ്യാനമൊ അല്ലെങ്കിൽ നമ്മൾ ദൈവവുമായിട്ട് സമ്പർക്കം ചെയ്യാനുള്ള ആ മാർഗം പലതും ആവാം. എങ്ങനെ വേണമെങ്കിലോ ആവാം. പക്ഷേ, എന്ത് ചെയ്യണം എന്ന് വച്ചാൽ, ആ ദൈവവുമായിട്ടുള്ള സമ്പർക്കം ആ ദൈവവുമായിട്ടുള്ള ബന്ധം വേണം. അതിനാണ് ഇവിടെ പ്രാധാന്യം. നമ്മൾ മനസ്സിനെ ശൂന്യമാക്കിക്കൊണ്ട് ആ ശൂന്യതയിൽ ഇരിയ്ക്കുക; അങ്ങനെ അതൊക്കെ പലർക്കും പല രീതിയിലാണ്. ചിലപ്പോൾ, അതുവഴിയായിട്ട് അവർ ദൈവത്തെ വാഴ്ത്തുകയാണോ, ദൈവത്തെ പ്രീതിപ്പെടുത്തുകയാണോ, അല്ലെങ്കിൽ സ്വയം പല മാറ്റങ്ങൾക്ക് വേണ്ടിയിട്ടാണോ, അത് ഓരോരുത്തരുടെയും രീതിയാണ്. പ്രധാനം എന്താന്ന് വച്ചാൽ: ആ ദൈവവുമായിട്ട് ഈ ആത്മാവ് ബന്ധം ആവുക. ഈ ആത്മാവ് ദൈവവുമായിട്ട് സംസാരിയ്ക്കുക. ആ ദൈവവുമായിട്ട് അലിഞ്ഞ് ഇഴുകിച്ചേരുക. ഇതാണല്ലോ പ്രധാനം. സോഫി ടീച്ചറുടെ രീതി എടുത്തു നോക്കിയാൽ: പ്രാർത്ഥിയ്ക്കാനോ - എന്തെങ്കിലും ദൈവമേ എന്ന് പറഞ്ഞു ഇരിയ്ക്കുമ്പോൾ തന്നെ വല്ലാതായിട്ട് കരച്ചിൽ; സാധാരണമല്ല ഏങ്ങി ഏങ്ങി ഇങ്ങനെ കരയും. ദൈവം നല്ലവനാണ് - ദൈവം നല്ലവനാണ് - ദൈവം നല്ലവനാണ്, എന്ന് പറഞ്ഞ് ഇങ്ങനെ ഏങ്ങി ഏങ്ങി കരഞ്ഞുകൊണ്ടേയിരിയ്ക്കും. അതേപോലെ ബൈബിളോ ഖുർആനോ ഒക്കെ വായിയ്ക്കാനായിട്ട് എടുക്കുമ്പോഴും ദൈവം എന്നൊക്കെ പറഞ്ഞ് അവിടെ ആ എഴുത്ത് കാണുമ്പോൾ തന്നെ, വിതുമ്പും. ഉള്ള് കിടന്ന് ഒരു വല്ലാത്ത ഒരു വിധത്തിൽ കരയും. ഇങ്ങനെ കരഞ്ഞിട്ട് കുറച്ചു നേരം കഴിയുമ്പോൾ, ഇതെല്ലാം ചെയ്തു കഴിയുമ്പോഴത്തേയ്ക്കും, ഏതോ വല്ലാത്ത ഒരു അവസ്ഥയിലാണ്. അതായത് എന്തൊക്കെയോ ഉള്ളിൽ സംഭവിച്ചു എന്നുള്ള ഒരു രീതി. പലർക്കും പല രീതിയിലാണ് ദൈവത്തെ, അവരോട് അവർ പ്രാർത്ഥിയ്ക്കുന്നത്. ദൈവത്തോട് അവർ സമ്പർക്കം ചെയ്യുന്നതൊക്കെ പല രീതിയിലാണ്. പക്ഷേ, കൃഷ്ണൻ പറഞ്ഞിട്ടുണ്ടല്ലോ മാർഗ്ഗം പലതായാലും നമ്മുടെ ലക്ഷ്യം ഒന്നായിരിയ്ക്കണം എന്ന്. അപ്പോൾ, നമ്മുടെ ലക്ഷ്യം ഒന്നായിരിയ്ക്കണം. ഏതു മാർഗം ഉപയോഗിച്ചാലും അത് ഓരോരുത്തരുടെ വ്യക്തിപരമാണ്.</p><h4>മത ഗ്രന്ഥങ്ങൾ എന്തിന്?</h4><p>സുജോ സാർ ഈ പറയുന്ന കാര്യങ്ങളെല്ലാം ഈ മതഗ്രന്ഥങ്ങളിലൊക്കെ ഉള്ള കാര്യങ്ങളാണ്. പുതിയതായിട്ട് ഒന്നുമില്ല. അത് ഏത്, അതിന്റെ വിശദാംശങ്ങൾ എങ്ങനെ, എന്നൊക്കെ ഉള്ളത് അവരവരുടെ ഗ്രന്ഥങ്ങളിലൂടെ വായിച്ച് മനസ്സിലാക്കണം, എന്ന് ദൈവം പറഞ്ഞിട്ടുണ്ട്. അതുകൊണ്ടാണ് അത് അറിഞ്ഞിരിയ്ക്കണം എന്ന് പറയുന്നത്. ഒരു ഹിന്ദു ഭഗവത്ഗീത വായിച്ച് അതിലെ കാര്യങ്ങൾ മനസ്സിലാക്കിയിരിയ്ക്കണം. ഇതൊന്നും ചെയ്യാത്തതുകൊണ്ടാണ് സുജോ സാറിലൂടെ ഇങ്ങനെയൊക്കെ പറയുന്നത്. ദൈവം പറയുന്നതാണ്, ഇതൊക്കെ മനസ്സിലാക്കിയിട്ട് ഇനി അത് വായിച്ചു നോക്കണം എന്ന്. അല്ലെങ്കിൽ, അവർക്ക് കൊടുത്തത് നഷ്ടമായില്ലെ? നിങ്ങൾക്ക് കൊടുത്ത ഒരു നല്ലൊരു വിശിഷ്ട ആഹാരം നിങ്ങൾ കഴിച്ചില്ല എന്ന് പറയുന്നത്, ശരിയ്ക്കും തെറ്റാണ്. അത് കൊടുത്തത് ദൈവമല്ലേ? അപ്പോൾ, ദൈവം ആദ്യം കൊടുത്ത സാധനം മാനിയ്ക്കാതെ നിൽക്കുന്നത് കൊണ്ടാണ് നിങ്ങൾക്ക് ഇത്രയും കഷ്ടങ്ങളും പ്രശ്നങ്ങളും ഒക്കെ വരുന്നത്. ദൈവം ഒരു കാര്യം ഒരാളിലൂടെ കൊടുത്താൽ, അത് ഭക്തിയോടുകൂടിയും, വളരെ ആഗ്രഹത്തോടെയും അത് ഭക്ഷിയ്ക്കണം. അപ്പോൾ ആദ്യം അത് ഭക്ഷിയ്ക്കൂ.</p><p>ഈ മൂന്ന് ഗ്രന്ഥങ്ങളും നല്ലരീതിയിൽ കേട്ടും വായിച്ചും മനസ്സിലാക്കി എടുത്താൽ, സ്രഷ്ടാവാം ദൈവത്തിന്റെ സ്വഭാവം, ആ മനസ്സ്, നമുക്ക് വ്യക്തമാകും. അത് വ്യക്തമാവാത്ത ആർക്കും മോക്ഷം കിട്ടില്ല. അതാണ് പ്രശ്നം. അല്ലെങ്കിൽ കിട്ടും, നന്മയുടെ ഒരു വലിയ തലത്തിലോട്ടൊന്നും പോകില്ല. ഒരു ഭക്തൻ പോകുന്ന ഒരു തലമുണ്ട്, ആ ഒരു ചെറിയ തലത്തിലോട്ട്. അത് സ്വർഗ്ഗം തന്നെയാണ് ആ തലത്തിലോട്ട് പോകും. വലുത് വേണം എന്ന് ആഗ്രഹിയ്ക്കുന്നവർക്ക് വലുതിന് വേണ്ട തലത്തിലേയ്ക്ക് വളർന്നു വന്നേ പറ്റൂ.</p><p>നമുക്ക് മഹാഭാരതവും രാമായണവും ഒക്കെ വായിയ്ക്കാം. വായിക്കേണ്ട എന്നല്ല. പക്ഷേ, ഈ മറ്റു ഗ്രന്ഥങ്ങളിലൂടെ കൃഷ്ണന്റെ ഉപദേശത്തിലൂടെ ഭഗവത്ഗീത, ബൈബിൾ, ഖുർആൻ ഇതിലൂടെ ഒക്കെ വ്യവസ്ഥകളും കാര്യങ്ങളും എല്ലാം നല്ല രീതിയിൽ മനസ്സിലാക്കിയിട്ട്, നമ്മൾ മഹാഭാരതം വായിച്ചു നോക്കിയാലുണ്ടല്ലോ! നമ്മൾക്ക് ചിത്രം മുഴുവൻ മാറിപ്പോകും. മൊത്തം തെറ്റായിരിയ്ക്കും. കൃഷ്ണൻ തമ്മിൽ അടിപ്പിച്ച് മൊത്തത്തിനെയും നശിപ്പിച്ചു കളഞ്ഞത് എന്തിനാണെന്ന് അപ്പോഴേ പിടികിട്ടുകയുള്ളൂ.</p><h4>സുജോ സാറിന്റെ അനുഭവം</h4><p>"ഞാൻ ചെറുപ്രായം മുതൽ അമ്പലത്തിലോ പള്ളിയിലോ ഒരിടത്തും ഒന്നും പോകാറില്ല. കാരണം എന്റെ ഉള്ളിലൂടെ ഒരു സംസാരം ഉണ്ട്. അത് ചെയ്യരുത് - ഇത് ചെയ്യരുത് - അങ്ങനെ ചെയ്യണം - ഇങ്ങനെ ചെയ്യണം. അപ്പോൾ അതനുസരിച്ച് ഞാൻ അങ്ങനെ പോയിപ്പോകും. ഒരു ലെവൽ കഴിഞ്ഞ് പ്രായപൂർത്തി - ഒരു കോളേജിലൊക്കെ പഠിയ്ക്കുന്ന സമയമായപ്പോൾ, എന്റെ ഉള്ളിലൂടെ കിട്ടുന്ന കാര്യങ്ങൾ ഒന്നും എനിയ്ക്ക് അങ്ങോട്ട് ഉൾക്കൊള്ളാൻ പറ്റുന്നില്ല. കാരണം, എല്ലാവരെയും പോലെ ജീവിയ്ക്കാൻ പറ്റില്ല. എനിയ്ക്ക് എല്ലാവരെയും പോലെ ജീവിയ്ക്കണം. എന്റെ ഫ്രണ്ട്സിനെ പോലെയൊക്കെ എനിയ്ക്ക് ജീവിയ്ക്കണം. അപ്പോൾ, ഞാൻ അത് മൈൻഡ് ചെയ്യാതെയായി. എന്നിട്ട് എന്റെ ഇഷ്ടം തന്നെ ജീവിക്കാൻ തുടങ്ങി. കുറെ നാൾ കഴിഞ്ഞ് ഒരു പത്ത് വർഷത്തോളം ഒക്കെ വലിയ കുഴപ്പമില്ല. അത് കഴിഞ്ഞിട്ട് എന്റെ എല്ലാ മേഖലകളിലും തടസ്സങ്ങൾ വരാൻ തുടങ്ങി. അപ്പോൾ, എന്റെ ഉള്ളിലൂടെ സംസാരത്തെ വീണ്ടും ഞാൻ ശ്രദ്ധിയ്ക്കാൻ തുടങ്ങി. എന്തുകൊണ്ട് എനിയ്ക്ക് ഇങ്ങനെ? എന്തേ എന്നെ സഹായിയ്ക്കാത്തത്? എന്നൊക്കെ പറഞ്ഞപ്പോൾ. "നീ എന്നെ അന്വേഷിയ്ക്കണം.' എന്ന് കിട്ടി. ഞാൻ എവിടെ അന്വേഷിയ്ക്കണം എന്ത് അന്വേഷിയ്ക്കണം എന്ന് പറഞ്ഞപ്പോൾ. "എല്ലാ മതങ്ങളിലൂടെയും അന്വേഷിയ്ക്കണം." ആദ്യം ഹിന്ദു മതം. അപ്പോൾ എനിക്ക് ഹിന്ദു മതത്തിലാണ് ഫസ്റ്റ് വന്നത്. കാര്യം ഞാൻ തുടക്കത്തിലേ പോകുന്നത് ഇങ്ങനെയുള്ള വിഗ്രഹങ്ങളിലൂടെ ഒക്കെ. അപ്പോൾ, എനിയ്ക്ക് ഒരുപാട് സംശയങ്ങൾ ഉണ്ടായി. അതാര് - ഇതെന്ത് - ഇതെന്തിന് - പിന്നെ ഭൂമിയിലെ മനുഷ്യരുടെ ജീവിതം വെച്ചിട്ട് സംശയങ്ങൾ. ഇപ്പോൾ ഇതെല്ലാം എനിയ്ക്ക് പറഞ്ഞു തരാൻ തുടങ്ങി. ഇതെല്ലാം പറഞ്ഞുതന്ന് അടിസ്ഥാനപരമായിട്ട് കുറെ കാര്യങ്ങൾ മനസ്സിലാക്കിയതിനു ശേഷം, ദൈവം പിന്നെ എന്റെ അടുത്ത് പറഞ്ഞത് നീ ഭഗവത്ഗീത വായിയ്ക്കണം. അല്ലെങ്കിൽ ബൈബിൾ വായിയ്ക്കണം. കാരണം ഞാൻ ആ സമയത്ത് ഹൈന്ദവ രീതിയിൽ പോയി കറങ്ങി കറങ്ങി എനിയൊന്നും പിടി കിട്ടുന്നില്ല, ഒന്നും മനസ്സിലാകുന്നില്ല. ചില ആശ്രമത്തിലേക്ക് പോയി ചില സ്വാമിമാരുടെ അടുത്തൊക്കെ ചോദിയ്ക്കുമ്പോൾ, അവർ പറയുന്ന കാഴ്ചപ്പാട് എന്റെ അകത്ത് അത് ഉൾക്കൊള്ളില്ല. അകത്തു നിന്ന് ഇത് ശരിയല്ല ശരിയല്ല എന്ന് പറഞ്ഞു തരും. എന്റെ ആത്മാവ് പറയുന്നതാണ്, അടുത്തയിടത്ത് പോകും. അങ്ങനെയൊക്കെ പോയിട്ട് ഒന്നും ഒരു ക്ലിയർ ആവാത്തതിനു ശേഷമാണ് ദൈവത്തോട് ഞാൻ ഇരുന്ന് ചോദിച്ച് ഓരോ കാര്യങ്ങൾ പറയാൻ തുടങ്ങിയത്.</p><p>അപ്പോൾ, ആ സമയം ഞാൻ ഈ പെന്തകോസ്ത് മേഖലയിലായിരുന്നു. പെന്തക്കോസ്ത് മേഖലയിൽ നിൽക്കെയാണ് ഞാൻ യേശുവിനെ കാണുന്നതും, യേശു നേരിട്ട് വന്ന് കുറെ കാര്യങ്ങൾ പറഞ്ഞു തരുന്നതും. പല കാഴ്ചകൾ എനിയ്ക്ക് കാണിച്ചു തന്നു, അങ്ങനെ ഒരുപാട് അനുഭവം ഉണ്ടായി. അതിനുശേഷമാണ്, എനിയ്ക്ക് ഉള്ളിലൂടെ ദൈവത്തിൽ നിന്നുള്ള പല പല പുതിയ പുതിയ കാര്യങ്ങൾ അന്ത്യകാലത്തെക്കുറിച്ചും കൂടുതൽ എനിയ്ക്ക് കിട്ടി. കിട്ടിയിട്ടുള്ള അത്രയും ബൈബിളിലെ വെളിപാട് പുസ്തകത്തെക്കുറിച്ചാണ്. “അതാണ് നീ അറിയേണ്ടത് നീ ആദ്യമേ വായിക്കേണ്ടത്" അതാണെന്ന് കിട്ടിയത്. ആദ്യം ഞാൻ ബൈബിൾ വായിച്ചു തുടങ്ങുന്നത് വെളിപാട് പുസ്തകമാണ്. വെളിപാട് പുസ്തകത്തിൽ വന്നപ്പോൾ എനിയ്ക്ക് ഒന്നും പിടിക്കുന്നില്ല. അപ്പോൾ, ഓരോന്നും ഞാൻ സംശയങ്ങൾ ചോദിയ്ക്കാൻ തുടങ്ങി. അതെന്തിനാണ് അന്ത്യകാലത്ത് അതങ്ങനെ - ഇതങ്ങനെ - എന്റെ മനസ്സിൽ തന്നെ ഒരുപാട് സംശയം വരാൻ തുടങ്ങി. അപ്പോൾ, ഇതെല്ലാം ദൈവം എനിയ്ക്ക് പറഞ്ഞു തന്നു. പുതിയ കാലഘട്ടം പുതിയ ആകാശം പുതിയ ഭൂമി - സത്യയുഗം ഇതെല്ലാം വച്ചിട്ട് ഓരോ കാര്യങ്ങൾ പറയാൻ തുടങ്ങി. ഇതെല്ലാം കഴിഞ്ഞതിനുശേഷം ദൈവം എന്റെ അടുത്ത് പറഞ്ഞത്. "നീ ആദ്യം ബൈബിൾ വായിയ്ക്കുക. എനിയ്ക്കാണെങ്കിൽ ഇതുപോലെ ഒരു ബുദ്ധിമുട്ട്! കാരണം, ഞാൻ പഠിയ്ക്കുന്ന കാലത്ത് പോലും ബുക്ക് വായിച്ച് പഠിച്ച് ശീലം എനിയ്ക്കില്ല. അതുകാരണം, വായിച്ചെടുക്കാൻ ഭയങ്കര പാടാണ്. എന്നാലും കുത്തിയിരുന്ന് ഞാൻ ഏതാണ്ടൊക്കെ വായിച്ചു. പിന്നെ എന്റെ അടുത്ത് പറഞ്ഞു. ഭഗവത്ഗീത വായിയ്ക്കുക. ഇതിന്റെ ആവശ്യം എന്ത്? എനിയ്ക്ക് ദൈവം കാര്യങ്ങൾ പറഞ്ഞു തന്നല്ലോ! അപ്പോൾ ഇനി ഞാൻ ഇതൊക്കെ വായിയ്ക്കേണ്ട ഒരു താല്പര്യവും എനിയ്ക്കില്ല. എനിയ്ക്ക് ദൈവം പറഞ്ഞ കാര്യം അനുസരിച്ച് ഞാൻ ജീവിച്ചാൽ പോരെ? അപ്പോൾ, ദൈവം പറഞ്ഞതാണ് ഞാൻ നിങ്ങൾക്ക് പറഞ്ഞു തരുന്നത്. ഇതെല്ലാം ദൈവം ഓരോ വ്യക്തികളിലൂടെ ഭൂമിയിൽ കൊടുത്തതാണ്. അത് നീ അറിഞ്ഞിരിയ്ക്കണം, വായിച്ചിരിയ്ക്കണം. അടുത്തത് ഖുർആനിലോട്ട് കൊണ്ടുപോയി. അങ്ങനെ ഇത് മൂന്നും എന്നെക്കൊണ്ട് ദൈവം ഒരു പ്രാവശ്യം കഷ്ടിച്ച് വായിപ്പിച്ചു. പക്ഷേ ഇത് വായിയ്ക്കുമ്പോൾ ഇതിന്റെയകത്ത് ഒരുപാട് രഹസ്യങ്ങൾ ഉണ്ട്. ഞാൻ പറഞ്ഞ ഇത്രയും കേട്ടതിനു ശേഷം, അതിന്റെ അകത്തുള്ള ഒരു പ്രധാന രഹസ്യം നിങ്ങൾക്ക് പറഞ്ഞു തരാം.</p><p>ഈ ഗ്രൂപ്പിലുള്ള മിക്കവരും പ്ലാൻഡ് ആണ്. ഈ മതഗ്രന്ഥങ്ങൾ വായിയ്ക്കുന്നതിൽ ചില രഹസ്യം ഉണ്ടെന്ന് പറഞ്ഞു തരാം. അതായത്, നിങ്ങൾ ഈ മതഗ്രന്ഥങ്ങൾ പ്രത്യേകിച്ച് ബൈബിൾ. ബൈബിളിൽ ആണ് ഇത്രയും ക്യാരക്ടേഴ്സ് അതിലുള്ളത്. ഭഗവത്ഗീതയിൽ ഉണ്ട്. ഖുർആനിൽ അത്രയും ഇല്ല. എങ്കിലും, ആ ഹദീസുകളിലൂടെയും ഒക്കെ നമ്മൾ ഇത്തിരി സഞ്ചരിച്ചാൽ നിങ്ങൾക്ക് തന്നെ മനസ്സിലാകും, നിങ്ങളുടെ മുൻജന്മങ്ങൾ എന്തായിരുന്നെന്ന്. ഇത് നിങ്ങൾ തിരിച്ചറിയാനാണ് ഞാൻ ഈ ഗ്രന്ഥങ്ങളൊക്കെ ഒന്ന് മനസ്സിരുത്തി വായിയ്ക്കൂ എന്ന് പറയുന്നത്. ഖുർആൻ ഞാൻ എടുത്ത് പറയുന്നില്ല, അത് വേറൊരു രീതിയാണ്. പിന്നെ അതിനെകുറിച്ച് 2028 ന് ശേഷം നല്ല രീതിയിൽ ആ ഖുർആൻ ലെവലിലോട്ട് പോകും. ഭഗവത്ഗീതയോ മെയിൻ ആയിട്ട് ബൈബിളോ ഒക്കെ വായിച്ചാൽ അതിലെ ഓരോ ക്യാരക്ടർ, അവരുടെ കഥ, അവരുടെ അനുഭവങ്ങളൊക്കെ നിങ്ങൾ മനസ്സിരുത്തി വായിച്ചു വന്നാൽ നിങ്ങളുടെ മുൻജന്മം എന്താണെന്ന് നിങ്ങൾക്ക് മനസ്സിലാകും. കാരണം, അതിൽ പറയുന്ന പലരുമാണ് എന്റെ ഈ ഗ്രൂപ്പിലുള്ള നിങ്ങളിൽ പലരും. അത് നിങ്ങൾ കണ്ടെത്തും, കണ്ടെത്തിയിരിയ്ക്കും.</p><p>ഇപ്പോൾ ഭൂമിയിൽ വന്നിരിയ്ക്കുന്ന ആത്മാക്കൾ എല്ലാം ദൈവത്തിനു വേണ്ടി ചില ഡ്യൂട്ടികൾ ചെയ്യാൻ വന്നതല്ലേ? ഞാൻ അതിൽ എപ്പോഴും പറയാറുള്ളത്, സാധാരണ ഒരു ആത്മാവ് ഭക്തിയിൽ എല്ലാം തികഞ്ഞ് ദൈവത്തിലോട്ട് മോക്ഷപ്രാപ്തിയിൽ പോകുന്ന ആത്മാക്കൾ അല്ല. ഞാൻ അന്വേഷിയ്ക്കുന്നതും, എന്റെ റൂട്ടിൽ ദൈവം കൊണ്ടെത്തിയ്ക്കുന്നതും, വരണം എന്ന് ആഗ്രഹിയ്ക്കുന്നതൊക്കെ ചില നിയോഗങ്ങളായിട്ട്; അത് ഞാൻ പ്രത്യേകം പറഞ്ഞില്ലേ സത്യയുഗം അതിലോട്ട് തലമുറകളെ പ്രാപ്തമാക്കി വിടാനും, ആ സത്യയുഗം ആസ്വദിച്ചിട്ട് തിരിച്ചു പോകാനും, അതോടൊപ്പം തന്നെ ചില ഡ്യൂട്ടികൾ ഉണ്ട്. അതൊക്കെ അവരവർക്ക് തന്നെ പിന്നീട് വെളിപ്പെട്ട് കിട്ടും. അപ്പോൾ, അതിനൊക്കെ വേണ്ടിയിട്ടുള്ള ചില ആത്മാക്കളാണ് ഞാൻ ഈ പറയുന്ന ആത്മാക്കൾ. ഇത് ഇവർ എല്ലാ കാലഘട്ടത്തും വരും. ഇപ്പോൾ ഓരോ കാലഘട്ടത്തും ദൈവത്തിനു വേണ്ടി ചില പ്രവാചകർ വരുമ്പോഴെല്ലാം അവരെ സപ്പോർട്ട് ചെയ്തും അവരുടെ കൂടെ ഈ ആത്മാക്കൾ അപ്പോൾ വരും. ഇപ്പോഴും വരും. ഈ കാലഘട്ടത്തും ഇവരൊക്കെ തന്നെയാണ് വീണ്ടും വന്നേക്കുന്നത്. ഇത് കൽക്കിയുടെ ആ രീതി നോക്കണം. മഹാവിഷ്ണുവും അവതാരം എടുത്ത് വരുമ്പോൾ ആ മഹാവിഷ്ണുവിന്റെ കൂടെ നിൽക്കുന്ന ദേവീദേവന്മാരും സകല സാധനങ്ങളും അനന്തൻ ആണെങ്കിലും സുദർശ്ശന ചക്രം ആയുധങ്ങൾ ഇതെല്ലാം മനുഷ്യരായിട്ട് ഭൂമിയിൽ വരും. ഇവരെല്ലാവരും ടീം ആയിട്ട് നിന്നാണ് ഈ സത്യയുഗം ഉണ്ടാക്കിയെടുക്കുന്നത്."</p><h4>ദൈവത്തിന്റെ സ്നേഹവും ശിക്ഷയും</h4><p>സാറിന്റെ സന്ദേശം നിങ്ങൾ ഇപ്പോൾ കേൾക്കാൻ തുടങ്ങിയിട്ടുണ്ടല്ലോ? അത് ഒരുപാട് പ്രാവശ്യം നിങ്ങൾ കേൾക്കുമ്പോൾ ദൈവം ആരാണ് എന്നുള്ളത് നിങ്ങൾക്ക് മനസ്സിലാകും. ഇനി നമ്മൾ ആരാണ്, നമ്മൾ ദൈവത്തോട് എന്താണ്, നമ്മുടെ സമ്പർക്കം, ദൈവത്തോട് നമുക്കുള്ള ആ ഒരു ബന്ധം എന്താണ്, എന്നും മനസ്സിലാകും. ഇനി ഇത് മനസ്സിലാക്കി കഴിയുമ്പോൾ, നിങ്ങളെ സൃഷ്ടിച്ച ആ ദൈവത്തെ - ഈ പ്രപഞ്ചം മുഴുവൻ സൃഷ്ടിച്ചു കാത്തു പരിപാലിയ്ക്കുന്ന ആ ദൈവത്തെ പൂർണ്ണമായിട്ട് നിങ്ങൾ സ്നേഹിക്കുക. ഇതാണ് എല്ലാത്തിന്റെയും അടിസ്ഥാനവും തുടക്കവും. ഇത് നല്ല രീതിയിൽ നിങ്ങളിൽ പോകുമ്പോൾ, നിങ്ങൾ ഏത് ഗ്രന്ഥം വായിയ്ക്കണം നിങ്ങൾ ഇനി മുന്നോട്ട് എങ്ങനെ പോകണം, എന്നുള്ളതെല്ലാം ആ ദൈവം നിങ്ങൾക്ക് വെളിപ്പെടുത്തി തരും - നിങ്ങൾക്ക് കാണിച്ചു തരും. ഇത് തുടക്കം. ഇങ്ങനെ ചെയ്തു പോയാൽ മതി. ആ ദൈവത്തെ സ്നേഹിയ്ക്കുക. എനിക്ക് എല്ലാം തന്ന ആ ദൈവം എന്റെ ശ്വാസം മുതൽ എന്റെ ശരീരത്തിലെ ഓരോ അവയവങ്ങൾ മുതൽ സകലതും സൃഷ്ടിച്ച് - എന്നെ പൊന്നുപോലെ ഈ ഭൂമിയിൽ വിട്ട ആ ദൈവത്തെ ഞാൻ സ്നേഹിയ്ക്കുന്നു. ആ ദൈവത്തിന് നന്ദി പറയുന്നു - എന്നുള്ള നന്ദിയും സ്നേഹവും നിങ്ങളുടെ ഉള്ളിൽ ഉണ്ടെങ്കിൽ, നിങ്ങൾ വളരും. നിങ്ങൾ വളരുക മാത്രമല്ല മറ്റുള്ളവർക്ക് നിങ്ങൾ പറഞ്ഞുകൊടുക്കുന്ന രീതിയിൽ നിങ്ങളുടെ ആത്മാവ് നല്ലൊരു ആത്മീയയായി / ആത്മീയനായി മാറും.</p><p>നമ്മളെല്ലാവരും ഒരു കണക്കിന് സീൻ മരുഭൂമിയിലൂടുള്ള ഒരു യാത്രയിലാണ്. കഷ്ടങ്ങളും പ്രശ്നങ്ങളും വിഷയങ്ങളും ആയിട്ടുള്ള ഒരു യാത്ര. ആ യാത്രയിൽ ദൈവത്തോട് അടുക്കുമ്പോൾ നമ്മുടെ സമയമൊക്കെ നല്ലതാകും. ഒരുപാട് ഗുണങ്ങൾ കിട്ടും. നന്മകൾ കിട്ടും. അങ്ങനെയൊക്കെ കിട്ടിക്കിട്ടി വരുമ്പോൾ, നമ്മുടെ സ്വഭാവങ്ങളൊക്കെ തന്നെ മാറിപ്പോകും. പിന്നെ ദൈവത്തോട് പിറുപിറുക്കാൻ തുടങ്ങും. ഭൗതികത്തിലോട്ട് ബന്ധിതരായിട്ട്, പ്രാർത്ഥിച്ച് ഓരോന്ന് വാങ്ങിയ്ക്കാൻ തുടങ്ങും. കിട്ടാത്തതിന് പരിഭവം പറയാൻ തുടങ്ങും. അങ്ങനെയൊക്കെ വരുമ്പോൾ ദൈവം ഒരു കൊടുപ്പ് അങ്ങ് കൊടുക്കും. അതവന്റെ അവസാനത്തെ കൊടുപ്പായിരിയ്ക്കും. പിന്നെ ചിലപ്പോൾ മൊത്തത്തിലായിരിയ്ക്കും ആ കുടുംബത്തോടുള്ള ശിക്ഷയും നാശവും വരുന്നത്. അങ്ങനെയും ഉണ്ട്.</p>`

        conclusion: "നമ്മെ ഈ ഭൂമിയിലേക്ക് അയച്ച സ്രഷ്ടാവായ ദൈവത്തിൽ മനസ്സ് ഉറപ്പിച്ച്, ഒന്നിനോടും അമിതമായ മമതയില്ലാതെ, ഭൂമിയിലെ കടമകൾ സ്നേഹത്തോടെയും ഉത്തരവാദിത്വത്തോടെയും നിർവ്വഹിക്കുക.",
        fullContentHtml: `<p><strong>പഠന സംഗ്രഹം</strong><br>2026 നവംബർ 1, ഞായറാഴ്ച<br><strong>വിഷയം:</strong> പ്രകൃതിയുടെ വ്യവസ്ഥകളെല്ലാം തിരിച്ചറിഞ്ഞു: ഇനി എങ്ങനെ പ്രാവർത്തികമാക്കാം?</p><p>നമ്മൾ സത്യദൈവത്തെ തിരിച്ചറിഞ്ഞു. ദൈവത്തിന്റെ നിയമങ്ങളെല്ലാം ഏകദേശം സന്ദേശങ്ങളിലൂടെ കേട്ട് മനസ്സിലാക്കി. ഇനിയെങ്ങനെ ജീവിയ്ക്കണം - എങ്ങനെ മുന്നോട്ടു പോകണം എന്നുള്ളത് വ്യക്തിപരമായിട്ട് നമ്മൾ ഓരോരുത്തരും ആണ്. നമ്മളാണ് ഇനി തീരുമാനിയ്ക്കേണ്ടത്: "ഞാൻ ഇനി എങ്ങനെ പ്രാർത്ഥിയ്ക്കണം? വീട്ടിൽ ആയാലും, മറ്റുള്ളവരോട് എന്റെ പെരുമാറ്റ രീതി എങ്ങനെയായിരിയ്ക്കണം? അതായത്, ഈ വ്യവസ്ഥയെല്ലാം വച്ചിട്ട് ഞാൻ എങ്ങനെയായിരിയ്ക്കണം?" എന്ന് ഓരോ വ്യക്തിയും മുന്നോട്ടു പോകുന്നതായിരിയ്ക്കും ഏറ്റവും നല്ലത്.</p><p>നമുക്ക് എന്തെങ്കിലും സംശയം വരുന്നു, ഇത് മനസ്സിലാകുന്നില്ല എന്നുണ്ടെങ്കിൽ സന്ദേശങ്ങൾ കേൾക്കുക, എന്നിട്ടും നാലുവശവും ഭയങ്കര ഇരുട്ടാണ്, മുന്നോട്ടു പോകാൻ ഒട്ടും തന്നെ പറ്റുന്നില്ല എങ്കിൽ, ഗുരുവിനെ തേടിപ്പോവുക. അല്ലാതെ, ഇത് അറിഞ്ഞു കഴിഞ്ഞതിൽ പിന്നെ നമ്മൾ തന്നെ നമുക്ക് ഒരു ചിട്ട ജീവിതം ഉണ്ടാക്കി എടുക്കേണ്ടത് അത്യാവശ്യവും നല്ലതുമാണ്.</p><p>മനസ്സിനെ ശുദ്ധമാക്കി വയ്ക്കുക എന്നുള്ളതാണ് ഏറ്റവും പ്രധാനപ്പെട്ടത്. സ്രഷ്ടാവായ ദൈവത്തെ തിരിച്ചറിഞ്ഞ ഒരാൾക്ക്, പിന്നെ “എന്റെ ആഗ്രഹം” പിന്നെ "എന്റെ രീതി" എന്നുള്ളത് മാറണ്ടെ? അത് മാറിയിട്ട്, ദൈവവും ഞാനും ചേർന്നിട്ടുള്ള ഒരു ആഗ്രഹം ഒരു പ്രവർത്തി - ഒരു ഇഷ്ടം. ഇങ്ങനെയല്ലേ വരേണ്ടത്?</p><p>നമ്മൾ ഒരു വ്യക്തിയ്ക്കു വേണ്ടി പ്രാർത്ഥിയ്ക്കുമ്പോൾ എങ്ങനെ അവിടെ മമത വരും? നമ്മൾ ഒരു നല്ലത് അവർക്ക് ചെയ്തു കൊടുക്കുകയല്ലേ? അപ്പോൾ, ദൈവത്തോട് നാം പറയുന്നു: “ആ വ്യക്തിക്ക് ഒരു വഴി കാണിച്ചു കൊടുക്കണേ! ദൈവത്തെ തിരിച്ചറിയാനുള്ള ഒരു വഴി കാണിച്ചു കൊടുക്കണേ! അസുഖങ്ങൾ വരുമ്പോൾ മാറാനുള്ള വഴി കാണിച്ചു കൊടുക്കണേ!" പ്രാർത്ഥിയ്ക്കുമ്പോൾ നമ്മൾ ഒരു സഹായം മാത്രമല്ലേ ചെയ്യുന്നുള്ളൂ? അല്ലാതെ അവരുമായിട്ട് എങ്ങനെ മമതയാകും? ഒരിയ്ക്കലും അത് ആകാൻ ആയിട്ട് വഴിയില്ല. പക്ഷേ ഒരു കാര്യം. നമ്മൾ ദൈവവും ആയിട്ടാണ് കൂടി ഇഴുകിച്ചേർന്ന് ഒരു ബന്ധം പ്രത്യേക ഒരു സ്നേഹം ഇതൊക്കെ ആ ദൈവത്തോട് ആണ് എന്ന് വെച്ചു കൊള്ളൂ. അവിടെ നമ്മുടെ ഹൃദയം - നമ്മുടെ മനസ്സ് - നമ്മളായിരിയ്ക്കുന്ന ആ ഒരു അവസ്ഥ ദൈവവും ആയിട്ട് നേരത്തെ നിറഞ്ഞിരിയ്ക്കുകയാണ്. വേറെ ആൾക്ക് അതിൽ എങ്ങനെ കയറാൻ പറ്റും? ദൈവവും ആയിട്ടുള്ള ബന്ധത്തിൽ എന്തെങ്കിലും കുറവുണ്ടെങ്കിൽ മാത്രമേ മറ്റുള്ളവർക്ക് അതിൽ കയറി വരാനായിട്ട് പറ്റുകയുള്ളൂ? അല്ലെങ്കിൽ, നമ്മൾ തന്നെ മറ്റുള്ളവരെ അവിടെ കയറ്റി ഇരുത്തിയാൽ. നമ്മൾ വിചാരിച്ചു കൊള്ളണം ആ ദൈവമായിട്ടുള്ളത് എവിടെയോ എന്തൊക്കെയോ കുറവുണ്ട്. കുറവുള്ളത് കൊണ്ടല്ലേ മറ്റുള്ളവർക്ക് അവിടെ വന്നു നിൽക്കാനായിട്ട് പറ്റുന്നത്?</p><p>ദൈവത്തിന്റെ വ്യവസ്ഥ പ്രകാരം ഒരു വിവാഹം കഴിഞ്ഞ സ്ത്രീയ്ക്ക് അവളുടെ ഭർത്താവിനോട് മമത ആകാം. മക്കളോട് പോലും അതിന്റെ ആവശ്യം വരുന്നില്ല. മക്കളോട് പക്ഷേ, മക്കൾ പ്രായപൂർത്തിയാവുന്നത് വരെ ആകാം. മരണം വരെ ഭർത്താവ് കൂടെ ഉള്ളിടത്തോളം കാലം ഭർത്താവിനോട് മമത ആകാം. എന്നാൽ, ഭർത്താവിന് തിരിച്ചും ഭാര്യയോട് മമത ആകാൻ പാടില്ല. മക്കളോടും അതേ പോലെ മമതയാകാൻ പാടില്ല. വളർന്ന് ഒരു നില ആകുന്നത് വരെ ആകാം; അതിനപ്പുറത്ത് ആകാൻ പാടില്ല. ഒരു പുരുഷന് ദൈവത്തോട് മാത്രമേ മമത ആകാൻ പാടുള്ളൂ. ആദ്യ സ്ഥാനം ദൈവത്തിനോട് മാത്രമേ ആകാൻ പാടുള്ളൂ. ഭാര്യയ്ക്ക് ആദ്യ സ്ഥാനം ദൈവത്തിനോടും ആകാം, അല്ലെങ്കിൽ ഭർത്താവിനോട് ആകണം. കാരണം, ഒരു സ്ത്രീയുടെ തല എന്ന് പറയുന്നത് അവളുടെ ഭർത്താവാണ്. പുരുഷന്റെ തല എന്ന് പറയുന്നത് ദൈവത്തിന്റെ ആത്മാവാണ്.</p><p>ഭർത്താവിന് ഒരു വിഭവം വെച്ച് കൊടുക്കുമ്പോൾ ഭർത്താവ് അത് കൊള്ളില്ല എന്ന് പറയുമ്പോൾ വിഷമം വരില്ല - എന്ന് പറയുമ്പോൾ അത് തെറ്റാണ്. കാരണം ദൈവം നമ്മളെ ഏൽപ്പിച്ച ഒരു ജോലിയാണ്. സ്വാദ് ആയിട്ട് ഒരു വിഭവം ഉണ്ടാക്കി ഭർത്താവിന് ഇഷ്ടമനുസരിച്ച് അത് ചെയ്യുക എന്നുള്ളത് ഭർത്താവിന് ഇഷ്ടപ്പെടുന്നില്ല എന്നുണ്ടെങ്കിൽ, അതിനർത്ഥം ദൈവം ഏൽപ്പിച്ച ജോലിയിൽ നമ്മൾ തോറ്റുപോയി. നമുക്ക് വിഷമം വന്നാലേ അടുത്ത പ്രാവശ്യം നല്ല സ്വാദ് ആയിട്ട് വിഭവം ഉണ്ടാക്കാൻ പറ്റുകയുള്ളൂ. അല്ലാതെ വിഷമം ഇല്ലാതെ എന്റെ കർമ്മം ഞാൻ ചെയ്തു എന്ന് പറഞ്ഞിരിയ്ക്കുന്നത് ദൈവത്തിന്റെ കണ്ണിൽ അഹങ്കാരമായിട്ട് വരികയുള്ളൂ.</p><p>ഇപ്പോൾ നിങ്ങൾ ഒരു വിഭവം ഉണ്ടാക്കി കൊടുക്കുകയാണ്. വിഭവം നല്ല സ്വാദ് ആണെന്ന് നമ്മൾക്ക് തന്നെ അറിയാം. വീട്ടിലുള്ള ബാക്കി ഉള്ള ആരും ഒന്നും പറയുന്നില്ല, നമുക്ക് ഒരു പൂർണ്ണ ബോധ്യമുണ്ട് ഇത് സ്വാദാണെന്ന്. പക്ഷേ, നമ്മുടെ ഭർത്താവ് അത് കൊള്ളില്ല എന്ന് പറഞ്ഞു നമ്മളെ കുത്തുമ്പോൾ, നമുക്ക് നമ്മുടെ സാമാന്യബോധം വെച്ച് ചിന്തിയ്ക്കാം; ഭർത്താവ് നമ്മെ താക്കാൻ അല്ലെങ്കിൽ എന്തോ മനസ്സിൽ കൂടുതൽ വെച്ച് പറയുകയാണെന്ന്. അപ്പോൾ, അങ്ങനത്തെ സാഹചര്യത്തിൽ നമ്മൾ വിഷമിക്കേണ്ട ആവശ്യം വരുന്നില്ല. ദൈവം ഇതൊക്കെ കാണുന്നത്: എല്ലാം ഓരോ മനസ്സൊക്കെ നോക്കി അളന്നു കുറിച്ചാണ് ഇതിലെ ശരിയും തെറ്റും കണ്ടെത്തുന്നത്. അല്ലാതെ, ഒരാളുടെ പ്രവൃത്തി കണ്ടാൽ മാത്രം ഇത് ശരിയാണോ തെറ്റാണോ എന്ന് നമുക്ക് പറയാൻ പറ്റില്ല.</p><p>ഈ ഭൂമിയിൽ ഇരിയ്ക്കുന്ന ഓരോ ആത്മാവും ദൈവത്തിൽ നിന്ന് വന്ന ഓരോ ആത്മാവും; ആത്മീയയും ആത്മീയനുമായിട്ടാണ് പോകേണ്ടത്. ഈ ഭൂമി വിടുമ്പോൾ ഇവിടെ വന്നിട്ട് ആ സ്രഷ്ടാവായ ദൈവത്തെ തിരിച്ചറിഞ്ഞ്, ആ ദൈവത്തെ കൂടുതൽ സ്നേഹിച്ച്, ദൈവത്തോട് ഒരു മമത വരുത്തി, ഞാനീ കാണുന്നതെല്ലാം എന്നെ അയച്ച ആ ദൈവത്തിന്റേതാണ് എന്നുള്ള ആ ഒരു സ്നേഹബന്ധത്തിൽ ആയിരിയ്ക്കണം ഓരോ ആത്മാവും; എന്നാണ് ദൈവം ആഗ്രഹിക്കുന്നത്. അതിനു വേണ്ടിയിട്ടാണ് പരീക്ഷണങ്ങൾ വിടുകയും, അല്ലെങ്കിൽ ഏതെങ്കിലും പ്രശ്നങ്ങൾ വന്ന് - ഞാൻ ദൈവമാണെന്ന് - മനസ്സിലാക്കി കൊടുക്കുകയും, ഏതെല്ലാം രീതിയിൽ ഒരു ആത്മാവിന് ദൈവത്തെ മനസ്സിലാക്കാൻ പറ്റുമോ ആ രീതിയിൽ എല്ലാം മനസ്സിലാക്കി കൊടുക്കുന്നത്. ഇതെല്ലാം നമ്മൾ ശരിയായ രീതിയിൽ പോകുമ്പോൾ, ഒരു മമത ഒരു സ്നേഹം ഇതെല്ലാം ആ ദൈവത്തോട് ആണെങ്കിൽ നമുക്ക് മറ്റുള്ള സകലമാന എല്ലാ ജീവജാലങ്ങളോടും സ്നേഹിക്കാൻ തോന്നും നമ്മുടെ ഭാര്യയായാലും ഭർത്താവായാലും മക്കളായാലും. അവരോട് നമുക്ക് ഒരു പ്രത്യേക സ്നേഹം വരും. ഈ സ്നേഹം വരണം, നമ്മൾ അവരെ സ്നേഹിയ്ക്കണം.</p><p>ഇനി ആ ദൈവവും ആയിട്ടുള്ള നമ്മുടെ ബന്ധം ദൈവവുമായുള്ള സ്നേഹം നമുക്ക് എവിടെയോ കുറഞ്ഞു - അത് മനസ്സിലാക്കാൻ പറ്റുന്നില്ല. ഈ ലോകവും ആയിട്ടുള്ള സുഖം ഒന്ന് ആസ്വദിച്ചാൽ കൊള്ളാം, എന്ന് തോന്നി ആ ദൈവത്തെ ഒന്ന് മാറ്റി എന്ന് വെച്ചോളൂ. അപ്പോഴാണ്, ഈ ഭൂമിയിൽ വേറെ ആരോടെങ്കിലും നമുക്ക് മമത വരുന്നത്. നമ്മുടെ ഹൃദയം - നമ്മുടെ ഉള്ളം ഒരിയ്ക്കലും കാലിയായിട്ടിരിയ്ക്കില്ല. അവിടെ എന്തെങ്കിലും നിറഞ്ഞു കൊണ്ടിരിയ്ക്കണം. ദൈവവുമായി നിറഞ്ഞു കൊണ്ടിരിയ്ക്കുന്ന ഒരു വ്യക്തിക്ക് അവിടെ മറ്റുള്ളവരെ അതിൽ കൊണ്ടു നിർത്താൻ പറ്റില്ല. അവിടെ എന്തെങ്കിലും ഒരു ശകലം സ്ഥലമുണ്ടെങ്കിൽ മാത്രമേ മറ്റുള്ള വ്യക്തിക്ക് ആ മമതയിലേയ്ക്ക് വരാൻ പറ്റുകയുള്ളൂ. അതുകൊണ്ട്, സദാ നമ്മൾ ആ ദൈവത്തോട് ആയിരിയ്ക്കുമ്പോൾ, നമ്മൾക്ക് മറ്റുള്ള വ്യക്തികളോട് മമത വരില്ല സ്നേഹമേ വരികയുള്ളൂ.</p><p>ദൈവവും ആയിട്ട് നമ്മുടെ ബന്ധം ശക്തമാണെങ്കിൽ വീട്ടിലും നമ്മുടെ കുടുംബത്തിലും നമ്മുടെ ബന്ധം ശക്തമായിരിയ്ക്കും. പക്ഷേ നമ്മുടെ മനസ്സ് എപ്പോഴും ഒന്ന് പതറും. കാരണം, ആരെയെങ്കിലും നമ്മൾ കൂടുതലായിട്ട് സ്നേഹിയ്ക്കാൻ പോവുകയോ, അല്ലെങ്കിൽ കൂടുതലായിട്ടും മമതയിലേക്ക് പോകുമ്പോൾ, നമ്മൾ പിൻവലിയും. അയ്യോ ദൈവം എന്നുള്ള ഒരു ഉൾക്കുത്ത് വരും. കാരണം ഭർത്താവായാലും, മക്കളായാലും, ധനം ആയാലും, വീടായാലും, എന്തെല്ലാമായാലും, നിലനിൽപ്പില്ലാത്തതാണ്. നമ്മൾക്ക് മുമ്പ്, അല്ലെങ്കിൽ നമുക്ക് പിന്നിലോ, അതെന്നെങ്കിലും ഒരു ദിവസം നമ്മുടെ കൈവിട്ടു പോകും. ഇങ്ങനെ നമ്മൾ മനസ്സുകൊണ്ട് ചിന്തിയ്ക്കണം.</p><p>പക്ഷേ, ഞാൻ പോകുമ്പോൾ എന്റെ കൂടെ വരുന്ന ഒരാളുണ്ട്. ഞാൻ പോകുന്നയിടത്ത് ആ വ്യക്തി - ദൈവം ഇരിപ്പുണ്ട്. അതാണ് ഇപ്പോഴും മാറാതെ ഇരിയ്ക്കുന്നത്. അതിലോട്ട് വേണം നമ്മൾ പിടിയ്ക്കാൻ. അല്ലാതെ നമ്മളിൽ നിന്ന് കുറച്ചുനാൾ കഴിഞ്ഞ് ഇല്ലാതാകുന്ന അതിലോട്ടാണ് നമ്മുടെ ശ്രദ്ധ. അതാണ് എന്റെ മമതയും അതാണ് എന്റേതെന്ന് പറഞ്ഞു നടക്കുമ്പോൾ, നമ്മൾ പറ്റിയ്ക്കപ്പെടും. ഒരു ദിവസം നമ്മൾ ഇതെല്ലാം ഓർത്ത് കരയേണ്ടി വരും. ഇത് എപ്പോൾ വേണമെങ്കിലും എന്റെ കൈവിട്ടു പോകാം, പക്ഷേ എന്റെ കൈവിട്ടു പോകാത്തത് ഒരു ദൈവമുണ്ട് അത് എപ്പോഴും നിലനിൽക്കും. ഇങ്ങനെ ഒരു മനസ്സോടുകൂടി നിൽക്കുന്നവർക്ക് ആരോടും ഒരു മമതയും വരില്ല, പക്ഷേ സ്നേഹം വരും. അവരെ സ്നേഹിയ്ക്കണം. അവർ ഉള്ളിടത്തോളം കാലം അവരെ സ്നേഹിയ്ക്കണം. ഇല്ല എങ്കിൽ നമുക്ക് ദൈവമായിട്ട് ബന്ധമുണ്ട് എന്ന് പറയുന്നതിൽ കാര്യമില്ല.</p><p>മമത എന്നത് ഓരോ ആത്മാക്കൾക്കും ഓരോ നിലയിലാണ്. ദൈവത്തിന്റെ ഏറ്റവും ഉയർന്ന തലത്തിലേയ്ക്ക് പോകേണ്ട ആത്മാക്കൾക്ക് അത്ര കർശ്ശനമായിട്ട് മമത മുറിച്ചുമാറ്റപ്പെടും. ഒറ്റയ്ക്ക് ആയിപ്പോകും. ഒറ്റയ്ക്ക് ആക്കണം. അതേ സമയം അത്രയും ഉയർന്ന നിലയിലേയ്ക്ക് പോകേണ്ട എന്നുള്ളവർക്ക് മമത അത്രയ്ക്ക് മുറിയ്ക്കപ്പെട്ടാൽ മതി. പൂർണ്ണമായും മമത മുറിഞ്ഞ്, മക്കളെയും ഉപേക്ഷിച്ച്, ഭാര്യയാണെങ്കിൽ ഭാര്യയും ഉപേക്ഷിച്ച്, ഭർത്താവാണെങ്കിൽ ഭർത്താവിനെയും ഉപേക്ഷിച്ച്, അങ്ങനെയുള്ള ഒരു സാഹചര്യവും വരില്ല. പക്ഷേ, നമുക്ക് അത് അറിഞ്ഞുകൂടാ. നമ്മൾ മമത മുറിയ്ക്കപ്പെടുന്നതിനെ കുറിച്ചുള്ള നിയമം പറഞ്ഞു കൊടുക്കുകയേ ചെയ്യാവൂ. അത് കേൾക്കുന്ന ആത്മാക്കൾക്ക് - അവരവർക്ക് ഭാവിയിൽ മറ്റ് അദൃശ്യ ശക്തികൾ സാഹചര്യത്തിലൂടെ വേണ്ട രീതിയിൽ പാകപ്പെടുത്തി എടുക്കും. എല്ലാവർക്കും ഒരേ രീതിയിൽ അല്ല മമതയുടെ നിയമങ്ങൾ.</p><p>ഒറ്റപ്പെട്ടിരിയ്ക്കുക എന്ന് പറഞ്ഞു കഴിഞ്ഞാൽ; ഈ വ്യക്തിയ്ക്ക് ഒറ്റപ്പെട്ടിരിയ്ക്കുന്നത് ആയിരിയ്ക്കും ഇഷ്ടം. പ്രകൃതിയെ നോക്കിയിരിയ്ക്കുക, തീക്ഷ്ണമായ ചിന്തകൾ, ആത്മീയപരമായിട്ടുള്ള പദ്ധതികൾ, അമാനുഷികപരമായ പലപല സ്വപ്നങ്ങൾ; അങ്ങനെ അനുഭവങ്ങൾ. ഇത് ഒക്കെ ആരുമായിട്ടും പങ്കുവെയ്ക്കാൻ പോലും പറ്റില്ല. കാരണം, ഇതെല്ലാം വ്യത്യസ്തമായ അനുഭവങ്ങളാണ്. ഇതൊക്കെ അനുഭവപ്പെട്ട്, ഒറ്റയ്ക്ക് പലപല പദ്ധതികളും ചിന്തകളുമായി ഇരിയ്ക്കുന്ന അവസ്ഥ വേറെയാണ്. അല്ലാതെ, ചിലരുടെ സ്വഭാവം ഇഷ്ടമില്ലാത്തതു കൊണ്ട് ബന്ധുക്കളും വീട്ടുകാരും ഒക്കെ അവരെ അടുപ്പിയ്ക്കില്ല. ഇവർ അത് വിഷമിച്ചിരിയ്ക്കും. “അയ്യോ എന്നെ ഇവരാരും കൂട്ടുന്നില്ല. എനിയ്ക്ക് ആരും ബന്ധം ഒന്നും വരുന്നില്ലല്ലോ! ആർക്കും എന്നെ ഇഷ്ടപ്പെടുന്നില്ല.” എന്നൊക്കെ പറഞ്ഞു ഒറ്റപ്പെടുന്നത് വേറെ. അത് രണ്ടും രണ്ടാണ്.</p><p>ദൈവത്തിനുവേണ്ടി ചില നിയോഗം പോലെ, അല്ലെങ്കിൽ ദൈവത്തിന്റെ പദ്ധതിയിൽ ചില കാര്യങ്ങൾ ചെയ്യാനായിട്ട് ചില ആത്മാക്കൾ ഭൂമിയിൽ വരും. അങ്ങനെയുള്ളവർ ജന്മനാൽ മമത ഇല്ലായ്മ കാണിയ്ക്കും. ആരുമായിട്ടും ഒരു മമതയും ഉണ്ടാകില്ല.</p><p>നമ്മളെപ്പോഴും മറ്റുള്ള വ്യക്തികളെ നല്ലതായിട്ട് കാണാൻ ശ്രമിയ്ക്കാം. നമ്മൾ എത്രത്തോളം മറ്റുള്ള വ്യക്തികളെ അവർ നല്ലതാണ് - നല്ലവരാണ് എന്ന് പറയുമ്പോൾ, നമ്മൾ നല്ലവരായിക്കൊണ്ടേയിരിയ്ക്കും. നമ്മളുള്ള സാഹചര്യം - നമ്മുടെ ചുറ്റുപാട്, നല്ലതായിക്കൊണ്ടേയിരിയ്ക്കും. ഒരുപാട് നന്മയുടെ ശക്തി കിട്ടികൊണ്ടേയിരിയ്ക്കും. മറ്റുള്ളവർ എത്ര എന്ത് ചെയ്താലും, അത് പോകട്ടെ. പക്ഷേ, എന്നാലും, അവരിൽ ഇങ്ങനെ ഒരു നല്ല ഗുണമുണ്ട്. എന്നാലും, അവർ ഇങ്ങനെ ഒരു നന്മ എനിക്ക് ചെയ്തിട്ടുണ്ട്. എന്ന് പറഞ്ഞുകൊണ്ട് ഒരേയൊരു നന്മ ഇരുന്നാൽ പോലും, അവർ നല്ലവരാണെന്ന് പറഞ്ഞ് നമ്മൾ ശീലിച്ചു കഴിഞ്ഞാൽ, നമ്മൾ സ്വാഭാവികമായും ഒരു നല്ല വ്യക്തിയായി മാറും. നമ്മുടെ ചുറ്റിലും ദൈവത്തിന്റെ നന്മയുടെ ദൂതന്മാരായിട്ടുള്ളവർ നമ്മുടെ കൂടെ വന്നിരിയ്ക്കും.</p><p>അതേസമയം, നമ്മൾ തിന്മയാണ് എപ്പോഴും കാണുന്നതെന്ന് വെച്ചോളൂ. എല്ലാവരും എനിയ്ക്ക് എതിരാണ്. ഞാൻ എവിടെപ്പോയാലും ഇങ്ങനെയൊക്കെയാണ്. എന്നിങ്ങനെ, നമ്മൾ എപ്പോഴും ഒരു തിന്മയുടെ മാനസികാവസ്ഥയോട് കൂടെ ഇരുന്നാൽ, നമ്മളിൽ നിന്ന് ഒരിയ്ക്കലും നന്മ വരാനായി തിന്മയുടെ ശക്തി സമ്മതിയ്ക്കില്ല. നമ്മൾക്ക് എപ്പോഴും അസ്വസ്ഥത. എപ്പോഴും നമുക്ക് തിന്മ ചെയ്യാൻ ആയിട്ട് മറ്റുള്ളവർ നമ്മളെ അന്വേഷിച്ചു വരും. എത്രത്തോളം നമ്മൾ മറ്റുള്ളവരെക്കുറിച്ച് മോശമായിട്ട് സംസാരിക്കുന്നുവോ, നമ്മൾ ചിന്തിക്കുന്നുവോ, നമ്മൾ ചെയ്യുന്നുവോ, നമ്മുടെ ചുറ്റുപാടും മൊത്തം തിന്മയുള്ളതായിക്കൊണ്ടുവരും. നമ്മൾ നല്ലത് പറയുക, നമ്മൾക്ക് നല്ലതു തന്നെ വരും. തിന്മ ചെയ്താൽ - സംസാരിച്ചാൽ നമുക്ക് തിന്മ തന്നെ വന്നുകൊണ്ടിരിയ്ക്കും. ഇത് ദൈവം വെച്ചിരിക്കുന്ന വ്യവസ്ഥയല്ലേ?</p><p>അഹങ്കാരം എന്ന് പറയുന്നത് പിശാചിന്റെ ഒരു സ്വഭാവമാണ്. അതിനെ കുറയ്ക്കാനും, അതിനെ മാറ്റിയെടുക്കാനും നമ്മൾ പ്രാർത്ഥിച്ചിട്ടും ശ്രമിച്ചിട്ടും നടക്കില്ല. ശരിയ്ക്കും പറഞ്ഞാൽ, ഇത് അഭ്യാസത്തിലൂടെ ദൈവം ശരിയാക്കിത്തരും. എന്ന് പറഞ്ഞാൽ, അനുഭവിലൂടെ. ചില അനുഭവങ്ങളിലൂടെ വരുമ്പോഴാണ് അത് നല്ലൊരു പാഠമായിട്ട് നമുക്ക് വരുന്നത്. അപ്പോൾ, എനിയ്ക്ക് അങ്ങനെ ഒരു അനുഭവം തരണേ എന്ന് ദൈവത്തോട് പ്രാർത്ഥിച്ചാൽ; ദൈവം ഒരു സാഹചര്യം സൃഷ്ടിച്ച് - അത് നിങ്ങളുടെ അഹങ്കാരത്തെ കുറയ്ക്കുകയല്ല, ചിലപ്പോൾ വേരോടുകൂടി പിഴുത് മാറ്റുക വരെ ചെയ്തെന്നു വരും.</p><p>നമ്മളെ ഈ ഭൂമിയിൽ വിട്ടേക്കുന്നതിന് ദൈവത്തിന് ഒരു പദ്ധതി ഉണ്ടാകുമല്ലോ. നമ്മൾ ഈ ഭൂമിയിൽ ഇരിയ്ക്കുന്ന അത്രയും കാലം ആസ്വദിയ്ക്കുക. എന്ന് പറയുമ്പോൾ, ഇവിടെ കാണുന്നതെല്ലാം ദൈവത്തിന്റെ കരവേലയാണ് - ദൈവത്തിന്റെ സൃഷ്ടിയാണ്, ഇതെല്ലാം കണ്ട് ആസ്വദിയ്ക്കുക. ദൈവത്തിന് നന്ദി പറയുക. ദൈവത്തിനെ സ്തുതിയ്ക്കുക. ദൈവത്തെ വാഴ്ത്തുക. ഇതെല്ലാം ആസ്വദിക്കുക. പൂക്കൾ കണ്ടില്ലേ? അതിന്റെ മണവും, അതിന്റെ ഭംഗിയും; ഇതൊക്കെ ദൈവം വച്ചിരിയ്ക്കുന്നത് നമുക്ക് കാണാൻ വേണ്ടിയിട്ടാണ് - കണ്ട് ആസ്വദിയ്ക്കാൻ വേണ്ടി. ആസ്വദിച്ച് അത് എന്റേതായി മാറാതെ; ആസ്വദിച്ച് ദൈവത്തിന് നന്ദി പറയുക. "ദൈവമേ ദൈവത്തിന്റെ ഓരോ സൃഷ്ടി ഇങ്ങനെ!" മലയും കടലും ഇതെല്ലാം കണ്ട്, അവിടെ പോവുക, ആസ്വദിയ്ക്കുക. കാരണം, ഇതൊക്കെ ദൈവത്തിന്റെ കൈകൊണ്ട് നമ്മുടെ ദൈവം ഉണ്ടാക്കിയ സാധനം അല്ലേ? അതിൽ ആസ്വദിയ്ക്കുമ്പോഴെല്ലാം, നമ്മൾ ദൈവത്തെ ഓർത്ത് ആ ഓരോ നിമിഷവും ദൈവമായിട്ടാണ് നമ്മൾ ആസ്വദിക്കുന്നത്; എന്നുള്ള സങ്കൽപ്പത്തിൽ ആസ്വദിക്കുക. സന്തോഷമായിട്ടിരിയ്ക്കുക.</p><p>നമ്മൾ ഭൂമിയിൽ വന്നിട്ട് ഞാൻ ഇവിടെ നിൽക്കേണ്ട ആളല്ല എന്ന് ചിന്തിയ്ക്കുന്നതിൽ അർത്ഥമില്ല. കാരണം, ഇവിടെ അല്ലെങ്കിൽ, പിന്നെ ദൈവത്തിന് തെറ്റു പറ്റിയോ നമ്മളെ ഇങ്ങോട്ട് വിടാൻ? ഇവിടെ ഇരുന്നുകൊണ്ട് എല്ലാവരെയും സ്നേഹിയ്ക്കുക. ഒരു കുടുംബമായാൽ, നല്ല ഉത്തരവാദിത്വത്തോട് കൂടി ആ കുടുംബത്തിലെ കാര്യങ്ങൾ നോക്കുക. എല്ലാം ഭംഗിയ്ക്ക് ചെയ്തിട്ട്, ഇവിടെ നിന്ന് പോകണം. അതാണ് അതിന്റെ ശരി. ഒന്നിനോടും മമതയില്ലാതെ എല്ലാം ആസ്വദിയ്ക്കുക. സ്നേഹിയ്ക്കുക. എല്ലാ ജീവജാലങ്ങളെയും കണ്ട് സ്നേഹിക്കുക. ഈ കിളികളൊക്കെ ഇങ്ങനെ പാടി നടക്കുമ്പോൾ അവരെന്തെല്ലാം ചൊല്ലി ദൈവത്തെ സ്തുതിയ്ക്കുന്നുണ്ടോ എന്ന് നമ്മൾക്ക് അറിയുന്നില്ല? ഈ സാഹചര്യത്തിലേയ്ക്ക് നമ്മൾ ഇനി തിരിച്ചു വരുമോ എന്ന് നമുക്ക് അറിഞ്ഞുകൂടാ. പരമാവധി നമ്മൾ ദൈവത്തെ ആരാധിയ്ക്കുക. ദൈവത്തിന്റെ ഓരോ സൃഷ്ടിയേയും കണ്ടു ദൈവത്തെ കൂടുതൽ സ്നേഹിച്ച് സ്നേഹിച്ചിരിയ്ക്കുക. ദൈവത്തെ സ്തുതിക്കുക. നമ്മൾ ആനന്ദിയ്ക്കുക.</p><p>എല്ലാം കഴിഞ്ഞിട്ട് നമ്മളെ ഭൂമിയിലോട്ടു വിടണോ അല്ലെങ്കിൽ വേറെ ഗ്രഹത്തിലേയ്ക്ക് വിടണോ എന്നൊക്കെ ദൈവം നിശ്ചയിയ്ക്കും. നമ്മൾ സന്തോഷമായിട്ട് ഇരിയ്ക്കുക. പേടിയ്ക്കരുത് - മമതയായിട്ട് പോയാലോ? അത് ചെയ്യരുതെന്നല്ലേ? പക്ഷേ, എന്നാലും - എങ്ങനെ - എന്നൊക്കെ പറഞ്ഞ്, നമ്മൾ രണ്ടു മനസ്സോടുകൂടി ചെയ്യരുത്. മമത വന്നാൽ പോലും ദൈവത്തോട് പ്രാർത്ഥിയ്ക്കുക. "ദൈവമേ! നിന്നിൽ നിന്നും ഒരു ശകലം പോലും സ്നേഹം കുറയരുത്." എന്ന് പ്രാർത്ഥിച്ചു കൊണ്ട് മുന്നോട്ടുപോകാം. അല്ലാതെ ഒരു ചിട്ടവച്ച് - ഇങ്ങോട്ട് തിരിയരുത് - അങ്ങനെ പോകുന്നത്; അത്രേയ്ക്കും ഒരു സ്വാതന്ത്ര്യമല്ല. നമ്മൾ സ്വതന്ത്രരായിട്ട് സൃഷ്ടിക്കപ്പെട്ടവരാണ്. നമ്മൾ നമ്മളെ തന്നെ യോഗ്യരാക്കി എടുക്കുക.</p><p>ദൈവത്താൽ തെരഞ്ഞെടുക്കപ്പെട്ട് പ്രധാനമായ പല ദൗത്യങ്ങളും ഏൽപ്പിയ്ക്കുന്ന ആ വ്യക്തിയെ, പിശാച് പരമാവധി ശല്യം ചെയ്യാനായിട്ട് ദൈവം തന്നെ അനുവദിയ്ക്കും. കാരണം, ദൈവത്തിന് അറിയണം: എത്ര മാത്രം ശക്തിയോടുകൂടി പിശാചിനെ നേരിടാനുള്ള ക്ഷമത - കെൽപ്പ് ഉണ്ട് എന്ന്. ഇല്ലാതെ വരുമ്പോൾ, അത് ഉണ്ടാക്കിയെടുക്കാൻ വേണ്ടിയിട്ട് ദൈവം തന്നെ അനുവദിച്ചു കൊടുക്കുന്ന ഒരു സാഹചര്യം ഉണ്ട്. ഇത് നമ്മൾ സ്വർണ്ണം വീണ്ടും വീണ്ടും തീയ്യിലിട്ട് പരുവപ്പെടുത്തി എടുക്കുമല്ലോ, അതുപോലെ ചെയ്തെടുത്ത് ദൈവത്തിന് വേണ്ടപ്പെട്ട വ്യക്തിയെ അധികമായിട്ട് ദൈവത്തോട് ചേർന്ന് നിൽക്കത്തക്ക രീതിയിൽ യോഗ്യനായി വരുന്നതുവരെ അങ്ങനെ ചെയ്യും. എന്നിട്ടും അയാൾ ദൈവത്തോടൊപ്പം എത്താൻ ആയിട്ട് ശ്രമിയ്ക്കും. പൈശാചികമായിട്ട് എനിക്ക് ഒരു ശല്യവും ഇല്ല, സുഖജീവിതമാണ് എന്ന് പറയുന്നവർ ദൈവത്തിൽ നിന്ന് എത്രമാത്രം അകന്നു നിൽക്കുന്നു എന്ന് വിചാരിച്ചു കൊള്ളണം.</p><h4>മമതയും കുടുംബ ജീവിതവുമായി ബന്ധപ്പെട്ട് സോഫി ടീച്ചർ കേട്ട ഒരു കഥ പറയുന്നു.</h4><p>കൃഷ്ണനും ഒരു സന്യാസിയും കൂടെ സംസാരിച്ചു കൊണ്ട് വരികയാണ്. അപ്പോൾ കൃഷ്ണൻ തനിക്ക് ദാഹിയ്ക്കുന്നു എന്ന് പറയുകയാണ്. അപ്പോൾ ഈ സന്യാസി "ദാഹിയ്ക്കുന്നോ? ഞാൻ ഇപ്പോൾ വെള്ളം കൊണ്ടുവരാം." എന്ന് പറഞ്ഞിട്ട്, കൃഷ്ണന് വെറുതെ അവിടെ ഇവിടെയുള്ള വെള്ളം കൊടുത്താൽ പോരാ, നല്ല വെള്ളം കൊണ്ട് പോകണമെന്ന് പറഞ്ഞിട്ട് ഒരു വീടിന്റെ കതക് മുട്ടുകയാണ്. അപ്പോൾ ഒരു സുന്ദരിയായ പെണ്ണ് വന്ന് കതക് തുറക്കുന്നു. കുറച്ചു വെള്ളം വേണമല്ലോ എന്ന് ചോദിയ്ക്കുമ്പോൾ, അവർ വെള്ളം എടുക്കാൻ പോയി. വെള്ളമെടുക്കാൻ പോയിട്ട് വെള്ളം കൊടുത്തുകൊണ്ട് ഇവർ കൂടുതൽ സംസാരിച്ച് സമയം പോയി. അങ്ങനെ സംസാരിച്ചു വന്നപ്പോൾ - വീട്ടിൽ ആ പെണ്ണ് മാത്രമേയുള്ളൂ. പിന്നെ ബന്ധുക്കളുടെ ഒക്കെയായിട്ട് ആ സ്ത്രീയുടെ കുറെ കഥകൾ ഒക്കെ പറഞ്ഞപ്പോൾ, ഈ സന്യാസിയ്ക്ക് അവരോട് ഇഷ്ടവും സ്നേഹവും ഒക്കെ തോന്നി. അങ്ങനെ രണ്ടുപേരും കൂടി ഒന്നിച്ചു ജീവിയ്ക്കാം എന്ന് തീരുമാനിച്ചു.</p><p>അവർക്ക് കല്യാണം ആയി. അവർക്ക് രണ്ട് ആൺമക്കളും ഒരു പെൺകുട്ടിയും ജനിച്ചു. പിന്നെ അവർ കുടുംബ ജീവിതത്തിൽ അധിക സന്തോഷമായിട്ട്, ഒരു പ്രശ്നവുമില്ലാതെ, നല്ല രീതിയിൽ അങ്ങോട്ടുമിങ്ങോട്ടും പങ്കുവയ്ക്കുക - ഉൾക്കൊള്ളുക; അങ്ങനെയൊക്കെയുള്ള പല കാര്യത്തിലും പോയിക്കൊണ്ടിരിയ്ക്കുകയാണ്. കുട്ടികൾക്ക് അഞ്ചു വയസ്സ്, ആറു വയസ്സ്, രണ്ടു വയസ്സ്, ഇങ്ങനെയുള്ള പ്രായമാണ്. ഒരു ദിവസം ആ നാട്ടിൽ നല്ല ക്ഷാമം ഉണ്ടായി. അപ്പോൾ നിർബന്ധിതരായി അവർ വേറൊരു സ്ഥലത്തേയ്ക്ക് പോകണം. ഇവിടെ ഇരുന്നാൽ അവർക്ക് ആഹാരം ഒന്നും കിട്ടുകയില്ല. അപ്പോൾ, ഈ സന്യാസി ഭാര്യയും മക്കളെയും കൂട്ടിക്കൊണ്ട് വേറൊരു ഇടത്തേയ്ക്ക് പോവുകയാണ്. ആ സ്ഥലത്തേക്ക് പോകുമ്പോൾ ഒരു പുഴയുണ്ട്. ആ പുഴ കടന്ന് വേണം അപ്പുറത്തോട്ട് പോകാനായിട്ട്. നോക്കുമ്പോഴാണ് പുഴയിൽ ഒരുപാട് വെള്ളം. ഒരുപാട് വെള്ളം ആയിട്ട് കടന്നു പോകാൻ പറ്റില്ല. ഈ സന്യാസിക്ക് മാത്രമേ പോകാൻ പറ്റുകയുള്ളൂ, കൊച്ചുകുട്ടികൾക്കും ഭാര്യക്കും പോകാൻ പറ്റില്ല.</p><p>സന്യാസി രണ്ട് ആൺകുട്ടികളെയും അപ്പുറത്തും ഇപ്പുറത്തും രണ്ട് തോളത്തും എടുത്തു വച്ചു. ആ പെൺകുട്ടിയോട് തലയിൽ ഇരിക്കാൻ പറഞ്ഞു തലയിലും ഇരുത്തിച്ച്, ഭാര്യയെ മുതുകിൽ കയറ്റി. എന്നിട്ട് പറഞ്ഞു, "നിങ്ങൾ എന്നെ മുറുകെ പിടിച്ചോ. ഞാൻ പുഴ കടക്കുന്നത് വരെ എന്നെ വിട്ടുകളയരുത്." എന്ന് പറഞ്ഞു പോവുകയാണ്. എന്നിട്ട് ആ പുഴയിൽ ഇറങ്ങിയപ്പോൾ വെള്ളത്തിന്റെ ശക്തി കുറയുന്നില്ല, കൂടിക്കൂടി വരികയാണ്. ഒഴുക്കിന്റെ ശക്തി ഒരുപാട് കൂടി വന്നപ്പോൾ ആദ്യം ഇടതുഭാഗത്തുള്ള ആൺകുട്ടി തെന്നി വെള്ളത്തിൽ പോയി. പിന്നെ നോക്കിയപ്പോൾ, വലതുവശത്തുള്ള ആ ആൺകുട്ടിയും വെള്ളത്തിൽ ഒലിച്ചുപോയി. ഒന്നും ചെയ്യാൻ പറ്റിയില്ല. സന്യാസിയ്ക്ക് ഒരുപാട് വിഷമം വന്നു. വിഷമം വന്നു കരയുകയാണ്. "നിങ്ങളെങ്കിലും എന്നെ ഒന്ന് മുറുകെ പിടിച്ചോ! - അയ്യോ! എന്ത് ചെയ്യട്ടെ?" എന്ന് പറഞ്ഞ് വിഷമിച്ചു വിഷമിച്ചു പോകുമ്പോൾ. അവസാനം ഈ പിള്ളേര് പോയതിന്റെ വിഷമവും ദുഃഖവും കൊണ്ട് ഭാര്യയ്ക്ക് പിടിച്ചു നിൽക്കാൻ പറ്റിയില്ല. മുതുകത്തിരുന്ന ഭാര്യയും വെള്ളത്തിൽ പോയി. അവസാനം ആ പെൺകുട്ടി തലയിൽ മുറുകെപ്പിടിച്ച് ഇരിയ്ക്കുകയാണ്. കാറ്റും വെള്ളവും ഒക്കെ അടിച്ചപ്പോഴേയ്ക്കും, കുട്ടിയ്ക്കും അവിടെ ഇരിയ്ക്കാനായിട്ട് പറ്റിയില്ല. അതും വെള്ളമടിച്ചു കൊണ്ടുപോയി.</p><p>എല്ലാം വെള്ളത്തിൽ പോകുന്നത് കണ്ടിട്ട് ഈ സന്യാസിയ്ക്ക് ഒന്നും ചെയ്യാൻ പറ്റിയില്ല. അവസാനം ഈ സന്യാസിയും അങ്ങ് വെള്ളം അടിച്ചു കൊണ്ടുപോകുന്ന വക്കിൽ ആയി. മരിയ്ക്കാറായുള്ള രീതിയിലായി. ഒന്നും ചെയ്യാൻ പറ്റിയില്ല. അപ്പോഴേയ്ക്കും ആ സന്യാസി "എന്റെ കൃഷ്ണാ!" എന്ന് ഉച്ചത്തിൽ ഒറ്റ വിളി. വിളിച്ചപ്പോഴേയ്ക്കും കൃഷ്ണൻ പറയുകയാണ്, "വത്സാ എന്തുപറ്റി? വെള്ളം കിട്ടിയില്ലേ ഇതുവരെ?" അപ്പോഴാണ് ആ സന്യാസി ഓർക്കുന്നത്, അയാൾ ഇവിടെ വന്നത് കൃഷ്ണന്റെ ദാഹം തീർക്കാൻ കുറച്ചു വെള്ളം കൊണ്ടുവരുന്നതിനു വേണ്ടിയിട്ടാണ്. ഇത്രയും കഥകൾ സംഭവിച്ചു.</p><p>ഇതൊരു ചെറിയ കഥയാണെങ്കിലും, ഇതിൽ നിന്ന് എന്താണ് മനസ്സിലാക്കേണ്ടത് എന്ന് വെച്ചാൽ: ദൈവം നമ്മളെ പ്രത്യേക ഒരു ജോലിയ്ക്ക് വേണ്ടിയിട്ട് ഭൂമിയിൽ വിടും. വിട്ടു കഴിയുമ്പോൾ നമ്മൾ ഇവിടെ വന്ന് കാണുന്നതെല്ലാം കണ്ട് ആസ്വദിച്ച് - സ്നേഹമായി മക്കളുമായി. അങ്ങനെ ആകുമ്പോഴേയ്ക്കും ആ ദൈവത്തെ മറന്നു. ആ ദൈവം തന്ന ജോലിയും മറന്നു കളഞ്ഞു. അവസാനം എല്ലാം നഷ്ടപ്പെട്ട് എല്ലാം ഒന്നുമില്ലാതെ ആയപ്പോഴേയ്ക്കും "ദൈവമേ!" എന്ന് വിളിച്ചപ്പോഴാണ് ദൈവം പറയുന്നത്: നിന്നെ വിട്ടതിന്റെ ഉദ്ദേശ്യം എന്ത്? കിട്ടിയില്ലേ? എന്ന് ചോദിക്കുമ്പോഴാണ് മനസ്സിലാവുന്നത്: ഇതിനു വേണ്ടിയിട്ടാണ് ഞാൻ വന്നത്. പക്ഷേ ഇങ്ങനെ ആയിപ്പോയി എന്ന് പറഞ്ഞു. ഇങ്ങനെയൊക്കെ നമ്മുടെ ജീവിതം ആയിപ്പോകരുത് എന്ന് പറയാനായിട്ടാണ് ഈ കഥ.<br>നമ്മളെ ചിന്തിപ്പിയ്ക്കുന്ന ഒരു കുട്ടിക്കഥ.<br>സത്യപ്രകാശം</p>`

            "ഒന്നാം പുനരുദ്ധാനവും രണ്ടാം പുനരുദ്ധാനവും: ദൈവീക വ്യവസ്ഥകൾ പാലിക്കുന്നവർ ഭൂമിയിലെ സത്യയുഗത്തിലേക്ക് (ഒന്നാം പുനരുദ്ധാനം) പ്രവേശിക്കും. വ്യവസ്ഥകൾ തെറ്റിക്കുന്നവർ ഭൂമിയിൽ അതിന്റെ കർമ്മഫലങ്ങൾ അനുഭവിച്ച ശേഷം അവസാനം സ്വർഗ്ഗത്തിലേക്ക് (രണ്ടാം പുനരുദ്ധാനം) പോകും; എന്നാൽ അവർക്ക് സത്യയുഗം ആസ്വദിക്കാൻ കഴിയില്ല."
