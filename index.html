        conclusion: "അറിവ് നേടിയ ശേഷം ഏത് വഴി തിരഞ്ഞെടുക്കണമെന്നത് ഓരോരുത്തരുടെയും തീരുമാനമാണ്. ദൈവീക വ്യവസ്ഥകൾ പാലിച്ച് കുടുംബത്തെ നേർവഴിക്ക് നയിക്കുന്നവർ ഒന്നാം പുനരുദ്ധാനമായ സത്യയുഗത്തിന് യോഗ്യരാകും.",
        fullContentHtml: `<p><strong>പഠന സംഗ്രഹം</strong><br>2026 ഒക്ടോബർ 29, വ്യാഴാഴ്ച<br><strong>വിഷയം:</strong> ഇന്നുവരെ ചർച്ച ചെയ്ത ചർച്ചകളിലെ സംശയനിവാരണം.</p><h4>സ്ത്രീകളുടെ ധർമ്മം</h4><p><strong>ചോദ്യം:</strong> സുഭാഷിതങ്ങൾ 31: 10 - 28 പ്രകാരമുള്ള ഉത്തമയായ ഭാര്യയെ കണ്ടുപിടിയ്ക്കാൻ ആർക്ക് കഴിയും?</p><p><strong>ഉത്തരം:</strong> സുഭാഷിതങ്ങളിൽ ഈ പറയുന്ന കാര്യങ്ങൾ എല്ലാം ഒത്തിണങ്ങി വന്നാൽ സ്ത്രീ ശരിയാണ്. പക്ഷേ ഈ കാലഘട്ടത്തിൽ അങ്ങനെയല്ല. ഈ കാലഘട്ടത്തിൽ ഭർത്താക്കന്മാർക്ക് വീട്ടുജോലി, ഭാര്യമാർ കുടുംബനേതൃത്വം ഏറ്റെടുത്ത് കുടുംബത്തിന്റെ തല സ്ത്രീയായിട്ടിരിക്കുകയല്ലേ? അവൾ വാ തുറന്നാൽ ജ്ഞാനം വരുമോ? അനാവശ്യ വാക്കും വിരട്ടും ഭീഷണിയും തെറിവാക്കും ഒക്കെ അല്ലേ വായിൽ വരുന്നത്? നിങ്ങൾ ഈ പറയുന്ന എല്ലാം ഒത്തിണങ്ങി വന്ന സ്ത്രീ എന്ന് പറയുന്നത് ശരിയാണ്. അല്ലാതെ വരുമാനത്തിനു വേണ്ടി മാത്രം സ്ത്രീ പോവുകയും ഭർത്താവിനെയും, കുടുംബ കാര്യങ്ങളും നേരാംവണ്ണം നോക്കാതെ, രാവിലെ ജോലിക്ക് പോയിട്ട് രാത്രി കയറി വന്നിട്ട്, മക്കളെ അമ്മയുടെ കയ്യിൽ ഏൽപ്പിക്കുക, ജോലിക്കാരിയെ വച്ച് മക്കളെ നോക്കുക, എന്നിട്ട് ഭാര്യ പണത്തിനു വേണ്ടി മാത്രമുള്ള പോക്ക്, ആ കാശ് എന്തു ചെയ്യുന്നു എന്ന് ഭർത്താവിനും അറിഞ്ഞുകൂടാ. ഭാര്യ പോയാൽ തന്നെ എവിടേയ്ക്ക് പോകുന്നു എന്തൊക്കെ കാണിയ്ക്കുന്നു എന്ന് ഭർത്താവിന് യാതൊരു ബോധവുമില്ല. ഭർത്താവ് വേറൊരു രീതിയിൽ പോകുന്നു. അതാണ് പ്രശ്നം. ദൈവം ഒരുകാലത്ത് നല്ല കാര്യങ്ങൾ പറഞ്ഞതെല്ലാം. അതിന്റെ ചില കാര്യങ്ങൾ മാത്രം എടുത്തു വച്ചുകൊണ്ട്, ബാക്കി എല്ലാം തള്ളിക്കളഞ്ഞിട്ട് വഴി തെറ്റി പോകുന്നതു കൊണ്ടാണ്; പിന്നീട് ദൈവം ഇതെല്ലാം മാറ്റി മാറ്റി കർശ്ശനമാക്കി കൊണ്ടുവരുന്നത്. ഇപ്പോൾ ദൈവം കർശ്ശനമായി.</p><p><strong>ചോദ്യം:</strong> സ്ത്രീകൾക്ക് മാത്രം ചെയ്യാൻ പറ്റുന്ന എന്ത് ദൗത്യമാണ് ജീവിതത്തിൽ ഉള്ളത്?</p><p>സ്ത്രീയുടെ മുഖ്യ പങ്ക് എന്ന് പറയുന്നത് അടുത്ത തലമുറയെ തെറ്റ് കൂടാതെ വളർത്തിയെടുക്കുക. മറ്റുള്ളവർക്ക് അറിവ് - ജ്ഞാനം പകർന്നു കൊടുക്കുക. സ്ത്രീയ്ക്ക് എത്രത്തോളം വേണമെങ്കിലും അറിവ് സമ്പാദിക്കാം. ഭർത്താവിന് കീഴ്പ്പെട്ടു നിന്ന്, ഭർത്താവിന് എന്തൊക്കെ വേണമൊ സഹായങ്ങൾ ചെയ്യേണ്ടത് അതെല്ലാം ചെയ്ത് ഭർത്താവിനെ സഹായിയ്ക്കുക. മക്കളെ പ്രസവിയ്ക്കുക. അത് ഒരിക്കലും ഒരു ആണിന് പറ്റില്ലല്ലോ, ഇതാണ് പ്രധാനം.</p><p>നമ്മൾ, പറയുന്നത് കേട്ടിട്ടുണ്ടല്ലോ: സ്ത്രീയാണ് വീട്ടിലെ വിളക്ക്. ഒരു സ്ത്രീ വിചാരിച്ചാൽ കുടുംബം നന്നാകും. ഒരു സ്ത്രീ ആ കുടുംബത്തെ നശിപ്പിയ്ക്കുകയും ചെയ്യും എന്നൊക്കെ പറയാറുണ്ടല്ലോ. അതൊക്കെ ശരി തന്നെ. കാരണം, ഒരു വീട്ടിലെ മക്കളെ വളർത്താനും അവരെ നല്ല രീതിയിൽ എത്തിയ്ക്കാനും; ദൈവത്തോട് സദാ പ്രാർത്ഥിക്കേണ്ട ഒരു വലിയ ദൗത്യം സ്ത്രീകൾക്കാണ് ഉള്ളത്. എങ്ങനെയുള്ള ഭർത്താവായാലും ആ ഭർത്താവിനെ നന്നാക്കിത്തരാൻ ദൈവത്തോട് പ്രാർത്ഥിയ്ക്കുകയും. ഏത് തരം ഭർത്താവിനെയും സ്ത്രീയുടെ പെരുമാറ്റം കൊണ്ട്, നല്ല പ്രവർത്തികൾ കൊണ്ട്, നന്നാക്കി മാറ്റിയെടുക്കുന്നതിന്റെ ഉദാഹരണം കാണിച്ചു കൊടുക്കേണ്ടത് സ്ത്രീ തന്നെയാണ്. ഒരു കുടുംബത്തിൽ ഏറ്റവും പ്രധാനമായി കണക്കാക്കപ്പെടുന്നത് സ്ത്രീയാണ്.</p><p><strong>ചോദ്യം:</strong> സ്ത്രീ അബലയാണോ? സൃഷ്ടിയിൽ ഏറ്റവും അവസാനത്തേതും, ഏറ്റവും ശക്തവും ഏറ്റവും പ്രധാനപ്പെട്ട ഒരു സൃഷ്ടിയുമാണ് സ്ത്രീ. ഭൗതിക തലങ്ങളിൽ ബന്ധപ്പെട്ട് നിൽക്കുന്ന പുരുഷ വർഗ്ഗത്തിന് ഉന്നതമായ ആത്മീയതലത്തിലേക്ക് ബന്ധിപ്പിക്കുന്ന ദൈവത്തിന്റെ ഒരു പ്രത്യേക ഉപകരണം അല്ലേ സ്ത്രീ?</p><p><strong>ഉത്തരം:</strong> ദൈവം ആദ്യം ഒരാളെ സൃഷ്ടിച്ചു. ആ ആണിൽ നിന്നുമാണ് കുറച്ച് ശക്തിയെടുത്ത് സ്ത്രീയെ സൃഷ്ടിച്ചത്. ആ സ്ത്രീയെ സൃഷ്ടിച്ചത് തന്നെ അയാൾക്ക് കൂട്ടായിട്ടാണ്. ഇത് എന്തിനാണ് ചിന്തിച്ചാൽ ബാക്കി കാര്യങ്ങൾ നമുക്ക് കിട്ടും. സ്ത്രീ അബല എന്നല്ല. പുരുഷനെ സഹായിയ്ക്കാൻ പുരുഷന്റെ കീഴിൽ നിൽക്കുന്ന സ്ത്രീ, ആ സ്ത്രീയെ അബല എന്ന് എങ്ങനെ പറയാൻ പറ്റും? പുരുഷൻ അമേരിക്കൻ പ്രസിഡെന്റ് ആണെങ്കിൽ അയാളുടെ ഭാര്യയുടെ ശക്തിയും നിലയും നമ്മുടെ ഈ ഗ്രൂപ്പിലുള്ള സാധാരണ ഒരു സ്ത്രീയ്ക്ക് കിട്ടുമോ? ബാക്കിയുള്ള സ്ത്രീകളെ വച്ച് നോക്കുമ്പോൾ വലിയ നിലയിൽ ആയിരിയ്ക്കും ആ സ്ത്രീ. പല കാര്യത്തിലും അധികാരങ്ങളും കാണും, എന്തെല്ലാം കിട്ടും. ഭർത്താവ് ഒരു പടി മുകളിൽ നിൽക്കണം എന്നേയുള്ളൂ, വേറൊന്നുമല്ല. ഇപ്പോൾ മാതാ അമൃതാനന്ദമയി. എത്രയോ ആൾക്കാരെ നിയന്ത്രിച്ച് എത്രയോ വലിയ നിലയിൽ നിൽപ്പുണ്ട്. നന്മയോ തിന്മയോ എന്തോ ആയിക്കോട്ടെ, സ്ത്രീ നിൽക്കുന്നത് കണ്ടോ? സ്ത്രീയ്ക്ക് സ്ഥാനമില്ലെന്നൊ, അബല അല്ലെന്നുള്ളതോ അല്ല വിഷയം. വിവാഹം കഴിഞ്ഞ് ഒരു തലയായ പുരുഷന്റെ കീഴിൽ ഭാര്യയായി വന്നു കഴിഞ്ഞാൽ, ഒരു പടി താഴെ. എന്തൊക്കെയുണ്ടെങ്കിലും, എത്ര കഴിവുണ്ടെങ്കിലും ആ പുരുഷന്റെ ഒരു പടി താഴെ നിന്നേ കാര്യങ്ങൾ ചെയ്യാൻ പറ്റുകയുള്ളൂ. പുരുഷൻ ഒരുപടി മുകളിൽ നിന്ന് ഇതെല്ലാം ചെയ്യും, ഒരുപടി താഴെ നിന്നുകൊണ്ട് സ്ത്രീയും ചെയ്യും.</p><p><strong>ചോദ്യം:</strong> ശരിയല്ലാത്ത ഒരു കാര്യം പുരുഷൻ ചെയ്യുമ്പോൾ അത് തെറ്റാണെന്ന് ഭാര്യ പറയുന്നത് തെറ്റാണോ? അത് ദൈവനിന്ദ ആയിട്ട് വരുമോ?</p><p><strong>ഉത്തരം:</strong> ഭർത്താവിന്റെ അടുത്ത് നമ്മൾ തെറ്റ് ചൂണ്ടിക്കാണിയ്ക്കുന്നതും അന്യനായ ഒരാളുടെ അടുത്ത് തെറ്റ് ചൂണ്ടിക്കാണിയ്ക്കുന്നതും തമ്മിൽ വ്യത്യാസമുണ്ട്. ഭർത്താവിന്റെ അടുത്ത് തെറ്റ് ചൂണ്ടി കാണിയ്ക്കുമ്പോൾ നമ്മൾ ഭർത്താവിന്റെ കീഴിൽ നിൽക്കുന്നതു കൊണ്ട് അത് ചൂണ്ടിക്കാണിക്കുന്ന രീതിയിൽ വ്യത്യാസമുണ്ട്. അവിടെ കാര്യം പറഞ്ഞ് മനസ്സിലാക്കുന്നത് പോലെ; സ്നേഹത്തിലും, ആ നിലയിലും തെറ്റിനെ പറഞ്ഞു മനസ്സിലാക്കി കൊടുക്കണം. അല്ലാതെ ഭർത്താവിന്റെ അടുത്ത്, "പണ്ടേ നിങ്ങളുടെ സ്വഭാവം ഇങ്ങനെയായിരുന്നു, ഇത് നേരത്തെ എനിയ്ക്ക് മനസ്സിലായിരുന്നു, നിങ്ങൾ കാണിയ്ക്കുന്നത് അത്രയും മണ്ടത്തരം" എന്നൊക്കെയുള്ള അധികാര രീതിയിൽ സംസാരിയ്ക്കുമ്പോഴാണ് അവിടെ പ്രശ്നം വരുന്നത്. അപ്പോൾ സ്ത്രീ ഭർത്താവിന്റെ തൊട്ട് മുകളിലെ നിലയിൽ കയറി സംസാരിയ്ക്കുകയാണ്. അങ്ങനെ സംസാരിയ്ക്കുമ്പോൾ ദൈവീക കണ്ണിൽ അവിടെ പ്രശ്നം വരും. അപ്പോൾ, സ്ത്രീ താഴത്തെ തട്ടിൽ നിന്ന് എങ്ങനെയാണ് ഉപദേശിയ്ക്കേണ്ടത്, അങ്ങനെ ഉപദേശിക്കണം. ഭർത്താവിന്റെ ഭാഗത്തു നിന്ന് ഏതെങ്കിലും ഒരു തെറ്റ് നമ്മൾ കാണുന്നുണ്ട് എങ്കിൽ, തീർച്ചയായും അവരെ ഉപദേശിയ്ക്കണം. അവരുടെ കീഴിൽ തന്നെ നിന്നുകൊണ്ട് അവരെ പഠിപ്പിയ്ക്കുന്ന രീതിയിൽ ആവാതെ, എനിയ്ക്ക് ആത്മീയ കാര്യങ്ങൾ ഇത്തിരി അറിയാം എന്നുള്ള രീതിയിലും പറയാതെ, ഒരു ഭാര്യ എന്നുള്ള രീതിയിൽ നിന്നുകൊണ്ട് ഭർത്താവിനെ ഉപദേശിയ്ക്കുന്നതിൽ യാതൊരു തെറ്റുമില്ല. അങ്ങനെ തന്നെ ചെയ്യണം.</p><p><strong>ചോദ്യം:</strong> പ്രവാചക പദവിയിൽ സ്ത്രീകൾ വരുമോ? ബൈബിളിൽ പ്രവാചകരായ സ്ത്രീകളെക്കുറിച്ച് പറയുന്നുണ്ടല്ലൊ!</p><p><strong>ഉത്തരം:</strong> പുരുഷന്റെ മേൽ അധികാരം വഹിയ്ക്കാനുള്ള അനുവാദം സ്ത്രീയ്ക്ക് ദൈവം കൊടുത്തിട്ടില്ല. സ്ത്രീയ്ക്ക് എപ്പോഴും സ്ത്രീകളെ മാത്രമേ ഉപദേശിയ്ക്കാനും പഠിപ്പിയ്ക്കാനും നേർവഴിയ്ക്ക് നയിയ്ക്കാനും ദൈവം വച്ചിരിയ്ക്കുന്ന ഒരു വഴിയുള്ളൂ. പുരുഷനാണെങ്കിൽ അങ്ങനെയല്ല; പുരുഷന്മാരെയും സ്ത്രീകളെയും ഒരേപോലെ ആത്മീയ മേഖല പഠിപ്പിയ്ക്കാനും അവരുടെ മേൽ അധികാരമെടുക്കാനും ഒരു പുരുഷനും പറ്റും. സ്ത്രീകൾക്ക് ഒരു പുരുഷന്റെ മേൽ അധികാരം എടുക്കാൻ പറ്റാത്തതു കൊണ്ടാണ്, പ്രവാചകന്മാരായിട്ട് ദൈവം സ്ത്രീകളെ തിരഞ്ഞെടുക്കാത്തത്. പ്രവാചകൻ എന്ന് പറയുമ്പോൾ അത്രയും ഉയർന്ന നിലയിൽ ഉള്ളവരായിരിയ്ക്കണം. സ്ത്രീകൾക്ക് എങ്ങനെയായാലും അത് പറ്റില്ലല്ലോ. പുരുഷന്റെ മേൽ അധികാരമില്ലല്ലോ.</p><p>ബൈബിളിൽ പറയുന്നതും, ഇന്ന് ചുറ്റുപാടും മാധ്യമങ്ങളിലും കാണുന്നതും, സ്ത്രീകൾക്ക് പ്രവചന വരം ഉണ്ട് എന്നാണ്. ഇവരാരും പ്രവാചകർ അല്ലല്ലോ. വരം തൽക്കാലമായി കിട്ടുന്നതാണ്. ഈ അന്ത്യകാലത്ത് ദൈവം അതെല്ലാം പിൻവലിച്ചിരിപ്പുണ്ട്. അതെല്ലാം അവരിൽ നിന്നും നഷ്ടപ്പെട്ടു പോകും. കൃപാ കാലത്ത് അങ്ങനെയൊക്കെ ചില കാര്യങ്ങൾ കിട്ടിക്കൊണ്ടിരുന്നതാണ്. യഥാർത്ഥ പ്രവാചക എന്നൊന്നില്ല; പ്രവാചകൻ എന്നേയുള്ളൂ. പൈശാചിക ശക്തികളുടെ കൂടെ നിൽക്കുന്ന ചില പ്രവാചകിമാർ ഉണ്ട്. ദൈവത്തിന്റെ നന്മയിൽ അങ്ങനെ ഇല്ല.</p><p><strong>ചോദ്യം:</strong> എല്ലാ ഉത്തരവാദിത്വങ്ങളും സ്ത്രീകൾ ഒറ്റയ്ക്ക് ചെയ്യുന്നതിൽ തെറ്റുണ്ടോ?</p><p><strong>ഉത്തരം:</strong> ദൈവം കർമ്മങ്ങൾ രണ്ടായിട്ട് കൊടുത്തിട്ടുണ്ട്. ഒന്ന് സ്ത്രീകൾക്ക് ഒരു വിഭാഗം കൊടുത്തു; മറ്റൊന്ന് പുരുഷന്മാർക്ക് ഒരു വിഭാഗം കൊടുത്തു. സ്ത്രീയ്ക്ക് കൊടുത്തതു തന്നെ കൂടുതലാണ്. സ്ത്രീയ്ക്ക് കൊടുത്ത ജോലി ചെയ്യാൻ ബാധ്യസ്ഥയാണ്. വീടും പരിസരവും വൃത്തിയായി സൂക്ഷിയ്ക്കുക, ആഹാരം പാകം ചെയ്യുക, മക്കളെ വളർത്തുക, പ്രസവിയ്ക്കുക, ഭർത്താവ് ഉണ്ടെങ്കിൽ ഭർത്താവിന് ഭൗതികത്തിൽ എന്തെങ്കിലും സഹായം ചെയ്തു കൊടുക്കുക. വലിയ വലിയ ദൗത്യങ്ങൾ സ്ത്രീകൾക്ക് നേരത്തേ കൊടുത്തിട്ടുണ്ട്.</p><p>ഭർത്താവിന്റെ ജോലി എന്ന് പറഞ്ഞു കഴിഞ്ഞാൽ വീട്ടിലേയ്ക്ക് ഭാര്യയ്ക്ക് മക്കൾക്ക് എന്തൊക്കെ ആവശ്യങ്ങളുണ്ട് അതിനുള്ള പണം എത്ര കഷ്ടപ്പെട്ട് ആണെങ്കിലും വിയർത്ത് അധ്വാനിച്ച് സമ്പാദിച്ചു കൊടുക്കുക. എങ്ങനെ വലിയൊരു ജോലിയാണ് ഭർത്താവിന് കൊടുത്തേക്കുന്നത്. നമ്മുടെ അഭിപ്രായത്തിൽ, ഭർത്താവിന്റെ ജോലി സുഖമാണ്. കുറച്ചു ബുദ്ധിയും ആരോഗ്യവും ജോലി ചെയ്യാനുള്ള കഴിവും ഉണ്ടെന്നുണ്ടെങ്കിൽ ദൈവം ഏൽപ്പിച്ച ജോലി എളുപ്പത്തിൽ ചെയ്യാൻ പറ്റും. സ്ത്രീയ്ക്ക് ഇപ്പോൾ ഉള്ള ജോലി കുറച്ച് പാടാണ്. കാരണം, മക്കളെയൊക്കെ വളർത്തി നേർവഴിക്ക് എത്തിയ്ക്കുക എന്ന് പറയുന്നത് വിചാരിയ്ക്കുന്ന പോലെ എളുപ്പമല്ല; നല്ല പാടാണ്. കാരണം, പിള്ളേര് കാണിയ്ക്കുന്ന ഓരോ മണ്ടത്തരങ്ങളും; ക്ഷമയോടും സ്നേഹത്തിലും, അറിവ് നേടിയും, പഠിപ്പിച്ച് എടുക്കാൻ തന്നെ 'വട്ടാവും'. അത് അമ്മമാർക്ക് അറിയാം. ഇതോടൊപ്പം തന്നെ, വീട് വൃത്തിയാക്കുക തുണികൾ കഴുകിക്കൊടുക്കുക, കുട്ടികളുടെ കാര്യങ്ങൾ നോക്കുക; മൊത്തം അധികപ്പണിയാണ്. ഭർത്താക്കന്മാർക്ക് ഒന്നും അറിയേണ്ട; രാവിലെ വീട്ടിൽ നിന്ന് പോയി വൈകുന്നേരം കയറി വന്നാൽ മതി. ശരിയ്ക്കും മനസ്സിലാവാത്ത കാര്യം എന്താണെന്ന് വച്ചു കഴിഞ്ഞാൽ ഇത്രയും ജോലികൾ കിടക്കവേ, ഭർത്താക്കന്മാരുടെ ജോലിയും കൂടെ സ്ത്രീകൾക്ക് ചെയ്തേ പറ്റൂ: "വരുമാനം കൂടി എനിയ്ക്ക് കണ്ടെത്തണം' എന്ന് സ്ത്രീ ചിന്തിയ്ക്കുന്നത് ശരിക്കും മാനസികമായിട്ട് ഇത്തിരി പ്രശ്നമുണ്ടെന്ന് നമുക്ക് തോന്നുകയുള്ളൂ. ഇല്ലെന്നുണ്ടെങ്കിൽ, സ്ത്രീയ്ക്ക് ഏൽപ്പിച്ച ജോലി ഒന്നും ചെയ്യാതെ; ഈ ആണുങ്ങളുടെ ജോലി മാത്രം ചെയ്യാനായിരിയ്ക്കും സ്ത്രീയുടെ പദ്ധതി. അങ്ങനെ വരുമ്പോഴേക്കും പ്രകൃതിയുടെ വ്യവസ്ഥ തെറ്റി. സ്ത്രീയ്ക്ക് ദൈവം ഏൽപ്പിച്ച കടുത്ത ജോലി സ്വതവേ ഉണ്ട്. ഇതിനും പുറമേ, ഭർത്താവ് ഉഴപ്പുന്ന ഇടത്ത് സാമ്പത്തികം കൂടെ കണ്ടെത്തി ഉണ്ടാക്കി വരിക എന്ന് പറയുമ്പോൾ; സ്ത്രീ ഇരട്ടി പണി ചെയ്യുകയാണ്. അങ്ങനെ വരുമ്പോൾ ആ സ്ത്രീ ഭൂമിയിൽ നരകം അനുഭവിയ്ക്കുകയാണ്. അല്ലാതെ, ഇരട്ടിപ്പണിയും മൂന്നിരട്ടിപ്പണിയും ചെയ്യുക എന്ന് പറയുന്ന ഒരു സ്ത്രീക്ക് മാനസികമായ രോഗമാണെന്നേ നമുക്ക് പറയാൻ പറ്റുകയുള്ളൂ.</p><p><strong>ചോദ്യം:</strong> സത്യയുഗത്തിൽ എത്താൻ സ്ത്രീ പുരുഷന്മാർ കുടുംബ ജീവിതത്തിൽ പാലിക്കേണ്ട പ്രധാന നിയമം എന്താണ്?</p><p><strong>ഉത്തരം:</strong> ഈ വ്യവസ്ഥകളും കാര്യങ്ങളും ഒക്കെ കേട്ടാൽ ആത്മീയമായി വളർച്ച വരും. ആത്മീയ വളർച്ച വന്ന ഒരു ആത്മാവ് സ്ത്രീയാണെങ്കിൽ, ആ വ്യക്തിക്ക് ഭർത്താവ് ജോലി ചെയ്യുന്നതു പോലെ സമ്പാദിക്കണം എന്നുള്ള ആഗ്രഹവും ആ മനസ്സും പൂർണ്ണമായിട്ട് അങ്ങോട്ട് മാറിപ്പോകും. പകരം, മക്കളുടെ കാര്യങ്ങൾ നല്ലപോലെ നോക്കണം, വീടും പരിസരവും വൃത്തിയായി സൂക്ഷിയ്ക്കണം, ഇങ്ങനെയൊക്കെയുള്ള അതിലോട്ടേ ആത്മാവിന് താത്പര്യം വരികയുള്ളൂ. ആത്മീയ വളർച്ചയില്ലാത്ത സ്ത്രീകളാണ് ഭൗതിക കാര്യങ്ങൾക്ക് വേണ്ടി തെറ്റി, തെറ്റായിക്കൊണ്ട് ഓടിക്കൊണ്ടിരിക്കുന്നത്. പുരുഷന്മാരും അങ്ങനെ തന്നെയാണ്. ആത്മീയ വളർച്ച വന്ന ഒരു പുരുഷൻ, യഥാർത്ഥ ആത്മീയ വളർച്ച വന്നാൽ പിന്നെ സ്വന്തം ഭാര്യയെ ഇരട്ടപ്പണി കൊടുത്തു ദ്രോഹിയ്ക്കാൻ ശ്രമിയ്ക്കുകയില്ല. മാത്രവുമല്ല, ഭാര്യ ചെയ്യേണ്ട ജോലി ഭർത്താവിന് ചെയ്യാൻ തോന്നുകയുമില്ല. ആത്മീയ വളർച്ച വന്ന ആൾക്കാരുടെ കാര്യമാണ് ഈ പറയുന്നത്. ഇത് താനേ വരുന്ന ഒരു മാനസികാവസ്ഥയാണ്. ഇപ്പോൾ അങ്ങനെ ഒരു അവസ്ഥ വരുന്നില്ല എന്ന് വെച്ചാൽ, ആത്മീയ വളർച്ച വന്നിട്ടില്ല എന്നർത്ഥം. ആത്മാവായിട്ട് ആ ഒരു നിലയിൽ ഒന്നും ആകുന്നില്ല. ആവാത്ത കാലത്തോളം ഈ വ്യവസ്ഥ തെറ്റിയേ ജീവിയ്ക്കുകയുള്ളൂ.</p><p>ഒരു കുടുംബത്തിൽ ഇപ്പോൾ പുരുഷന് ആത്മീയ വളർച്ച വന്നു എന്ന് വച്ചോളൂ. ആ സ്ത്രീയ്ക്ക് ആത്മീയ വളർച്ച വന്നില്ല എന്നുണ്ടെങ്കിൽ അവർ തമ്മിൽ ഒന്നിച്ചു പോകുന്നത് വളരെ പാടായിരിയ്ക്കും. കാരണം അങ്ങോട്ട് പൊരുത്തപ്പെടുകയില്ല. രണ്ടുപേരും ഒരേപോലെ ആ വളർച്ച വന്നാലേ ഒരു കുടുംബത്തിൽ നല്ല കൃത്യമായിട്ട് സുഖമായിട്ട് പോകാൻ പറ്റുകയുള്ളൂ. ആത്മീയ വളർച്ച വരുന്ന ഒരു വ്യക്തിയ്ക്ക് ആത്മീയ വളർച്ച ഇല്ലാത്തവരുടെ കൂടെ ജീവിയ്ക്കുന്നത് നരകതുല്യമായിരിയ്ക്കും. ഒന്നുകിൽ രണ്ടുപേരും ആത്മീയ വളർച്ച ഇല്ലാത്ത ശിശുക്കളെപ്പോലെ എല്ലാവരും ചെയ്യുന്നത് പോലെ ഭൗതികത്തിൽ തോന്നുന്നത് പോലെ അങ്ങ് ജീവിച്ചു പോവുക. അതിന്റേതായ കഷ്ടങ്ങളും കാര്യങ്ങളും അങ്ങ് നേരിടുക. അങ്ങനെയുള്ള കുടുംബങ്ങളിൽ എപ്പോഴും പ്രശ്നങ്ങളും വിഷയങ്ങളും രോഗങ്ങളും അങ്ങനെയുള്ള കാര്യങ്ങൾ വന്നു കൊണ്ടേയിരിയ്ക്കും. അവർ പലരും നിയമം പാലിയ്ക്കാൻ സന്നദ്ധരല്ല. കാരണം, എത്ര നാൾ കാത്തിരുന്ന് പരീക്ഷ എഴുതിയ ജോലിയാണ് കിട്ടിയിട്ടുള്ളത്. അത് കളയാനുള്ള മനസ്സ് ഒന്നും വരില്ല. അവർ പറയുന്നത് ഇങ്ങനെ ആഗ്രഹിച്ചു കിട്ടിയ ജോലി ഒന്നും കളയാൻ പറ്റുകയില്ല, മരണം വരെ ഇങ്ങനെയുള്ള ദുരിതം അനുഭവിച്ചു കൊള്ളാം.</p><p>അമ്മ ശരി ഇല്ലാതെ വരുമ്പോഴേയ്ക്കും കുറച്ചു കഴിഞ്ഞു മക്കളിൽ പൈശാചികത കയറി വരും എന്നതിൽ മാറ്റം ഒന്നുമില്ല. കാരണം, ദൈവം - പ്രകൃതി പറയുന്നതാണ്. കുട്ടികൾ വഴി തെറ്റി പോകുന്നതിന്റെ മുഖ്യ കാരണം അമ്മമാരുടെ സ്വാധീനം കുടുംബത്തിൽ വരാത്തതുകൊണ്ടാണ്. അമ്മമാർ രാവിലെ ഇറങ്ങിപ്പോകുമ്പോൾ മക്കളെ നയിക്കേണ്ട അവിടെ തെറ്റിപ്പോവുകയാണ്. കാരണം, വീട്ടിൽ മറ്റുള്ളവർ നോക്കുന്നത് ഒന്നും അമ്മ നോക്കുന്നത് പോലെ വരില്ല. അമ്മയ്ക്ക് അറിവും വിവരവും ഒന്നും കാണില്ല. അമ്മ തോന്നിയത് പോലുള്ള ജീവിതം, ഭർത്താവ് നേരെ തല തിരിച്ചുള്ള വേറൊരു ജീവിതം. ഇത് കണ്ട് വളരുന്ന മക്കളും തല തിരിഞ്ഞു പോവില്ലേ? വേറെ ഒരു മാറ്റവും ഒന്നുമില്ല. ഇതൊക്കെ അനുഭവിക്കേണ്ടതായി വരും. കാരണം, എല്ലാവർക്കും ഈ നിയമം പാലിയ്ക്കാൻ പറ്റില്ല. അത് പറ്റണമെന്നുണ്ടെങ്കിൽ ദൈവത്തോട് അത്രയും തീക്ഷ്ണതയും ദൈവത്തോട് അത്രയും ആത്മാർത്ഥതയും ഉണ്ടാവണം. ഒരു ആത്മീയ വളർച്ച വ്യക്തിക്ക് വരുമ്പോഴേ ആ മനസ്സ് മാറി വരികയുള്ളൂ. പറഞ്ഞു മാറ്റിച്ച് പഠിപ്പിച്ചു മാറ്റിക്കാവുന്ന സാധനമല്ല. സത്യയുഗത്തിലേയ്ക്ക് ദൈവം പദ്ധതിയിട്ട് വച്ചിരിക്കുന്ന ചില ആത്മാക്കൾക്ക് ഇത് കേട്ട് കഴിയുമ്പോൾ അവരുടെ ഉള്ളിൽ തന്നെ ആ മാറ്റം വന്നിരിയ്ക്കും, എന്നാണ് ദൈവം പറയുന്നത്. മാറ്റം വന്നില്ല എന്നാൽ വിചാരിച്ചു കൊള്ളണം, സത്യയുഗത്തിലേയ്ക്ക് ആ കുടുംബത്തിന് സാധ്യതയില്ല.</p><p><strong>ചോദ്യം:</strong> സ്ത്രീകൾക്ക് ദൈവത്തിൽ നിന്ന് ആത്മീയ ദർശ്ശനങ്ങൾ ലഭിയ്ക്കുമോ?</p><p><strong>ഉത്തരം:</strong> സ്ത്രീകൾക്ക് ദൈവത്തിൽ നിന്ന് ദർശ്ശനങ്ങൾ കിട്ടില്ലെന്ന് ആരു പറഞ്ഞു? ഒരു പുരുഷനെ സ്ത്രീ ശബ്ദത്തിൽ വന്ന് പഠിപ്പിയ്ക്കുന്നു എന്ന് പറയുമ്പോൾ അവിടെ കുറച്ച് സംശയിയ്ക്കാൻ ഉണ്ട്. കാരണം, പുരുഷനു മേൽ സ്ത്രീയ്ക്ക് അധികാരമില്ലല്ലോ. പക്ഷേ ഒരു സ്ത്രീയ്ക്ക്, പുരുഷ ശബ്ദത്തിലോ സ്ത്രീ ശബ്ദത്തിലോ കിട്ടിക്കഴിഞ്ഞാൽ അവിടെ വിശ്വസിയ്ക്കാം. ദൈവം ആ നിയമത്തിലൂടെ പ്രവർത്തിയ്ക്കുകയുള്ളൂ. ദൈവം ഒരു നിയമം എഴുതി വച്ചിട്ട് ഒരു വ്യക്തിക്ക് മാത്രമാണ് നിയമം തെറ്റി കാര്യം നടക്കും എന്ന് പറയുമ്പോൾ, അവിടെ സംശയിക്കേണ്ടിയിരിയ്ക്കുന്നു. നിങ്ങൾക്ക് കിട്ടിയ കാര്യങ്ങൾ നിങ്ങൾ മനസ്സിൽ വച്ചേക്കുക, എന്നിട്ട് മുന്നോട്ടു പോവുക. ബാക്കി നിങ്ങളുടെ ജീവിതവും കാര്യങ്ങളും ദൈവത്തിന്റെ വ്യവസ്ഥയിൽ തന്നെയാണ് പോകുന്നത് എന്നുണ്ടെങ്കിൽ കുഴപ്പം ഒന്നുമില്ല. അതല്ല ദർശ്ശനങ്ങളും കാര്യങ്ങളൊക്കെ കിട്ടിയതിനു ശേഷം വ്യവസ്ഥകളിൽ ശരിയെന്ന് തോന്നുന്നതെല്ലാം തെറ്റിപ്പോകുന്നു, അല്ലെങ്കിൽ തെറ്റായിട്ടുള്ള ദർശ്ശനങ്ങൾ കിട്ടുന്നു. ഇപ്പോൾ ഈ ആത്മീയ ഗുരുക്കന്മാർക്ക് തെറ്റായ ദർശനം കിട്ടി ഒരുപാട് വഴിതെറ്റി പോവുകയല്ലേ? അപ്പോൾ, അതേ പോലെ, സ്വയം ദൈവമാകണം, ഞാൻ തന്നെയാണ് സൃഷ്ടാവായ ദൈവം, അങ്ങനെയൊക്കെ കയറിവരുന്നുണ്ടെങ്കിൽ ഒന്ന് സൂക്ഷിക്കേണ്ടിയിരിക്കുന്നു.</p><h4>വഴിതെറ്റിപ്പോകുന്ന ആത്മീയർ</h4><p>നമ്മുടെ ഈ കാലഘട്ടത്തിൽ ഒരുപാട് ആത്മീയ ആൾക്കാർ വഴി തെറ്റി പോകുന്നുണ്ട്. പക്ഷേ പുറമെ നമ്മൾക്ക് നോക്കുമ്പോൾ അറിയാം, അവർ കാണിക്കുന്നത് അത്രയും മണ്ടത്തരങ്ങളും തെറ്റുകളും ആണെന്ന്. വ്യക്തമായി ശബ്ദം കേട്ടും, വ്യക്തമായി ചില ദർശ്ശനം കണ്ടുമാണ്, അവരിതെല്ലാം ചെയ്തുകൊണ്ടിരിയ്ക്കുന്നത്. അവരെ നമ്മൾക്ക് പറഞ്ഞു മനസ്സിലാക്കിയ്ക്കുവാൻ പറ്റില്ല. പുറമേ നിന്ന് നമ്മൾ നോക്കുമ്പോൾ അറിയാം ഇവർ കാണിയ്ക്കുന്നതെല്ലാം വചനവിരുദ്ധമാണ്. പക്ഷേ, അവർക്ക് അത് അറിയാൻ പറ്റില്ല, കാരണം അവർ കാണുന്ന കാര്യം അവർ ചെയ്യുന്നു. അവർക്ക് കിട്ടുന്ന ദർശ്ശനം അനുസരിച്ച് അവർ മുന്നോട്ടു പോകുന്നു. ഇതെങ്ങനെ നമുക്ക് മാറ്റാൻ പറ്റും? നമുക്കൊന്നും ചെയ്യാൻ പറ്റില്ല. അവരെ അവരുടെ വഴിയ്ക്ക് വിടുക. ദൈവത്തിന് ആവശ്യമുണ്ടെങ്കിൽ അവരെയൊക്കെ നന്നാക്കിച്ച് എടുത്തുകൊള്ളും. ഇത്രയേ ഉള്ളൂ.</p><h4>യേശുവിന്റെ അമ്മ മറിയം</h4><p>യേശുവിന്റെ അമ്മയെ കുറിച്ച് ഒരുപാട് കാര്യങ്ങൾ പറയാൻ പറ്റും. ആദ്യമായിട്ട്, ഇവർ പിതാവായ ദൈവത്തെ പൂർണ്ണ ആത്മാവോടും, പൂർണ്ണ മനസ്സോടും, പൂർണ്ണ ശക്തിയോടും കൂടെ സ്നേഹിച്ചിരുന്ന ഒരു സ്ത്രീയായിരുന്നു. അവരുടെ ജീവിതത്തിൽ എന്ത് സംഭവിച്ചാലും ഇത് യാദൃശ്ചികമാണ് എന്ന് പറയില്ല. അവർ എപ്പോഴും ഇത് ദൈവം നിശ്ചയിച്ചു, ദൈവത്തിന്റെ ഇഷ്ടം നിറവേറട്ടെ; എന്ന് മാത്രമേ പറഞ്ഞിട്ടുള്ളൂ. അങ്ങനെ പറഞ്ഞ് ശീലിച്ചു ശീലിച്ചു വളർന്നതാണ്. ഇവർ ഇങ്ങനെ വളരണമെങ്കിൽ ഇവരുടെ അച്ഛനമ്മമാർ ഏറ്റവും കൂടുതൽ ദൈവത്തിന്റെ നിയമം അനുസരിച്ച് ജീവിച്ചിരുന്ന ഒരു മാതാപിതാക്കളായിരുന്നു.</p><p>മറിയം എല്ലാ കാര്യത്തിലും ദൈവത്തെ മാത്രമാണ് മനസ്സിൽ പ്രധാനമായി കൊണ്ട് നടന്നിട്ടുള്ളത്. മറ്റുള്ളവർ എന്ത് സഹായം ചോദിച്ചാലും അവർക്ക് വേണ്ടി പ്രാർത്ഥിയ്ക്കുകയും, അവരുടെ കാര്യങ്ങൾ സാധിച്ചു കൊടുക്കുകയും, അവരെ സ്നേഹിയ്ക്കുകയും, അവർക്ക് എന്തെങ്കിലും ഭൗതിക ആവശ്യങ്ങൾ ഉണ്ടെങ്കിൽ അത് അപ്പോൾ തന്നെ കൊണ്ട് കൊടുക്കുകയും; അങ്ങനെ ഒരുപാട് നല്ല ശീലങ്ങൾ മറ്റുള്ളവർക്ക് കാണിച്ചു കൊടുക്കുകയും; സ്വന്തം ജീവിതത്തിൽ പ്രവർത്തിയ്ക്കുകയും അവർ ചെയ്തിട്ടുണ്ട്.</p><p>അവർ യൗസേഫ് എന്ന അവരുടെ ഭർത്താവ് ഒഴികെ വേറെ ഏതൊരു പുരുഷനെയും മനസ്സുകൊണ്ട് പോലും ചിന്തിച്ചിട്ടില്ലാത്ത ഒരു വിശുദ്ധ സ്ത്രീയായിരുന്നു. ഒരു ഭർത്താവിന്റെ അടുത്ത് എങ്ങനെ ഇടപഴകണം, എന്തൊക്കെ ചെയ്യണം, എങ്ങനെയൊക്കെ ആയിരിയ്ക്കണം എന്നതിനെക്കുറിച്ച് ഇവർ നൂറു ശതമാനം കൃത്യമായിട്ട് ചെയ്തു. അതേപോലെ ഒരു കുട്ടിയെ എങ്ങനെ വളർത്തണം എന്നുള്ളത് കാണാം. യേശുവിനെ എടുത്താൽ, എല്ലാ നിയമങ്ങളും ഇവർക്ക് അറിയാം അറിയാവുന്നതെല്ലാം കുഞ്ഞിലേ ഇരുന്നപ്പോൾ യേശുവിന് പറഞ്ഞു കൊടുക്കുകയും, സകലമായ കാര്യങ്ങളിൽ ഒരമ്മ എങ്ങനെയായിരിയ്ക്കണം എന്ന് മറ്റുള്ളവരെക്കൊണ്ട് പറയിപ്പിയ്ക്കുകയും ഇവരത് മാതൃകയായി ചെയ്യുകയും ചെയ്തിട്ടുണ്ട്. വളർന്നു വരുമ്പോഴേയ്ക്കും യേശു തന്നെ അമ്മയെ കുറിച്ച് ഒരുപാട് നല്ല കാര്യങ്ങൾ പറഞ്ഞിട്ടുണ്ട്. എന്റെ അമ്മയാണ്, എന്റെ അമ്മയുടെ പ്രാർത്ഥനയാണ് ആത്മീയതയുടെ കാരണം. ഇതുമാത്രമല്ല, ഒരുപാട് ഒരുപാട് കാരണങ്ങളുണ്ട്. അതുകൊണ്ടാണ് സോഫി ടീച്ചറുടെ പ്രാർത്ഥനയിൽ ദൈവം, മറിയം ഒരു ഉദാഹരണമാണെന്ന് പറഞ്ഞിട്ടുള്ളത്.</p><p>മറിയം ഒരിക്കലും "എന്നോട് നിങ്ങൾ പ്രാർത്ഥിയ്ക്കുക" എന്നോ, "എന്റെ അടുത്ത് ഒരു ഉടമ്പടി വയ്ക്കണം" എന്നോ "എന്റെ വിഗ്രഹം ഉണ്ടാക്കി വച്ച് ഇങ്ങനെയൊക്കെ ചെയ്യണം" എന്നോ ഒരിയ്ക്കലും എവിടെയും പറഞ്ഞിട്ടില്ല. അഥവാ എവിടെയെങ്കിലും അങ്ങനെ പറഞ്ഞിട്ടുണ്ടെങ്കിൽ, അത് യേശുവിന്റെ അമ്മയാകാൻ സാധ്യതയില്ല. ഭൂമിയിൽ പലരോടും ഇവർ സംസാരിച്ചിട്ടുണ്ട്, പ്രത്യക്ഷപ്പെട്ടിട്ടുണ്ട്. ഇവർ പറയുന്ന കാര്യങ്ങൾ എന്താണെന്ന് വച്ചാൽ: "നിങ്ങൾ പിതാവായ ദൈവം വച്ച നിയമങ്ങൾ അനുസരിച്ച് നടക്കുക. ദൈവത്തിന്റെ ഇഷ്ടം അനുസരിച്ച് നടക്കൂ. നിങ്ങൾ പാപം ചെയ്യല്ലേ! യേശു പറഞ്ഞിരിയ്ക്കുന്ന കാര്യങ്ങൾ മനസ്സിലാക്കാൻ നിങ്ങൾ ബൈബിൾ വായിച്ചിരിയ്ക്കണം. നിങ്ങൾ സദാ പ്രാർത്ഥിയ്ക്കണം." എന്നുള്ള നല്ല കാര്യങ്ങളൊക്കെ പറഞ്ഞു തന്നിട്ടുണ്ട്. "ന്യായവിധി ശിക്ഷയുടെ കാലങ്ങൾ തുടങ്ങാൻ പോകുന്നു. അതിൽ നിന്ന് രക്ഷപ്പെടാൻ നിങ്ങൾ ഇങ്ങനെ ചെയ്യൂ. പിതാവായ ദൈവത്തോട് കൂടുതൽ അടുക്കൂ." എന്നുള്ള ഒരുപാട് കാര്യങ്ങൾ പറഞ്ഞു തന്നിട്ടുണ്ട്. ഇപ്പോൾ ഇതൊക്കെയാണ് ഇവർ നമ്മളോട് പറഞ്ഞു തരുന്നത്. നമ്മളെ ഒരുക്കുന്നു. എങ്ങനെ ഒരുക്കുന്നു? ദൈവത്തിന്റെ നിയമങ്ങൾ അനുസരിച്ച് ജീവിയ്ക്കാൻ വേണ്ടിയുള്ള ഒരു ഒരുക്കത്തിന് സഹായിയ്ക്കുന്ന ഒരാളായിട്ടേയുള്ളൂ. അല്ലാതെ വേറെ ഈ ലോകത്ത് പറഞ്ഞു നടക്കുന്ന കത്തോലിക്ക സഭയിൽ പോലും പറഞ്ഞു നടക്കുന്ന കാര്യങ്ങളൊന്നും ശരിയല്ല.</p><h4>ബൈബിളിൽ സസ്യാഹാരം</h4><p>ബൈബിളിൽ പറഞ്ഞിരിയ്ക്കുന്ന യഹൂദ മതമാണെങ്കിലും, യേശുവിന് ശേഷമുള്ളവരൊക്കെ; ഭൗതിക കുടുംബത്തിൽ കടമകൾ ശരിയായിട്ട് ചെയ്തു മുന്നോട്ടു പോകുന്നരീതിയിലുള്ള കാര്യങ്ങളാണ് പറയുന്നത്, പഠിപ്പിയ്ക്കുന്നത്. അല്ലാതെ വീടും നാടും മക്കളെയും കുടുംബവും ഒക്കെ ഉപേക്ഷിച്ചിട്ട് ഒറ്റയ്ക്ക് ദൈവത്തെ മാത്രം ധ്യാനിച്ച്, ദൈവത്തെ മാത്രം ആശ്രയിച്ച്, ദൈവത്തിലേയ്ക്ക് പോകുന്നവരുടെ ഏറ്റവും ഉയർന്ന തലമല്ല ബൈബിളിൽ പഠിപ്പിയ്ക്കുന്നത്. ഖുർആനും അങ്ങനെയല്ല. കാരണം, ഏറ്റവും ഉയർന്ന തലത്തിലേയ്ക്ക് പോകേണ്ട സമയമാകുമ്പോഴാണ് നമ്മൾ പൂർണ്ണമായും സസ്യാഹാരവും അല്ല - പഴവർഗ്ഗങ്ങളും, വെള്ളവും മാത്രം കുടിച്ച് കഴിയുന്ന അവസ്ഥയിലേയ്ക്ക് എത്തേണ്ടത്. അതിനു മുമ്പ് ചെയ്തു തീർക്കേണ്ട ഒരുപാട് കർമ്മങ്ങൾ പൂർത്തീകരിയ്ക്കാൻ ഉണ്ട്. അതിന്, ആത്മീയത്തിലുള്ള ശിശുക്കൾക്ക് വേണ്ടിയുള്ള പഠിപ്പുകളും പഠനങ്ങളും ഒക്കെയാണ് ബൈബിളിലും ഖുർആനിലും ഉള്ളത്. അതുകൊണ്ട്, അതിൽ സസ്യാഹാരത്തിനെ കുറിച്ച് പറയുന്നില്ല. പൗലോസ്, ബൈബിളിൽ പറയുന്നുണ്ട് സസ്യാഹാരമായാലും മാംസാഹാരമായാലും അവനവന്റെ ഇഷ്ടം പോലെ ചെയ്യാം.</p><h4>സ്വപ്നം - ദർശ്ശനങ്ങൾ</h4><p>സ്വപ്നം എന്ന് പറയുന്നത് നമ്മുടെ ആത്മാവ് നമ്മളോട് ആശയവിനിമയം നടത്തുന്നതാണ്. ആത്മാവിന് നമ്മളോട് പല കാര്യങ്ങളും പറഞ്ഞുതരാൻ ഉണ്ട്. ഭാവിയിൽ സംഭവിയ്ക്കാനുള്ളത് ഉണ്ട്, ഇപ്പോൾ പറ്റിക്കൊണ്ടിരിക്കുന്ന തെറ്റുകൾ പറഞ്ഞു തരാൻ ഉണ്ട്, ചിലപ്പോൾ മുജ്ജന്മത്തിൽ എന്തെങ്കിലും കാണിച്ചിട്ടുണ്ടെങ്കിൽ അത് കാണിച്ചു തരും, നമുക്ക് എന്തെങ്കിലും പൈശാചികങ്ങൾ ഇപ്പോൾ നിൽപ്പുണ്ടെങ്കിൽ അത് കാണിച്ചു തരും, നമ്മൾ എങ്ങനെ നന്നാകണം എന്ന് പറഞ്ഞു തരും. നമ്മളുടെ സുഹൃത്ത് എന്ന നിലയിൽ അല്ലെങ്കിൽ നമ്മൾ തന്നെയാണ് നമ്മളെ സഹായിയ്ക്കുന്നത് എന്ന രീതിയിൽ സകല കാര്യങ്ങളും ആശയവിനിമയം നടത്താനുള്ള ഒരു മാധ്യമമാണ് സ്വപ്നം എന്നു പറയുന്നത്. ആത്മാവിന് എവിടെ നിന്ന് ഈ വിവരങ്ങൾ കിട്ടുന്നു എന്ന് വെച്ചാൽ; മറ്റ് അദൃശ്യ ശക്തികൾക്ക് ആത്മാവുമായിട്ട് ബന്ധമുണ്ട്. നമുക്ക് നേരിട്ട് ബന്ധം ഒന്നുമില്ല. ദൈവത്തിൽ നിന്നും കിട്ടിയ വിവരങ്ങൾ, മറ്റ് ദൂതന്മാരിലൂടെ - ദേവന്മാരിലൂടെ നമ്മുടെ ആത്മാവിന് കിട്ടിയിട്ട്, ഈ ആത്മാവ് നമുക്ക് പറഞ്ഞു തരുന്നതാണ് സ്വപ്നങ്ങളെല്ലാം.</p><p>ഇനി ആത്മാവിന് തന്നെ നമ്മളെ വിട്ട് വേറെ ഏതെങ്കിലും മണ്ഡലങ്ങളിൽ സഞ്ചരിയ്ക്കണമെങ്കിൽ, ആത്മാവ് സഞ്ചരിയ്ക്കും. പക്ഷേ നമ്മൾ ഇത് തിരിച്ചറിയുന്നതോ; - നമുക്ക് ഒരു സ്വപ്നം പോലെ തോന്നുകയുള്ളൂ. സ്വപ്നവും, നമ്മുടെ ആത്മാവ് നമ്മളിൽ നിന്നും ഒരു മേഖലയിലേയ്ക്ക് സഞ്ചരിയ്ക്കുന്നതും; അത് കണ്ടുകൊണ്ടിരിയ്ക്കുന്നവർക്കേ അത് തിരിച്ചറിയാൻ സാധിയ്ക്കൂ. അപ്പോൾ നമ്മൾ കാണുന്നതെല്ലാം എന്താണ് ഏതാണെന്ന് വ്യാഖ്യാനിച്ചു മനസ്സിലാക്കി എടുത്താൽ കാര്യങ്ങൾ ശരിയാകും. പക്ഷേ, ഇത് വ്യാഖ്യാനിച്ചു മനസ്സിലാക്കി എടുക്കാൻ പാടാണ്. ഒരാളുടെ സ്വപ്നം പല രീതിയിൽ വരും. അയാൾ കണ്ട കാര്യം വച്ചും, അനുഭവിച്ച കാര്യം വച്ചും, അയാൾ ചോദിച്ച ചോദ്യം വച്ചും, അയാളുടെ കൂടെയുള്ളവരെ വെച്ചും ഒക്കെയാണിത് കാണിച്ചു തരുന്നത്. ഒരാളുടെ സ്വപ്നം വ്യാഖ്യാനിയ്ക്കുക എന്ന് പറയുന്നത് തന്നെ വളരെ പാടാണ്. അയാളുടെ അടുത്ത് സകല വിധ വിശദാംശങ്ങളും ചോദിയ്ക്കണം - കണ്ട കാര്യങ്ങൾ ആദ്യം മുതൽ അവസാനം വരെ, അപ്പോൾ എന്തൊക്കെ തോന്നി, സ്വപ്നത്തിൽ കണ്ട ആളുടെ വസ്ത്രം, ഇതുപോലെ സ്വപ്നത്തിൽ കാണുന്ന സൂക്ഷ്മം ആയിട്ടുള്ള സകല കാര്യങ്ങളും ഓർത്തെടുത്ത് ഗ്രഹിച്ചെടുത്താൽ മാത്രമേ കൃത്യമായ ഉത്തരം കിട്ടുകയുള്ളൂ. സത്യം പറഞ്ഞാൽ അത് ഇത്തിരി പാടാണ്. പക്ഷേ നമ്മൾ അതിനു വേണ്ടി ശ്രമിച്ച് കണ്ട സ്വപ്നത്തെ അങ്ങനെ ആദ്യാവസാനം ആലോചിച്ച്, ഉണർന്ന ഉടൻ തന്നെ ഒരു പത്ത് പതിനഞ്ച് മിനിറ്റ് കട്ടിലിൽ കിടന്നു കൊണ്ട് തന്നെ, അത് മുഴുവനും ഗ്രഹിച്ച് എടുത്തു വെച്ചാൽ നമുക്ക് ചിലപ്പോൾ അതിൽ നിന്ന് വ്യാഖ്യാനിച്ചു കിട്ടും. പക്ഷേ കുറേ കഴിഞ്ഞ ശേഷം ഒന്നുകൂടെ ആലോചിച്ചു കഴിഞ്ഞാൽ ഇതിന്റെ സൂക്ഷ്മമായ മർമ്മങ്ങൾ എല്ലാം മറന്നു പോകും. ഇതിന്റെ അകത്തു നിന്ന് മർമ്മ ഭാഗങ്ങളെല്ലാം ഓർത്തെടുത്ത് വെച്ചാലേ, അതിൽ നിന്ന് നമുക്ക് ഉത്തരമെടുത്ത് മുന്നോട്ട് പോകാൻ പറ്റുകയുള്ളൂ. പക്ഷേ പറ്റും എന്നുള്ളത് ഉറപ്പാണ്. ഇപ്പോൾ പിശാച് കാണിച്ചു തന്നാലും ശരി, ദൈവത്തിൽ നിന്ന് കാണിച്ചു തന്നാലും ശരി, നമ്മളിനി ഭാവനാ മണ്ഡലത്തിൽ പോയി എന്ത് കണ്ടാലും ശരി, സകല സ്വപ്നത്തിന്റെയും എല്ലാം പിന്നിൽ കാര്യങ്ങൾ ഉണ്ട്; അല്ലാതെ വെറുതെ കാണില്ല. എന്തു കണ്ടാലും അതിന്റെ പിന്നിൽ സംഗതികൾ ഉണ്ടെന്ന് മനസ്സിലാക്കണം.</p><p>വെളിപാട് കാണുക, അല്ലെങ്കിൽ സ്വപ്നം കാണുക എന്നതു കൊണ്ട്, നമ്മുടെ ഈ മൂന്നാം കണ്ണ് കൊണ്ട് ഒരു മണ്ഡലത്തിൽ നിന്നു കൊണ്ട് ചില കാര്യങ്ങൾ കാണുന്നതാണ്. ഇപ്പോൾ ഒരു ടീവി നമ്മൾ വാങ്ങിച്ചു. ആ ടീവി ഓൺ ചെയ്താൽ, റിമോട്ട് വച്ച് ചാനൽ മാറ്റിയാൽ പലതും കാണാമല്ലോ. അതേപോലെ, നമ്മുടെ ഈ സ്വപ്നദർശനം കാണുന്ന മേഖല ഭൗതിക മനസ്സുകൊണ്ട് ഒരാൾക്ക് തുറന്നു കിട്ടിക്കഴിഞ്ഞാൽ, ആ മേഖലയിൽ നടക്കുന്ന എന്തും കാണാം. ആ മേഖല ഒരു ടീവി പോലെയാണ്. ആ മേഖലയിൽ ആത്മാവ് വേണ്ടതെല്ലാം ആ ടീവിയിലൂടെ നമുക്ക് കാണിച്ചു തന്നുകൊണ്ടേയിരിയ്ക്കും. നമ്മുടെ ആത്മാവിന് അത്രയും ബലം ഇല്ലെങ്കിൽ അതിന്റെ ഇടയിൽ കൂടെ നമ്മുടെ ഉള്ളിലുള്ള പൈശാചിക ശക്തികളും, റിമോട്ട് വെച്ച് ചാനല് മാറ്റി വേറെ കാണിച്ച് തരുന്നതു പോലെ ആ ടീവിയിലൂടെ സ്വാധീനിച്ച് അതിലൂടെ കാണിച്ചു തന്നുകൊണ്ടിരിയ്ക്കും. ഇത് ആത്മാവിന് അറിയാം, പക്ഷേ ആത്മാവിന് ഒന്നും ചെയ്യാൻ പറ്റില്ല. അതിനെ മറികടന്നും കൊണ്ട് നമുക്ക് വിവരം തരാനുള്ള അത്രയും ശക്തി ആത്മാവിന് കാണില്ല. ബോധ മനസ്സുകൊണ്ട് നമ്മുടെ വിവരങ്ങളും കാര്യങ്ങളും തിരിച്ചറിഞ്ഞിട്ട് വേണം നമ്മൾ അത് കണ്ടുപിടിച്ച് നിയന്ത്രിയ്ക്കാൻ.</p><p>ഇതേപോലെ നന്മയുടെ ശക്തികൾ തരുന്ന ചില വിവരങ്ങൾ ആത്മാവിലൂടെ അല്ലാതെ തന്നെ ചിലപ്പോൾ ചില സംഗതികൾ സ്വപ്നത്തിലൂടെ കണ്ടെന്നിരിയ്ക്കും. കാര്യം, അത് അവിടെ തുറന്നു കിടക്കുമ്പോൾ, നമ്മുടെ ആത്മാവ് പോയി എന്തും കാണുന്നതാണ്. ചിലപ്പോൾ മറ്റു മണ്ഡലങ്ങളിൽ പോയി അത് കാണും. ഇത് ഒരു മേഖല തുറന്നു കിട്ടുന്നതാണ്. അതാണ് മൂന്നാം കണ്ണ് തുറക്കുന്നത് എന്ന് പറയുന്നത്. മറ്റു മണ്ഡലങ്ങളിൽ ഉള്ളതെല്ലാം ഒരു ടീവി കാണുന്നതു പോലെ നമ്മൾ കാണുകയാണ്. എന്തൊക്കെ ആ മേഖലയിൽ ഉണ്ടോ അതൊക്കെ നമുക്ക് കാണാൻ പറ്റും. ആ മേഖലയിലൂടെയാണ് നമ്മളുടെ ആത്മാവ് നമുക്ക് കാര്യങ്ങളൊക്കെ ഇങ്ങനെ പറഞ്ഞു തന്നുകൊണ്ടിരിയ്ക്കുന്നത്. നമുക്ക് സ്വപ്നം പോലെ അത് തോന്നുമെങ്കിലും, പൈശാചികവും ഉണ്ട്. ഇതൊന്നും നമ്മുടെ ആത്മാവ് കാണിച്ചുതരുന്നതല്ല, ആ തുറന്നു കിടക്കുന്നതിലൂടെ നമ്മുടെ ആത്മാവ് അത് കാണുന്നതാണ്. സ്ഥിരം കാണുന്നവർക്ക് അറിയാം ഇത് സ്വപ്നമാണോ അല്ലാതെ കാണുന്നതാണോ എന്ന്. സ്ഥിരമായിട്ട് ഇങ്ങനെ പല പല ദർശ്ശനങ്ങൾ കാണുന്നവർക്ക് അതിന്റെ വ്യത്യാസം അനുഭവിയ്ക്കാൻ പറ്റും.</p><h4>രണ്ടാം പുനരുദ്ധാനം</h4><p>സുജോ സാർ പറയുന്നത് സത്യയുഗത്തിലേയ്ക്കുള്ള കാര്യങ്ങളാണ്. സത്യയുഗം എന്നുള്ള ആ കാലഘട്ടം അല്ലെങ്കിൽ പുതിയ ആകാശം പുതിയ ഭൂമി എന്ന് പറയുന്ന ആ ഒരു അനുഭവം. അതിലേയ്ക്ക് പ്രവേശിയ്ക്കുന്നവർക്ക് വേണ്ടിയുള്ള നിയമങ്ങൾ വ്യവസ്ഥകൾ ദൈവം സുജോ സാറിന് പറഞ്ഞു തരുന്നത്, നമുക്ക് പറഞ്ഞു തരുന്നതാണ്. ആരെങ്കിലും ആ വ്യവസ്ഥയിൽ ശരിയായി വന്നിട്ടുണ്ടെങ്കിൽ അത് നിങ്ങളുടെ ഭാഗ്യം. നിങ്ങൾ അതിന് യോഗ്യനായി.</p><p>രണ്ടാം പുനരുദ്ധാനം അങ്ങനെയല്ല. ഭൂമിയുടെ അന്ത്യത്തോളം കർമ്മം തെറ്റി കിടക്കുന്നതിന്റെ ഫലമെല്ലാം അനുഭവിച്ചുകൊണ്ടിരിയ്ക്കണം. എന്നിട്ട് അവർക്ക് സ്വർഗ്ഗത്തിൽ തന്നെ പോകാൻ പറ്റും. പക്ഷേ ഭൂമിയിലുള്ള സത്യയുഗം എന്ന ഈ കാലഘട്ടത്തിലേയ്ക്ക് അവരുടെ തലമുറയോ അവരോ പ്രവേശിയ്ക്കില്ല. ആർക്കു വേണം എങ്ങനെ വേണം അത് അവരവരുടെ തിരഞ്ഞെടുപ്പാണ്. അല്ലാതെ ഇതെല്ലാം പറഞ്ഞു തരുമ്പോഴേക്കും, ഈ വ്യവസ്ഥ തെറ്റിക്കിടക്കുന്നവർ കിടന്ന് പിറുപിറുത്തിട്ടോ, ദൈവത്തോട് മറുത്തടിച്ചിട്ടോ, കാര്യമൊന്നുമില്ല. തെറ്റിക്കിടക്കുന്ന കർമ്മത്തിന്റെ ഫലം അവരവർ അനുഭവിച്ചു തീർക്കണം. അതെന്തായാലും അനുഭവിച്ചിരിയ്ക്കും. അവരുടെ മക്കളിലൂടെയോ എങ്ങനെയെങ്കിലും അത് അനുഭവിച്ചു തീരും. എന്നിട്ട് ആ ആത്മാക്കളെ ദൈവം സ്വർഗ്ഗത്തിലോട്ട് കൊണ്ടുപോകും. ഭൂമിയിൽ മൊത്തം കഷ്ടമായിരിയ്ക്കും. അവരുടെ കണ്ണുനീർ സ്വർഗ്ഗത്തിൽ ചെല്ലുമ്പോൾ ദൈവം തുടച്ചു മാറ്റും എന്ന് പറഞ്ഞാൽ, അങ്ങ് കയറുന്നത് വരെയും കരച്ചിൽ ആയിരിയ്ക്കും. ഒരു വിഭാഗം ജനങ്ങൾ അങ്ങനെയേ പോവുകയുള്ളൂ. നമുക്ക് ഇപ്പോൾ അവരെ ഉപദേശിച്ചു നന്നാക്കാൻ ഒന്നും പറ്റില്ല.</p><p>അറിവ് എടുക്കുക, ആ അറിവെടുത്തതിനു ശേഷം എന്ത് വേണമെന്ന് അവരവർ തീരുമാനിയ്ക്കുക. പറ്റാത്തവർ, ദൈവത്തോട് പ്രാർത്ഥിയ്ക്കുക. സാഹചര്യം മാറ്റിത്തന്ന് എനിക്ക് സത്യയുഗം ആസ്വദിയ്ക്കണം അല്ലെങ്കിൽ ഭൂമിയിലെ സുഖം എനിക്ക് വരണം; എനിക്ക് ഒന്നാം പുനരുദ്ധാനത്തിൽ പങ്കു വരണമെന്ന് അവനവൻ ആഗ്രഹിച്ചാൽ, സാഹചര്യത്തിലൂടെ അത് ചെയ്യും. അല്ലാതെ എന്റെ കുടുംബം പ്രശ്നങ്ങളൊന്നുമില്ലാതെ ഇങ്ങനെ പോയാൽ മതി എന്ന് ചിന്തിയ്ക്കുന്നവർക്ക് നാളെ ഇതിന്റെയൊക്കെ ഫലം നിയമത്തിൽ അനുഭവിച്ചറിയേണ്ടതായി വരും.<br>സത്യപ്രകാശം</p>`

        mainPoints: [
            "കൃപയുടെ കാലഘട്ടം (2012-ന് മുമ്പ്): യോഗ്യതയോ അർഹതയോ ഇല്ലെങ്കിൽ പോലും ദൈവം കരുണയാൽ കാര്യങ്ങൾ സാധിച്ചു കൊടുത്തിരുന്ന കാലമായിരുന്നു ഇത്. അന്ന് സാധാരണക്കാർക്ക് മതഗ്രന്ഥങ്ങളിലെ അറിവുകൾ ലഭ്യമല്ലാതിരുന്നതിനാൽ തെറ്റുകൾ ആവർത്തിക്കുമ്പോഴും ദൈവം സംരക്ഷിച്ചിരുന്നു.",
            "ന്യായവിധിയുടെ കാലഘട്ടം (2012 മുതൽ): സാങ്കേതികവിദ്യയിലൂടെയും മാധ്യമങ്ങളിലൂടെയും ഇന്ന് സകലർക്കും അറിവ് ലഭ്യമാണ്. അതിനാൽ ദൈവം സൗജന്യ സംരക്ഷണം പിൻവലിക്കുകയും ന്യായവിധിയുടെ കാലഘട്ടം ആരംഭിക്കുകയും ചെയ്തു. ഇനി യോഗ്യതയുണ്ടെങ്കിലേ കാര്യങ്ങൾ നടക്കുകയുള്ളൂ; ചെറിയ തെറ്റുകൾക്ക് പോലും ഉടനടി ശിക്ഷയും ഫലവും അനുഭവിക്കേണ്ടി വരും.",
            "സ്വയം തൊഴിലും പശ്ചാത്താപവും: മറ്റൊരാളുടെ കീഴിൽ ജോലി ചെയ്യുമ്പോൾ ഉടമയിലെ പൈശാചിക ശക്തികളുടെ സ്വാധീനം വരാൻ സാധ്യതയുള്ളതിനാൽ സ്വയം തൊഴിൽ കണ്ടെത്തുക. പൊങ്ങച്ചവും ശാപവാക്കുകളും ഉപേക്ഷിച്ച്, കഴിഞ്ഞ തെറ്റുകൾക്ക് മനസ്സുരുകി ദൈവത്തോട് മാപ്പ് പറഞ്ഞു പശ്ചാത്തപിക്കുക.",
            "പരിശുദ്ധാത്മാവും കൽക്കിയുടെ വരവും: ദൈവത്തോട് അടുക്കാൻ ശ്രമിക്കുന്നവരിലെല്ലാം ന്യായവിധിയുടെ ആത്മാവ് പ്രവേശിച്ചിട്ടുണ്ട്. യേശു കൃപയുടെ ദൗത്യമായിരുന്നു നിർവ്വഹിച്ചതെങ്കിൽ, വരാനിരിക്കുന്ന കൽക്കിയിൽ (പുതിയ മനുഷ്യനിൽ) അതേ ദൈവാത്മാവ് പ്രവേശിച്ച് ന്യായവിധി നടപ്പിലാക്കും. 300 വർഷങ്ങൾക്ക് ശേഷം ന്യായവിധിയും ശിക്ഷയും ഇല്ലാത്ത പൂർണ്ണ സത്യയുഗം വരും."
        ],
        conclusion: "കൃപയുടെ കാലം അവസാനിച്ചു; ഇനി ന്യായവിധിയുടെ കാലമാണ്. സൗജന്യ സംരക്ഷണം പിൻവലിക്കപ്പെട്ട ഈ കാലഘട്ടത്തിൽ, പ്രകൃതിയുടെ വ്യവസ്ഥകൾ പാലിച്ചും പശ്ചാത്തപിച്ചും യോഗ്യരായി ജീവിക്കുന്നവർക്ക് മാത്രമേ രക്ഷപ്പെടാൻ സാധിക്കൂ.",
        fullContentHtml: `<p><strong>സത്യപ്രകാശം</strong><br><strong>പഠന സംഗ്രഹം</strong><br>2026 ഒക്ടോബർ 25, ചൊവ്വാഴ്ച<br><strong>വിഷയം:</strong> കൃപയുടെ കാലഘട്ടവും ന്യായവിധിയുടെ കാലഘട്ടവും തമ്മിൽ വ്യത്യാസമെന്ത്?</p><p>2012 നു മുമ്പ് ന്യായമായിട്ടല്ല വിധി പോയിക്കൊണ്ടിരുന്നത്, അന്യായമായിട്ടാണ് പോയിക്കൊണ്ടിരുന്നത്. അതിനെയാണ് കൃപ എന്ന് പറയുന്നത്. അതായത്, ഒരുത്തന് അർഹത ഇല്ലെങ്കിൽ പോലും, അവനത് കിട്ടാനുള്ള ന്യായം ഇല്ലെങ്കിൽ പോലും, അവൻ അത് ദൈവം കൊടുക്കുന്ന ഒരു കാലഘട്ടമായിരുന്നു. 2012 മുതൽ ഇനി ന്യായവിധിയുടെ കാലഘട്ടമാണ്. അതായത് ന്യായമായേ ഇനി എല്ലാവർക്കും കാര്യങ്ങൾ നടക്കുകയുള്ളൂ. അന്യായമായി നടക്കില്ല. വെറുതെ പ്രാർത്ഥിച്ചത് കൊണ്ട് കാര്യങ്ങൾ നടക്കില്ല. അവന് അതിന് യോഗ്യതയുണ്ടോ എന്ന് നോക്കിയിട്ടേ ദൈവത്തിൽ നിന്ന് കാര്യങ്ങൾ നടന്ന് കിട്ടുകയുള്ളൂ. 300 വർഷം കഴിയുമ്പോൾ പൂർണ്ണ സത്യയുഗമാണ്. അവിടെ ന്യായവിധിയോ ശിക്ഷയോ ഒന്നുമില്ല. അതിനുമുമ്പ് അതൊക്കെ ചെയ്തു കഴിഞ്ഞിരിയ്ക്കും.</p><p>കൃപയുടെ കാലഘട്ടത്തിൽ ആര് എത്ര തെറ്റ് ചെയ്താലും അവരുടെ പ്രാർത്ഥനയ്ക്ക് ഫലം വരുമായിരുന്നു. നാളെ ഒരു സമയത്ത് അവൻ നന്നാവുമല്ലോ എന്ന് വിചാരിച്ച് പ്രാർത്ഥിയ്ക്കുന്ന ആർക്കും, അല്ലെങ്കിൽ പ്രാർത്ഥന ഇല്ലാത്തവർക്ക് പോലും; അവന്റെ വിഷമം മനസ്സിലാക്കി കാര്യങ്ങൾ ശരിയാക്കി കൊടുക്കുമായിരുന്നു.</p><p>കൃപയുടെ കാലഘട്ടത്തിൽ സകലർക്കും അറിവുകൾ ഇല്ല. ഒരു മതഗ്രന്ഥങ്ങളിലെ കാര്യങ്ങൾ പോലും ആർക്കും അറിഞ്ഞുകൂടാ. ചില അപൂർവ്വ ഗുരുക്കന്മാർക്ക് മാത്രമേ ഇത് അറിയാവൂ. അവരിത് നേരാംവണ്ണം സാധുജനങ്ങൾക്ക് പഠിപ്പിയ്ക്കാറുമില്ല. അതുകൊണ്ടാണ് കൃപയുടെ കാലഘട്ടത്തിൽ, മനുഷ്യൻ തെറ്റിന് പുറമേ തെറ്റ് ആവർത്തിച്ച് പൊയ്ക്കൊണ്ടിരിയ്ക്കുമ്പോൾ, അതിലൂടെ വരുന്ന പൈശാചിക ശക്തികളുടെ ശല്യം അല്ലെങ്കിൽ ആ കർമ്മത്തിന്റെ ഫലം അനുഭവിക്കാതെ ദൈവം അവരെ കാത്തുകൊണ്ടിരുന്നത്. ദൈവം തീരെ നിവൃത്തിയില്ലാത്തവർക്ക് മാത്രമേ കുറച്ചു കുറച്ചായിട്ട് അതിന്റെ ഫലം കൊടുത്തു കൊണ്ടിരുന്നുള്ളൂ. തീരെ രക്ഷയില്ലെന്ന് കാണുന്നവരെ നശിപ്പിച്ച്, അടുത്ത ജന്മം കൊടുത്തു കൊണ്ടു വരും. കാരണം അറിവ് കിട്ടുന്നില്ലല്ലോ!</p><p>ഒരു സ്ഥാപനത്തിന്റെ ഉടമയുടെ കീഴിൽ ജോലി ചെയ്യുന്നവരിലേക്ക് അയാളുടെ പൈശാചിക ശക്തികളുടെ സ്വാധീനം വരും. മക്കളുടെ കഴിവിനെക്കുറിച്ച് പൊങ്ങച്ചം പറയുന്നവരിലേയ്ക്കും, മാതാപിതാക്കളുടെ ശാപവാക്കുകളിലൂടെ മക്കളിലേയ്ക്കും പൈശാചിക ശക്തികളുടെ സ്വാധീനം വരും. കൃപയുടെ കാലഘട്ടം കഴിഞ്ഞതുകൊണ്ട് ഇനി: സ്വയം തൊഴിൽ കണ്ടെത്തുക, പൊങ്ങച്ചം പറയാതിരിയ്ക്കുക, ശാപവാക്കുകൾ പറയാതിരിയ്ക്കുക. ചെയ്തു പോയ തെറ്റുകൾക്ക് മനസ്സുരുകി ദൈവത്തോട് മാപ്പ് പറഞ്ഞു പശ്ചാത്തപിയ്ക്കുക.</p><p>ന്യായവിധി എന്നാൽ ശിക്ഷ മാത്രമല്ല. നന്മയാണെങ്കിലും ന്യായമായ ഒരു വിധിയെ ഇനി നടക്കുകയുള്ളൂ. ഒരുത്തന് ഇനി ഉയർച്ച വരണമെങ്കിൽ ന്യായമായ രീതിയിലേ ഉയർച്ച വരികയുള്ളൂ.</p><p>ഈ ന്യായവിധിയുടെ കാലഘട്ടത്തിൽ ഭൂമിയിൽ വച്ച് തന്നെ ഓരോരുത്തർക്കും അവരുടെ ന്യായമായി വിധിനടപ്പിലാക്കി അവരെ നന്നാക്കിയെടുക്കുകയും. നന്നാകാത്തവർക്ക് മരണശേഷം മറ്റ് മണ്ഡലങ്ങളിൽ കൊണ്ടുപോയിട്ട് വേറെ ഒരു ന്യായവിധിയും ഉണ്ട്. മരിയ്ക്കുന്നതു വരെ ഭൂമിയിൽ തോന്നിയപോലെ ജീവിച്ചിട്ട്, "മരണശേഷം ന്യായവിധി, അത് അപ്പോൾ കണ്ടോളാം" എന്ന് മനുഷ്യൻ ഇങ്ങനെ കുഴിഞ്ഞു ചിന്തിയ്ക്കുമെന്ന് ദൈവത്തിന് നേരത്തേ അറിയാം. അതുകൊണ്ട് ഭൂമിയിൽ വെച്ചു തന്നെ ശരിയ്ക്കുള്ള ന്യായമായ ശിക്ഷയും വിധിയും തുടങ്ങിയിട്ട്, മരണശേഷവും ഇതിന്റെ ബാക്കി തുടരും.</p><p>സൗജന്യ സംരക്ഷണം ദൈവം പിൻവലിയ്ക്കുമ്പോൾ ആൾക്കാർക്ക് എന്ത് കാരണം കൊണ്ടാണ് നമ്മൾക്ക് ഇത്രയും പ്രശ്നങ്ങളും വിഷയങ്ങളും എന്ന് തിരിച്ചറിയാൻ പറ്റുകയില്ല. പക്ഷേ സുജോ സാറിന്റെ മെസ്സേജ് കേൾക്കുന്ന ഒരു വ്യക്തിക്ക് എവിടെയാണ് നമ്മൾ ശരിയാകേണ്ടത് എന്നുള്ള തിരിച്ചറിവ് കിട്ടും. അപ്പോൾ അങ്ങനെ വരുന്നവർ അത് പാലിച്ചു പെട്ടെന്ന് രക്ഷപ്പെടും. ഇത്രയേ ഉള്ളൂ ഗുണം.</p><p>ഇത്രയും നാളും പലർക്കും ഒരു യോഗ്യതയും ഇല്ലാതെ പ്രാർത്ഥനയിലൂടെ കാര്യങ്ങൾ സാധിച്ചു കൊണ്ടിരുന്നത്, ഇനി അങ്ങനെ സാധിയ്ക്കില്ല. ഇനി അങ്ങനെ സാധിയ്ക്കണമെങ്കിൽ അവൻ അത്രയും ആത്മീയമായി ത്യാഗം സഹിയ്ക്കണം. ഒന്നുകിൽ ധനം നഷ്ടപ്പെടുത്തേണ്ടി വരും, ഇല്ലെങ്കിൽ ശാരീരിക പീഡനം, ഇല്ലെങ്കിൽ മാനസിക ക്ലേശം; ഇതിലൂടെ അവൻ അവനെത്തന്നെ വില കൊടുത്താൽ മാത്രമേ ഇനി കാര്യങ്ങളെല്ലാം ശരിയായി വരികയുള്ളൂ. സുജോ സാറിന്റെ മെസ്സേജുകൾ കേട്ട് കാര്യങ്ങൾ ക്രമപ്പെടുത്തി പ്രകൃതിയുടെ വ്യവസ്ഥകൾ അനുസരിച്ച് പോകുന്നവർക്ക് അങ്ങനെ വില കൊടുക്കേണ്ടി വരില്ല. എന്തെങ്കിലും വിഷമങ്ങളൊ പ്രശ്നങ്ങളൊ വരുമ്പോൾ, സുജോ സാറിന്റെ മെസ്സേജിലൂടെ മനസ്സിലാക്കിയ കാര്യങ്ങൾ പാലിച്ച്, അതിനെ അതിജീവിച്ച് മുന്നോട്ടു പോകാൻ പറ്റും.</p><p>ദൈവം ഈ കാലഘട്ടത്തിൽ സാങ്കേതികത വികസിപ്പിച്ചിട്ട് മാധ്യമങ്ങളിലൂടെ സകലർക്കും ഈ അറിവുകൾ കൊടുക്കാൻ തുടങ്ങി. കൊച്ചു കുട്ടികൾക്ക് വരെ മൊബൈലിലൂടെയും ഈ സകല അറിവും കിട്ടാൻ തുടങ്ങി. അറിവ് ഇത്രയും കിട്ടിയ സ്ഥിതിക്ക്, ധൈര്യമായിട്ട് ഇനി കൃപയുടെ കാലഘട്ടം നിർത്തുകയും ന്യായമായി വിധി ചെയ്യുകയും ചെയ്യും. കാരണം, എല്ലാവർക്കും അറിവ് കിട്ടിക്കൊണ്ടിരിയ്ക്കുകയാണ്. ഇപ്പോഴും അറിവ് കിട്ടിക്കൊണ്ടിരിപ്പുണ്ട്. ഇനി ആർക്കും ജന്മങ്ങൾ ഇല്ല.</p><p>സത്യയുഗത്തിലേയ്ക്ക് പ്രവേശിയ്ക്കുന്നവർ ദൈവത്തിന്റെ ഹിതം അനുസരിച്ച് ജീവിയ്ക്കുന്നവർ ആയിരിയ്ക്കും. അവരൊന്നിലും തെറ്റില്ല. ദൈവത്തിന്റെ നിയമം എന്താണൊ അതായിരിയ്ക്കും അവരുടെ ഇഷ്ടങ്ങളും, അതിൽ ആയിരിയ്ക്കും അവരുടെ സന്തോഷവും. അത് ചെയ്തായിരിയ്ക്കും അവർ ജീവിയ്ക്കുക. അപ്പോൾ, അവർക്ക് എവിടെയാണ് ശിക്ഷ വരുന്നത്? അവിടെ ശിക്ഷയുടെ ആവശ്യമില്ലല്ലോ!</p><p>സത്യയുഗത്തിലും മനുഷ്യന്റെ സ്വതന്ത്ര ചിന്തയിൽ ചില തെറ്റുകൾ പറ്റാം, പറ്റില്ലെന്നല്ല. നമ്മുടെ ഉള്ളിൽ തന്നെ രക്ഷയുടെ ശക്തികളും ശിക്ഷയുടെ ശക്തികളും സ്വതവേ ഉണ്ട്. നമ്മെ വഴിതെറ്റിച്ച് തെറ്റായ രീതിയിൽ കൊണ്ടുപോകുവാൻ പൈശാചിക ശക്തികൾ ഇല്ലെന്നേ ഉള്ളൂ. എവിടെയെങ്കിലും ചില തെറ്റുകൾ ചെറുതായി പറ്റുമ്പോൾ തന്നെ നമ്മുടെ ഉള്ളിൽ ശിക്ഷയുടെ ശക്തികൾ അല്പം ശിക്ഷ തരും. നമുക്ക് ബോധം വന്ന് പെട്ടെന്ന് തന്നെ നമ്മൾ ശരിയായിക്കൊള്ളും. നമ്മൾ വഴി തെറ്റി പോകില്ല. നമ്മൾ ഇന്ന് കാണുന്നതു പോലെയുള്ള ആശുപത്രി - നരകം പോലുള്ള കൊള്ള സംഘങ്ങൾ സത്യയുഗത്തിൽ ഇല്ല.</p><p>ദൈവത്തിന്റെ ആത്മാവ് പരിശുദ്ധാത്മാവ് എന്ന രീതിയിൽ ദൈവത്തോട് അടുക്കാൻ ശ്രമിയ്ക്കുന്ന സകലരിലും പ്രവേശിച്ചിട്ടുണ്ട്. അപ്പോൾ, ന്യായവിധിയുടെ ആത്മാവ് സകലരിലും ഉണ്ട്. ഈ കാലഘട്ടം മാറി ന്യായവിധിയുടെ കാലഘട്ടം ആകുമ്പോഴേയ്ക്കും, സകലരിലും ഉള്ള ആത്മാവ് എന്ന ദൈവത്തിന്റെ ചൈതന്യം തന്നെ അവരെ ന്യായം വിധിയ്ക്കും. ന്യായമായ വിധി എല്ലാവർക്കും വരും. അത് പുറമേ കാണാൻ പറ്റില്ല. അകമേ അനുഭവത്തിലൂടെയാണ് അത് തിരിച്ചറിയുന്നത്. ന്യായമായത് ചെയ്യാതെ അവർക്ക് ഒരു രക്ഷയും വരില്ല. ചെറിയ തെറ്റിനു വരെ അപ്പപ്പോൾ ശിക്ഷ കിട്ടും. അപ്പോൾ അവർക്ക് മനസ്സിലാകും, ന്യായമായത് അവർക്ക് സംഭവിച്ചുകൊണ്ടിരിപ്പുണ്ട്.</p><p>ഏതൊരു മനുഷ്യനിൽ ആണോ ദൈവത്തിന്റെ ആത്മാവ് പ്രവേശിച്ച് പ്രവർത്തിയ്ക്കുന്നത് ആ മനുഷ്യനെ ക്രിസ്തു എന്നു പറയും. ക്രിസ്തു എന്ന വാക്കിന്റെ അർത്ഥം അഭിഷിക്തൻ: ദൈവത്തിന്റെ ആത്മാവിനെ അഭിഷേകം പ്രാപിച്ചവൻ. യേശുവും ഒരു ക്രിസ്തു ആയിരുന്നു. യേശുവിന് ന്യായവിധി ശിക്ഷ നടത്താൻ പറ്റില്ല. യേശുവിന് കൃപയാണ്. യേശുവിന് കൊടുത്തിരിക്കുന്നത് ആ കുരുതിയാണ്. ആ കുരുതിയിൽ വിശ്വസിക്കുന്നവർക്ക് സൗജന്യമായിട്ട് കർമ്മങ്ങൾ ഇളവ് ചെയ്യുകയും, അങ്ങനെയൊരു ജോലിയാണ് യേശു ചെയ്യുന്നത്. യേശു അന്നും ഇന്നും ഭൂമിയിലുണ്ട്. ഈ കാലഘട്ടം അവസാനിയ്ക്കുന്നത് വരെ, അതായത് പൂർണ്ണ സത്യയുഗം ആകുന്നതുവരെ യേശു ശരീരം ആയിട്ടും അല്ലാതെയും ഭൂമിയിൽ തന്നെ കാണും.</p><p>ന്യായവിധി നടത്താൻ വരുന്ന ആ കൽക്കിയുടെ ആത്മാവും ഒരു മനുഷ്യനായിട്ടു വരുമ്പോൾ ദൈവത്തിന്റെ ആത്മാവ് പ്രവേശിയ്ക്കുന്നത് കൊണ്ട്, നമുക്ക് ആ വ്യക്തിയെയും ക്രിസ്തു എന്ന് വിളിയ്ക്കാം. പുതിയൊരു മനുഷ്യൻ പുതിയൊരു സ്ത്രീയിലൂടെ ജനിച്ച ഇത് ചെയ്യും. ആ വ്യക്തിയിലും യേശുവിൽ മുപ്പതാമത്തെ വയസ്സിൽ പ്രവേശിച്ച ദൈവത്തിന്റെ അതേ ആത്മാവ് തന്നെയായിരിയ്ക്കും ഈ ന്യായവിധി നടത്താൻ വരുന്ന ആ വ്യക്തിയിൽ പ്രവേശിച്ചിട്ട് ന്യായവിധി ശിക്ഷ നടത്തുന്നത്.</p><p>ഇപ്പോൾ കാര്യം മനസ്സിലായല്ലൊ. നിങ്ങളുടെ കുടുംബത്തിലും നിങ്ങളുടെ ദേശത്തിലും തെറ്റിദ്ധാരണകൾ പഠിച്ചു വച്ചിരിക്കുന്നവർക്ക് ശരിയായിട്ടുള്ള കാര്യങ്ങൾ പറഞ്ഞു കൊടുക്കുക. കാരണം, പറഞ്ഞു കൊടുത്താലും ഇല്ലെങ്കിലും അവർക്ക് ഇഷ്ടംപോലെ പ്രശ്നങ്ങളും വിഷയങ്ങളും കഷ്ടങ്ങളും പെരുകിപ്പെരുകി വരുമ്പോൾ താനെ അവർക്ക് മനസ്സിലായിക്കൊള്ളും. അപ്പോൾ, നിങ്ങൾ പറഞ്ഞു കൊടുത്തില്ലെങ്കിലും ദൈവം ആരെയെങ്കിലും വെച്ച് അന്ന് അവർക്ക് ഇത് അറിയിച്ചു കൊടുക്കും.<br>സത്യപ്രകാശം</p>`

/* =====================================================================
   3. TAB SWITCHING & HEADER TITLE/SUBTITLE UPDATE LOGIC
   ===================================================================== */
let currentMode = "videos"; // 'videos' or 'discussions'

const tabVideosBtn = document.getElementById("tabVideosBtn");
const tabDiscussionsBtn = document.getElementById("tabDiscussionsBtn");
const videosSection = document.getElementById("videosSection");
const discussionsSection = document.getElementById("discussionsSection");
const searchBarDock = document.getElementById("searchBarDock");
const contentWrapper = document.getElementById("contentWrapper");
const titleEl = document.getElementById("channelTitle");
const subEl = document.getElementById("channelSubtitle");
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");

function switchMode(mode) {
    currentMode = mode;
    searchInput.value = "";
    searchClear.classList.remove("visible");

    if (mode === "videos") {
        tabVideosBtn.classList.add("active");
        tabDiscussionsBtn.classList.remove("active");
        videosSection.style.display = "block";
        discussionsSection.style.display = "none";
        searchBarDock.style.display = "block";
        contentWrapper.classList.remove("discussions-mode");

        // Update Top Banner Text for Videos
        titleEl.textContent = "Spritual Destiny";
        subEl.textContent = "SPIRITUAL KNOWLEDGE & EXPLORATION";
        filterVideos();
    } else {
        tabDiscussionsBtn.classList.add("active");
        tabVideosBtn.classList.remove("active");
        videosSection.style.display = "none";
        discussionsSection.style.display = "block";
        searchBarDock.style.display = "none"; // Hide search bar & tags on 2nd page
        contentWrapper.classList.add("discussions-mode");
        stopVideosIn(document);

        // Update Top Banner Text for സത്യപ്രകാശം (Discussion Summary)
        titleEl.textContent = "സത്യപ്രകാശം";
        subEl.textContent = "വാട്സാപ്പ് ഗ്രൂപ്പിലെ ചർച്ചകളുടെ സംഗ്രഹം";
        renderDiscussionsList();
    }

    updateMorph(); // Re-center header text immediately
    window.scrollTo({ top: 0, behavior: "smooth" });
}

tabVideosBtn.addEventListener("click", () => switchMode("videos"));
tabDiscussionsBtn.addEventListener("click", () => switchMode("discussions"));

/* =====================================================================
   4. DAILY DISCUSSIONS ACCORDION LIST (MAIN POINTS + CONCLUSION + FULL PDF)
   ===================================================================== */
const discussionsList = document.getElementById("discussionsList");

function renderDiscussionsList() {
    discussionsList.innerHTML = "";

    dailyDiscussions.forEach((item) => {
        const details = document.createElement("details");
        details.className = "playlist";

        // Close other opened discussions when one is opened
        details.addEventListener("toggle", () => {
            if (details.open) {
                discussionsList.querySelectorAll(".playlist").forEach((other) => {
                    if (other !== details) other.removeAttribute("open");
                });
            }
        });

        const summary = document.createElement("summary");

        const topicSpan = document.createElement("span");
        topicSpan.className = "playlist-name";
        topicSpan.textContent = item.topic;

        const rightSpan = document.createElement("span");
        rightSpan.className = "playlist-right";

        const dateSpan = document.createElement("span");
        dateSpan.className = "video-count";
        dateSpan.textContent = "📅 " + item.date;

        const plusMinusToggle = document.createElement("span");
        plusMinusToggle.className = "playlist-toggle";

        rightSpan.appendChild(dateSpan);
        rightSpan.appendChild(plusMinusToggle);

        summary.appendChild(topicSpan);
        summary.appendChild(rightSpan);
        details.appendChild(summary);

        // Expanded Body: Main Points -> Conclusion -> Full Unchanged PDF Content
        const bodyDiv = document.createElement("div");
        bodyDiv.className = "discussion-body";

        const pointsHtml = item.mainPoints.map(pt => `<li>${pt}</li>`).join("");
        const shareText = `✨ *സത്യപ്രകാശം - പഠന സംഗ്രഹം* ✨\n📅 *തീയതി:* ${item.fullDate}\n\n📌 *വിഷയം: ${item.topic}*\n\n📝 *ചർച്ചയുടെ പ്രധാന ആശയങ്ങൾ:*\n${item.mainPoints.map(p => "• " + p).join("\n")}\n\n💡 *ചർച്ചയുടെ നിഗമനം (Conclusion):*\n_${item.conclusion}_`;
        const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);

        bodyDiv.innerHTML = `
            <span class="disc-date-day">📅 ${item.fullDate}</span>

            <div class="disc-summary-box">
                <h3 class="disc-section-heading">📝 ചർച്ചയുടെ പ്രധാന ആശയങ്ങൾ</h3>
                <ul class="disc-main-points">${pointsHtml}</ul>
            </div>

            <div class="disc-conclusion-box">
                <div class="disc-conclusion-title">💡 ചർച്ചയുടെ നിഗമനം (Conclusion)</div>
                <p class="disc-conclusion-text">${item.conclusion}</p>
            </div>

            <div class="full-pdf-box">
                <div class="full-pdf-header">📄 പൂർണ്ണ പഠന വിവരങ്ങൾ </div>
                <div class="full-pdf-text">${item.fullContentHtml}</div>
            </div>

            <div class="player-actions" style="margin-top: 0;">
                <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="whatsapp-share-btn">
                    <svg viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.029 18.88c-1.161 0-2.305-.292-3.318-.844l-3.677.964.984-3.595c-.607-1.052-.927-2.246-.926-3.468.001-3.825 3.113-6.937 6.937-6.937 1.856.001 3.598.723 4.907 2.034 1.31 1.311 2.031 3.054 2.03 4.908-.001 3.825-3.113 6.938-6.937 6.938z"/></svg>

    const rawSaved = localStorage.getItem(FAV_STORAGE_KEY);
    if (rawSaved) {
        savedVideoIds = new Set(JSON.parse(rawSaved));
    }
} catch (e) {}

let showOnlyFavorites = false;

function persistFavorites() {
    try {
        localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify([...savedVideoIds]));
    } catch (e) {}
    updateFavBadge();
}

function updateFavBadge() {
    const badge = document.getElementById("favCountBadge");
    if (badge) badge.textContent = savedVideoIds.size;
}

function stopVideosIn(container) {
    container.querySelectorAll(".video-player.show").forEach(p => {
        p.classList.remove("show");
        p.innerHTML = "";
    });
    container.querySelectorAll(".video-title.active").forEach(b => {
        b.classList.remove("active");
    });
}

const library = document.getElementById("library");

playlists.forEach((playlist, index) => {
    const details = document.createElement("details");
    details.className = "playlist";

    details.addEventListener("toggle", () => {
        const isSearching = document.getElementById("searchInput").value.trim().length > 0 || showOnlyFavorites;
        if (details.open) {
            if (!isSearching) {
                library.querySelectorAll(".playlist").forEach((otherDetails) => {
                    if (otherDetails !== details) {
                        otherDetails.removeAttribute("open");
                        stopVideosIn(otherDetails);
                    }
                });
            }
        } else {
            stopVideosIn(details);
        }
    });

    const summary = document.createElement("summary");

    const name = document.createElement("span");
    name.className = "playlist-name";
    // ADDED: Numbering for Video Playlists (e.g. 1. സാമ്പത്തിക പ്രശ്നം)
    name.innerHTML = `<span style="color: #d8b66f; margin-right: 6px; font-weight: 700;">${index + 1}.</span> ${playlist.name}`;

    const right = document.createElement("span");
    right.className = "playlist-right";

    const count = document.createElement("span");
    count.className = "video-count";
    count.dataset.total = playlist.videos.length;
    count.textContent = playlist.videos.length + " Videos";

    const toggle = document.createElement("span");
    toggle.className = "playlist-toggle";

    right.appendChild(count);
    right.appendChild(toggle);

    summary.appendChild(name);
    summary.appendChild(right);

    details.appendChild(summary);

    const videoList = document.createElement("div");
    videoList.className = "video-list";

    playlist.videos.forEach((video, vIndex) => {
        const videoTitle = video[0];
        const videoId = video[1];

        const item = document.createElement("div");
        item.className = "video-item";
        item.dataset.videoId = videoId;

        const row = document.createElement("div");
        row.className = "video-row";

        const button = document.createElement("button");
        button.className = "video-title";
        button.type = "button";

        const play = document.createElement("span");
        play.className = "play";
        play.textContent = "▶";

        const title = document.createElement("span");
        // ADDED: Numbering for Videos inside Playlists (e.g. 1. വീഡിയോയുടെ പേര്)
        title.innerHTML = `<span style="color: #aebdd1; margin-right: 6px; font-size: 13px; font-weight: 600;">${vIndex + 1}.</span> ${videoTitle}`;

        button.appendChild(play);
        button.appendChild(title);

        const favBtn = document.createElement("button");
        favBtn.type = "button";
        favBtn.className = "fav-btn";
        const isInitiallySaved = savedVideoIds.has(videoId);
        if (isInitiallySaved) {
            favBtn.classList.add("saved");
            favBtn.textContent = "★";
            favBtn.title = "Saved-ൽ നിന്നും നീക്കുക";
        } else {
            favBtn.textContent = "☆";
            favBtn.title = "Save ചെയ്യുക";
        }

        favBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const nowSaved = !savedVideoIds.has(videoId);
            if (nowSaved) {
                savedVideoIds.add(videoId);
            } else {
                savedVideoIds.delete(videoId);
            }
            document.querySelectorAll(`.video-item[data-video-id="${videoId}"] .fav-btn`).forEach(btn => {
                btn.classList.toggle("saved", nowSaved);
                btn.textContent = nowSaved ? "★" : "☆";
                btn.title = nowSaved ? "Saved-ൽ നിന്നും നീക്കുക" : "Save ചെയ്യുക";
            });
            persistFavorites();
            if (showOnlyFavorites) {
                filterVideos();
            }
        });

        row.appendChild(button);
        row.appendChild(favBtn);

        const player = document.createElement("div");
        player.className = "video-player";

        button.addEventListener("click", () => {
            const isAlreadyOpen = player.classList.contains("show");
            stopVideosIn(document);

            if (!isAlreadyOpen) {
                button.classList.add("active");
                player.classList.add("show");

                const youtubeUrl = "https://www.youtube.com/watch?v=" + encodeURIComponent(videoId);

                const frame = document.createElement("div");
                frame.className = "video-frame";

                const iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(videoId);
                iframe.title = videoTitle;
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;

                frame.appendChild(iframe);

                const actions = document.createElement("div");
                actions.className = "player-actions";

                const waShare = document.createElement("a");
                waShare.className = "whatsapp-share-btn";
                const shareMessage = `✨ *${videoTitle}*\n\n${youtubeUrl}`;
                waShare.href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareMessage);
                waShare.target = "_blank";
                waShare.rel = "noopener noreferrer";
                waShare.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.029 18.88c-1.161 0-2.305-.292-3.318-.844l-3.677.964.984-3.595c-.607-1.052-.927-2.246-.926-3.468.001-3.825 3.113-6.937 6.937-6.937 1.856.001 3.598.723 4.907 2.034 1.31 1.311 2.031 3.054 2.03 4.908-.001 3.825-3.113 6.938-6.937 6.938z"/></svg><span>Share</span>`;

                const link = document.createElement("a");
                link.className = "youtube-link";
                link.href = youtubeUrl;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.innerHTML = `<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg><span>Watch on YouTube</span>`;

                actions.appendChild(waShare);
                actions.appendChild(link);

                player.appendChild(frame);
                player.appendChild(actions);
            }
        });

        item.appendChild(row);
        item.appendChild(player);

        videoList.appendChild(item);
    });

    details.appendChild(videoList);
    library.appendChild(details);
});

updateFavBadge();

/* Instant Search + Quick Topic Tags + Favorites Filter Logic */
const searchStatus = document.getElementById("searchStatus");
const favFilterBtn = document.getElementById("favFilterBtn");
const topicChips = document.querySelectorAll("#quickTagsBar .topic-chip[data-tag]");

function syncChipStates() {
    const currentQuery = searchInput.value.trim();
    topicChips.forEach(chip => {
        chip.classList.toggle("active", !showOnlyFavorites && currentQuery === chip.dataset.tag);
    });
    favFilterBtn.classList.toggle("active", showOnlyFavorites);
}

function filterVideos() {
    const query = searchInput.value.trim().toLowerCase();
    searchClear.classList.toggle("visible", query.length > 0 || showOnlyFavorites);
    syncChipStates();

    const allPlaylists = library.querySelectorAll(".playlist");
    let totalMatchedVideos = 0;

    if (!query && !showOnlyFavorites) {
        searchStatus.style.display = "none";
        allPlaylists.forEach((pl) => {
            pl.style.display = "";
            pl.removeAttribute("open");
            stopVideosIn(pl);
            const countEl = pl.querySelector(".video-count");
            countEl.textContent = countEl.dataset.total + " Videos";
            pl.querySelectorAll(".video-item").forEach((item) => {
                item.style.display = "";
            });
        });
        return;
    }

    allPlaylists.forEach((pl) => {
        const playlistName = pl.querySelector(".playlist-name").textContent.toLowerCase();
        const isPlaylistNameMatch = query.length > 0 && playlistName.includes(query);
        const items = pl.querySelectorAll(".video-item");
        let matchedInPlaylist = 0;

        items.forEach((item) => {
            const titleText = item.querySelector(".video-title span:last-child").textContent.toLowerCase();
            const vidId = item.dataset.videoId;
            const matchesText = !query || isPlaylistNameMatch || titleText.includes(query);
            const matchesFav = !showOnlyFavorites || savedVideoIds.has(vidId);

            if (matchesText && matchesFav) {
                item.style.display = "";
                matchedInPlaylist++;
                totalMatchedVideos++;
            } else {
                item.style.display = "none";
                stopVideosIn(item);
            }
        });

        const countEl = pl.querySelector(".video-count");
        if (matchedInPlaylist > 0) {
            pl.style.display = "";
            pl.setAttribute("open", "");
            countEl.textContent = matchedInPlaylist + " / " + countEl.dataset.total + " Videos";
        } else {
            pl.style.display = "none";
            pl.removeAttribute("open");
            stopVideosIn(pl);
        }
    });

    searchStatus.style.display = "block";
    if (showOnlyFavorites && totalMatchedVideos === 0) {
        searchStatus.textContent = "സേവ് ചെയ്ത വീഡിയോകൾ ഒന്നും ഇല്ല. വീഡിയോയുടെ വലതുവശത്തുള്ള ☆ ബട്ടൺ അമർത്തി സേവ് ചെയ്യാം.";
    } else if (totalMatchedVideos > 0) {
        searchStatus.textContent = showOnlyFavorites
            ? `സേവ് ചെയ്ത ${totalMatchedVideos} വീഡിയോകൾ`
            : `${totalMatchedVideos} വീഡിയോകൾ കണ്ടെത്തി`;
    } else {
        searchStatus.textContent = "തിരയുന്ന വിഷയത്തിൽ വീഡിയോകൾ ഒന്നും കണ്ടെത്തിയില്ല.";
    }
}

searchInput.addEventListener("input", filterVideos);

searchClear.addEventListener("click", () => {
    searchInput.value = "";
    showOnlyFavorites = false;
    filterVideos();
    searchInput.focus();
});

// Quick Topic Chips Click
topicChips.forEach(chip => {
    chip.addEventListener("click", () => {
        showOnlyFavorites = false;
        const tag = chip.dataset.tag;
        if (searchInput.value.trim() === tag) {
            searchInput.value = "";
        } else {
            searchInput.value = tag;
        }
        filterVideos();
    });
});

// Saved Favorites Chip Click
favFilterBtn.addEventListener("click", () => {
    showOnlyFavorites = !showOnlyFavorites;
    if (showOnlyFavorites) {
        searchInput.value = "";
    }
    filterVideos();
});

/* Back to Top Button with Live Scroll Progress */
const backToTopBtn = document.getElementById("backToTop");
const progressRingFill = document.getElementById("progressRingFill");
const ringCircumference = 2 * Math.PI * 22;

backToTopBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
});

/* Continuous 60fps Smooth Header Morphing */
const header = document.getElementById("channelHeader");
const logo = document.getElementById("channelLogo");
const textBox = document.getElementById("headerText");
const lineEl = document.getElementById("headerLine");

function lerp(start, end, t) {
    return start + (end - start) * t;
}

function updateMorph() {
    const isMobile = window.innerWidth <= 600;
    const scrollRange = isMobile ? 130 : 160;
    const scrollY = window.scrollY;
    const progress = Math.min(Math.max(scrollY / scrollRange, 0), 1);

    if (scrollY > 220) {
        backToTopBtn.classList.add("show");
    } else {
        backToTopBtn.classList.remove("show");
    }

    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const scrollPercent = docHeight > 0 ? Math.min(Math.max(scrollY / docHeight, 0), 1) : 0;
    progressRingFill.style.strokeDashoffset = ringCircumference * (1 - scrollPercent);

    const ease = progress * (2 - progress);
    const headerW = header.clientWidth;

    // 1. Header Height & Border Radius
    const startH = isMobile ? 205 : 235;
    const endH = isMobile ? 62 : 70;
    const currentH = lerp(startH, endH, ease);
    header.style.height = currentH + "px";
    header.style.borderRadius = lerp(isMobile ? 12 : 16, 12, ease) + "px";

    // 2. Logo Size & Position
    const startLogo = isMobile ? 75 : 92;
    const endLogo = isMobile ? 40 : 46;
    const curLogo = lerp(startLogo, endLogo, ease);

    const startLogoX = (headerW - startLogo) / 2;
    const endLogoX = isMobile ? 12 : 18;
    const curLogoX = lerp(startLogoX, endLogoX, ease);

    const startLogoY = isMobile ? 18 : 24;
    const endLogoY = (endH - endLogo) / 2;
    const curLogoY = lerp(startLogoY, endLogoY, ease);

    logo.style.width = curLogo + "px";
    logo.style.height = curLogo + "px";
    logo.style.left = curLogoX + "px";
    logo.style.top = curLogoY + "px";

    // 3. Text Font Sizes
    const isDiscussion = currentMode === "discussions";
    const startTitleSize = isMobile ? (isDiscussion ? 22 : 23) : (isDiscussion ? 28 : 29);
    const endTitleSize = isMobile ? 15 : 18;
    titleEl.style.fontSize = lerp(startTitleSize, endTitleSize, ease) + "px";

    const startSubSize = isMobile ? (isDiscussion ? 11.5 : 11) : (isDiscussion ? 13.5 : 14);
    const endSubSize = isMobile ? 9.5 : 11;
    subEl.style.fontSize = lerp(startSubSize, endSubSize, ease) + "px";
    subEl.style.marginTop = lerp(isMobile ? 5 : 8, 2, ease) + "px";

    // 4. Text Alignment & Position
    if (ease > 0.5) {
        textBox.style.alignItems = "flex-start";
        textBox.style.textAlign = "left";
        textBox.style.whiteSpace = "nowrap";
    } else {
        textBox.style.alignItems = "center";
        textBox.style.textAlign = "center";
        textBox.style.whiteSpace = isMobile && isDiscussion ? "normal" : "nowrap";
    }

    const textW = textBox.offsetWidth;
    const textH = textBox.offsetHeight;

    const startTextX = (headerW - textW) / 2;
    const endTextX = endLogoX + endLogo + (isMobile ? 10 : 14);
    const curTextX = lerp(startTextX, endTextX, ease);

    const startTextY = startLogoY + startLogo + (isMobile ? 10 : 12);
    const endTextY = (endH - textH) / 2;
    const curTextY = lerp(startTextY, endTextY, ease);

    textBox.style.left = curTextX + "px";
    textBox.style.top = curTextY + "px";

    // 5. Divider Line Fade Out
    lineEl.style.opacity = Math.max(0, 1 - ease * 2.5);
}

let isTicking = false;
function onScrollOrResize() {
    if (!isTicking) {
        window.requestAnimationFrame(() => {
            updateMorph();
            isTicking = false;
        });
        isTicking = true;
    }
}

window.addEventListener("scroll", onScrollOrResize, { passive: true });
window.addEventListener("resize", onScrollOrResize, { passive: true });

updateMorph();
</script>
